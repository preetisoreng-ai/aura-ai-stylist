      function AddPersonSheet({ onClose, onSave }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const nameRef = useRef(null);
        const [name, setName] = useState("");
        const [relation, setRelation] = useState("");
        const [age, setAge] = useState("");

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (nameRef.current) nameRef.current.focus();

          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        const trimmed = name.trim();
        const ready = Boolean(trimmed && relation);

        const submit = (e) => {
          e.preventDefault();
          if (!ready) return;
          // An age only makes sense for someone still growing, and it is
          // what drives the re-measure nudge on the card.
          const grows = relation === "Son" || relation === "Daughter";
          const label = grows && age.trim() ? relation + ", " + age.trim() : relation;
          onSave({
            id: "fam-" + Date.now(),
            name: trimmed,
            relation: label,
            values: 0,
            updated: "Measurements not taken yet",
            initials: initialsFor(trimmed),
            stale: true,
          });
        };

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="add-person-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              <div className="relative shrink-0 pt-2.5 pb-1">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="Close without adding anyone"
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <form onSubmit={submit} className="px-5 pt-2 pb-6">
                <h2
                  id="add-person-title"
                  className="font-display text-[22px] leading-tight text-ink"
                >
                  Add someone
                </h2>

                <label
                  htmlFor="person-name"
                  className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-1.5"
                >
                  Their name
                </label>
                <input
                  id="person-name"
                  ref={nameRef}
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Meera R."
                  autoComplete="off"
                  style={{ fontSize: 16 }}
                  className="w-full px-3.5 py-3 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                />

                <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-4 mb-1.5">
                  How they relate to you
                </span>
                <div className="flex flex-wrap gap-2" role="group">
                  {RELATIONS.map((r) => (
                    <button
                      key={r}
                      type="button"
                      onClick={() => setRelation(r)}
                      aria-pressed={relation === r}
                      className={
                        "min-h-[38px] px-3.5 rounded-full border text-[12.5px] font-medium transition-all active:scale-95 " +
                        (relation === r
                          ? "bg-primary text-onprimary border-primary"
                          : "bg-card text-ink border-hairline hover:border-primary/45")
                      }
                    >
                      {r}
                    </button>
                  ))}
                </div>

                {(relation === "Son" || relation === "Daughter") && (
                  <div className="aura-fade-in">
                    <label
                      htmlFor="person-age"
                      className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-4 mb-1.5"
                    >
                      Age{" "}
                      <span className="normal-case tracking-normal">
                        (children outgrow a set quickly)
                      </span>
                    </label>
                    <input
                      id="person-age"
                      type="text"
                      inputMode="numeric"
                      value={age}
                      onChange={(e) => setAge(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))}
                      placeholder="7"
                      style={{ fontSize: 16 }}
                      className="w-24 px-3.5 py-3 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                    />
                  </div>
                )}

                <p className="text-[11.5px] text-muted leading-relaxed mt-4">
                  Measurements come later — in a fitting, or from a scan.
                </p>

                <div className="flex items-center gap-2.5 mt-5">
                  <button
                    type="button"
                    onClick={onClose}
                    className="min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13px] font-medium hover:bg-inset active:scale-95 transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={!ready}
                    className="flex-1 min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
                  >
                    Add them
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      function ProductDetailSheet({ piece, ship, owned, onClose, onRequest, onAsk, onReorder, onAlter, onCare, saved, onSave }) {
        const trackRef = useRef(null);
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const [slide, setSlide] = useState(0);
        const [specOpen, setSpecOpen] = useState(false);
        // Which action was tapped. It fills plum for a beat so the tap is
        // acknowledged before the sheet closes out from under it.
        const [firing, setFiring] = useState(null);
        const fireTimer = useRef(null);
        useEffect(() => () => clearTimeout(fireTimer.current), []);
        const views = getViewsForPiece(piece);

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (!items.length) return;
            const a = items[0];
            const z = items[items.length - 1];
            if (e.shiftKey && document.activeElement === a) {
              e.preventDefault();
              z.focus();
            } else if (!e.shiftKey && document.activeElement === z) {
              e.preventDefault();
              a.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        // Derive the active slide from scroll position so a swipe and the dots
        // always agree about which framing is showing.
        const onScroll = () => {
          const el = trackRef.current;
          if (!el) return;
          const i = Math.round(el.scrollLeft / el.clientWidth);
          if (i !== slide) setSlide(Math.max(0, Math.min(views.length - 1, i)));
        };

        const goTo = (i) => {
          const el = trackRef.current;
          const child = el && el.children[i];
          if (!el || !child) return;
          setSlide(i);
          el.scrollTo({
            left: child.offsetLeft - el.offsetLeft,
            behavior: reducedMotion() ? "auto" : "smooth",
          });
        };

        const rows = [
          { k: "Fabric", v: piece.fabric },
          { k: "Includes", v: piece.includes },
          { k: "Weight", v: piece.weight },
          { k: "Care", v: piece.care },
          { k: "On the loom", v: piece.weeks },
        ];

        /* "DHL Express · 4 days" — the courier sits with the duty line, the
                       transit time drops to its own line under it. */
        const [courierName, courierDays] = ship.courier.split(" · ");

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="piece-sheet-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 h-[90%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              {/* Grabber + close */}
              <div className="relative shrink-0 pt-2.5 pb-2.5">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />

                <button
                  type="button"
                  onClick={onClose}
                  aria-label={`Close ${piece.name}`}
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto thread-scroll">
                {/* Swipeable carousel */}
                <div
                  ref={trackRef}
                  onScroll={onScroll}
                  className="flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
                  role="group"
                  aria-label={`${piece.name} photographs`}
                  tabIndex={0}
                  onKeyDown={(e) => {
                    if (e.key === "ArrowRight") {
                      e.preventDefault();
                      goTo(Math.min(views.length - 1, slide + 1));
                    } else if (e.key === "ArrowLeft") {
                      e.preventDefault();
                      goTo(Math.max(0, slide - 1));
                    }
                  }}
                >
                  {views.map((v) => (
                    <div key={v.id} className="snap-center shrink-0 w-full px-5">
                      <div className="relative w-full h-[36vh] rounded-2xl overflow-hidden bg-inset border border-hairline">
                        <SheetPhoto piece={piece} view={v} alt={`${piece.name} — ${v.label}`} />
                        <span className="absolute bottom-3 left-3 text-[12px] font-bold text-white bg-black/45 px-3 py-1 rounded-full">
                          {v.label}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Dots */}
                <div className="flex items-center justify-center gap-1.5 mt-3">
                  {views.map((v, i) => (
                    <button
                      key={v.id}
                      type="button"
                      onClick={() => goTo(i)}
                      aria-label={`Show ${v.label}`}
                      aria-current={i === slide}
                      className="w-11 h-8 flex items-center justify-center"
                    >
                      <span
                        className={`block rounded-full transition-all ${
                          i === slide ? "w-4 h-[5px] bg-primary" : "w-[5px] h-[5px] bg-hairline"
                        }`}
                      />
                    </button>
                  ))}
                </div>

                {/* Details */}
                <div className="px-5 pb-5">
                  {/* Save sits with the name it applies to. */}
                  <div className="flex items-start justify-between gap-3 mt-1">
                    <h2
                      id="piece-sheet-title"
                      className="font-display text-[32px] leading-[36px] text-ink"
                    >
                      {piece.name}
                    </h2>
                    {onSave && (
                      <HeartButton
                        saved={saved}
                        onToggle={onSave}
                        name={piece.name}
                        tone="plain"
                        className="mt-1"
                      />
                    )}
                  </div>
                  <p className="font-mono text-[11px] uppercase tracking-wider text-goldtext mt-1.5">
                    {piece.craft}
                  </p>
                  {/* The spec is for people who want it. It stays folded away until
                      asked for, so the description is not buried under a table on
                      first look. */}
                  <p className="text-[14px] text-muted leading-[22px] mt-3">
                    {piece.note}{" "}
                    {/* Reads as part of the sentence, so the eye finds it where the
                        text runs out rather than off at the margin. */}
                    <button
                      type="button"
                      onClick={() => setSpecOpen((v) => !v)}
                      aria-expanded={specOpen}
                      aria-controls="piece-spec"
                      className="font-semibold text-ink hover:text-primary transition-colors whitespace-nowrap"
                    >
                      {specOpen ? "Show less" : "Show more…"}
                    </button>
                  </p>

                  {specOpen && (
                    <dl
                      id="piece-spec"
                      className="mt-4 border-t border-hairline aura-fade-in"
                    >
                      {rows.map((r) => (
                        <div
                          key={r.k}
                          className="flex items-baseline justify-between gap-4 py-3 border-b border-hairline"
                        >
                          <dt className="font-mono text-[11px] uppercase tracking-wider text-muted shrink-0">
                            {r.k}
                          </dt>
                          <dd className="text-[13px] text-ink text-right">{r.v}</dd>
                        </div>
                      ))}
                    </dl>
                  )}

                  {!owned && (
                    <p className="text-[11px] text-muted leading-[17px] mt-4">
                      Nothing is added at checkout. You approve photographs of the finished garment
                      before it is dispatched, and alterations are covered under the Perfect Fit
                      Guarantee.
                    </p>
                  )}

                  {owned && (
                    <p className="font-mono text-[10.5px] text-muted mt-4">
                      Delivered {owned.delivered} · cut to {owned.profile}
                    </p>
                  )}
                </div>
              </div>

              {/* A piece you already own has nothing left to buy — what it
                  needs are the three things you can do with it. Anything you
                  do not own yet keeps its price and its fit check. */}
              {owned ? (
                <div className="shrink-0 bg-card pb-4">
                  {/* One control split three ways rather than three pills —
                      they are siblings, so they read better joined than as
                      three competing buttons. */}
                  <div
                    className="flex items-stretch border-t border-hairline"
                    role="group"
                    aria-label={`What to do with your ${owned.name}`}
                  >
                    {[
                      { label: "Reorder", run: () => onReorder(owned) },
                      { label: "Alter", run: () => onAlter(owned) },
                      { label: "Care", run: () => onCare(owned) },
                    ].map((a, i) => {
                      const on = firing === a.label;
                      return (
                        <button
                          key={a.label}
                          type="button"
                          /* Only the siblings lock. The tapped one stays live
                             so it keeps its pressed look for the whole beat. */
                          disabled={Boolean(firing) && !on}
                          onClick={() => {
                            if (firing) return;
                            setFiring(a.label);
                            clearTimeout(fireTimer.current);
                            fireTimer.current = window.setTimeout(a.run, 800);
                          }}
                          /* Painted inline rather than by class: the Tailwind
                             CDN only ships utilities it can see in the DOM, and
                             with an owned sheet open nothing else on the page
                             uses the plum fill — so the class would resolve to
                             nothing at the moment it is needed. */
                          style={
                            on
                              ? {
                                  backgroundColor: "#3B2A5A",
                                  color: "#FFFFFF",
                                }
                              : undefined
                          }
                          /* The fill lands on the frame of the tap — easing it
                             in spends most of the beat on a half-tone that
                             reads as a hover, not as an answer. */
                          className={
                            "flex-1 min-h-[54px] px-2 text-[13.5px] font-medium " +
                            (i > 0 ? "border-l border-hairline " : "") +
                            (on
                              ? ""
                              : "bg-card text-ink transition-colors hover:bg-inset active:bg-selfill")
                          }
                        >
                          {a.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ) : (
                /* Price stays put while everything above it scrolls. */
                <div className="shrink-0 border-t border-hairline bg-card px-5 pt-3.5 pb-5 flex items-center gap-3">
                  <div className="min-w-0 flex-1">
                    <span className="block text-[28px] text-ink font-bold leading-none">
                      {ship.symbol}
                      {piece.from}
                    </span>
                    <span className="block text-[11px] text-muted leading-snug mt-1.5">
                      {ship.duty} · {courierName}
                    </span>
                    <span className="block text-[11px] text-muted leading-snug">{courierDays}</span>
                  </div>

                  <button
                    type="button"
                    onClick={() => onRequest(piece)}
                    className="shrink-0 min-h-[48px] px-7 rounded-full bg-primary text-onprimary text-[14px] font-semibold hover:bg-primary/90 active:scale-95 transition-all"
                  >
                    See Fit
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }
      /* ===================================================================
       WARDROBE DATA
       What Aura remembers on your behalf: the pieces you own, the
       measurement sets they were cut to, the people you order for, and the
       care and alteration credits attached to each commission.

       `piece` links an owned garment back to the catalogue so a reorder can
       open the real product sheet instead of a dead end.
       =================================================================== */
      const OWNED = [
        {
          id: "own-1",
          piece: "heritage-lehenga",
          name: "Heritage handloom",
          craft: "Banarasi kadhwa weave · Varanasi",
          delivered: "12 March 2026",
          profile: "Your measurements",

          image: "images/heritage_banarasi.jpg",
        },
        {

          name: "Featherweight festive",
          craft: "Hand aari work · Mumbai atelier",
          delivered: "4 January 2026",
          profile: "Your measurements",
          swatch: ["#D8C7E4", "#C89B3C", "#F3EEE4"],
          image: "images/featherweight_organza.jpg",
        },
        {
          id: "own-3",
          piece: "kanjivaram-saree",
          name: "Temple border Kanjivaram",
          craft: "Korvai join · Kanchipuram",
          delivered: "19 October 2025",
          profile: "Your measurements",
          swatch: ["#5A2140", "#C89B3C", "#D9C7A7"],
          image: "images/kanjivaram_gold.png",
        },
        {
          id: "own-4",
          piece: "chanderi-kurta",
          name: "Chanderi kurta set",
          craft: "Handloom · Chanderi",
          delivered: "2 September 2025",
          profile: "Your measurements",
          swatch: ["#6A5D82", "#E8D9B5", "#FBF8F3"],
        },
        {
          id: "own-5",
          piece: "bagru-kurta",
          name: "Bagru block print",
          craft: "Hand block, natural dye · Jaipur",
          delivered: "14 August 2025",
          profile: "Meera R.",
          swatch: ["#2F4F3E", "#D9C7A7", "#F3EEE4"],
        },
        {
          id: "own-6",
          piece: "raw-silk-sherwani",
          name: "Ivory raw-silk sherwani",
          craft: "Dori and pearl work · Delhi",
          delivered: "28 November 2025",
          profile: "Ravi",
          swatch: ["#F3EEE4", "#D9C7A7", "#7C7B86"],
        },
      ];

      /* Owned items come from two places. What Aura made carries a delivery
         date and the measurement set it was cut to; what you photographed
         yourself carries only what you chose to tell us, so the rows say
         different things and the two never pretend to be one list. */
      const UPLOADED = [
        {
          id: "up-1",
          source: "uploaded",
          name: "Mother's Kanjivaram",
          craft: "Handed down · photographed at home",
          added: "Added 3 Feb 2026",
          note: "Silk, gold zari border",
          swatch: ["#7B1E3B", "#C89B3C", "#E4D2A8"],
          image: "images/family_silks.png",
        },
        {
          id: "up-2",
          source: "uploaded",
          name: "Cream sharara set",
          craft: "Bought in Hyderabad · not from Aura",
          added: "Added 18 May 2026",
          note: "Worn to a mehendi",
          swatch: ["#F3EEE4", "#D9C7A7", "#C89B3C"],
        },
        {
          id: "up-3",
          source: "uploaded",
          name: "Indigo cotton kurta",
          craft: "Market find · Jaipur",
          added: "Added 2 Aug 2026",
          note: "Everyday, block printed",
          swatch: ["#2B3A67", "#D9C7A7", "#F3EEE4"],
        },
      ];

      const OWNED_TABS = [
        { id: "aura", label: "From Aura" },
        { id: "uploaded", label: "Uploaded outfits" },
      ];

      /* What you add outlasts the session, so the photograph is kept as a
         downscaled thumbnail: localStorage has a few megabytes to its name and
         the row only ever draws it at 58px. */
      const UPLOADS_KEY = "aura.uploads.v1";

      function readUploads() {
        try {
          const raw = window.localStorage.getItem(UPLOADS_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) ? parsed : UPLOADED;
        } catch (e) {
          return UPLOADED;
        }
      }

      function writeUploads(list) {
        try {
          window.localStorage.setItem(UPLOADS_KEY, JSON.stringify(list));
        } catch (e) {
          /* out of quota — the outfit still shows for this session */
        }
      }

      function thumbnail(file, max, done) {
        const reader = new FileReader();
        reader.onerror = () => done(null);
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => done(reader.result);
          img.onload = () => {
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            try {
              done(canvas.toDataURL("image/jpeg", 0.72));
            } catch (e) {
              done(reader.result);
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      /* What Aura offers back after looking at the photograph. No vision model
         sits behind this screen, so the read is drawn from a set rather than
         inferred — which is why the copy says "suggested" and every field
         stays editable. That is how it should behave either way. */
      const UPLOAD_READS = [
        { name: "Banarasi silk saree", note: "Deep red, gold zari border" },
        { name: "Embroidered lehenga", note: "Pastel net, sequin and thread work" },
        { name: "Cotton kurta set", note: "Block printed, everyday wear" },
        { name: "Chanderi suit", note: "Handloom, soft sheen" },
        { name: "Anarkali, floor length", note: "Georgette, mirror detailing" },
      ];

      function suggestFor(file) {
        const seed = (file.name || "").length + (file.size || 0);
        return UPLOAD_READS[seed % UPLOAD_READS.length];
      }

      const PROFILES = [
        {
          id: "prof-1",
          name: "Your measurements",
          values: 14,
          updated: "Updated 12 Aug 2026",
          note: "Primary set · used for most commissions",
          primary: true,
        },
      ];

      /* Your own measurements live in the Profile screen's store, so editing
         them here writes to the same place rather than keeping a second copy
         that could drift. Only the measurement keys are touched; name, email
         and addresses are left exactly as they were. */
      const PROFILE_KEY = "aura.profile.v1";
      const MEASURE_KEYS = [
        "unit",
        "bust",
        "waist",
        "hip",
        "shoulder",
        "sleeve",
        "length",
        "height",
        "fitNote",
      ];

      function readProfile() {
        try {
          const raw = window.localStorage.getItem(PROFILE_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      /* The same seed the Profile screen starts from, so before anything is
         saved both screens show identical figures rather than one showing
         blanks. */
      const PROFILE_SEED = {
        unit: "in",
        bust: "36",
        waist: "30",
        hip: "39",
        shoulder: "15",
        sleeve: "22",
        length: "41",
        height: "5'5\"",
        fitNote: "",
      };

      function profileMeasurements(p) {
        return MEASURE_KEYS.reduce(function (o, k) {
          o[k] = p[k] !== undefined ? p[k] : PROFILE_SEED[k];
          return o;
        }, {});
      }

      const FAMILY_KEY = "aura.family.v1";

      function readFamily() {
        try {
          const raw = window.localStorage.getItem(FAMILY_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) && parsed.length ? parsed : FAMILY;
        } catch (e) {
          return FAMILY;
        }
      }

      function writeFamily(list) {
        try {
          window.localStorage.setItem(FAMILY_KEY, JSON.stringify(list));
        } catch (e) {
          /* a record that cannot be stored still shows for this session */
        }
      }

      /* Calendar sync is a standing preference rather than a session toggle:
         once a calendar is linked its occasion dates keep feeding lead times,
         so the choice has to survive a reload. */
      const CALENDAR_KEY = "aura.calendarSync.v1";

      function readCalendarSync() {
        try {
          return window.localStorage.getItem(CALENDAR_KEY) === "on";
        } catch (e) {
          return false;
        }
      }

      function writeCalendarSync(on) {
        try {
          window.localStorage.setItem(CALENDAR_KEY, on ? "on" : "off");
        } catch (e) {
          /* a preference that cannot be stored still holds for this session */
        }
      }

      const FAMILY = [
        {
          id: "fam-1",
          name: "Meera R.",
          relation: "Mother",
          values: 12,
          updated: "Updated 21 Jul 2026",
          initials: "MR",
        },
        {
          id: "fam-2",
          name: "Ravi",
          relation: "Partner",
          values: 10,
          updated: "Updated 28 Nov 2025",
          initials: "R",
        },
        {
          id: "fam-3",
          name: "Aarav",
          relation: "Son, 7",
          values: 8,
          updated: "Re-measure suggested — children grow",
          initials: "A",

      const CREDITS = [
        {
          id: "alter",
          label: "Alterations",
          count: 2,
          note: "Free re-fitting on any piece you own. Post it back, we adjust and return it.",
        },
        {
          id: "care",
          label: "Care services",
          count: 1,
          note: "Specialist clean and press, including zari and mirror work.",
        },

      /* A heart holds either a garment name or a curated entry's id, so
         resolve against both before falling back to the raw key. */
      function resolveFavourite(key) {
        const piece = PIECES.find((p) => p.name === key);
        if (piece) {
          return {
            key,
            name: piece.name,
            title: piece.name,
            meta: piece.craft,
            image: piece.image,
            swatch: piece.swatch,
            piece,
          };
        }
        for (const section of CURATIONS) {
          const it = section.items.find((i) => i.id === key);
          if (it) {
            return {
              key,
              name: it.title,
              title: it.title,
              meta: it.meta,
              image: it.image,
              swatch: it.swatch,
              piece: it.piece ? PIECES.find((p) => p.id === it.piece) : null,
            };
          }
        }
        return { key, name: key, title: key, meta: "Saved", swatch: SWATCHES.ivory };
      }

      /* ===================================================================
       SHARED ROW PIECES
       =================================================================== */
      function Swatch({ item, className }) {
        const [failed, setFailed] = useState(false);

        if (failed || !item.image) {
          return (
            <span
              className={className}
              role="img"
              aria-label={`${item.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${item.swatch[0]} 0%, ${item.swatch[2]} 55%, ${item.swatch[1]} 100%)`,
              }}
            />
          );
        }
        return (
          <img
            src={item.image}
            alt={item.name}
            loading="lazy"
            onError={() => setFailed(true)}
            className={`${className} object-cover`}
            draggable="false"
          />
        );
      }

      /* ===================================================================
       MAIN

            {/* Dual-geography */}
            <div className="shrink-0 pt-5 flex flex-col gap-6">

              <p className="flex items-start gap-3 pt-1 m-0" aria-live="polite">

            <div className="flex-1 min-h-6" aria-hidden="true" />

            {/* Sign-off */}

                Perfect Fit Guarantee
              </span>
            </div>
          </div>
        );
      }

      function App() {
        const wish = useWishlist();

        const favourites = wish.ids.map(resolveFavourite);

        const openFavourite = (f) => {
          if (f.piece) setOpenPiece(f.piece);
          else showToast(`${f.title} — details open in the next release`);

        const [drawerOpen, setDrawerOpen] = useState(false);

        const [openOwned, setOpenOwned] = useState(null);
        // Family grows in-session, and the measurements somebody typed by hand
        // are worth keeping across a reload.
        const [family, setFamily] = useState(readFamily);
        const [addOpen, setAddOpen] = useState(false);
        const [measuring, setMeasuring] = useState(null);
        const [selfProfile, setSelfProfile] = useState(readProfile);

        useEffect(() => {
          writeFamily(family);
        }, [family]);
        // Owned items is the longest section, so it stays folded until asked for.
        const [ownedOpen, setOwnedOpen] = useState(false);
        const [ownedTab, setOwnedTab] = useState("aura");
        // Outfits you added sit above the seeded examples, newest first.
        const [uploads, setUploads] = useState(readUploads);
        const [addOutfitOpen, setAddOutfitOpen] = useState(false);

        useEffect(() => {
          writeUploads(uploads);
        }, [uploads]);

        const tabLists = { aura: OWNED, uploaded: uploads };
        // The outfit open for editing, or null while nothing is.
        const [editOutfit, setEditOutfit] = useState(null);
        // Calendar sync sits above Owned items as its own section.
        const [calendarSync, setCalendarSync] = useState(readCalendarSync);
        const [toastMsg, setToastMsg] = useState("");
        const toastTimer = useRef(null);

        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        useEffect(() => () => clearTimeout(toastTimer.current), []);

        const toggleCalendarSync = () => {
          const next = !calendarSync;
          setCalendarSync(next);
          writeCalendarSync(next);
          showToast(
            next
              ? "Calendar synced — occasion dates now set your delivery clock"
              : "Calendar sync off — your dates stay in your calendar"
          );

        // Reordering hands the piece to the stylist with its original
        // measurement set named, so the thread starts from what we know.
        const reorder = (owned) => {

            encodeURIComponent(

          // Keep the owned record alongside the catalogue one: the sheet needs

            <div className="app-viewport">

                    fill="currentColor"

                    focusable="false"
                  >
                    <path d="M20.5603 10.189L13.0603 2.68899C12.779 2.4079 12.3977 2.25 12 2.25C11.6024 2.25 11.221 2.4079 10.9397 2.68899L3.4397 10.189C3.29973 10.3279 3.18878 10.4933 3.1133 10.6755C3.03782 10.8577 2.99931 11.053 3.00001 11.2502V20.2502C3.00001 20.4492 3.07903 20.6399 3.21968 20.7806C3.36033 20.9212 3.5511 21.0002 3.75001 21.0002H9.75001C9.94892 21.0002 10.1397 20.9212 10.2803 20.7806C10.421 20.6399 10.5 20.4492 10.5 20.2502V15.0002H13.5V20.2502C13.5 20.4492 13.579 20.6399 13.7197 20.7806C13.8603 20.9212 14.0511 21.0002 14.25 21.0002H20.25C20.4489 21.0002 20.6397 20.9212 20.7803 20.7806C20.921 20.6399 21 20.4492 21 20.2502V11.2502C21.0007 11.053 20.9622 10.8577 20.8867 10.6755C20.8112 10.4933 20.7003 10.3279 20.5603 10.189ZM19.5 19.5002H15V14.2502C15 14.0513 14.921 13.8606 14.7803 13.7199C14.6397 13.5793 14.4489 13.5002 14.25 13.5002H9.75001C9.5511 13.5002 9.36033 13.5793 9.21968 13.7199C9.07903 13.8606 9.00001 14.0513 9.00001 14.2502V19.5002H4.50001V11.2502L12 3.75024L19.5 11.2502V19.5002Z" />

                  <span className="flex items-center gap-0.5">

                  <div className="flex items-center gap-3">
                    <div className="min-w-0 flex-1">
                      <h2
                        id="calendar-sync-title"
                        className="font-display text-[18px] leading-tight text-ink"
                      >
                        Sync Calendar
                      </h2>
                      <p className="text-[11.5px] text-muted leading-snug mt-1">
                        Occasion dates from your calendar set the lead time on every commission.
                      </p>
                    </div>

                    <button
                      type="button"
                      role="switch"
                      aria-checked={calendarSync}
                      aria-labelledby="calendar-sync-title"
                      onClick={toggleCalendarSync}
                      className="shrink-0 -my-2 -mr-1.5 w-12 h-11 flex items-center justify-center rounded-lg active:scale-95 transition-transform"
                    >
                      <span
                        aria-hidden="true"
                        className={`relative block w-[42px] h-[24px] rounded-full border bg-transparent transition-colors ${
                          calendarSync ? "border-primary" : "border-ctrl"
                        }`}
                      >
                        <span
                          className={`absolute top-[3px] w-[16px] h-[16px] rounded-full transition-all ${
                            calendarSync ? "left-[22px] bg-primary" : "left-[4px] bg-ctrl"
                          }`}
                        />
                      </span>
                    </button>
                  </div>
                </section>

                {/* ---------- Owned items ---------- */}
                <section className="mb-7" aria-labelledby="owned-title">
                  <h2 id="owned-title" className="sr-only">
                    Owned items
                  </h2>

                  <button
                    type="button"
                    onClick={() => setOwnedOpen((v) => !v)}
                    aria-expanded={ownedOpen}
                    aria-controls="owned-list"
                    className="w-full text-left flex items-center gap-2 -mx-1 px-1 py-1 mb-2.5 rounded-xl hover:bg-inset/60 active:scale-[0.995] transition-colors"
                  >
                    <span className="font-display text-[20px] leading-tight text-ink">
                      Owned items
                    </span>
                    <span className="font-mono text-[10.5px] text-muted">
                      {OWNED.length + uploads.length} pieces
                    </span>
                    <span className="flex-1" />
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      className={`shrink-0 text-primary transition-transform duration-200 ${
                        ownedOpen ? "rotate-90" : ""
                      }`}
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="m9 18 6-6-6-6" />
                    </svg>
                  </button>

                  {ownedOpen && (
                    <div id="owned-list" className="aura-fade-in">
                      <div
                        className="flex items-center gap-1.5 mb-2.5"
                        role="group"
                        aria-label="Which pieces to show"
                      >
                        {OWNED_TABS.map((t) => (
                          <button
                            key={t.id}
                            type="button"
                            aria-pressed={ownedTab === t.id}
                            onClick={() => setOwnedTab(t.id)}
                            className={`min-h-[44px] px-3.5 rounded-full border text-[12.5px] font-medium transition-colors ${
                              ownedTab === t.id
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            {t.label}
                            <span className="font-mono text-[10px] ml-1.5 opacity-70">
                              {tabLists[t.id].length}
                            </span>
                          </button>
                        ))}
                      </div>

                      <div className="flex flex-col gap-2.5">
                        {(tabLists[ownedTab] || tabLists.aura).map(
                          (o) => (
                        <div
                          key={o.id}
                          className="bg-card border border-hairline rounded-2xl overflow-hidden"
                        >
                          <button
                            type="button"
                            onClick={() =>
                              o.source === "uploaded" ? setEditOutfit(o) : viewPiece(o)
                            }
                            aria-label={
                              o.source === "uploaded"
                                ? `${o.name} — ${o.added}`
                                : `${o.name} — delivered ${o.delivered}`
                            }
                            aria-haspopup="dialog"
                            className="w-full text-left flex items-stretch gap-3 p-2.5 hover:bg-inset/40 active:scale-[0.995] transition-colors"
                          >
                            <Swatch
                              item={o}
                              className="shrink-0 w-[58px] h-[76px] rounded-xl overflow-hidden bg-inset"
                            />
                            <span className="min-w-0 flex-1 flex flex-col justify-center">
                              <span className="block text-[14px] font-medium text-ink leading-snug">
                                {o.name}
                              </span>
                              <span className="block text-[11.5px] text-muted leading-snug mt-0.5 line-clamp-1">
                                {o.craft}
                              </span>
                              {o.source === "uploaded" ? (
                                <React.Fragment>
                                  <span className="block font-mono text-[10.5px] text-muted mt-1">
                                    {o.added}
                                  </span>
                                  <span className="block text-[11px] text-muted mt-0.5">
                                    {o.note}
                                  </span>
                                </React.Fragment>
                              ) : (
                                <React.Fragment>
                                  <span className="block font-mono text-[10.5px] text-muted mt-1">
                                    Delivered {o.delivered}
                                  </span>
                                  <span className="block text-[11px] text-muted mt-0.5">
                                    Cut to {o.profile}
                                  </span>
                                </React.Fragment>
                              )}
                            </span>

                            {/* What you can do with it lives in the sheet. */}
                            <span
                              aria-hidden="true"
                              className="shrink-0 self-center text-muted pr-0.5"
                            >
                              <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                focusable="false"
                              >
                                <path d="m9 18 6-6-6-6" />
                              </svg>
                            </span>
                          </button>
                            </div>
                          )
                        )}
                      </div>

                      {ownedTab === "uploaded" && (
                        <button
                          type="button"
                          onClick={() => setAddOutfitOpen(true)}
                          aria-haspopup="dialog"
                          className="w-full mt-2.5 min-h-[52px] rounded-2xl border border-dashed border-ctrl/60 flex items-center justify-center gap-2 text-[13px] font-medium text-primary hover:border-primary hover:bg-inset/50 active:scale-[0.995] transition-all"
                        >
                          <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                          </svg>
                          Add an outfit
                        </button>
                      )}
                    </div>
                  )}
                </section>

                {/* ---------- Measurement profiles ---------- */}
                <section className="mb-7" aria-labelledby="profiles-title">
                  <h2
                    id="profiles-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Measurement profiles
                  </h2>
                  <div className="flex flex-col gap-2.5">
                    {PROFILES.map((p) => (
                      <button
                        key={p.id}
                        type="button"
                        aria-haspopup="dialog"
                        onClick={() =>
                          setMeasuring({
                            id: "self",
                            self: true,
                            name: p.name,
                            relation: "",
                            m: profileMeasurements(selfProfile),
                          })
                        }
                        className="w-full text-left p-3 bg-card border border-hairline rounded-2xl hover:border-primary/45 active:scale-[0.99] transition-all"
                      >
                        <span className="flex items-center justify-between gap-3">
                          <span className="text-[14px] font-medium text-ink truncate">
                            {p.name}
                          </span>
                          {p.primary && (
                            <span className="shrink-0 font-mono text-[9.5px] uppercase tracking-wider text-goldtext border border-goldtext/40 rounded-full px-2 py-0.5">
                              Primary
                            </span>
                          )}
                        </span>
                        <span className="block text-[11.5px] text-muted leading-snug mt-1">
                          {p.note}
                        </span>
                        <span className="block font-mono text-[10.5px] text-muted mt-1.5">
                          {selfProfile.measuredCount !== undefined
                            ? selfProfile.measuredCount + " values · " + selfProfile.measuredAt
                            : p.values + " values · " + p.updated}
                        </span>
                      </button>
                    ))}
                  </div>
                </section>

                {/* ---------- Family members ---------- */}
                <section className="mb-7" aria-labelledby="family-title">
                  <h2
                    id="family-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Family members
                  </h2>
                  <div className="flex flex-col gap-2.5">
                    {family.map((f) => (
                      <button
                        key={f.id}
                        type="button"
                        onClick={() => setMeasuring(f)}
                        aria-haspopup="dialog"
                        className="w-full text-left flex items-center gap-3 p-3 bg-card border border-hairline rounded-2xl hover:border-primary/45 active:scale-[0.99] transition-all"
                      >
                        <span
                          aria-hidden="true"
                          className="shrink-0 w-10 h-10 rounded-full bg-gold text-ink font-display text-[15px] flex items-center justify-center"
                        >
                          {f.initials}
                        </span>
                        <span className="min-w-0 flex-1">
                          <span className="block text-[14px] font-medium text-ink truncate">
                            {f.name}
                            <span className="text-muted font-normal"> · {f.relation}</span>
                          </span>
                          <span
                            className={`block font-mono text-[10.5px] mt-1 ${
                              f.stale ? "text-goldtext" : "text-muted"
                            }`}
                          >
                            {f.values} values · {f.updated}
                          </span>
                        </span>
                      </button>
                    ))}

                    <button
                      type="button"
                      onClick={() => setAddOpen(true)}
                      aria-haspopup="dialog"
                      className="w-full min-h-[48px] rounded-2xl border border-dashed border-ctrl/60 text-[12.5px] font-medium text-primary hover:bg-inset active:scale-[0.99] transition-all"
                    >
                      Add someone
                    </button>
                  </div>
                </section>

                {/* ---------- Care & alteration credits ---------- */}
                <section className="mb-7" aria-labelledby="credits-title">
                  <h2
                    id="credits-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Care &amp; alteration credits
                  </h2>

                  <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                    {CREDITS.map((c, i) => (
                      <div
                        key={c.id}
                        className={`p-3.5 ${i > 0 ? "border-t border-hairline" : ""}`}
                      >
                        <div className="flex items-baseline justify-between gap-3">
                          <span className="font-mono text-[11px] uppercase tracking-wider text-muted">
                            {c.label}
                          </span>
                          <span className="font-mono text-[18px] font-medium text-ink leading-none">
                            {c.count}
                          </span>
                        </div>
                        <p className="text-[11.5px] text-muted leading-snug mt-1.5">{c.note}</p>
                      </div>
                    ))}

                    <div className="px-3.5 py-3 border-t border-hairline bg-inset/50 flex items-center justify-between gap-3">
                      <span className="text-[11px] text-muted leading-snug">
                        Credits never expire while you own the piece.
                      </span>
                      <button
                        type="button"
                        onClick={() =>
                          showToast(`${totalCredits} credits available — pick a piece to use one`)
                        }
                        className="shrink-0 min-h-[44px] -my-2 px-1 text-[12px] font-medium text-primary hover:text-ink transition-colors"
                      >
                        Use a credit
                      </button>
                    </div>
                  </div>
                </section>
              </div>

              {measuring && (
                <PersonMeasureSheet
                  person={measuring}
                  onToast={showToast}
                  onClose={() => setMeasuring(null)}
                  onSave={(m, filled) => {
                    if (measuring.self) {
                      // Merge into the Profile store; leave everything else alone.
                      const next = Object.assign({}, readProfile(), m, {
                        measuredAt: todayStamp(),
                        measuredCount: filled,
                      });
                      try {
                        window.localStorage.setItem(PROFILE_KEY, JSON.stringify(next));
                      } catch (e) {
                        /* still shows for this session */
                      }
                      setSelfProfile(next);
                      setMeasuring(null);
                      showToast("Your measurements saved");
                      return;
                    }
                    setFamily((list) =>
                      list.map((p) =>
                        p.id === measuring.id
                          ? Object.assign({}, p, {
                              m,
                              values: filled,
                              updated: todayStamp(),
                              stale: filled === 0,
                            })
                          : p
                      )
                    );
                    setMeasuring(null);
                    showToast(measuring.name + "'s measurements saved");
                  }}
                />
              )}

              {(addOutfitOpen || editOutfit) && (
                <AddOutfitSheet
                  outfit={editOutfit}
                  onClose={() => {
                    setAddOutfitOpen(false);
                    setEditOutfit(null);
                  }}
                  onSave={(saved) => {
                    const editing = Boolean(editOutfit);
                    setUploads((list) =>
                      list.some((u) => u.id === saved.id)
                        ? list.map((u) => (u.id === saved.id ? saved : u))
                        : [saved].concat(list)
                    );
                    setAddOutfitOpen(false);
                    setEditOutfit(null);
                    showToast(
                      editing ? saved.name + " updated" : saved.name + " added to your wardrobe"
                    );
                  }}
                />
              )}

              {addOpen && (
                <AddPersonSheet
                  onClose={() => setAddOpen(false)}
                  onSave={(person) => {
                    setFamily((list) => list.concat(person));
                    setAddOpen(false);
                    showToast(person.name + " added — measurements next");
                  }}
                />
              )}

              {/* ---------- Product detail sheet ---------- */}
              {openPiece && (
                <ProductDetailSheet
                  saved={wish.saved(openPiece.name)}
                  onSave={() => wish.toggle(openPiece.name)}
                  piece={openPiece}
                  ship={activeCountry}
                  onClose={() => {
                    setOpenPiece(null);
                    setOpenOwned(null);
                  }}
                  owned={openOwned}
                  onReorder={(o) => {
                    setOpenPiece(null);
                    setOpenOwned(null);
                    reorder(o);
                  }}
                  onAlter={(o) => {
                    setOpenPiece(null);
                    setOpenOwned(null);
                    showToast(`Alteration requested for ${o.name} — 1 credit used`);
                  }}
                  onCare={(o) => {
                    setOpenPiece(null);
                    setOpenOwned(null);
                    showToast(`Care service booked for ${o.name}`);
                  }}
                  onRequest={(p) => {
                    // See Fit opens the thread on the measurements the piece would
                    // be cut to, rather than on a request for it. The picture and
                    // name travel with it so the thread never has to look the piece
                    // up in a catalogue that may not carry it.
                    window.location.href =
                      "conversation.html?prompt=" +
                      encodeURIComponent(`See how the ${p.name} fits me.`) +
                      "&piece=" +
                      encodeURIComponent(p.id) +
                      "&name=" +
                      encodeURIComponent(p.name) +
                      "&craft=" +
                      encodeURIComponent(p.craft || "") +
                      "&img=" +
                      encodeURIComponent(p.image || "") +
                      "&from=" +
                      encodeURIComponent(p.from || "") +
                      "&fit=1&ship=" +
                      encodeURIComponent(activeCountry.code);
                  }}
                  onAsk={(p, view) => {
                    setOpenPiece(null);
                    showToast(`Asked Meera about the ${view.label.toLowerCase()} on ${p.name}`);
                  }}
                />
              )}

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <AuraDrawer
                  active="wardrobe"
                  countries={SHIP_TO}
                  current={activeCountry}
                  onPickCountry={(c) => {
                    setActiveCountry(c);
                    showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                  }}
                  onClose={() => setDrawerOpen(false)}
                />
              </Overlay>

              {/* ---------- Minimised chat -- returns to home ---------- */}
              <a
                href="index.html"
                aria-label="Back to home"
                className="absolute bottom-7 right-4 w-14 h-14 rounded-full bg-primary text-onprimary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-all"
              >
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.9"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
