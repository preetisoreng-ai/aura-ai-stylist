              <div className="relative shrink-0 pt-2.5 pb-2.5">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="Close AI scan"
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              {capturing ? (
                /* ---------- Viewfinder ---------- */
                <div className="flex-1 flex flex-col min-h-0">
                  <div className="px-5 pb-3">
                    <h2 id="scan-title" className="font-display text-[22px] text-ink leading-tight">
                      {active.label}
                    </h2>
                    <p className="text-[12px] text-muted leading-snug mt-1">{active.cue}</p>
                  </div>

                  <div className="relative flex-1 min-h-0 mx-5 rounded-2xl overflow-hidden bg-ink">
                    <video
                      ref={videoRef}
                      playsInline
                      muted
                      className="absolute inset-0 w-full h-full object-cover"
                      style={{ transform: "scaleX(-1)" }}
                    />
                    <BodyGuide view={active.id} />

                    {countdown > 0 && (
                      <div className="absolute inset-0 flex items-center justify-center">
                        <span className="font-display text-[72px] text-white drop-shadow-lg">
                          {countdown}
                        </span>
                      </div>
                    )}

                    {camError && (
                      <div className="absolute inset-0 flex items-center justify-center p-6 text-center">
                        <p className="text-[13px] text-white leading-relaxed">{camError}</p>
                      </div>
                    )}

                    <p className="absolute left-0 right-0 bottom-3 text-center font-mono text-[10.5px] text-white/90">
                      2.5 m back · phone at hip height
                    </p>
                  </div>

                  <div className="shrink-0 px-5 pt-4 pb-5 flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => {
                        stopCamera();
                        setCapturing(null);
                        setCountdown(0);
                      }}
                      className="min-h-[48px] px-5 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                    >
                      Back
                    </button>
                    <button
                      type="button"
                      disabled={!!camError || countdown > 0}
                      onClick={() => startTimer(active.id)}
                      className="flex-1 min-h-[48px] px-5 rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
                    >
                      {countdown > 0 ? `Hold still — ${countdown}` : "Take it in 5 seconds"}
                    </button>
                  </div>
                </div>
              ) : (
                /* ---------- Setup and review ---------- */
                <div className="flex-1 overflow-y-auto px-5 pb-5">
                  <h2 id="scan-title" className="font-display text-[24px] text-ink leading-tight">
                    AI scan
                  </h2>
                  <div className="mt-5 rounded-2xl border border-hairline bg-inset/50 p-4">
                    <h3 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2">
                      How to stand
                    </h3>
                    <ul className="space-y-1.5">
                      {STANDING_GUIDE.map((g, i) => (
                        <li key={i} className="flex gap-2 text-[12px] text-ink leading-snug">
                          <span className="font-mono text-[10.5px] text-goldtext shrink-0 mt-0.5">
                            {String(i + 1).padStart(2, "0")}
                          </span>
                          <span>{g}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Three shots, three cards, side by side — the stance cue moves
                into the picker, where it is read at the moment it matters. */}
                  <div className="mt-4 grid grid-cols-3 gap-2.5">
                    {SHOTS.map((s) => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setPicking(s)}
                        aria-haspopup="dialog"
                        aria-label={
                          shots[s.id]
                            ? `${s.label} — captured, choose how to retake it`
                            : `${s.label} — choose how to take it`
                        }
                        className={`p-2 rounded-2xl border bg-card text-left transition-all active:scale-[0.98] ${
                          shots[s.id]
                            ? "border-primary/50"
                            : "border-hairline hover:border-primary/45"
                        }`}
                      >
                        <span className="block w-full aspect-[3/4] rounded-xl overflow-hidden bg-inset border border-hairline flex items-center justify-center">
                          {shots[s.id] ? (
                            <img
                              src={shots[s.id]}
                              alt={`${s.label} photograph`}
                              className="w-full h-full object-cover"
                            />
                          ) : (
                            <svg
                              viewBox="0 0 120 300"
                              className="w-full h-full p-2 opacity-35"
                              aria-hidden="true"
                            >
                              <g
                                stroke="currentColor"
                                strokeWidth="9"
                                strokeLinecap="round"
                                fill="none"
                                className="text-muted"
                              >
                                <circle cx="60" cy="34" r="20" />
                                <line x1="60" y1="54" x2="60" y2="170" />
                                <line x1="30" y1="76" x2="90" y2="76" />
                                <line x1="60" y1="170" x2="38" y2="270" />
                                <line x1="60" y1="170" x2="82" y2="270" />
                              </g>
                            </svg>
                          )}
                        </span>

                        <span className="block text-[12.5px] font-medium text-ink mt-1.5 truncate">
                          {s.label}
                        </span>
                        <span
                          className={`block font-mono text-[10px] mt-0.5 ${
                            shots[s.id] ? "text-primary" : "text-muted"
                          }`}
                        >
                          {shots[s.id] ? "Captured" : "Not yet"}
                        </span>
                      </button>
                    ))}
                  </div>

                  {picking && (
                    <div
                      className="absolute inset-0 z-50 flex items-center justify-center px-6 aura-fade-in"
                      style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
                      onMouseDown={(e) => {
                        if (e.target === e.currentTarget) setPicking(null);
                      }}
                    >
                      <div
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="shot-choice-title"
                        className="w-full max-w-[300px] bg-card rounded-3xl border border-hairline shadow-2xl p-5"
                      >
                        <h3
                          id="shot-choice-title"
                          className="font-display text-[20px] text-ink leading-tight"
                        >
                          {picking.label}
                        </h3>
                        <p className="text-[12px] text-muted leading-relaxed mt-1.5 mb-4">
                          {picking.cue}
                        </p>

                        <button
                          type="button"
                          onClick={() => {
                            const id = picking.id;
                            setPicking(null);
                            openCamera(id);
                          }}
                          className="w-full min-h-[48px] rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                        >
                          Use camera
                        </button>

                        <label className="mt-2.5 w-full min-h-[48px] rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium flex items-center justify-center cursor-pointer hover:bg-inset active:scale-95 transition-all">
                          Upload a photograph
                          <input
                            type="file"
                            accept="image/*"
                            className="sr-only"
                            onChange={(e) => {
                              const handler = onUpload(picking.id);
                              setPicking(null);
                              handler(e);
                            }}
                          />
                        </label>

                        <button
                          type="button"
                          onClick={() => setPicking(null)}
                          className="w-full min-h-[44px] mt-1.5 text-[12.5px] font-medium text-muted hover:text-ink transition-colors"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}

                  <button
                    type="button"
                    disabled={taken < SHOTS.length}
                    onClick={() => onDone(taken)}
                    className="w-full mt-5 min-h-[48px] rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
                  >
                    {taken < SHOTS.length
                      ? `Extract measurements — ${taken} of ${SHOTS.length}`
                      : "Extract measurements"}
                  </button>

                  <p className="text-[11px] text-muted leading-relaxed mt-3">
                    Photographs stay on this device in this prototype — nothing is uploaded.
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ===================================================================
             SOMEONE ELSE'S MEASUREMENTS
             The same fourteen points the Profile screen asks for, so a family
             member's record reads identically to your own. Kept per person and
             stored, because these are figures somebody has taken by hand and
             losing them on reload would be worse than not offering the form.
             =================================================================== */
      const MEASURE_FIELDS = [
        { k: "bust", label: "Bust" },
        { k: "waist", label: "Waist" },
        { k: "hip", label: "Hip" },
        { k: "shoulder", label: "Shoulder" },
        { k: "sleeve", label: "Sleeve length", short: "Sleeve" },
        { k: "length", label: "Garment length", short: "Length" },
      ];

      /* Line icons for each measurement (36px grid), drawn in brand plum. */
      const FIT_ICONS = {
        bust: (
          <>
            <path d="M11 6c0 3-2 4-2 7M25 6c0 3 2 4 2 7" />
            <path d="M9 13c0 3 2 5 4.5 5S18 16 18 14c0 2 2 4 4.5 4S27 16 27 13" />
            <path d="M9 13v3c0 6 1 11 2 14M27 13v3c0 6-1 11-2 14" />
            <path d="M11 22h14" />
          </>
        ),
        waist: (
          <>
            <path d="M11 5c1 4 3 7 3 11s-2 7-3 15M25 5c-1 4-3 7-3 11s2 7 3 15" />
            <path d="M13 16h10" strokeDasharray="1.5 2" />
            <circle cx="18" cy="19" r="0.8" fill="currentColor" stroke="none" />
          </>
        ),
        hip: (
          <>
            <path d="M11 5c0 4-2 7-2 11 0 6 2 10 3 15M25 5c0 4 2 7 2 11 0 6-2 10-3 15" />
            <path d="M9 16c3 1 6 3 9 7 3-4 6-6 9-7" />
            <path d="M18 23v8" />
          </>
        ),
        shoulder: (
          <>
            <path d="M14 5c0 2 1.5 3 4 3s4-1 4-3" />
            <path d="M14 7 8 10c-1.5.7-2 2-2 3.5V31M22 7l6 3c1.5.7 2 2 2 3.5V31" />
            <path d="M11 17v14M25 17v14" />
          </>
        ),
        sleeve: (
          <>
            <path d="M12 5c-2 1-3 3-3 5l5 18c.3 1.2 1.5 2 2.8 1.6l1.5-.5c1.2-.4 1.8-1.7 1.4-2.9L14 9" />
            <path d="M15 5c2 0 3.5 1.5 3.5 3.5" />
            <path d="m15.5 26 3.5-1.2" />
          </>
        ),
        length: (
          <>
            <path d="M14 4v4l-2 4 2 3-5 16h18l-5-16 2-3-2-4V4" />
            <path d="M14 8h8" />
          </>
        ),
        height: (
          <>
            <circle cx="14" cy="7" r="2.5" />
            <path d="M10.5 12h7l1 9h-2l-.5 10h-4l-.5-10h-2l1-9Z" />
            <path d="M25 5v26M23 5h4M23 31h4" />
          </>
        ),
        note: (
          <>
            <path d="M11 5h10l5 5v20a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
            <path d="M21 5v5h5M14 17h8M14 21h8M14 25h5" />
          </>
        ),
      };

      function FitIcon({ name, size = 28 }) {
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 36 36"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.2"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
            focusable="false"
            className="text-primary/80"
          >
            {FIT_ICONS[name]}
          </svg>
        );
      }

      /* One measurement as a card: icon, label, the figure in serif, and a
         clear button. The unit follows the figure so labels stay whole on a
         phone-width card; screen readers hear the full name and unit. */
      function MeasureField({ id, label, value, onChange, inputMode, icon, unit, fullLabel }) {
        const clear = () => {
          onChange("");
          const el = document.getElementById(id);
          if (el) el.focus();
        };
        return (
          <div className="relative flex items-stretch rounded-2xl border border-hairline bg-card focus-within:border-primary focus-within:shadow-[0_0_0_3px_rgb(59_42_90/0.12)] transition-shadow">
            <span className="shrink-0 w-12 flex items-center justify-center border-r border-hairline my-3">
              <FitIcon name={icon || "length"} />
            </span>
            <label htmlFor={id} className="flex-1 min-w-0 pl-2.5 pr-9 py-2.5 cursor-text">
              <span className="block text-[10.5px] uppercase tracking-[0.06em] text-muted truncate">
                {label}
              </span>
              <span className="flex items-baseline gap-1 mt-0.5">
                <input
                  id={id}
                  type="text"
                  value={value}
                  onChange={(e) => onChange(e.target.value)}
                  inputMode={inputMode}
                  placeholder="—"
                  aria-label={(fullLabel || label) + (unit ? ` (${unit})` : "")}
                  size={Math.max(2, (value || "").length)}
                  className="min-w-0 max-w-full bg-transparent font-read text-[22px] leading-[28px] text-ink placeholder:text-ctrl focus:outline-none"
                />
                {unit && value && <span className="text-[12px] text-muted">{unit}</span>}
              </span>
            </label>
            {value && (
              <button
                type="button"
                onClick={clear}
                aria-label={"Clear " + (fullLabel || label).toLowerCase()}
                className="absolute right-0 top-1/2 -translate-y-1/2 w-10 h-11 flex items-center justify-center text-muted hover:text-ink"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.6"
                  strokeLinecap="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            )}
          </div>
        );
      }

      function todayStamp() {
        const d = new Date();
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return "Updated " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
      }

      /* Four ways to arrive at the same fourteen points. The chips pick
               the route; everything below them belongs to that route. */
      const MEASURE_MODES = [
        {
          id: "tape",
          label: "Manual",
          icon: <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3ZM14.5 7.5l3 3" />,
        },
        {
          id: "scan",
          label: "AI scan",
          icon: (
            <>
              <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.8l1.5-2.2h6.4L16.7 7h2.8A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z" />
              <circle cx="12" cy="12.8" r="3.3" />
            </>
          ),
        },
        {
          id: "garment",
          label: "Garment",
          icon: <path d="M10 3v3l-1.5 3 1.5 2-4 10h12l-4-10 1.5-2L14 6V3M10 6h4" />,
        },
        {
          id: "session",
          label: "Session",
          icon: (
            <>
              <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
              <path d="M3.5 10h17M8 3v4M16 3v4" />
            </>
          ),
        },
      ];

      /* A native select draws its own arrow in a font that is not ours, so the
         control is flattened and the chevron drawn back on. */
      const CHEVRON_BG =
        "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235A5468' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>\")";

      /* Garments the wardrobe does not know about. */
      const OTHER_GARMENTS = [
        "Blouse",
        "Kurta",
        "Lehenga skirt",
        "Saree blouse",
        "Anarkali",
        "Shirt",
        "Dress",
        "Trousers",
      ];

      const SESSION_SLOTS = ["Tomorrow morning", "Tomorrow evening", "This weekend", "Next week"];

            function PersonMeasureSheet({ person, onClose, onSave, onToast }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const blank = {
          unit: "in",
          bust: "",
          waist: "",
          hip: "",
          shoulder: "",
          sleeve: "",
          length: "",
          height: "",
          fitNote: "",
        };
        const [form, setForm] = useState(() => Object.assign({}, blank, person.m || {}));
        const [scanOpen, setScanOpen] = useState(false);
        const [mode, setMode] = useState("tape");
        const [slot, setSlot] = useState("");
        /* Photographs of the tape on the cloth. They stay in memory for
                 this session — a data URL per shot is far too heavy for the
                 same store the figures go into. */
        const [shots, setShots] = useState([]);

        /* A flat garment reads about half the body measure, plus the ease the
           piece was cut with. Worked from the figures already on file rather
           than from the photograph itself — a draper is the one who checks it
           against the cloth. */
        const [applied, setApplied] = useState(false);

        const halfOf = (v, ease) => {
          const n = parseFloat(v);
          return isFinite(n) ? (n / 2 + ease).toFixed(1) : "";
        };

        const suggestion = {
          flatChest: halfOf(form.bust, 1),
          flatWaist: halfOf(form.waist, 1),
          flatLength: isFinite(parseFloat(form.length))
            ? String(parseFloat(form.length))
            : "",
        };

        const hasSuggestion = Boolean(
          suggestion.flatChest || suggestion.flatWaist || suggestion.flatLength
        );

        const useSuggestion = (focusAfter) => {
          setForm((f) => Object.assign({}, f, suggestion));
          setApplied(true);
          if (focusAfter) {
            window.setTimeout(() => {
              const el = document.getElementById("pm-flat-chest");
              if (el) {
                el.focus();
                el.select();
              }
            }, 60);
          }
        };

        const addShots = (e) => {
          const files = Array.from(e.target.files || []);
          e.target.value = "";
          files.slice(0, 6).forEach((file) => {
            const reader = new FileReader();
            reader.onload = () =>
              setShots((list) =>
                list.concat({
                  id: "sh" + Date.now() + Math.random(),
                  src: reader.result,
                  name: file.name,
                })
              );
            reader.readAsDataURL(file);
          });
        };
        const set = (k) => (v) => setForm((f) => Object.assign({}, f, { [k]: v }));

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (panelRef.current) panelRef.current.focus();

          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        const filled =
          MEASURE_FIELDS.filter((m) => form[m.k].trim()).length + (form.height.trim() ? 1 : 0);

        if (scanOpen) {
          // The scan takes the whole screen, so it replaces the sheet
          // rather than stacking on it; closing returns you here with
          // whatever you had already typed still in the fields.
          return (
            <AiScanModal
              onClose={() => setScanOpen(false)}
              onDone={(n) => {
                setScanOpen(false);
                onToast(
                  n +
                    " photographs of " +
                    (person.self ? "you" : person.name) +
                    " saved \u2014 a draper will confirm " +
                    (person.self ? "your" : "their") +
                    " fourteen points within a day"
                );
              }}
            />
          );
        }

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="measure-sheet-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 h-[94%] bg-canvas rounded-t-[32px] shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              <div className="relative shrink-0 pt-3 pb-1">
                <span className="block w-10 h-1 rounded-full bg-ctrl/40 mx-auto" aria-hidden="true" />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label={
                    person.self
                      ? "Close your measurements"
                      : "Close " + person.name + "'s measurements"
                  }
                  className="absolute top-3 right-3 w-11 h-11 rounded-full flex items-center justify-center bg-hairline/70 text-ink hover:bg-hairline active:scale-95 transition-all z-10"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto thread-scroll px-4 pt-4 pb-6">
                <h2
                  id="measure-sheet-title"
                  className="font-display text-[32px] leading-none text-ink pr-12"
                >
                  {person.self ? "Your measurements" : person.name}
                  {!person.self && person.relation && (
                    <span className="text-muted text-[20px]">{" \u00b7 " + person.relation}</span>
                  )}
                </h2>
                <p className="text-[14px] text-muted leading-snug mt-2 mb-5">
                  {person.self
                    ? "Add your details for a better fit and personalised suggestions."
                    : "Add " + person.name + "\u2019s details for a better fit and personalised suggestions."}
                </p>
                {/* How the measurements get taken. */}
                <div
                  className="flex gap-1 p-1 rounded-full bg-card border border-hairline shadow-[0_1px_3px_rgb(30_27_46/0.06)] mb-6"
                  role="tablist"
                  aria-label="How to take these measurements"
                >
                  {MEASURE_MODES.map((mm) => {
                    const on = mode === mm.id;
                    return (
                      <button
                        key={mm.id}
                        type="button"
                        role="tab"
                        aria-selected={on}
                        onClick={() => setMode(mm.id)}
                        className={
"flex-1 min-w-0 min-h-[44px] px-1 rounded-full flex items-center justify-center gap-1.5 font-read text-[15px] whitespace-nowrap transition-colors " + (on ? "bg-primary text-onprimary" : "text-ink hover:bg-inset")
                        }
                      >
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="1.5"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                          className="shrink-0"
                        >
                          {mm.icon}
                        </svg>
                        {mm.label}
                      </button>
                    );
                  })}
                </div>

                {mode === "scan" && (
                  <div className="aura-fade-in">
                    <p className="text-[13px] text-ink leading-relaxed">
                      Photograph {person.self ? "yourself" : person.name} against an on-screen guide
                      — front, back and side.
                    </p>
                    <button
                      type="button"
                      onClick={() => setScanOpen(true)}
                      aria-haspopup="dialog"
                      className="mt-3 w-full min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[13.5px] font-medium flex items-center justify-center gap-1.5 hover:bg-primary/90 active:scale-95 transition-all"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M12 2.5 13.9 8.1 19.5 10 13.9 11.9 12 17.5 10.1 11.9 4.5 10 10.1 8.1z" />
                        <path d="M18.5 15.5 19.4 18.1 22 19 19.4 19.9 18.5 22.5 17.6 19.9 15 19 17.6 18.1z" />
                      </svg>
                      Open the camera guide
                    </button>
                  </div>
                )}

                {mode === "garment" && (
                  <div className="aura-fade-in space-y-3.5">
                    <p className="text-[13px] text-ink leading-relaxed">
                      Lay a garment that already fits flat, and measure across it. A draper doubles
                      the flat figures.
                    </p>

                    <div>
                      <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5">
                        Photographs
                      </span>
                      <p className="text-[11.5px] text-muted leading-relaxed mb-2">
                        Photograph the tape where it lies on the cloth, so a draper can check the
                        reading against the garment.
                      </p>

                      <div className="grid grid-cols-3 gap-2">
                        {shots.map((sh) => (
                          <div key={sh.id} className="relative">
                            <img
                              src={sh.src}
                              alt={"Tape on the garment \u2014 " + sh.name}
                              className="block w-full aspect-[3/4] object-cover rounded-xl border border-hairline bg-inset"
                            />
                            <button
                              type="button"
                              onClick={() => setShots((list) => list.filter((x) => x.id !== sh.id))}
                              aria-label={"Remove " + sh.name}
                              className="absolute top-1 right-1 w-7 h-7 rounded-full bg-card border border-hairline text-ink shadow-sm flex items-center justify-center hover:bg-inset active:scale-90 transition-all"
                            >
                              <svg
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2.4"
                                strokeLinecap="round"
                                aria-hidden="true"
                                focusable="false"
                              >
                                <path d="M18 6 6 18" />
                                <path d="m6 6 12 12" />
                              </svg>
                            </button>
                          </div>
                        ))}

                        <label className="aspect-[3/4] rounded-xl border border-dashed border-ctrl/60 flex flex-col items-center justify-center gap-1 text-primary cursor-pointer hover:bg-inset hover:border-primary/50 active:scale-[0.98] transition-all">
                          <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="1.9"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                          </svg>
                          <span className="text-[11.5px] font-medium">
                            {shots.length ? "Add more" : "Add a photo"}
                          </span>
                          <input
                            type="file"
                            accept="image/*"
                            multiple
                            className="sr-only"
                            onChange={addShots}
                          />
                        </label>
                      </div>

                      {shots.length > 0 && (
                        <p className="font-mono text-[10px] text-muted mt-1.5">
                          {shots.length} {shots.length === 1 ? "photograph" : "photographs"}
                          {" \u00b7 kept on this device"}
                        </p>
                      )}

                      {shots.length > 0 && hasSuggestion && (
                        <div className="mt-3 rounded-2xl border border-hairline bg-inset/50 p-3.5 aura-fade-in">
                          <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted">
                            Suggested reading
                          </span>
                          <p className="text-[11.5px] text-muted leading-relaxed mt-1 mb-2.5">
                            Worked from the figures already on file. A draper checks
                            them against your photographs before anything is cut.
                          </p>

                          <dl className="bg-card border border-hairline rounded-xl divide-y divide-hairline overflow-hidden">
                            {[
                              { k: "flatChest", label: "Chest, flat" },
                              { k: "flatWaist", label: "Waist, flat" },
                              { k: "flatLength", label: "Length" },
                            ].map((r) => (
                              <div
                                key={r.k}
                                className="flex items-baseline justify-between gap-3 px-3 py-2"
                              >
                                <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted">
                                  {r.label}
                                </dt>
                                <dd className="font-mono text-[13px] text-ink">
                                  {suggestion[r.k]
                                    ? suggestion[r.k] + " " + form.unit
                                    : "\u2014"}
                                </dd>
                              </div>
                            ))}
                          </dl>

                          {applied ? (
                            <p className="flex items-center gap-1.5 text-[12.5px] mt-2.5 text-primary">
                              <svg
                                width="15"
                                height="15"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2.4"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                aria-hidden="true"
                                focusable="false"
                              >
                                <path d="M20 6 9 17l-5-5" />
                              </svg>
                              Filled in below — edit any of them
                            </p>
                          ) : (
                            <div className="flex items-center gap-2 mt-2.5">
                              <button
                                type="button"
                                onClick={() => useSuggestion(false)}
                                className="flex-1 min-h-[44px] px-3 rounded-full bg-primary text-onprimary text-[13px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                              >
                                Use these
                              </button>
                              <button
                                type="button"
                                onClick={() => useSuggestion(true)}
                                className="flex-1 min-h-[44px] px-3 rounded-full bg-card border border-ctrl text-ink text-[13px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Adjust manually
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    <div>
                      <label
                        htmlFor="pm-garment"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Which garment
                      </label>
                      <select
                        id="pm-garment"
                        value={form.garment || ""}
                        onChange={(e) => set("garment")(e.target.value)}
                        style={{
                          fontSize: 16,
                          backgroundImage: CHEVRON_BG,
                          backgroundRepeat: "no-repeat",
                          backgroundPosition: "right 14px center",
                          backgroundSize: "16px",
                        }}
                        className="w-full min-h-[48px] pl-3.5 pr-10 rounded-xl border border-hairline bg-card text-ink appearance-none focus:outline-none focus:border-primary transition-colors"
                      >
                        <option value="">Choose a garment</option>
                        <optgroup label="From your wardrobe">
                          {OWNED.map((o) => (
                            <option key={o.id} value={o.name}>
                              {o.name}
                            </option>
                          ))}
                        </optgroup>
                        <optgroup label="Something else">
                          {OTHER_GARMENTS.map((g) => (
                            <option key={g} value={g}>
                              {g}
                            </option>
                          ))}
                        </optgroup>
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <MeasureField
                        id="pm-flat-chest"
                        icon="bust"
                        unit={form.unit}
                        label="Chest, flat"
                        value={form.flatChest || ""}
                        onChange={set("flatChest")}
                        inputMode="decimal"
                      />
                      <MeasureField
                        id="pm-flat-waist"
                        icon="waist"
                        unit={form.unit}
                        label="Waist, flat"
                        value={form.flatWaist || ""}
                        onChange={set("flatWaist")}
                        inputMode="decimal"
                      />
                    </div>
                    <MeasureField
                      id="pm-flat-length"
                      icon="length"
                      unit={form.unit}
                      label="Length, shoulder to hem"
                      value={form.flatLength || ""}
                      onChange={set("flatLength")}
                      inputMode="decimal"
                    />
                  </div>
                )}

                {mode === "session" && (
                  <div className="aura-fade-in">
                    <p className="text-[13px] text-ink leading-relaxed">
                      A draper takes the points with {person.self ? "you" : person.name} over video.
                      Six minutes, and they write them down for you.
                    </p>
                    <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-4 mb-1.5">
                      When suits
                    </span>
                    <div className="flex flex-wrap gap-2" role="group" aria-label="When suits">
                      {SESSION_SLOTS.map((sl) => {
                        const on = slot === sl;
                        return (
                          <button
                            key={sl}
                            type="button"
                            aria-pressed={on}
                            onClick={() => setSlot(sl)}
                            className={
                              "min-h-[44px] px-4 rounded-full border font-read text-[15px] transition-all active:scale-95 " +
                              (on
                                ? "bg-primary text-onprimary border-primary"
                                : "text-ink border-gold/45 hover:bg-card/60 hover:border-gold/80")
                            }
                          >
                            {sl}
                          </button>
                        );
                      })}
                    </div>
                    <button
                      type="button"
                      disabled={!slot}
                      onClick={() =>
                        onToast(
                          "Session requested for " +
                            slot.toLowerCase() +
                            " \u2014 Meera will confirm a time"
                        )
                      }
                      className="mt-4 w-full min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
                    >
                      {slot ? "Request this session" : "Pick a time first"}
                    </button>
                  </div>
                )}

                <div
                  className="space-y-3.5"
                  hidden={mode !== "tape"}
                  style={{ display: mode === "tape" ? undefined : "none" }}
                >
                  <div>
                    <span id="pm-unit-label" className="block text-[14px] text-ink mb-2">
                      Units
                    </span>
                    <div
                      className="inline-flex p-0.5 rounded-full bg-inset border border-hairline"
                      role="group"
                      aria-labelledby="pm-unit-label"
                    >
                      {[
                        { id: "in", label: "Inches" },
                        { id: "cm", label: "Centimetres" },
                      ].map((u) => {
                        const on = form.unit === u.id;
                        return (
                          <button
                            key={u.id}
                            type="button"
                            aria-pressed={on}
                            onClick={() => set("unit")(u.id)}
                            className={
                              "min-h-[32px] px-4 rounded-full text-[13.5px] transition-colors " + (on ? "bg-card text-primary font-medium shadow-[0_1px_2px_rgb(30_27_46/0.08)]" : "text-muted hover:text-ink")
                            }
                          >
                            {u.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="border-t border-hairline pt-4 grid grid-cols-2 gap-2">
                    {MEASURE_FIELDS.map((m) => (
                      <MeasureField
                        key={m.k}
                        id={"pm-" + m.k}
                        icon={m.k}
                        label={m.short || m.label}
                        fullLabel={m.label}
                        unit={form.unit}
                        value={form[m.k]}
                        onChange={set(m.k)}
                        inputMode="decimal"
                      />
                    ))}
                  </div>

                  <MeasureField
                    id="pm-height"
                    icon="height"
                    label="Height"
                    value={form.height}
                    onChange={set("height")}
                  />
                </div>

                <div className="mt-5">
                  <label
                    htmlFor="pm-fit"
                    className="block font-mono text-[11px] uppercase tracking-[0.08em] text-muted mb-2"
                  >
                    Fit notes
                  </label>
                  <div className="flex items-stretch rounded-2xl border border-hairline bg-card focus-within:border-primary focus-within:shadow-[0_0_0_3px_rgb(59_42_90/0.12)] transition-shadow">
                  <span className="shrink-0 w-12 flex items-start justify-center pt-4 border-r border-hairline my-3">
                    <FitIcon name="note" size={24} />
                  </span>
                  <textarea
                    id="pm-fit"
                    rows={3}
                    value={form.fitNote}
                    onChange={(e) => set("fitNote")(e.target.value)}
                    placeholder="Add any specific notes (optional)"
                    style={{ fontSize: 16 }}
                    className="flex-1 min-w-0 px-3 py-3.5 bg-transparent text-ink placeholder:text-muted resize-none focus:outline-none"
                  />
                  </div>
                </div>
              </div>

              <div className="shrink-0 border-t border-hairline px-5 pt-3.5 pb-5 flex items-center gap-2.5 bg-canvas">
                <span className="text-[15px] text-muted flex-1" aria-live="polite">
                  {filled} of 7 recorded
                </span>
                <button
                  type="button"
                  onClick={onClose}
                  className="min-h-[52px] px-6 rounded-full border border-ink text-ink font-read text-[17px] hover:bg-inset active:scale-95 transition-all"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  onClick={() => onSave(form, filled)}
                  className="min-h-[52px] pl-6 pr-5 rounded-full bg-primary text-onprimary font-read text-[17px] flex items-center gap-2.5 hover:bg-primary/90 active:scale-95 transition-all"
                >
                  Save
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* ===================================================================
             ADD SOMEONE
             A new person is only a name and how they relate to you — their
             measurements are taken later, either in a fitting or by scan.
             Asking for anything more here would be asking for data we cannot
             use yet.
             =================================================================== */
      const RELATIONS = [
        "Mother",
        "Father",
        "Partner",
        "Sister",
        "Brother",
        "Daughter",
        "Son",
        "Friend",
      ];

      // "Meera R." -> "MR", "Ravi" -> "R". Matches the existing avatars.
      function initialsFor(name) {
        const parts = name.trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0][0].toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      /* Add an outfit: photograph first, because everything else is read
         from it. Aura fills the name and the description, then hands both
         back as ordinary fields — nothing is saved that you have not seen. */
      function AddOutfitSheet({ outfit, onClose, onSave }) {
        const restoreRef = useRef(null);
        const fileRef = useRef(null);
        const readTimer = useRef(null);
        const [image, setImage] = useState(outfit ? outfit.image || null : null);
        const [reading, setReading] = useState(false);
        const [name, setName] = useState(outfit ? outfit.name : "");
        const [note, setNote] = useState(outfit ? outfit.note || "" : "");
        // The hint under the photograph belongs to a read Aura has just done,
        // not to words you typed yourself last week.
        const [suggested, setSuggested] = useState(false);

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            clearTimeout(readTimer.current);
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        const pick = (e) => {
          const file = e.target.files && e.target.files[0];
          // Cleared so choosing the same file twice still fires a change.
          e.target.value = "";
          if (!file) return;
          setReading(true);
          thumbnail(file, 640, (data) => {
            if (!data) {
              setReading(false);
              return;
            }
            setImage(data);
            // A beat of reading, so the filled fields read as Aura's answer to
            // the photograph rather than something that was always there.
            readTimer.current = setTimeout(() => {
              const read = suggestFor(file);
              setName((v) => v || read.name);
              setNote((v) => v || read.note);
              setSuggested(true);
              setReading(false);
            }, 900);
          });
        };

        const trimmed = name.trim();
        // An outfit already in the wardrobe may never have had a photograph;
        // editing its words should not be held hostage to adding one.
        const ready = Boolean(trimmed && !reading && (image || outfit));

        const submit = (e) => {
          e.preventDefault();
          if (!ready) return;
          onSave(
            Object.assign({}, outfit, {
              id: outfit ? outfit.id : "up-" + Date.now(),
              source: "uploaded",
              name: trimmed,
              craft: outfit ? outfit.craft : "Your photograph",
              added: outfit ? outfit.added : todayStamp().replace("Updated", "Added"),
              note: note.trim() || "No description yet",
              image,
              swatch: outfit ? outfit.swatch : ["#D9C7A7", "#F3EEE4", "#C89B3C"],
            })
          );
        };

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby="add-outfit-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 max-h-[92%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              <div className="relative shrink-0 pt-2.5 pb-1">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label={
                    outfit ? "Close without saving changes" : "Close without adding an outfit"
                  }
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <form onSubmit={submit} className="px-5 pt-2 pb-6 overflow-y-auto no-scrollbar">
                <h2 id="add-outfit-title" className="font-display text-[22px] leading-tight text-ink">
                  {outfit ? "Edit outfit" : "Add an outfit"}
                </h2>
                <p className="text-[12px] text-muted leading-snug mt-1.5">
                  {outfit
                    ? "Change the photograph or the words. Nothing is saved until you say so."
                    : "Photograph the piece and Aura will fill in the rest. Change anything it gets wrong."}
                </p>

                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*"
                  onChange={pick}
                  className="sr-only"
                  tabIndex={-1}
                  aria-hidden="true"
                />

                {!image ? (
                  <button
                    type="button"
                    onClick={() => fileRef.current && fileRef.current.click()}
                    disabled={reading}
                    className="w-full mt-5 aspect-[4/3] rounded-2xl border border-dashed border-ctrl/70 bg-inset/40 flex flex-col items-center justify-center gap-2 text-primary hover:border-primary hover:bg-inset/70 active:scale-[0.995] transition-all disabled:opacity-60"
                  >
                    <svg
                      width="26"
                      height="26"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="1.8"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <rect x="3" y="5" width="18" height="14" rx="2" />
                      <circle cx="8.5" cy="10" r="1.5" />
                      <path d="m21 16-5-5-9 8" />
                    </svg>
                    <span className="text-[13.5px] font-medium">
                      {reading ? "Reading the photograph—" : "Add a photograph"}
                    </span>
                    <span className="text-[11px] text-muted">From your camera or camera roll</span>
                  </button>
                ) : (
                  <div className="mt-5">
                    <div className="relative rounded-2xl overflow-hidden border border-hairline bg-inset">
                      <img
                        src={image}
                        alt="The outfit you are adding"
                        className="block w-full max-h-[240px] object-contain bg-inset"
                      />
                      <button
                        type="button"
                        onClick={() => fileRef.current && fileRef.current.click()}
                        className="absolute bottom-2 right-2 min-h-[36px] px-3 rounded-full bg-card/95 border border-hairline text-[11.5px] font-medium text-ink shadow-sm hover:bg-card active:scale-95 transition-all"
                      >
                        Retake
                      </button>
                    </div>

                    <p
                      className="flex items-center gap-1.5 text-[11px] text-muted mt-2.5"
                      role="status"
                      aria-live="polite"
                    >
                      {reading ? (
                        <span>Reading the photograph—</span>
                      ) : suggested ? (
                        <span>Suggested from your photo · edit anything that is off.</span>
                      ) : (
                        <span>Retake the photograph, or edit the words below.</span>
                      )}
                    </p>

                    <label
                      htmlFor="outfit-name"
                      className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-4 mb-1.5"
                    >
                      What it is
                    </label>
                    <input
                      id="outfit-name"
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Banarasi silk saree"
                      autoComplete="off"
                      style={{ fontSize: 16 }}
                      className="w-full px-3.5 py-3 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                    />

                    <label
                      htmlFor="outfit-note"
                      className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mt-4 mb-1.5"
                    >
                      Description
                    </label>
                    <textarea
                      id="outfit-note"
                      rows={2}
                      value={note}
                      onChange={(e) => setNote(e.target.value)}
                      placeholder="Colour, fabric, where it came from"
                      style={{ fontSize: 16 }}
