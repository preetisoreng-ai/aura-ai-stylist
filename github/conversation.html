                  className="shrink-0"
                />
                <span className="flex-1 min-w-0 font-sans text-[12px] leading-[18px] text-muted">
                  Prices are landed to {current.code} — {current.duty},{" "}
                  {current.courier}. Nothing is added at checkout.
                </span>
              </p>
            </div>

            <div className="flex-1 min-h-6" aria-hidden="true" />

            {/* Sign-off */}
            <div className="shrink-0 relative h-[170px] border-t border-hairline">
              <span className="absolute left-0 top-[135px] font-mono text-[11px] leading-[13px] text-muted">
                Aura v1.0
              </span>
              <span className="absolute right-0 top-[127px] font-mono text-[10px] leading-[14px] tracking-[2px] uppercase text-ink pb-[5px] border-b border-ink/60 whitespace-nowrap">
                Perfect Fit Guarantee
              </span>
            </div>
          </div>
        );
      }

      function App() {
        const wish = useWishlist();
        const params = new URLSearchParams(window.location.search);
        const initialPrompt = (params.get("prompt") || "").trim();
        const [shipCode, setShipCode] = useState(() => (params.get("ship") || "US").toUpperCase());
        const ship = SHIP_TO[shipCode] || SHIP_TO.US;

        const brief = parseBrief(initialPrompt, ship);
        const directions = buildDirections(brief, ship);

        // Keep the key we arrived with: the record it resolves to may be a
        // design direction whose own id ("regal") is not the key ("regal-lehenga").
        const openingPieceKey = (params.get("piece") || "").trim();
        const openingPiece = pieceFor(openingPieceKey, directions);

        /* The screen that sent us here knows the piece even when this one
           does not, so fall back to what it put in the URL. */
        const openingContext = openingPiece
          ? {
              image: openingPiece.image,
              name: openingPiece.name,
              label: openingPiece.craft,
              piece: openingPieceKey,
            }
          : (params.get("name") || "").trim()
            ? {
                image: (params.get("img") || "").trim(),
                name: (params.get("name") || "").trim(),
                label: (params.get("craft") || "").trim(),
                piece: openingPieceKey,
              }
            : undefined;

        // What checkout needs to restate the order.
        const openingPieceRecord = openingContext
          ? {
              name: openingContext.name,
              craft: openingContext.label,
              image: openingContext.image,
              from: (openingPiece && openingPiece.from) || Number(params.get("from")) || null,
            }
          : null;

        // "See Fit" opens the thread on measurements instead of on a brief.
        const isFit = params.get("fit") === "1";
        const fitPieceName =
          (openingContext && openingContext.name) ||
          (initialPrompt.match(/See how the (.+) fits me\./) || [])[1] ||
          "";
        const [fit, setFit] = useState(readFit);
        const [fitPeople, setFitPeople] = useState(readFitPeople);
        const [checkout, setCheckout] = useState(null);
        const [fitWho, setFitWho] = useState("self");
        // A thread can hold more than one fit check, so which card is settled
        // and which one opened the sheet are both tracked per message.
        const [fitSheet, setFitSheet] = useState(null);
        const [settledFits, setSettledFits] = useState({});

        const [messages, setMessages] = useState(() => {
          if (!initialPrompt) return [];
          return [
            {
              id: "u0",
              from: "user",
              text: initialPrompt,
              // Arriving from a garment: show it, and let it be opened.
              context: openingContext,
            },
          ];
        });
        const [typing, setTyping] = useState(Boolean(initialPrompt));
        // "Today, 9:41 AM" over the thread — when this conversation opened.
        const [startedAt] = useState(() =>
          new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        );
        const [showWork, setShowWork] = useState(false);
        const [inputVal, setInputVal] = useState("");
        const [isListening, setIsListening] = useState(false);
        const [toastMsg, setToastMsg] = useState("");
        const [openDirection, setOpenDirection] = useState(null);
        const [drawerOpen, setDrawerOpen] = useState(false);
        // Attachment popup (Figma 36:1267) — Camera / Photos / Files.
        const [attachOpen, setAttachOpen] = useState(false);

        const attachRef = useRef(null);
        const threadRef = useRef(null);
        const bottomRef = useRef(null);
        const inputRef = useRef(null);
        const toastTimer = useRef(null);
        const timers = useRef([]);

        const track = (id) => {
          timers.current.push(id);
          return id;
        };

        // Log the opening brief once per mount so it appears in the home
        // screen's history drawer.
        useEffect(() => {
          recordChat(initialPrompt, shipCode);
        }, [initialPrompt, shipCode]);

        // Attachment popup dismisses on Escape or a click outside it. The
        // popup is a menu, not a dialog, so it does not trap focus.
        useEffect(() => {
          if (!attachOpen) return;
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              setAttachOpen(false);
            }
          };
          const onPointer = (e) => {
            if (attachRef.current && !attachRef.current.contains(e.target)) {
              setAttachOpen(false);
            }
          };
          document.addEventListener("keydown", onKey);
          document.addEventListener("pointerdown", onPointer);
          return () => {
            document.removeEventListener("keydown", onKey);
            document.removeEventListener("pointerdown", onPointer);
          };
        }, [attachOpen]);

        useEffect(
          () => () => {
            timers.current.forEach(clearTimeout);
            if (toastTimer.current) clearTimeout(toastTimer.current);
          },
          []
        );

        // The mobile keyboard shrinks the visual viewport without changing
        // the layout viewport — track it so the composer is never covered.
        useEffect(() => {
          const vv = window.visualViewport;
          if (!vv) return;
          const root = document.documentElement;
          const apply = () => {
            root.style.setProperty("--app-h", vv.height + "px");
          };
          apply();
          vv.addEventListener("resize", apply);
          vv.addEventListener("scroll", apply);
          return () => {
            vv.removeEventListener("resize", apply);
            vv.removeEventListener("scroll", apply);
            root.style.removeProperty("--app-h");
          };
        }, []);

        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        // Opening reply to the brief carried over from the home screen.
        useEffect(() => {
          if (!initialPrompt) return;
          const id = track(
            setTimeout(
              () => {
                setTyping(false);
                setShowWork(!isFit);
                setMessages((m) => [
                  ...m,
                  isFit
                    ? {
                        id: "a0",
                        from: "aura",
                        text: fitPieceName
                          ? `Here are the measurements the ${fitPieceName} would be cut to.`
                          : "Here are the measurements this piece would be cut to.",
                        fit: true,
                        fitChoice: true,
                        fitPiece: fitPieceName,
                        fitRecord: openingPieceRecord,
                      }
                    : {
                        id: "a0",
                        from: "aura",
                        text: `Here's how I've read your brief, and four directions that answer it differently. Every price is landed to ${ship.code}, and every lead time is what the artisan can actually hold. Tell me what's missing and I'll tighten it.`,
                        work: true,
                      },
                ]);
              },
              reducedMotion() ? 120 : 1100
            )
          );
          return () => clearTimeout(id);
        }, []);

        // Keep the newest message in view without yanking the whole page.
        useEffect(() => {
          const el = bottomRef.current;
          if (!el) return;
          el.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "end" });
        }, [messages, typing]);

        /* `context` attaches the photograph the question came from, so the
           thread shows what was being looked at and Meera answers about it. */
        const send = (raw, context) => {
          const text = (raw || "").trim();
          if (!text) {
            if (inputRef.current) inputRef.current.focus();
            return;
          }
          const uid = "u" + Date.now();
          setMessages((m) => [...m, { id: uid, from: "user", text, context }]);
          setInputVal("");
          setComposerExpanded(false);
          setTyping(true);

          track(
            setTimeout(
              () => {
                setTyping(false);
                setMessages((m) => [
                  ...m,
                  {
                    id: "a" + Date.now(),
                    from: "aura",
                    ...(context && context.replyWith
                      ? context.replyWith
                      : auraReplyTo(text, brief, ship, directions)),
                  },
                ]);
              },
              reducedMotion() ? 120 : 900
            )
          );
        };

        const handleMic = () => {
          if (isListening) {
            setIsListening(false);
            showToast("Voice input stopped");
            return;
          }
          setIsListening(true);
          showToast("Listening — English, Hindi or Hinglish");
          track(
            setTimeout(() => {
              setIsListening(false);
              setInputVal("Kuch lightweight dikhao — the venue gets warm by evening.");
              showToast("Voice transcribed into the composer");
              if (inputRef.current) inputRef.current.focus();
            }, 1800)
          );
        };

        const hasText = inputVal.trim().length > 0;
        /* The pill holds one line. When the text needs a second, the box opens
           into the card; it closes again once the text is short enough to fit
           (a little shorter than where it opened, so it does not flicker). */
        const [multiline, setMultiline] = useState(null);
        const composerOpen = multiline !== null;

        const ICON = "images/input-box/";

        const renderPlus = () => (
          <button
            type="button"
            onClick={() => setAttachOpen((v) => !v)}
            aria-label="Add an attachment"
            aria-haspopup="menu"
            aria-expanded={attachOpen}
            className={`w-11 h-11 shrink-0 rounded-full flex items-center justify-center transition-colors ${
              attachOpen ? "bg-primary text-onprimary" : "text-primary hover:bg-inset active:scale-95"
            }`}
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              stroke="currentColor"
              strokeWidth="1.4"
              strokeLinecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M9 2v14M2 9h14" />
            </svg>
          </button>
        );

        const renderMic = () => (
          <button
            type="button"
            onClick={handleMic}
            aria-label={isListening ? "Stop voice input" : "Start voice input"}
            aria-pressed={isListening}
            className={`w-11 h-11 shrink-0 rounded-full flex items-center justify-center transition-colors ${
              isListening ? "bg-primary aura-listening" : "bg-inset hover:bg-hairline active:scale-95"
            }`}
          >
            <img
              src={ICON + "icon-mic.svg"}
              width="23.5517"
              height="24.75"
              alt=""
              style={isListening ? { filter: "brightness(0) invert(1)" } : undefined}
            />
          </button>
        );

        const renderSend = () => (
          <button
            type="submit"
            disabled={!hasText}
            aria-label="Send"
            className="w-11 h-11 shrink-0 rounded-full bg-primary flex items-center justify-center hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-50"
          >
            <img src={ICON + "icon-send-arrow.svg"} width="23" height="24" alt="" />
          </button>
        );

        /* Grow the field to fit what has been typed, then scroll inside it. */
        const fitComposer = useCallback(() => {
          const el = inputRef.current;
          if (!el) return;
          if (!composerOpen) {
            el.style.height = "";
            el.style.overflowY = "hidden";
            // One line is 19px of text plus 12px of padding; anything taller wrapped.
            if (inputVal.includes("\n") || el.scrollHeight > 36) setMultiline(inputVal.length);
            return;
          }
          const fitsAgain =
            !inputVal.trim() || (!inputVal.includes("\n") && inputVal.length < multiline - 4);
          if (fitsAgain) {
            setMultiline(null);
            return;
          }
          el.style.height = "auto";
          const full = el.scrollHeight;
          const max = 162; // Figma 7:2818 — the card's text area
          el.style.height = Math.min(full, max) + "px";
          el.style.overflowY = full > max ? "auto" : "hidden";
        }, [composerOpen, inputVal, multiline]);

        useLayoutEffect(() => {
          fitComposer();
          const frame = requestAnimationFrame(fitComposer);
          window.addEventListener("resize", fitComposer);
          return () => {
            cancelAnimationFrame(frame);
            window.removeEventListener("resize", fitComposer);
          };
        }, [inputVal, fitComposer]);

        /* Webfonts land after first paint and reflow the reply taller, so
           measure again once they have settled. */
        useEffect(() => {
          if (!document.fonts || !document.fonts.ready) return;
          let live = true;
          document.fonts.ready.then(() => {
            if (live) fitComposer();
          });
          return () => {
            live = false;
          };
        }, [fitComposer]);

        /* Rotation, a late stylesheet or a resized window all change how the
           reply wraps -- re-fit on width changes only, never on our own
           height writes. */
        useEffect(() => {
          const el = inputRef.current;
          if (!el || typeof ResizeObserver === "undefined") return;
          let lastWidth = el.clientWidth;
          const ro = new ResizeObserver((entries) => {
            const width = entries[0].contentRect.width;
            if (Math.abs(width - lastWidth) < 0.5) return;
            lastWidth = width;
            fitComposer();
          });
          ro.observe(el);
          return () => ro.disconnect();
        }, [fitComposer]);

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>
            {toastMsg && (
              <div
                aria-hidden="true"
                className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
              >
                <span className="text-gold" aria-hidden="true">
                  ✦
                </span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              {/* ---------- Header ---------- */}
              <header className="shrink-0 z-20 pl-2 pr-4 pt-3 pb-2 flex items-center gap-1 bg-canvas">
                <a
                  href="index.html"
                  onClick={(e) => {
                    // Go back to wherever we came from when there is somewhere to go.
                    if (window.history.length > 1 && document.referrer) {
                      e.preventDefault();
                      window.history.back();
                    }
                  }}
                  aria-label="Back"
                  className="w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 5-7 7 7 7" />
                  </svg>
                </a>

                <h1 className="flex-1 min-w-0 font-display text-[36px] leading-none text-ink truncate">
                  Aura
                </h1>

                <button
                  type="button"
                  onClick={() => setDrawerOpen(true)}
                  aria-label="Open navigation menu"
                  aria-haspopup="dialog"
                  aria-expanded={drawerOpen}
                  className="w-11 h-11 rounded-full border border-hairline flex items-center justify-center text-ink hover:border-primary/40 active:scale-95 transition-all shrink-0"
                  style={{ background: "rgb(var(--card-rgb))" }}
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line x1="4" y1="7" x2="20" y2="7" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="17" x2="20" y2="17" />
                  </svg>
                </button>
              </header>

              {/* ---------- Thread ---------- */}
              <div ref={threadRef} className="thread-scroll px-4 py-4">
                <div
                  className="space-y-3.5"
                  role="log"
                  aria-live="polite"
                  aria-label="Conversation with your stylist"
                >
                  {messages.length === 0 && (
                    <div className="text-center pt-10 px-4">
                      <h2 className="font-display text-[24px] text-ink leading-tight">
                        Tell me about the occasion
                      </h2>
                      <p className="text-[13px] text-muted mt-2 leading-relaxed max-w-[280px] mx-auto">
                        Where it is, when it is, and how you want to feel in the room. I'll take it
                        from there.
                      </p>
                    </div>
                  )}

                  {messages.length > 0 && (
                    <p className="text-center font-read italic text-[14px] text-muted m-0 pt-1">
                      Today, {startedAt}
                    </p>
                  )}

                  {messages.map((m) => (
                    <div
                      key={m.id}
                      className={m.from === "user" ? "flex justify-end" : "flex justify-start"}
                    >
                      <div className={m.from === "user" ? "max-w-[80%]" : "w-full"}>
                        {m.from === "user" ? (
                          <div className="aura-msg-in">
                            <MessageAttachment
                              context={m.context}
                              directions={directions}
                              onOpen={setOpenDirection}
                            />
                            <p
                              className="text-white font-read text-[17px] leading-[1.35] px-4 py-3 rounded-[22px] whitespace-pre-line m-0"
                              style={{ background: "rgb(var(--primary-rgb))" }}
                            >
                              {m.text}
                            </p>
                          </div>
                        ) : (
                          <div className="aura-msg-in">
                            <div className="flex items-start gap-2.5">
                              <span
                                aria-hidden="true"
                                className="w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-primary border border-primary/15"
                                style={{ background: "rgb(var(--sel-fill-rgb))" }}
                              >
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" focusable="false">
                                  <path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5Z" />
                                </svg>
                              </span>
                              <div className="flex-1 min-w-0 pr-2">
                                <span className="block font-mono text-[11px] uppercase tracking-[0.14em] text-ink/80 pt-1 mb-1.5">
                                  Aura
                                </span>
                                <p
                                  className="border border-hairline text-ink font-read text-[17px] leading-[1.35] px-4 py-3 rounded-[20px] whitespace-pre-line m-0"
                                  style={{ background: "rgb(var(--card-rgb))" }}
                                >
                                  {m.text}
                                </p>
                              </div>
                            </div>

                            {m.cards && m.cards.length > 0 && (
                              <div className="mt-2.5">
                                <h4 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2 px-0.5">
                                  {m.cardsLabel}
                                </h4>
                                <div className="grid grid-cols-2 gap-2.5">
                                  {m.cards.map((d) => (
                                    <DirectionCard
                                      saved={wish.saved(d.name)}
                                      onSave={() => wish.toggle(d.name)}
                                      key={d.id}
                                      d={d}
                                      ship={ship}
                                      onOpen={setOpenDirection}
                                    />
                                  ))}
                                </div>
                              </div>
                            )}

                            {m.pairings && (
                              <div className="mt-2.5">
                                <h4 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2 px-0.5">
                                  {m.pairingsLabel}
                                </h4>
                                <div className="space-y-2.5">
                                  {m.pairings.map((piece) => (
                                    <div
                                      key={piece.id}
                                      className="bg-card border border-hairline rounded-2xl overflow-hidden"
                                    >
                                      <div className="flex items-center gap-3 p-3 border-b border-hairline">
                                        <PieceThumb
                                          piece={piece}
                                          className="shrink-0 w-[42px] h-[54px] rounded-lg overflow-hidden bg-inset"
                                        />
                                        <span className="min-w-0 flex-1">
                                          <span className="block text-[13.5px] font-medium text-ink leading-snug">
                                            {piece.name}
                                          </span>
                                          <span className="block text-[11px] text-muted leading-snug mt-0.5">
                                            {piece.craft}
                                          </span>
                                        </span>
                                      </div>
                                      <ul className="grid grid-cols-3 gap-2 p-3">
                                        {piece.pairs.map((x) => (
                                          <li key={x.k}>
                                            {/* The reasoning still travels with
                                                the tile — as its title, and
                                                read aloud in full. */}
                                            <span className="sr-only">
                                              {x.k}: {x.label}. {x.note}
                                            </span>
                                            <span
                                              title={x.note}
                                              aria-hidden="true"
                                              className="block relative aspect-[3/4] rounded-xl overflow-hidden bg-inset border border-hairline"
                                            >
                                              <PieceThumb
                                                piece={{
                                                  name: x.label,
                                                  image: x.image,
                                                  swatch: x.swatch,
                                                }}
                                                className="block w-full h-full"
                                              />
                                              <span className="absolute top-1.5 left-1.5 px-1.5 py-[3px] rounded-full bg-card/90 font-mono text-[8.5px] uppercase tracking-wider text-muted leading-none">
                                                {x.k}
                                              </span>
                                            </span>
                                            <span
                                              aria-hidden="true"
                                              className="block text-[11px] text-ink leading-snug mt-1.5 line-clamp-2"
                                            >
                                              {x.label}
                                            </span>
                                          </li>
                                        ))}
                                      </ul>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {m.steps && (
                              <ol className="mt-2.5 bg-card border border-hairline rounded-2xl divide-y divide-hairline overflow-hidden">
                                {m.steps.map((st) => (
                                  <li key={st.k} className="flex items-start gap-3 px-4 py-3">
                                    <span
                                      aria-hidden="true"
                                      className="font-mono text-[10.5px] text-goldtext pt-0.5 shrink-0"
                                    >
                                      {st.k}
                                    </span>
                                    <span className="min-w-0">
                                      <span className="block text-[13px] text-ink font-medium leading-tight">
                                        {st.label}
                                      </span>
                                      <span className="block text-[11.5px] text-muted leading-relaxed mt-0.5">
                                        {st.note}
                                      </span>
                                    </span>
                                  </li>
                                ))}
                              </ol>
                            )}

                            {m.order && !m.orderPlaced && (
                              <button
                                type="button"
                                onClick={() => setCheckout(m.order)}
                                aria-haspopup="dialog"
                                className="mt-2.5 w-full min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Review order
                              </button>
                            )}

                            {m.fit && (
                              <FitCard
                                people={fitPeople}
                                chosenId={fitWho}
                                onChoose={setFitWho}
                                pieceName={m.fitPiece}
                              />
                            )}

                            {m.fitChoice && !settledFits[m.id] && (
                              <FitChoiceCard
                                onApprove={() => {
                                  setSettledFits((f) => Object.assign({}, f, { [m.id]: true }));
                                  const who =
                                    fitPeople.find((p) => p.id === fitWho) || fitPeople[0];
                                  // "Meera R." already ends in a stop; do not
                                  // give the sentence a second one.
                                  const forWhom =
                                    who.id === "self" ? "me" : who.name.replace(/\.$/, "");
                                  send(
                                    m.fitPiece
                                      ? `These are right — cut the ${m.fitPiece} for ${forWhom}.`
                                      : `These are right — cut for ${forWhom}.`,
                                    {
                                      replyWith: {
                                        text:
                                          "Noted \u2014 cutting to " +
                                          (who.id === "self"
                                            ? "your measurements"
                                            : who.name + "'s measurements") +
                                          ". Here is what you are placing.",
                                        order: m.fitRecord
                                          ? { piece: m.fitRecord, who: who }
                                          : null,
                                      },
                                    }
                                  );
                                  if (m.fitRecord) {
                                    setCheckout({ piece: m.fitRecord, who: who });
                                  }
                                }}
                                onUpdate={() => setFitSheet({ id: m.id, piece: m.fitPiece })}
                              />
                            )}

                            {/* Measurements can change after the piece is
                                agreed, so the way to replace them stays put
                                however far the conversation runs on. */}
                            {m.fit && (!m.fitChoice || settledFits[m.id]) && (
                              <button
                                type="button"
                                onClick={() => setFitSheet({ id: m.id, piece: m.fitPiece })}
                                aria-haspopup="dialog"
                                className="mt-2.5 w-full min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Add new measurements
                              </button>
                            )}

                            {m.work && showWork && (
                              <div className="mt-1">
                                <BriefCard
                                  brief={brief}
                                  ship={ship}
                                  onEdit={() => {
                                    // Editing the brief is just telling Aura what changed.
                                    setInputVal("Change my brief: ");
                                    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
                                  }}
                                />

                                <h3 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2 px-0.5">
                                  Four directions
                                </h3>
                                <div className="grid grid-cols-2 gap-2.5">
                                  {directions.map((d) => (
                                    <DirectionCard
                                      saved={wish.saved(d.name)}
                                      onSave={() => wish.toggle(d.name)}
                                      key={d.id}
                                      d={d}
                                      ship={ship}
                                      onOpen={setOpenDirection}
                                    />
                                  ))}
                                </div>

                                <p className="text-[11.5px] text-muted leading-relaxed mt-3 px-0.5">
                                  Prices are landed to {ship.code} — {ship.duty.toLowerCase()},{" "}
                                  {ship.courier}. Nothing is added at checkout. You approve
                                  photographs of the finished garment before it is dispatched.
                                </p>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}

                  {typing && (
                    <div className="flex justify-start">
                      <TypingBubble />
                    </div>
                  )}

                  <div ref={bottomRef} />
                </div>
              </div>

              {/* ---------- Full view: 90% bottom sheet ---------- */}
              {openDirection && (
                <DirectionSheet
                  saved={wish.saved(openDirection.name)}
                  onSave={() => wish.toggle(openDirection.name)}
                  d={openDirection}
                  ship={ship}
                  onClose={() => setOpenDirection(null)}
                  onRequest={(dir) => {
                    // Already in the thread, so the fit check happens here
                    // rather than by navigating to a fresh one.
                    setOpenDirection(null);
                    send(`See how the ${dir.name} fits me.`, {
                      image: dir.image,
                      name: dir.name,
                      label: dir.craft,
                      replyWith: {
                        text: `Here are the measurements the ${dir.name} would be cut to.`,
                        fit: true,
                        fitChoice: true,
                        fitPiece: dir.name,
                        fitRecord: {
                          name: dir.name,
                          craft: dir.craft,
                          image: dir.image,
                          from: dir.from,
                        },
                      },
                    });
                  }}
                  onAsk={(dir, view) => {
                    setOpenDirection(null);
                    const isJewellery = view.id === "jewelry" && dir.jewelry;
                    send(
                      view.id === "full"
                        ? `Tell me more about ${dir.name}`
                        : `Tell me more about the ${view.label.toLowerCase()} of ${dir.name}`,
                      {
                        image: view.image,
                        label: view.label,
                        name: dir.name,
                        replyWith: {
                          text: isJewellery
                            ? `${dir.jewelry.name} — ${dir.jewelry.craft}. ${dir.jewelry.pairingNote}`
                            : `${dir.craft}. ${dir.note} It is ${dir.weeks.toLowerCase()} on the loom once you approve the direction.`,
                          cardsLabel: "The piece you asked about",
                          cards: [dir],
                        },
                      }
                    );
                  }}
                />
              )}

              {/* ---------- Quick replies ---------- */}
              {!composerOpen && (
                <div className="shrink-0 px-4 pb-1 pt-2">
                  <div
                    className="flex gap-2 overflow-x-auto pb-1.5"
                    style={{ scrollbarWidth: "none" }}
                    role="group"
                    aria-label="Suggested replies"
                  >
                    {quickReplies(ship).map((q) => (
                      <button
                        key={q.label}
                        type="button"
                        onClick={() => send(q.label)}
                        className="reply-chip shrink-0"
                      >
                        {q.icon === "sparkle" && (
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" aria-hidden="true" focusable="false">
                            <path d="M10 3.5 11.8 9l5.7 1.8-5.7 1.8L10 18.5l-1.8-5.9L2.5 10.8 8.2 9 10 3.5Z" />
                            <path d="M18.5 3v4M16.5 5h4" strokeLinecap="round" />
                          </svg>
                        )}
                        {q.icon === "sliders" && (
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true" focusable="false">
                            <path d="M3 7h9M17 7h4M3 17h4M12 17h9" />
                            <circle cx="14.5" cy="7" r="2.3" />
                            <circle cx="9.5" cy="17" r="2.3" />
                          </svg>
                        )}
                        <span>{q.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* ---------- Composer ----------
               Figma "Input box" (7:2876), three states:
               rest   — pill: + · "Ask me anything" · mic in a sand circle
               active — same pill once there is text; the mic becomes a plum send
               typing — once the text runs past one line, a card: the text
                        scrolls above, + bottom-left, send bottom-right. */}
              <div className="relative shrink-0 px-4 pb-2 pt-1 z-40" ref={attachRef}>
                {attachOpen && (
                  <div className="absolute left-4 right-4 bottom-full z-50">
                    <AttachmentPopup
                      onPick={(opt) => {
                        setAttachOpen(false);
                        showToast(opt.hint);
                      }}
                    />
                  </div>
                )}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    send(inputVal);
                  }}
                  className={`composer-bar ${
                    composerOpen
                      ? "rounded-[20px] pl-4 pr-3 pt-3 pb-2.5"
                      : "flex items-center gap-2 rounded-full pl-1 pr-1.5 py-1.5"
                  }`}
                >
                  {!composerOpen && renderPlus()}

                  <label htmlFor="aura-reply" className="sr-only">
                    Ask Aura anything
                  </label>
                  <textarea
                    id="aura-reply"
                    ref={inputRef}
                    rows={1}
                    value={inputVal}
                    onChange={(e) => setInputVal(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        send(inputVal);
                      }
                    }}
                    placeholder="Ask me anything"
                    className={`aura-reply-field bg-transparent text-ink placeholder:text-muted focus:outline-none resize-none ${
                      composerOpen ? "is-open w-full" : "flex-1 min-w-0"
                    }`}
                  />

                  {!composerOpen && (hasText ? renderSend() : renderMic())}

                  {composerOpen && (
                    <div className="flex items-center justify-between pt-2 -ml-3">
                      {renderPlus()}
                      {renderSend()}
                    </div>
                  )}
                </form>

                <div className="home-pill-line" aria-hidden="true" />
              </div>

              {checkout && (
                <CheckoutPanel
                  piece={checkout.piece}
                  who={checkout.who}
                  ship={ship}
                  onBack={() => setCheckout(null)}
                  onPlace={() => {
                    const ref = "AUR-" + String(1000 + Math.floor(Math.random() * 9000));
                    setCheckout(null);
                    // The order is placed; its card must not offer a second go.
                    setMessages((ms) =>
                      ms.map((x) => (x.order ? Object.assign({}, x, { orderPlaced: true }) : x))
                    );
                    send(`Place the order for the ${checkout.piece.name}.`, {
                      replyWith: {
                        text:
                          "Order " +
                          ref +
                          " is placed. Meera starts on it today, and you will see each stage photographed in Orders before anything ships.",
                      },
                    });
                  }}
                />
              )}

              {fitSheet && (
                <FitSheet
                  initial={fit}
                  onClose={() => setFitSheet(null)}
                  onRequestSession={() => {
                    setFitSheet(null);
                    send("I'd like a video fitting session to take my measurements.");
                  }}
                  onSave={(values) => {
                    const next = writeFit(values);
                    const from = fitSheet;
                    setFit(next);
                    setFitPeople(readFitPeople());
                    setFitWho("self");
                    setFitSheet(null);
                    setSettledFits((f) => Object.assign({}, f, { [from.id]: true }));
                    send("I've measured again — use these instead.", {
                      replyWith: {
                        text: "Updated. Meera will cut to the new figures and send photographs before dispatch.",
                        fit: true,
                        fitPiece: from.piece,
                      },
                    });
                  }}
                />
              )}

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <AuraDrawer
                  active={null}
                  countries={Object.values(SHIP_TO)}
                  current={ship}
                  onPickCountry={(c) => {
                    setShipCode(c.code);
                    showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                  }}
                  onClose={() => setDrawerOpen(false)}
                />
              </Overlay>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
