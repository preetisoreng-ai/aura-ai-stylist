              note: "Heavy Kanchipuram silk holds a pleat all day once it has been pressed in.",
              image: "images/kanjivaram_gold.png",
              swatch: ["#5A2140", "#C89B3C", "#D9C7A7"],
            },
          ],
        },
        {
          id: "own-1",
          name: "Heritage handloom",
          craft: "Banarasi kadhwa weave · Varanasi",
          image: "images/heritage_banarasi.jpg",
          swatch: ["#7B1E3B", "#C89B3C", "#E8D9B5"],
          pairs: [
            {
              k: "Jewellery",
              label: "Basra pearl and polki choker",
              note: "Warm antique gold sits with the kadhwa zari, and a choker keeps the neckline from vanishing under the dupatta.",
              image: "images/jewelry_heritage.jpg",
              swatch: ["#7B1E3B", "#C89B3C", "#F3EEE4"],
            },
            {
              k: "Blouse",
              label: "The one it came with, shortened an inch",
              note: "You are holding two alteration credits. A shorter hem changes where the skirt sits.",
              image: "images/blouse_banarasi_ruby.jpg",
              swatch: ["#7B1E3B", "#C89B3C", "#E8D9B5"],
            },
            {
              k: "Footwear",
              label: "Closed juttis, gold thread",
              note: "The hem takes the weight here. Closed toes keep it off the floor.",
              image: "images/juttis_gold_thread.jpg",
              swatch: ["#C89B3C", "#7B1E3B", "#F3EEE4"],
            },
          ],
        },
        {
          id: "own-2",
          name: "Featherweight festive",
          craft: "Hand aari work · Mumbai atelier",
          image: "images/featherweight_organza.jpg",
          swatch: ["#D8C7E4", "#C89B3C", "#F3EEE4"],
          pairs: [
            {
              k: "Jewellery",
              label: "Lilac meenakari chandbalis",
              note: "Hand-painted enamel and nothing heavier — organza will not carry a collar.",
              image: "images/jewelry_featherweight.jpg",
              swatch: ["#D8C7E4", "#C89B3C", "#F3EEE4"],
            },
            {
              k: "Blouse",
              label: "Pastel, matched to the aari thread",
              note: "The fit still answers directly to your recorded measurements.",
              image: "images/blouse_pastel_aari.jpg",
              swatch: ["#D8C7E4", "#C89B3C", "#F3EEE4"],
            },
            {
              k: "Layer",
              label: "A plain second dupatta for the garba",
              note: "Keeps the embroidered one off the floor across nine nights.",
              image: "images/dupatta_lilac_organza.jpg",
              swatch: ["#F3EEE4", "#D8C7E4", "#E8D9B5"],
            },
          ],
        },
      ];

      /* Outfits you photographed yourself live in the Wardrobe screen's store.
         Aura has no colour or fabric for these, so it counts them and asks
         rather than inventing a pairing. */
      function readUploadedOutfits() {
        try {
          const raw = window.localStorage.getItem("aura.uploads.v1");
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      /* Suggested replies under the thread. The per-piece budget is quoted
         in the ship-to currency, at roughly the same landed value. */
      const PER_PIECE_BUDGET = { US: "$500", UK: "£400", CA: "C$650", IN: "₹40,000" };
      const quickReplies = (ship) => [
        { label: "Suggest 9 looks", icon: "sparkle" },
        { label: `Under ${PER_PIECE_BUDGET[ship.code] || ship.symbol + "500"} each` },
        { label: "With delivery timelines" },
        { label: "More filters", icon: "sliders" },
      ];

      /* ===================================================================
       AURA REPLY LOGIC — deterministic, honest responses to follow-ups
       =================================================================== */
      function auraReplyTo(text, brief, ship, directions) {
        const t = text.toLowerCase();

        /* Asked first, because the cheapest answer to a new occasion is often
           something already hanging up. */
        if (/\bwardrobe\b|\balready own\b|\bwhat i own\b|\bpair(ing|ed)?\b/.test(t)) {
          const mine = readUploadedOutfits().length;
          return {
            text:
              "Before anything new — three pieces you already own will carry this, and none of them needs replacing. They need finishing." +
              (mine
                ? ` I have left out the ${mine} you photographed yourself; tell me a colour and I will pair those too.`
                : ""),
            pairingsLabel: "From your wardrobe",
            pairings: WARDROBE,
          };
        }
        /* Follow-ups answer with the garments themselves, not a wall of prose —
           the same cards as the opening reply, narrowed to what was asked. */
        const pick = (...ids) =>
          ids.map((id) => directions.find((d) => d.id === id)).filter(Boolean);

        if (/\blight|lighter|weight|heavy|hot|warm\b/.test(t)) {
          return {
            text: "Noted — I'll weight the lighter end. Organza, chanderi and fine cotton-silk all sit under 900g finished, which makes a real difference across a long event.",
            cardsLabel: "Lightest on the body",
            cards: pick("light", "modern"),
          };
        }
        if (/\b(suggest|show me)\b.*\blooks?\b/.test(t)) {
          const nights = /\b9\b|\bnine\b/.test(t) || brief.occasion === "Navratri (9 nights)";
          return {
            text: nights
              ? "Nine nights, nine looks — built from these four directions. Each one carries two or three nights with a change of dupatta, blouse and jewellery, so you commission four pieces, not nine."
              : "Here are the looks I'd start from. Tell me which feels closest and I'll build around it.",
            cardsLabel: nights ? "Nine looks · four pieces" : "Looks to start from",
            cards: directions,
          };
        }
        if (/\bfilters?\b/.test(t)) {
          return {
            text: "I can narrow these by colour, fabric weight, budget per piece, who it's for, or how soon you need it in hand. Tell me one and I'll redraw the directions.",
          };
        }
        if (/\bbudget|cheap|afford|cost|price|expensive|under\b/.test(t)) {
          const b = brief.budget ? `your ${brief.budget} budget` : "your budget";
          const cheapest = directions
            .slice()
            .sort((a, x) => a.from - x.from)
            .slice(0, 2);
          return {
            text: `Every price shown is landed — fabric, tailoring, ${ship.duty.toLowerCase()} and ${ship.courier.split(" · ")[0]} shipping to ${ship.code}. Nothing is added at checkout. If ${b} is firm, say so and I'll only show directions that finish inside it.`,
            cardsLabel: `Gentlest on ${brief.budget ? "the budget" : "spend"} · landed to ${ship.code}`,
            cards: cheapest,
          };
        }
        if (/\btradition|classic|heritage|authentic\b/.test(t)) {
          return {
            text: "Then Heritage handloom is your direction. It's a kadhwa Banarasi — the motifs are woven in, not printed or stitched on, so the reverse is as clean as the face. It takes longer on the loom, and it lasts a generation.",
            cardsLabel: "Woven, not printed",
            cards: pick("heritage", "regal"),
          };
        }
        if (/\bfit|fitting|measure|measurement|size\b/.test(t)) {
          return {
            text: "Two options. Send measurements from a tailor you already trust, or do a 6-minute guided video fitting with one of our drapers — they'll take 14 points and note posture. Either way, you approve photos of the finished piece before it's dispatched, and alterations are covered under the Perfect Fit Guarantee.",
            steps: [
              {
                k: "01",
                label: "Measure",
                note: "Your tailor, or a 6-minute video fitting · 14 points",
              },
              {
                k: "02",
                label: "Approve",
                note: "Photographs of the finished garment before dispatch",
              },
              { k: "03", label: "Alter", note: "Covered under the Perfect Fit Guarantee" },
            ],
          };
        }
        if (/\btime|timelines?|delivery|when|deadline|rush|urgent|fast|soon\b/.test(t)) {
          return {
            text: `Realistic lead time for this brief is ${brief.lead} on the loom, plus ${ship.courier.split(" · ")[1]} in transit to ${ship.code}. If your date is tighter than that, say so now — I'd rather change the direction than promise a date the artisan can't hold.`,
            cardsLabel: "Ready soonest",
            cards: pick("light", "modern"),
          };
        }
        return {
          text: "Got it — that's on the brief. Anything else you'd like me to weigh: colour, weight, budget, or how soon you need it in hand?",
        };
      }

      /* ===================================================================
       PRESENTATIONAL PIECES
       =================================================================== */
      /* ===================================================================
       WISHLIST
       Saved pieces, shared by every surface that shows a garment — the
       suggestion cards, the list rows and the detail sheet. Kept in
       localStorage so a heart tapped on Discover is still filled when the
       same piece turns up in a conversation.

       Storage is best-effort: a private window or blocked site data throws,
       and the hearts simply behave as an unsaved session.
       =================================================================== */
      const WISHLIST_KEY = "aura.wishlist";

      function readWishlist() {
        try {
          const raw = window.localStorage.getItem(WISHLIST_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter((x) => typeof x === "string") : [];
        } catch (e) {
          return [];
        }
      }

      function writeWishlist(ids) {
        try {
          window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
        } catch (e) {
          /* saving is a convenience, never a blocker */
        }
      }

      // One source of truth per screen, so a heart tapped on a card updates
      // the sheet sitting on top of it and vice versa.
      function useWishlist() {
        const [ids, setIds] = useState(readWishlist);

        const toggle = useCallback((id) => {
          if (!id) return;
          setIds((cur) => {
            const next = cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
            writeWishlist(next);
            return next;
          });
        }, []);

        // Another tab, or a return trip through the back button.
        useEffect(() => {
          const sync = (e) => {
            if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
          };
          window.addEventListener("storage", sync);
          window.addEventListener("pageshow", sync);
          return () => {
            window.removeEventListener("storage", sync);
            window.removeEventListener("pageshow", sync);
          };
        }, []);

        return {
          ids,
          saved: (id) => ids.indexOf(id) !== -1,
          toggle,
        };
      }

      /* A wardrobe piece at row size. Anything without a photograph falls
         back to its own colours rather than a broken image. */
      function PieceThumb({ piece, className }) {
        const [failed, setFailed] = useState(false);

        if (failed || !piece.image) {
          return (
            <span
              className={className}
              role="img"
              aria-label={`${piece.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${piece.swatch[0]} 0%, ${piece.swatch[2]} 55%, ${piece.swatch[1]} 100%)`,
              }}
            />
          );
        }
        return (
          <img
            src={piece.image}
            alt={piece.name}
            loading="lazy"
            onError={() => setFailed(true)}
            className={`${className} object-cover`}
            draggable="false"
          />
        );
      }

      /* `tone="overlay"` sits on a photograph; `tone="plain"` on a light
         surface. Saved flips to a filled plum heart on white either way. */
      function HeartButton({ saved, onToggle, name, tone, className }) {
        const overlay = tone !== "plain";
        const base =
          "shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-90";
        const skin = saved
          ? "bg-card text-primary shadow-sm border border-hairline"
          : overlay
            ? "bg-black/35 text-white border border-white/25 hover:bg-black/55"
            : "bg-card text-muted border border-hairline hover:text-primary hover:border-primary/45";

        return (
          <button
            type="button"
            aria-pressed={saved}
            aria-label={
              saved ? `Remove ${name} from your wishlist` : `Save ${name} to your wishlist`
            }
            onClick={(e) => {
              // Cards are buttons themselves; never open the sheet from here.
              e.preventDefault();
              e.stopPropagation();
              onToggle();
            }}
            className={`${base} ${skin} ${className || ""}`}
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill={saved ? "currentColor" : "none"}
              stroke="currentColor"
              strokeWidth={saved ? 0 : 1.9}
              strokeLinecap="round"
              strokeLinejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 20.5 3.9 12.6a5 5 0 0 1 7.1-7.1l1 1 1-1a5 5 0 0 1 7.1 7.1Z" />
            </svg>
          </button>
        );
      }
      /* Line icons for the brief rows (24px grid, drawn at 22px). */
      const BRIEF_ICONS = {
        occasion: (
          <>
            <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
            <path d="M3.5 10h17M8 3v4M16 3v4" />
          </>
        ),
        garment: (
          <>
            <path d="M9 3h6M9.5 3 9 8l-1 1 1.2 3L6 21h12l-3.2-9L16 9l-1-1-.5-5" />
          </>
        ),
        where: (
          <>
            <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z" />
            <circle cx="12" cy="10" r="2.4" />
          </>
        ),
        budget: (
          <>
            <rect x="3" y="5.5" width="18" height="13" rx="2" />
            <path d="M3 10h18M7 15h3" />
          </>
        ),
        ship: (
          <>
            <path d="M2.5 6.5h11v10h-11zM13.5 10h4l3 3.2v3.3h-7" />
            <circle cx="6.5" cy="17.5" r="1.8" />
            <circle cx="17" cy="17.5" r="1.8" />
          </>
        ),
        lead: (
          <>
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7.5V12l3 2" />

      function BriefCard({ brief, ship, onEdit }) {
        const rows = [
          { id: "occasion", k: "Occasion", v: brief.occasion, fallback: "Not set yet" },
          { id: "garment", k: "Garment", v: brief.garment, fallback: "Open to suggestions" },
          {
            id: "where",
            k: "Where",
            // No city in the brief: where it ships is the best read of where it's worn.
            v: brief.city ? brief.city + (brief.month ? ` · ${brief.month}` : "") : ship.code,
            fallback: "Not set yet",
          },
          { id: "budget", k: "Budget", v: brief.budget, fallback: "Not set yet" },
          { id: "ship", k: "Ship to", v: `${ship.label}  ·  ${ship.duty}` },
          { id: "lead", k: "Lead time", v: brief.lead, note: "Estimated — confirm your date" },

        return (
          <div
            className="border border-hairline rounded-[22px] px-4 pt-4 pb-5 mt-4 shadow-[0_1px_2px_rgb(30_27_46/0.03)]"
            style={{ background: "rgb(var(--card-rgb))" }}
          >
            <div className="flex items-center justify-between pb-3 border-b border-hairline">
              <h3 className="font-display text-[28px] text-ink leading-none">Your brief</h3>
              <button
                type="button"
                onClick={onEdit}
                aria-label="Edit your brief"
                className="flex items-center gap-2 min-h-[44px] -my-2 -mr-1 pl-2 pr-1 rounded-full font-read text-[16px] text-ink hover:bg-inset transition-colors"
              >
                Edit
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.6"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z" />
                  <path d="m14.5 7.5 3 3" />
                </svg>
              </button>
            </div>
            <dl className="mt-3 space-y-3 m-0">
              {rows.map((r) => (
                <div key={r.id} className="flex items-start gap-3">
                  <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                    className="shrink-0 text-ink/80 mt-px"
                  >
                    {BRIEF_ICONS[r.id]}
                  </svg>
                  <dt className="font-mono text-[11px] uppercase tracking-[0.14em] text-muted shrink-0 leading-[24px]">
                    {r.k}
                  </dt>
                  <dd className="flex-1 min-w-0 m-0 text-right font-read text-[16px] leading-[24px] text-ink">
                    <span style={{ whiteSpace: "pre-wrap" }}>
                      {r.v || r.fallback}
                    </span>
                    {r.note && (
                      <span className="block font-sans italic text-[12px] leading-[18px] text-muted mt-0.5">
                        {r.note}
                      </span>
                    )}
                  </dd>
                </div>
              ))}
            </dl>
          </div>
        );
      }

      /* A garment photograph, framed. Falls back to a woven-pattern panel in
         the direction's own palette if the file is missing. */
      function Photo({ d, view, alt }) {
        const [failed, setFailed] = React.useState(false);

        const src = (view && view.image) || d.image;

        if (failed || !src) {
          return (
            <div
              className="w-full h-full"
              role="img"
              aria-label={`${d.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${d.swatch[0]} 0%, ${d.swatch[2]} 55%, ${d.swatch[1]} 100%)`,
              }}
            >
              <div
                className="w-full h-full opacity-30"
                style={{
                  backgroundImage:
                    "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 7px)",
                }}
              />
            </div>
          );
        }

        return (
          <img
            src={(view && view.image) || d.image}
            alt={alt}
            loading="eager"
            onError={() => setFailed(true)}
            className="w-full h-full select-none"
            style={{
              objectFit: view.fit || "cover",
              transform: `scale(${view.scale})`,
              transformOrigin: view.origin,
            }}
            draggable="false"
          />
        );
      }

      /* Grid card: photograph first, then one line of title, price, description. */
      function DirectionCard({ d, ship, onOpen, saved, onSave }) {
        return (
          <div className="relative">
            <button
              type="button"
              onClick={() => onOpen(d)}
              aria-haspopup="dialog"
              className="group block w-full text-left bg-card border border-hairline rounded-2xl overflow-hidden hover:border-primary/45 hover:shadow-md active:scale-[0.985] transition-all"
            >
              <span className="block relative w-full aspect-[3/4] bg-inset overflow-hidden">
                <Photo
                  d={d}
                  view={{ ...getViewsForDirection(d)[0], fit: "cover" }}
                  alt={`${d.name} — ${d.short}`}
                />
                <span
                  className="absolute bottom-2 right-2 flex gap-1 items-center rounded-full bg-black/45 px-1.5 py-1 border border-white/25"
                  aria-hidden="true"
                >
                  {d.swatch.map((c, i) => (
                    <span
                      key={i}
                      className="w-2.5 h-2.5 rounded-full border border-white/50"
                      style={{ backgroundColor: c }}
                    />
                  ))}
                </span>
              </span>

              <span className="block px-2.5 py-2.5">
                <span className="block font-display text-[17px] text-ink leading-tight truncate">
                  {d.name}
                </span>
                <span className="block font-mono text-[14px] text-ink font-semibold mt-1">
                  {ship.symbol}
                  {d.from}
                </span>
                <span className="block font-sans text-[11.5px] text-muted truncate mt-0.5">
                  {d.short}
                </span>
              </span>
            </button>

            {onSave && (
              <HeartButton
                saved={saved}
                onToggle={onSave}
                name={d.name}
                className="absolute top-2 right-2"
              />
            )}
          </div>
        );
      }

      /* Full view: slides up from the bottom over 90% of the screen, with a
         swipeable carousel of framings and a close control at top right. */
      /* What you tapped, carried into the conversation. It opens the piece's
         details when there are details to open. */
      function MessageAttachment({ context, directions, onOpen }) {
        // A name is enough to show something; not every piece has a
        // photograph yet, and a woven placeholder reads better than nothing.
        if (!context || (!context.image && !context.name)) return null;
        const piece = pieceFor(context.piece, directions);

        const inner = (
          <React.Fragment>
            {context.image ? (
              <img
                src={context.image}
                alt={context.name + " \u2014 " + (context.label || "")}
                loading="eager"
                className="block w-full h-[112px] object-cover"
              />
            ) : (
              <span
                role="img"
                aria-label={context.name + " \u2014 photograph not yet available"}
                className="block w-full h-[112px] bg-inset"
                style={{
                  backgroundImage:
                    "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 7px)",
                }}
              />
            )}
            <span className="block px-2.5 py-1.5">
              <span className="block text-[11.5px] text-ink font-medium leading-tight truncate">
                {context.name}
              </span>
              <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                {piece ? "Tap for details" : context.label}
              </span>
            </span>
          </React.Fragment>
        );

        const skin =
          "mb-1.5 ml-auto w-[136px] rounded-2xl overflow-hidden border border-hairline bg-card shadow-sm";

        if (!piece) {
          return <figure className={skin}>{inner}</figure>;
        }

        return (
          <button
            type="button"
            onClick={() => onOpen(piece)}
            aria-haspopup="dialog"
            aria-label={"Open details for " + piece.name}
            className={
              skin +
              " block text-left hover:border-primary/45 hover:shadow-md active:scale-[0.98] transition-all"
            }
          >
            {inner}
          </button>
        );
      }

      function DirectionSheet({ d, ship, onClose, onRequest, onAsk, saved, onSave }) {
        const trackRef = React.useRef(null);
        const panelRef = React.useRef(null);
        const restoreRef = React.useRef(null);
        const [slide, setSlide] = React.useState(0);
        const views = getViewsForDirection(d);
        const enlargedRef = React.useRef(null);

        React.useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              if (enlargedRef.current) enlargedRef.current();
              else onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (!items.length) return;
            const a = items[0];
            const z = items[items.length - 1];
            if (e.shiftKey && document.activeElement === a) {
              e.preventDefault();
              z.focus();
            } else if (!e.shiftKey && document.activeElement === z) {
              e.preventDefault();
              a.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        // Derive the active slide from scroll position so a swipe and the dots
        // always agree about which framing is showing.
        const onScroll = () => {
          const el = trackRef.current;
          if (!el) return;
          const i = Math.round(el.scrollLeft / el.clientWidth);
          if (i !== slide) setSlide(Math.max(0, Math.min(views.length - 1, i)));
        };

        const goTo = (i) => {
          const el = trackRef.current;
          const child = el && el.children[i];
          if (!el || !child) return;
          setSlide(i);
          el.scrollTo({
            left: child.offsetLeft - el.offsetLeft,
            behavior: reducedMotion() ? "auto" : "smooth",
          });
        };

        const rows = [
          { k: "Fabric", v: d.fabric },
          { k: "Colour", v: d.colour },
          { k: "Includes", v: d.includes },
          { k: "Weight", v: d.weight },
          { k: "Care", v: d.care },
          { k: "On the loom", v: d.weeks },
        ].filter((r) => r.v);

        /* "DHL Express · 4 days" — the courier sits with the duty line, the
           transit time drops to its own line under it. */
        const [courierName, courierDays] = ship.courier.split(" · ");

        // Keep the chosen thumbnail in view when the column scrolls.
        const thumbsRef = React.useRef(null);
        React.useEffect(() => {
          const col = thumbsRef.current;
          const t = col && col.children[slide];
          if (t) t.scrollIntoView({ block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" });
        }, [slide]);

        // Full-screen photo, opened from the label on each slide.
        const [enlarged, setEnlarged] = React.useState(null);

      /* ===================================================================
         COMPONENT: OVERLAY — same contract as the home screen's drawer.
         Escape to close, background scroll lock, focus moved in on open
         and restored to the trigger on close, focus kept inside while open.
         =================================================================== */
      function Overlay({ open, onClose, labelledBy, align, children }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        // Stays mounted briefly after closing so the panel can move back out.
        const [shown, setShown] = useState(open);
        useEffect(() => {
          if (open) {
            setShown(true);
            return;
          }
          const t = setTimeout(() => setShown(false), 260);
          return () => clearTimeout(t);
        }, [open]);

        useEffect(() => {
          if (!open) return;

          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus({ preventScroll: true });
          else panel.focus({ preventScroll: true });

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (items.length === 0) return;
            const firstEl = items[0];
            const lastEl = items[items.length - 1];
            if (e.shiftKey && document.activeElement === firstEl) {
              e.preventDefault();
              lastEl.focus();
            } else if (!e.shiftKey && document.activeElement === lastEl) {
              e.preventDefault();
              firstEl.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const restore = restoreRef.current;
            if (restore && typeof restore.focus === "function") restore.focus({ preventScroll: true });
          };
        }, [open, onClose]);

        if (!open && !shown) return null;

        return (
          <div
            className={`absolute inset-0 z-50 flex ${open ? "" : "aura-leaving "}${align === "end" ? "justify-end" : "items-end justify-center"}`}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              className="aura-scrim absolute inset-0 -z-10"
              style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)" }}
              onMouseDown={onClose}
              aria-hidden="true"
            />
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby={labelledBy}
              tabIndex={-1}
              className="focus:outline-none contents"
            >
              {children}
            </div>
          </div>
        );
      }

                  className="w-full flex items-center gap-4 px-2 py-3 rounded-xl text-left hover:bg-[rgb(var(--primary-rgb)_/_0.06)] active:scale-[0.99] transition-colors"
                >
                  <span
                    aria-hidden="true"
                    className="w-10 h-10 shrink-0 rounded-full bg-[rgb(232_232_232_/_0.8)] flex items-center justify-center text-primary"
                  >
                    <svg
                      width="20"

                      viewBox={`0 0 ${opt.box} ${opt.box}`}
                      fill="currentColor"
                      aria-hidden="true"
                      focusable="false"

                      <path d={ATTACH_ICONS[opt.id]} />
                    </svg>

                </button>
              </React.Fragment>
            ))}

        );
      }

      /* ===================================================================
       CHAT HISTORY
       Every conversation arrives here with its opening prompt in the URL —
       from the home screen, or from a Request on Discover — so this is the
       one place a chat needs recording. The home screen reads the log back
       and derives the titles.

       Storage is per-browser and best-effort: in a private window or with
       site data blocked this throws, and the log is simply not kept.
       =================================================================== */
      const CHAT_LOG_KEY = "aura.chats";
      const CHAT_LOG_LIMIT = 30;

      function recordChat(prompt, shipCode) {
        const text = (prompt || "").replace(/\s+/g, " ").trim();
        if (!text) return;
        try {
          const raw = window.localStorage.getItem(CHAT_LOG_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          const log = Array.isArray(parsed) ? parsed : [];

          // Re-opening or reloading the same brief bumps the existing entry
          // rather than stacking duplicates in the drawer.
          const existing = log.find((c) => c && c.prompt === text);
          if (existing) {
            existing.at = Date.now();
            existing.ship = shipCode;
          } else {
            log.push({
              id: "c" + Date.now().toString(36),
              prompt: text,
              ship: shipCode,
              at: Date.now(),
            });
          }

          log.sort((a, b) => (b.at || 0) - (a.at || 0));
          window.localStorage.setItem(CHAT_LOG_KEY, JSON.stringify(log.slice(0, CHAT_LOG_LIMIT)));
        } catch (e) {
          /* history is a convenience, never a blocker for the conversation */
        }
      }

      /* ===================================================================
       MAIN
       =================================================================== */
      /* ===================================================================
       AURA DRAWER — the right-hand navigation panel, identical on every
       screen. Built to Figma "Right Drawer / v2" (173:2827) with its
       "Drawer / Nav Item" and "Drawer / Ship-to" components; icons are the
       component's own exports in images/drawer/. Each screen passes which
       tab is current and its own ship-to state.
       =================================================================== */
      const DRAWER_SERIF = {

      const DRAWER_ICON = "images/drawer/";

      const DRAWER_TABS = [
        {

          label: "Home",
          link: "index.html",

        {

          label: "Discover",
          link: "discover.html",
          desc: "Craft & regional provenance",
        },
        {
          id: "design",
          label: "Design",
          link: "designers.html",
          desc: "The makers behind the cloth",
        },
        {
          id: "wardrobe",
          label: "Wardrobe",
          link: "wardrobe.html",
          desc: "Memory & measurements",
        },
        {
          id: "orders",
          label: "Orders",
          link: "orders.html",
          desc: "Live artisan production tracker",
        },

      // The ship-to codes are markets (UK); the top line shows the ISO country (GB).
      const DRAWER_ISO = { US: "US", UK: "GB", CA: "CA", IN: "IN" };

      function AuraDrawer({ active, countries, current, onPickCountry, onClose }) {

                  className="w-[52px] h-[52px] rounded-full bg-gold text-ink flex items-center justify-center text-[21px] leading-[26px]"
                  style={DRAWER_SERIF}
                >

                </span>
              </span>
              <span className="flex-1 min-w-0 flex flex-col gap-2">

                  <a

                      >

            {/* Dual-geography */}
            <div className="shrink-0 pt-5 flex flex-col gap-6">
              <div className="flex flex-col gap-3">
                <span

                </span>
                <div
                  className="flex gap-2"
                  role="group"
                  aria-labelledby="ship-to-label"
                >
                  {countries.map((c) => {
                    const on = current.code === c.code;
                    return (
                      <button
                        key={c.code}
                        type="button"
                        aria-pressed={on}
                        aria-label={`Ship to ${c.code}`}

                        className={`flex-1 min-w-0 h-14 rounded-xl border flex flex-col items-center justify-center gap-1 transition-colors ${
                          on
                            ? "bg-primary border-primary"
                            : "bg-inset border-hairline hover:border-ctrl/60"
                        }`}
                      >
                        <span
                          className={`text-[19px] leading-[23px] ${on ? "text-onprimary" : "text-ink"}`}
                          style={DRAWER_SERIF}
                        >

                    );
                  })}
                </div>
              </div>
              <p className="flex items-start gap-3 pt-1 m-0" aria-live="polite">
                <img
