<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE7" />
    <title>Aura — Stylist Conversation</title>
    <meta
      name="description"
      content="Aura stylist workbench — the conversational thread where an occasion brief becomes a set of bespoke design directions, with transparent lead times and landed cost."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              read: ["Newsreader", "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: transparent;
        /* Beige outline: accent/gold at low strength reads as warm beige on ivory. */
        border: 1px solid rgb(var(--gold-rgb) / 0.45);
        color: rgb(var(--ink-rgb));
        font-family: "Newsreader", Georgia, serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .reply-chip:hover {
        border-color: rgb(var(--gold-rgb) / 0.8);
        background: rgb(var(--card-rgb) / 0.6);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }


      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      /* Attachment popup — Figma 36:1267. Frosted glass over the canvas. */
      .attachment-popup {
        background: rgb(255 255 255 / 0.7);
        border: 1px solid rgb(255 255 255 / 0.6);
        box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .attachment-popup {
          background: var(--card);
          border-color: rgb(var(--hairline-rgb) / 0.9);
        }
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 19px;
        padding: 6px 4px 6px 0;
        height: 31px;
      }

      .aura-reply-field.is-open {
        padding: 0 6px 0 0;
        scrollbar-width: thin;
        scrollbar-color: rgb(var(--hairline-rgb)) transparent;
      }
      .aura-reply-field.is-open::-webkit-scrollbar {
        width: 5px;
      }
      .aura-reply-field.is-open::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 5px;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
      /* ---- Overlay motion: the scrim fades on its own, panels only move.
         Transform-only animation stays on the compositor, so the slide is
         smooth; closing plays the same motion in reverse before unmount. */
      html {
        scrollbar-gutter: stable;
      }
      .drawer-slide-in {
        animation: auraDrawerIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      .aura-scrim {
        animation: auraScrimIn 0.3s ease-out both;
      }
      .aura-leaving {
        pointer-events: none;
      }
      .aura-leaving .aura-scrim {
        animation: auraScrimOut 0.26s ease-in both;
      }
      .aura-leaving .drawer-slide-in {
        animation: auraDrawerOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .drawer-slide-in-left {
        animation: auraDrawerOutLeft 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .aura-sheet-up {
        animation: auraSheetOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraDrawerIn {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes auraDrawerOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }
      @keyframes auraDrawerOutLeft {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-100%, 0, 0);
        }
      }
      @keyframes auraSheetOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 100%, 0);
        }
      }
      @keyframes auraScrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes auraScrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer-slide-in,
        .aura-scrim,
        .aura-leaving .aura-scrim,
        .aura-leaving .drawer-slide-in,
        .aura-leaving .drawer-slide-in-left,
        .aura-leaving .aura-sheet-up {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect, useLayoutEffect, useCallback } = React;

      const reducedMotion = () =>
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const SHIP_TO = {
        US: {
          code: "US",
          symbol: "$",
          label: "US $",
          flag: "🇺🇸",
          duty: "Duties prepaid",
          courier: "DHL Express · 4 days",
        },
        UK: {
          code: "UK",
          symbol: "£",
          label: "UK £",
          flag: "🇬🇧",
          duty: "VAT prepaid",
          courier: "DHL Express · 3 days",
        },
        CA: {
          code: "CA",
          symbol: "C$",
          label: "CA $",
          flag: "🇨🇦",
          duty: "Duties prepaid",
          courier: "DHL Express · 5 days",
        },
        IN: {
          code: "IN",
          symbol: "₹",
          label: "INR ₹",
          flag: "🇮🇳",
          duty: "No import duty",
          courier: "Blue Dart · 2 days",
        },
      };

      /* ===================================================================
       BRIEF PARSING
       A light, honest read of the free-text brief. Anything Aura cannot
       infer is shown as "Not set yet" rather than invented — the customer
       should always see which facts are theirs and which are assumed.
       =================================================================== */
      const OCCASIONS = [
        {
          key: "navratri",
          match: /\bnavratri|navaratri|garba|dandiya\b/i,
          label: "Navratri (9 nights)",
          weeks: "3 to 5 weeks",
        },
        { key: "wedding", match: /\bwedding\b/i, label: "Wedding", weeks: "3 to 5 weeks" },
        { key: "sangeet", match: /\bsangeet\b/i, label: "Sangeet", weeks: "3 to 4 weeks" },
        { key: "reception", match: /\breception\b/i, label: "Reception", weeks: "4 to 6 weeks" },
        { key: "diwali", match: /\bdiwali\b/i, label: "Diwali", weeks: "2 to 3 weeks" },
        {
          key: "temple",
          match: /\btemple|puja|pooja\b/i,
          label: "Temple / Puja",
          weeks: "1 to 2 weeks",
        },
        { key: "mehendi", match: /\bmehendi|mehndi\b/i, label: "Mehendi", weeks: "3 to 4 weeks" },
        { key: "haldi", match: /\bhaldi\b/i, label: "Haldi", weeks: "2 to 3 weeks" },
        {
          key: "griha",
          match: /\bgriha|housewarming\b/i,
          label: "Griha Pravesh",
          weeks: "2 to 3 weeks",
        },
        {
          key: "cocktail",
          match: /\bcocktail\b/i,
          label: "Cocktail evening",
          weeks: "4 to 5 weeks",
        },
        { key: "annapras", match: /\bannaprashan\b/i, label: "Annaprashan", weeks: "2 to 3 weeks" },
      ];

      const GARMENTS = [
        { match: /\blehenga\b/i, label: "Lehenga" },
        { match: /\bsaree|sari\b/i, label: "Saree" },
        { match: /\bsherwani\b/i, label: "Sherwani" },
        { match: /\banarkali\b/i, label: "Anarkali" },
        { match: /\bkurta\b/i, label: "Kurta set" },
        { match: /\bsuit\b/i, label: "Suit set" },
      ];

      const CITIES = [
        "Jaipur",
        "London",
        "Chicago",
        "New York",
        "Chennai",
        "Toronto",
        "Delhi",
        "Mumbai",
        "Dubai",
        "Singapore",
        "Bangalore",
        "Hyderabad",
        "San Francisco",
        "Houston",
        "Vancouver",
        "Melbourne",
        "Sydney",
      ];

      const MONTHS = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      function parseBrief(text, ship) {
        const t = text || "";

        const occasion = OCCASIONS.find((o) => o.match.test(t)) || null;
        const garment = GARMENTS.find((g) => g.match.test(t)) || null;
        const city = CITIES.find((c) => new RegExp("\\b" + c + "\\b", "i").test(t)) || null;
        const month = MONTHS.find((m) => new RegExp("\\b" + m + "\\b", "i").test(t)) || null;

        // Budget: a currency symbol or code followed by a number, either order.
        const budgetMatch =
          t.match(/(?:budget[^0-9]{0,12})?([$£₹]|C\$|USD|GBP|INR|CAD)\s?([0-9][0-9,\.]*)/i) ||
          t.match(/([0-9][0-9,\.]*)\s?(USD|GBP|INR|CAD|dollars|pounds|rupees)/i);

        let budget = null;
        if (budgetMatch) {
          const digits =
            budgetMatch[2] && /[0-9]/.test(budgetMatch[2]) ? budgetMatch[2] : budgetMatch[1];
          const unit =
            budgetMatch[2] && /[0-9]/.test(budgetMatch[2]) ? budgetMatch[1] : budgetMatch[2];
          const symbol = /[$£₹]|C\$/.test(unit)
            ? unit
            : { USD: "$", GBP: "£", INR: "₹", CAD: "C$", dollars: "$", pounds: "£", rupees: "₹" }[
                unit
              ] || ship.symbol;
          // Trim sentence punctuation the number pattern picks up ("$600." → "$600").
          budget = symbol + digits.replace(/[.,]+$/, "");
        }

        return {
          occasion: occasion ? occasion.label : null,
          lead: occasion ? occasion.weeks : "3 to 5 weeks",
          leadAssumed: !occasion,
          garment: garment ? garment.label : null,
          city,
          month,
          budget,
        };
      }

      /* ===================================================================
       DESIGN DIRECTIONS — three responses to the same brief
       =================================================================== */
      function buildDirections(brief, ship) {
        const piece = brief.garment || "Silhouette";
        return [
          {
            id: "heritage",
            name: "Heritage handloom",
            short: "Banarasi mulberry silk",
            craft: "Banarasi kadhwa weave · Varanasi",
            image: "images/heritage_banarasi.jpg",
            jewelry: {
              name: "Basra Pearl & Polki Choker",
              type: "Antique Choker & Jhumka Set",
              craft: "Uncut Polki & Colombian emerald bead drops",
              image: "images/jewelry_heritage.jpg",
              pairingNote:
                "Antique 22k gold tones harmonize with Varanasi kadhwa gold zari weaving.",
            },
            note: `${piece} in pure mulberry silk with a restrained gold zari border. Weight and drape that photograph beautifully in warm light.`,
            fabric: "Pure mulberry silk, kadhwa woven zari",
            colour: "Mulberry red",
            weight: "Approx. 2.1 kg finished",
            care: "Dry clean only · store folded in muslin",
            includes: "Blouse, skirt, dupatta · fully lined",
            from: 780,
            weeks: brief.lead,
            swatch: ["#7B2D3B", "#C89B3C", "#F3EEE4"],
          },
          {
            id: "modern",
            name: "Modern sculptural",
            short: "Chanderi, structured drape",
            craft: "Chanderi with structured drape · Madhya Pradesh",
            image: "images/modern_chanderi.jpg",
            jewelry: {
              name: "Sculpted Rose Gold & Amethyst Collar",
              type: "Contemporary Collar & Studs",
              craft: "Baguette diamonds & deep violet amethyst",
              image: "images/jewelry_modern.jpg",
              pairingNote: "Architectural geometric lines complement structured Chanderi drape.",
            },
            note: `A cleaner, architectural take — fewer surface motifs, more shape. Easy to move in, and reads contemporary against traditional dress codes.`,
            fabric: "Chanderi silk-cotton, hand-finished seams",
            colour: "Deep violet",
            weight: "Approx. 1.3 kg finished",
            care: "Dry clean · steam rather than press",
            includes: "Blouse, skirt, sculpted stole",
            from: 640,
            weeks: brief.lead,
            swatch: ["#3B2A5A", "#B7A7C6", "#FBF8F3"],
          },
          {
            id: "light",
            name: "Featherweight festive",
            short: "Organza, hand aari work",
            craft: "Organza with hand aari embroidery · Lucknow",
            image: "images/featherweight_organza.jpg",
            jewelry: {
              name: "Lilac Meenakari & Pearl Chandbalis",
              type: "Meenakari Chandbalis & Choker",
              craft: "Hand-painted enamel & tourmaline drops",
              image: "images/jewelry_featherweight.jpg",
              pairingNote:
                "Airy pastel hues match lightweight organza and delicate hand Chikankari.",
            },
            note: `Built for long events and warm rooms. Under 900g finished, packs flat, and holds its shape after a full day of wear.`,
            fabric: "Silk organza, hand aari embroidery",
            colour: "Soft lilac",
            weight: "Under 900 g finished",
            care: "Dry clean · hang on a padded hanger",
            includes: "Blouse, skirt, sheer dupatta",
            from: 520,
            weeks: "2 to 3 weeks",
            swatch: ["#D9C7A7", "#C89B3C", "#6A5D82"],
          },
          {
            id: "regal",
            name: "Regal zardozi",
            short: "Velvet with zardozi handwork",
            craft: "Zardozi handwork · Delhi",
            image: "images/regal_zardozi.jpg",
            jewelry: {
              name: "Royal Jadau Hasli Collar",
              type: "Heritage Hasli & Earring Set",
              craft: "Cabochon rubies & 22k antique gold Jadau",
              image: "images/jewelry_regal.jpg",
              pairingNote:
                "Regal ruby warmth anchors deep wine velvet and raised metallic zardozi.",
            },
            note: `The most formal of the four — silk velvet carrying raised zardozi on the bodice and hem. Built for evening light and photographs.`,
            fabric: "Silk velvet, raised zardozi handwork",
            colour: "Oxblood maroon",
            weight: "Approx. 2.6 kg finished",
            care: "Dry clean only · never fold across the work",
            includes: "Blouse, skirt, embroidered dupatta",
            from: 920,
            weeks: "5 to 7 weeks",
            swatch: ["#2E2140", "#C89B3C", "#7B2D3B"],
          },
        ];
      }

      /* Framings of the garment photograph and the paired jewelry close-up. */
      /* ===================================================================
       PIECES YOU CAN ARRIVE WITH
       Tapping a garment on home opens this screen with that piece attached
       to your opening line. Four of them are the same pieces the stylist
       offers as directions, so they reuse those records rather than
       restating them; the rest are described here.
       =================================================================== */
      const TILE_TO_DIRECTION = {
        "regal-lehenga": "regal",
        "heritage-lehenga": "heritage",
        "featherweight-lehenga": "light",
        "modern-saree": "modern",
      };

      const EXTRA_PIECES = {
        "kundan-bridal": {
          id: "kundan-bridal",
          name: "Velvet bridal, kundan set",
          short: "Velvet bodice with kundan",
          craft: "Zardozi bodice \u00b7 Lucknow",
          image: "images/velvet_bridal_lehenga.jpg",
          note: "A wine velvet bodice worked in raised zardozi, shown with the uncut kundan collar it was built around. The two are cut and set together so the necklace sits above the work rather than on it.",
          fabric: "Silk velvet, raised zardozi, 22k-plated kundan",
          weight: "Approx. 2.4 kg finished",
          care: "Dry clean only \u00b7 never fold across the work",
          includes: "Bodice, skirt, dupatta \u00b7 jewellery sold separately",
          from: 980,
          weeks: "5 to 7 weeks",
          swatch: ["#5A1226", "#C89B3C", "#E8D9B5"],
        },
        "kanjivaram-saree": {
          id: "kanjivaram-saree",
          name: "Temple border Kanjivaram",
          short: "Korvai join, temple border",
          craft: "Korvai join \u00b7 Kanchipuram",
          image: "images/kanjivaram_gold.png",
          note: "Body and border woven separately and joined by hand at the loom \u2014 the korvai join is what gives the border its weight and that clean colour break. Heavy, and meant to be.",
          fabric: "Pure mulberry silk, three-ply zari",
          weight: "Approx. 800 g",
          care: "Dry clean \u00b7 rotate folds every few months",
          includes: "Saree with unstitched blouse piece",
          from: 710,
          weeks: "3 to 5 weeks",
          swatch: ["#7B1E3B", "#C89B3C", "#E4D2A8"],
        },
        "family-silks": {
          id: "family-silks",
          name: "Gold tissue silks",
          short: "Matched family commission",
          craft: "Family commission \u00b7 Kanchipuram",
          image: "images/gold_tissue_saree.jpg",
          note: "One warp, cut for a whole family \u2014 saree, sherwani and two smaller pieces, all from the same tissue so the gold reads identically across every photograph.",
          fabric: "Gold tissue silk, matched dye lot",
          weight: "Varies by piece",
          care: "Dry clean only \u00b7 store flat in muslin",
          includes: "Priced per piece \u00b7 measured together",
          from: 540,
          weeks: "6 to 8 weeks",
          swatch: ["#C89B3C", "#E8D9B5", "#F3EEE4"],
        },
        "blush-pastel": {
          id: "blush-pastel",
          name: "Blush silk, pastel set",
          short: "Raw silk with meenakari",
          craft: "Meenakari pairing \u00b7 Jaipur",
          image: "images/blush_pastel_saree.jpg",
          note: "Blush raw silk paired with hand-enamelled meenakari and freshwater pearl. Built for daytime \u2014 mehendi, haldi, a morning ceremony where heavy gold reads wrong.",
          fabric: "Raw silk, hand-enamelled meenakari, pearl",
          weight: "Under 700 g",
          care: "Dry clean \u00b7 keep enamel away from scent",
          includes: "Drape and blouse \u00b7 jewellery sold separately",
          from: 460,
          weeks: "3 to 4 weeks",
          swatch: ["#E9C9CE", "#C89B3C", "#F4EEE8"],
        },
      };

      // Null whenever the key names nothing we can actually describe, so the
      // attachment stays a picture rather than a button that opens nothing.
      function pieceFor(key, directions) {
        if (!key) return null;
        const dirId = TILE_TO_DIRECTION[key];
        if (dirId) return directions.find((d) => d.id === dirId) || null;
        return EXTRA_PIECES[key] || null;
      }

      /* ===================================================================
       SEE FIT
       The measurements a piece would be cut to, shown before anything is
       cut. They come from the same store the Profile and Wardrobe screens
       write to, so all three agree. You either confirm them or replace them.
       =================================================================== */
      const FIT_STORE = "aura.profile.v1";

      const FIT_ROWS = [
        { k: "bust", label: "Bust" },
        { k: "waist", label: "Waist" },
        { k: "hip", label: "Hip" },
        { k: "shoulder", label: "Shoulder" },
        { k: "sleeve", label: "Sleeve length" },
        { k: "length", label: "Garment length" },
        { k: "height", label: "Height" },
      ];

      // What the Profile screen starts from, so the thread never shows blanks
      // to somebody who has simply never opened Profile.
      const FIT_SEED = {
        unit: "in",
        bust: "36",
        waist: "30",
        hip: "39",
        shoulder: "15",
        sleeve: "22",
        length: "41",
        height: "5'5\"",
        fitNote: "",
      };

      function readFit() {
        try {
          const raw = window.localStorage.getItem(FIT_STORE);
          const saved = raw ? JSON.parse(raw) : null;
          return Object.assign({}, FIT_SEED, saved && typeof saved === "object" ? saved : {});
        } catch (e) {
          return Object.assign({}, FIT_SEED);
        }
      }

      /* Family members and their measurements, as the Wardrobe screen keeps
         them. Read-only here — this screen only picks from the list. */
      const FIT_FAMILY_STORE = "aura.family.v1";

      function readFitPeople() {
        const self = readFit();
        const people = [
          {
            id: "self",
            name: "Your measurements",
            relation: "",
            m: self,
            values:
              self.measuredCount !== undefined
                ? self.measuredCount
                : FIT_ROWS.filter((r) => (self[r.k] || "").trim()).length,
            updated: self.measuredAt || "",
          },
        ];

        try {
          const raw = window.localStorage.getItem(FIT_FAMILY_STORE);
          const saved = raw ? JSON.parse(raw) : null;
          if (Array.isArray(saved)) {
            saved.forEach((f) => {
              people.push({
                id: f.id,
                name: f.name,
                relation: f.relation || "",
                m: Object.assign({}, FIT_SEED, f.m || {}),
                values: f.values || 0,
                updated: f.updated || "",
              });
            });
          }
        } catch (e) {
          /* nobody saved yet, or storage is blocked */
        }

        return people;
      }

      function writeFit(values) {
        try {
          const raw = window.localStorage.getItem(FIT_STORE);
          const saved = raw ? JSON.parse(raw) : {};
          const next = Object.assign({}, saved, values, {
            measuredAt: fitStamp(),
            measuredCount: FIT_ROWS.filter((r) => (values[r.k] || "").trim()).length,
          });
          window.localStorage.setItem(FIT_STORE, JSON.stringify(next));
          return next;
        } catch (e) {
          return Object.assign({}, values);
        }
      }

      function fitStamp() {
        const d = new Date();
        const m = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return "Updated " + d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear();
      }

      /* ===================================================================
       CHECKOUT
       Reached by confirming the measurements a piece will be cut to. Every
       price in Aura is landed, so there is nothing to add here — the summary
       restates what was agreed and the order is placed against it.
       =================================================================== */
      /* Which kind of payment, not the credentials. Card and account numbers
         are taken by the payment provider on its own screen, never here. */
      const PAY_METHODS = [
        { id: "credit", label: "Credit card", note: "Visa, Mastercard, Amex" },
        { id: "debit", label: "Debit card", note: "Visa, Mastercard, RuPay" },
        { id: "upi", label: "UPI", note: "Any UPI app" },
      ];

      function CheckoutPanel({ piece, who, ship, onBack, onPlace }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const [placing, setPlacing] = useState(false);
        const [payOpen, setPayOpen] = useState(false);
        const [payMethod, setPayMethod] = useState("credit");
        const [card, setCard] = useState({ number: "", name: "", exp: "", cvc: "" });
        const [upi, setUpi] = useState("");
        const chosenPay =
          PAY_METHODS.find((m) => m.id === payMethod) || PAY_METHODS[0];

        const isCard = payMethod === "credit" || payMethod === "debit";
        const digits = card.number.replace(/\D/g, "");

        /* Enough to know the field was filled in, not a validity check — a
           real one belongs to the payment provider, along with the details
           themselves. */
        const payReady = isCard
          ? digits.length >= 12 &&
            card.name.trim().length > 1 &&
            /^\d{2}\/\d{2}$/.test(card.exp) &&
            /^\d{3,4}$/.test(card.cvc)
          : /^[\w.\-]{2,}@[\w.\-]{2,}$/.test(upi.trim());

        const setCardField = (k) => (v) =>
          setCard((c) => Object.assign({}, c, { [k]: v }));

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (panelRef.current) panelRef.current.focus();
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onBack();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onBack]);

        const [courierName, courierDays] = (ship.courier || " · ").split(" · ");
        const total = piece.from ? ship.symbol + piece.from : "—";
        const cutFor = who.id === "self" ? "your measurements" : who.name + "'s measurements";

        return (
          <div
            ref={panelRef}
            role="dialog"
            aria-modal="true"
            aria-labelledby="checkout-title"
            tabIndex={-1}
            className="absolute inset-0 z-50 bg-canvas flex flex-col focus:outline-none aura-fade-in"
          >
            <header className="shrink-0 flex items-center gap-1 px-2 pt-3 pb-2 border-b border-hairline bg-canvas">
              <button
                type="button"
                onClick={onBack}
                aria-label="Back to your conversation"
                className="flex items-center gap-1 min-h-[44px] pl-1.5 pr-3 rounded-full text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2.1"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m15 18-6-6 6-6" />
                </svg>
                <span className="text-[13.5px] font-medium">Back to chat</span>
              </button>
              <div className="min-w-0 flex-1 text-right pr-2">
                <h1
                  id="checkout-title"
                  className="font-display text-[20px] text-primary leading-tight truncate"
                >
                  Checkout
                </h1>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto thread-scroll px-4 pt-4 pb-6">
              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2">
                Order summary
              </h2>

              <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                <div className="flex items-center gap-3 p-3">
                  <span className="shrink-0 w-[58px] h-[76px] rounded-xl overflow-hidden bg-inset border border-hairline">
                    {piece.image ? (
                      <img
                        src={piece.image}
                        alt={piece.name}
                        className="w-full h-full object-cover"
                      />
                    ) : (
                      <span
                        aria-hidden="true"
                        className="block w-full h-full"
                        style={{
                          backgroundImage:
                            "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 7px)",
                        }}
                      />
                    )}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-[14px] font-medium text-ink leading-snug">
                      {piece.name}
                    </span>
                    {piece.craft && (
                      <span className="block text-[11.5px] text-muted leading-snug mt-0.5">
                        {piece.craft}
                      </span>
                    )}
                    <span className="block font-mono text-[10.5px] text-muted mt-1.5">
                      Cut to {cutFor}
                    </span>
                  </span>
                </div>

                <dl className="border-t border-hairline divide-y divide-hairline">
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">Garment, cut to measure</dt>
                    <dd className="font-mono text-[13px] text-ink">{total}</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">{ship.duty}</dt>
                    <dd className="font-mono text-[13px] text-muted">Included</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">{courierName}</dt>
                    <dd className="font-mono text-[13px] text-muted">Included</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-3 bg-inset/50">
                    <dt className="text-[13px] font-medium text-ink">Total, landed</dt>
                    <dd className="font-mono text-[17px] text-ink">{total}</dd>
                  </div>
                </dl>
              </div>

              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2">
                Delivery
              </h2>
              <div className="bg-card border border-hairline rounded-2xl px-4 py-3">
                <p className="text-[13px] text-ink leading-snug">{courierName}</p>
                <p className="font-mono text-[10.5px] text-muted mt-1">
                  {courierDays} once the piece is approved and dispatched
                </p>
              </div>

              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2">
                Payment
              </h2>
              <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                <button
                  type="button"
                  onClick={() => setPayOpen((v) => !v)}
                  aria-expanded={payOpen}
                  aria-controls="pay-methods"
                  className="w-full text-left px-4 py-3 flex items-center justify-between gap-3 hover:bg-inset/50 transition-all"
                >
                  <span className="min-w-0">
                    <span className="block text-[13px] text-ink leading-snug">
                      {chosenPay.label}
                    </span>
                    <span className="block font-mono text-[10.5px] text-muted mt-1 truncate">
                      {chosenPay.note}
                    </span>
                  </span>
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                    className={
                      "shrink-0 text-muted transition-transform " +
                      (payOpen ? "rotate-180" : "")
                    }
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>

                {payOpen && (
                  <div
                    id="pay-methods"
                    role="radiogroup"
                    aria-label="Payment method"
                    className="border-t border-hairline p-2 flex flex-col gap-1.5 aura-fade-in"
                  >
                    {PAY_METHODS.map((pm) => {
                      const on = pm.id === payMethod;
                      return (
                        <button
                          key={pm.id}
                          type="button"
                          role="radio"
                          aria-checked={on}
                          onClick={() => {
                            setPayMethod(pm.id);
                            setPayOpen(false);
                          }}
                          className={
                            "w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-xl border transition-all active:scale-[0.99] " +
                            (on
                              ? "border-primary bg-inset/60"
                              : "border-hairline hover:border-primary/45")
                          }
                        >
                          <span
                            aria-hidden="true"
                            className={
                              "shrink-0 w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center " +
                              (on ? "border-primary" : "border-ctrl")
                            }
                          >
                            {on && <span className="w-2 h-2 rounded-full bg-primary" />}
                          </span>
                          <span className="min-w-0 flex-1">
                            <span className="block text-[13px] font-medium text-ink truncate">
                              {pm.label}
                            </span>
                            <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                              {pm.note}
                            </span>
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              {isCard ? (
                <div className="bg-card border border-hairline rounded-2xl p-4 mt-2.5 aura-fade-in">
                  <label
                    htmlFor="pay-number"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                  >
                    Card number
                  </label>
                  <input
                    id="pay-number"
                    type="text"
                    inputMode="numeric"
                    autoComplete="cc-number"
                    value={card.number}
                    onChange={(e) =>
                      setCardField("number")(
                        e.target.value
                          .replace(/\D/g, "")
                          .slice(0, 16)
                          .replace(/(.{4})/g, "$1 ")
                          .trim()
                      )
                    }
                    placeholder="0000 0000 0000 0000"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />

                  <label
                    htmlFor="pay-name"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5 mt-3.5"
                  >
                    Name on card
                  </label>
                  <input
                    id="pay-name"
                    type="text"
                    autoComplete="cc-name"
                    value={card.name}
                    onChange={(e) => setCardField("name")(e.target.value)}
                    placeholder="As printed on the card"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />

                  <div className="grid grid-cols-2 gap-3 mt-3.5">
                    <div>
                      <label
                        htmlFor="pay-exp"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Expiry
                      </label>
                      <input
                        id="pay-exp"
                        type="text"
                        inputMode="numeric"
                        autoComplete="cc-exp"
                        value={card.exp}
                        onChange={(e) => {
                          const d = e.target.value.replace(/\D/g, "").slice(0, 4);
                          setCardField("exp")(
                            d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d
                          );
                        }}
                        placeholder="MM/YY"
                        style={{ fontSize: 16 }}
                        className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                      />
                    </div>
                    <div>
                      <label
                        htmlFor="pay-cvc"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        CVC
                      </label>
                      <input
                        id="pay-cvc"
                        type="text"
                        inputMode="numeric"
                        autoComplete="cc-csc"
                        value={card.cvc}
                        onChange={(e) =>
                          setCardField("cvc")(e.target.value.replace(/\D/g, "").slice(0, 4))
                        }
                        placeholder="123"
                        style={{ fontSize: 16 }}
                        className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                      />
                    </div>
                  </div>
                </div>
              ) : (
                <div className="bg-card border border-hairline rounded-2xl p-4 mt-2.5 aura-fade-in">
                  <label
                    htmlFor="pay-upi"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                  >
                    UPI ID
                  </label>
                  <input
                    id="pay-upi"
                    type="text"
                    inputMode="email"
                    autoComplete="off"
                    value={upi}
                    onChange={(e) => setUpi(e.target.value)}
                    placeholder="yourname@bank"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />
                  <p className="text-[11.5px] text-muted leading-relaxed mt-2">
                    You will approve the request in your UPI app.
                  </p>
                </div>
              )}

              <p className="text-[11.5px] text-muted leading-relaxed mt-4">
                Nothing is charged until Meera confirms the brief. You approve photographs of the
                finished garment before it is dispatched.
              </p>
            </div>

            <div className="shrink-0 px-4 py-3 bg-canvas">
              <button
                type="button"
                disabled={placing || !payReady}
                onClick={() => {
                  setPlacing(true);
                  onPlace();
                }}
                className="w-full min-h-[52px] rounded-full bg-primary text-onprimary text-[14.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
              >
                {placing
                  ? "Placing\u2026"
                  : payReady
                    ? "Place order"
                    : isCard
                      ? "Add card details"
                      : "Add your UPI ID"}
              </button>
            </div>
          </div>
        );
      }

      /* Every set on file — yours and each family member's — so the piece can
         be cut for whoever it is actually for. Picking one shows its figures. */
      function FitCard({ people, chosenId, onChoose, pieceName }) {
        const chosen = people.find((p) => p.id === chosenId) || people[0];
        const fit = chosen.m;

        return (
          <div className="mt-2.5 bg-card border border-hairline rounded-2xl overflow-hidden">
            <div className="px-4 pt-3 pb-2">
              <h4 className="font-display text-[16px] text-ink leading-tight">
                Whose measurements?
              </h4>
            </div>

            <div
              className="px-3 pb-3 flex flex-col gap-1.5"
              role="radiogroup"
              aria-label="Measurements on file"
            >
              {people.map((p) => {
                const on = p.id === chosen.id;
                return (
                  <button
                    key={p.id}
                    type="button"
                    role="radio"
                    aria-checked={on}
                    onClick={() => onChoose(p.id)}
                    className={
                      "w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-xl border transition-all active:scale-[0.99] " +
                      (on
                        ? "border-primary bg-inset/60"
                        : "border-hairline hover:border-primary/45")
                    }
                  >
                    <span
                      aria-hidden="true"
                      className={
                        "shrink-0 w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center " +
                        (on ? "border-primary" : "border-ctrl")
                      }
                    >
                      {on && <span className="w-2 h-2 rounded-full bg-primary" />}
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block text-[13px] font-medium text-ink truncate">
                        {p.name}
                        {p.relation && (
                          <span className="text-muted font-normal">{" \u00b7 " + p.relation}</span>
                        )}
                      </span>
                      <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                        {p.values
                          ? p.values + " values" + (p.updated ? " \u00b7 " + p.updated : "")
                          : "No measurements yet"}
                      </span>
                    </span>
                  </button>
                );
              })}
            </div>

            <div className="px-4 pt-3 pb-2 flex items-baseline justify-between gap-3 border-t border-hairline">
              <h4 className="font-display text-[16px] text-ink leading-tight truncate">
                {chosen.name}
              </h4>
              <span className="font-mono text-[10px] uppercase tracking-wider text-muted shrink-0">
                {fit.unit === "cm" ? "Centimetres" : "Inches"}
              </span>
            </div>
            <dl className="divide-y divide-hairline border-t border-hairline">
              {FIT_ROWS.map((r) => (
                <div key={r.k} className="flex items-baseline justify-between gap-3 px-4 py-2">
                  <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted">
                    {r.label}
                  </dt>
                  <dd className="font-mono text-[13px] text-ink">
                    {(fit[r.k] || "").trim() || "—"}
                  </dd>
                </div>
              ))}
            </dl>
            {fit.fitNote && (fit.fitNote || "").trim() ? (
              <p className="px-4 py-2.5 text-[12px] text-muted leading-relaxed border-t border-hairline">
                {fit.fitNote}
              </p>
            ) : null}
            {pieceName && (
              <p className="px-4 py-2.5 font-mono text-[10px] text-muted border-t border-hairline">
                {pieceName} would be cut to these
              </p>
            )}
          </div>
        );
      }

      /* Confirm them, or replace them. Nothing is cut until one is chosen. */
      function FitChoiceCard({ onApprove, onUpdate }) {
        return (
          <div className="mt-2.5 bg-inset/60 border border-hairline rounded-2xl p-4">
            <p className="text-[13px] text-ink leading-relaxed">
              Are these still right? A piece is cut to them once you confirm.
            </p>
            <div className="flex flex-col gap-2 mt-3">
              <button
                type="button"
                onClick={onApprove}
                className="w-full min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
              >
                Yes, cut to these
              </button>
              <button
                type="button"
                onClick={onUpdate}
                aria-haspopup="dialog"
                className="w-full min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
              >
                Add new measurements
              </button>
            </div>
          </div>
        );
      }

      /* The same seven points the Profile screen asks for. */
      /* Line icons for each measurement (36px grid). Drawn in the brand plum. */
      const FIT_ICONS = {
        bust: (
          <>
            <path d="M11 6c0 3-2 4-2 7M25 6c0 3 2 4 2 7" />
            <path d="M9 13c0 3 2 5 4.5 5S18 16 18 14c0 2 2 4 4.5 4S27 16 27 13" />
            <path d="M9 13v3c0 6 1 11 2 14M27 13v3c0 6-1 11-2 14" />
            <path d="M11 22h14" />
          </>
        ),
        waist: (
          <>
            <path d="M11 5c1 4 3 7 3 11s-2 7-3 15M25 5c-1 4-3 7-3 11s2 7 3 15" />
            <path d="M13 16h10" strokeDasharray="1.5 2" />
            <circle cx="18" cy="19" r="0.8" fill="currentColor" stroke="none" />
          </>
        ),
        hip: (
          <>
            <path d="M11 5c0 4-2 7-2 11 0 6 2 10 3 15M25 5c0 4 2 7 2 11 0 6-2 10-3 15" />
            <path d="M9 16c3 1 6 3 9 7 3-4 6-6 9-7" />
            <path d="M18 23v8" />
          </>
        ),
        shoulder: (
          <>
            <path d="M14 5c0 2 1.5 3 4 3s4-1 4-3" />
            <path d="M14 7 8 10c-1.5.7-2 2-2 3.5V31M22 7l6 3c1.5.7 2 2 2 3.5V31" />
            <path d="M11 17v14M25 17v14" />
          </>
        ),
        sleeve: (
          <>
            <path d="M12 5c-2 1-3 3-3 5l5 18c.3 1.2 1.5 2 2.8 1.6l1.5-.5c1.2-.4 1.8-1.7 1.4-2.9L14 9" />
            <path d="M15 5c2 0 3.5 1.5 3.5 3.5" />
            <path d="m15.5 26 3.5-1.2" />
          </>
        ),
        length: (
          <>
            <path d="M14 4v4l-2 4 2 3-5 16h18l-5-16 2-3-2-4V4" />
            <path d="M14 8h8" />
          </>
        ),
        height: (
          <>
            <circle cx="14" cy="7" r="2.5" />
            <path d="M10.5 12h7l1 9h-2l-.5 10h-4l-.5-10h-2l1-9Z" />
            <path d="M25 5v26M23 5h4M23 31h4" />
          </>
        ),
        note: (
          <>
            <path d="M11 5h10l5 5v20a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
            <path d="M21 5v5h5M14 17h8M14 21h8M14 25h5" />
          </>
        ),
      };

      function FitIcon({ name, size = 30 }) {
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 36 36"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.2"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
            focusable="false"
            className="text-primary/80"
          >
            {FIT_ICONS[name]}
          </svg>
        );
      }

      /* Ways to measure. Manual is the form below; the others explain
               themselves and hand you to the right place. */
      const FIT_METHODS = [
        {
          id: "manual",
          label: "Manual",
          icon: <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3ZM14.5 7.5l3 3" />,
        },
        {
          id: "scan",
          label: "AI scan",
          icon: (
            <>
              <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.8l1.5-2.2h6.4L16.7 7h2.8A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z" />
              <circle cx="12" cy="12.8" r="3.3" />
            </>
          ),
        },
        {
          id: "garment",
          label: "Garment",
          icon: <path d="M10 3v3l-1.5 3 1.5 2-4 10h12l-4-10 1.5-2L14 6V3M10 6h4" />,
        },
        {
          id: "session",
          label: "Session",
          icon: (
            <>
              <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
              <path d="M3.5 10h17M8 3v4M16 3v4" />
            </>
          ),
        },
      ];

      const FIT_METHOD_COPY = {
        scan: {
          title: "Measure with three photos",
          body: "Front, back and side against an on-screen guide — about two minutes. The photos stay on your phone; a draper confirms the fourteen points before anything is cut.",
          cta: "Start AI scan",
        },
        garment: {
          title: "Measure a piece that already fits",
          body: "Lay a blouse or kurta you love flat and measure it seam to seam — across the bust, waist and hip, shoulder to shoulder, and sleeve from shoulder seam to hem. Enter those numbers and we'll allow ease on top.",
          cta: "Enter garment measurements",
        },
        session: {
          title: "A 6-minute video fitting",
          body: "One of our drapers takes fourteen points on a video call and notes posture and how you like things to sit. You approve the numbers before they're used.",
          cta: "Ask for a session",
        },
      };

      function FitSheet({ initial, onClose, onSave, onRequestSession }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const inputRefs = useRef({});
        const [form, setForm] = useState(() =>
          Object.assign({}, FIT_SEED, initial || {}),
        );
        const [method, setMethod] = useState("manual");
        const set = (k) => (v) => setForm((f) => Object.assign({}, f, { [k]: v }));

        const recorded = FIT_ROWS.filter((r) => (form[r.k] || "").trim()).length;

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (panelRef.current) panelRef.current.focus();
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        const methodAction = () => {
          if (method === "scan") {
            window.location.href = "profile.html?scan=1";
          } else if (method === "garment") {
            setForm((f) =>
              Object.assign({}, f, {
                fitNote:
                  f.fitNote && f.fitNote.trim()
                    ? f.fitNote
                    : "Measured from a garment that fits well.",
              }),
            );
            setMethod("manual");
          } else if (method === "session") {
            onRequestSession && onRequestSession();
          }
        };

        // Short names keep every label whole on a phone-width card; the unit
        // sits after the number instead of in the label.
        const SHORT = { sleeve: "Sleeve", length: "Length" };

        const field = (r, wide) => {
          const val = form[r.k] || "";
          const unit = r.k === "height" ? "" : form.unit;
          return (
            <div
              key={r.k}
              className={`relative flex items-stretch rounded-2xl border border-hairline bg-card focus-within:border-primary focus-within:shadow-[0_0_0_3px_rgb(59_42_90/0.12)] transition-shadow ${
                wide ? "col-span-2" : ""
              }`}
            >
              <span className="shrink-0 w-12 flex items-center justify-center border-r border-hairline my-3">
                <FitIcon name={r.k} size={28} />
              </span>
              <label htmlFor={"fit-" + r.k} className="flex-1 min-w-0 pl-2.5 pr-9 py-2.5 cursor-text">
                <span className="block text-[10.5px] uppercase tracking-[0.06em] text-muted truncate">
                  {SHORT[r.k] || r.label}
                </span>
                <span className="flex items-baseline gap-1 mt-0.5">
                  <input
                    id={"fit-" + r.k}
                    ref={(el) => (inputRefs.current[r.k] = el)}
                    type="text"
                    inputMode={r.k === "height" ? "text" : "decimal"}
                    value={val}
                    onChange={(e) => set(r.k)(e.target.value)}
                    placeholder="—"
                    aria-label={r.label + (unit ? ` (${unit})` : "")}
                    size={Math.max(2, val.length)}
                    className="min-w-0 max-w-full bg-transparent font-read text-[22px] leading-[28px] text-ink placeholder:text-ctrl focus:outline-none"
                  />
                  {unit && val && <span className="text-[12px] text-muted">{unit}</span>}
                </span>
              </label>
              {val && (
                <button
                  type="button"
                  onClick={() => {
                    set(r.k)("");
                    const el = inputRefs.current[r.k];
                    if (el) el.focus();
                  }}
                  aria-label={`Clear ${r.label.toLowerCase()}`}
                  className="absolute right-0 top-1/2 -translate-y-1/2 w-10 h-11 flex items-center justify-center text-muted hover:text-ink"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18M6 6l12 12" />
                  </svg>
                </button>
              )}
            </div>
          );
        };

        const copy = FIT_METHOD_COPY[method];

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="fit-sheet-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 h-[94%] bg-canvas rounded-t-[32px] shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              <div className="relative shrink-0 pt-3 pb-1">
                <span
                  className="block w-10 h-1 rounded-full bg-ctrl/40 mx-auto"
                  aria-hidden="true"
                />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="Close without changing your measurements"
                  className="absolute top-3 right-3 w-11 h-11 rounded-full flex items-center justify-center bg-hairline/70 text-ink hover:bg-hairline active:scale-95 transition-all z-10"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto thread-scroll px-4 pt-4 pb-6">
                <h2
                  id="fit-sheet-title"
                  className="font-display text-[32px] leading-none text-ink pr-12"
                >
                  Your measurements
                </h2>
                <p className="text-[14px] text-muted leading-snug mt-2">
                  Add your details for a better fit and personalised suggestions.
                </p>

                {/* How to measure */}
                <div
                  className="flex gap-1 p-1 rounded-full bg-card border border-hairline shadow-[0_1px_3px_rgb(30_27_46/0.06)] mt-5"
                  role="tablist"
                  aria-label="How to measure"
                >
                  {FIT_METHODS.map((m) => {
                    const on = method === m.id;
                    return (
                      <button
                        key={m.id}
                        type="button"
                        role="tab"
                        aria-selected={on}
                        onClick={() => setMethod(m.id)}
                        className={"flex-1 min-w-0 min-h-[44px] px-1 rounded-full flex items-center justify-center gap-1.5 font-read text-[15px] whitespace-nowrap transition-colors " + (on ? "bg-primary text-onprimary" : "text-ink hover:bg-inset")}
                      >
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="1.5"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                          className="shrink-0"
                        >
                          {m.icon}
                        </svg>
                        {m.label}
                      </button>
                    );
                  })}
                </div>

                {method !== "manual" ? (
                  <div className="mt-5 rounded-2xl border border-hairline bg-card p-5">
                    <h3 className="font-read text-[20px] leading-snug text-ink m-0">
                      {copy.title}
                    </h3>
                    <p className="text-[14px] text-muted leading-relaxed mt-2 mb-0">
                      {copy.body}
                    </p>
                    <button
                      type="button"
                      onClick={methodAction}
                      className="mt-4 min-h-[48px] px-5 rounded-full bg-primary text-onprimary font-read text-[16px] flex items-center gap-2.5 hover:bg-primary/90 active:scale-95 transition-all"
                    >
                      {copy.cta}
                      <svg
                        width="17"
                        height="17"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="1.8"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M5 12h14M13 6l6 6-6 6" />
                      </svg>
                    </button>
                  </div>
                ) : (
                  <>
                    <span
                      id="fit-unit-label"
                      className="block text-[14px] text-ink mt-5 mb-2"
                    >
                      Units
                    </span>
                    <div
                      className="inline-flex p-0.5 rounded-full bg-inset border border-hairline"
                      role="group"
                      aria-labelledby="fit-unit-label"
                    >
                      {[
                        { id: "in", label: "Inches" },
                        { id: "cm", label: "Centimetres" },
                      ].map((u) => {
                        const on = form.unit === u.id;
                        return (
                          <button
                            key={u.id}
                            type="button"
                            aria-pressed={on}
                            onClick={() => set("unit")(u.id)}
                            className={"min-h-[32px] px-4 rounded-full text-[13.5px] transition-colors " + (on ? "bg-card text-primary font-medium shadow-[0_1px_2px_rgb(30_27_46/0.08)]" : "text-muted hover:text-ink")}
                          >
                            {u.label}
                          </button>
                        );
                      })}
                    </div>

                    <div className="border-t border-hairline mt-5 pt-4 grid grid-cols-2 gap-2">
                      {FIT_ROWS.map((r) => field(r, r.k === "height"))}
                    </div>

                    <label
                      htmlFor="fit-note"
                      className="block font-mono text-[11px] uppercase tracking-[0.08em] text-muted mt-5 mb-2"
                    >
                      Fit notes
                    </label>
                    <div className="flex items-stretch rounded-2xl border border-hairline bg-card focus-within:border-primary focus-within:shadow-[0_0_0_3px_rgb(59_42_90/0.12)] transition-shadow">
                      <span className="shrink-0 w-12 flex items-start justify-center pt-4 border-r border-hairline my-3">
                        <FitIcon name="note" size={26} />
                      </span>
                      <textarea
                        id="fit-note"
                        rows={3}
                        value={form.fitNote || ""}
                        onChange={(e) => set("fitNote")(e.target.value)}
                        placeholder="Add any specific notes (optional)"
                        className="flex-1 min-w-0 pl-3 pr-3 py-3.5 bg-transparent text-[16px] text-ink placeholder:text-muted resize-none focus:outline-none"
                      />
                    </div>
                  </>
                )}
              </div>

              <div className="shrink-0 border-t border-hairline px-5 pt-3.5 pb-5 flex items-center gap-2.5 bg-canvas">
                <span className="flex-1 text-[15px] text-muted" aria-live="polite">
                  {recorded} of {FIT_ROWS.length} recorded
                </span>
                <button
                  type="button"
                  onClick={onClose}
                  className="min-h-[52px] px-6 rounded-full border border-ink text-ink font-read text-[17px] hover:bg-inset active:scale-95 transition-all"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  onClick={() => onSave(form)}
                  className="min-h-[52px] pl-6 pr-5 rounded-full bg-primary text-onprimary font-read text-[17px] flex items-center gap-2.5 hover:bg-primary/90 active:scale-95 transition-all"
                >
                  Save
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        );
      }
      function getViewsForDirection(d) {
        return [
          {
            id: "full",
            label: "Full length",
            image: d.image,
            scale: 1,
            origin: "50% 50%",
            fit: "contain",
          },
          {
            id: "bodice",
            label: "Bodice & Neckline",
            image: d.image,
            scale: 2.1,
            origin: "50% 20%",
          },
          {
            id: "jewelry",
            label: "Jewellery pairing",
            image: d.jewelry && d.jewelry.image ? d.jewelry.image : d.image,
            isJewelry: true,
            fit: "cover",
          },
          { id: "hem", label: "Hem & Border", image: d.image, scale: 2.1, origin: "50% 86%" },
        ];
      }

      /* ===================================================================
       YOUR WARDROBE
       The pieces Aura has already made for you, mirrored from the Wardrobe
       screen so a conversation can reason about them. Each carries what it
       still wants rather than what it is — the stylist's job here is to
       finish an outfit you own, not to sell you another one.
       =================================================================== */
      const WARDROBE = [
        {
          id: "own-3",
          name: "Temple border Kanjivaram",
          craft: "Korvai join · Kanchipuram",
          image: "images/kanjivaram_gold.png",
          swatch: ["#5A2140", "#C89B3C", "#D9C7A7"],
          pairs: [
            {
              k: "Blouse",
              label: "Elbow-sleeve raw silk, mustard",
              note: "Pick up the border, not the body. A matched blouse flattens a Korvai — the contrast is the whole point of the join.",
              image: "images/blouse_mustard_silk.jpg",
              swatch: ["#C89B3C", "#8A6A1F", "#F0E4CB"],
            },
            {
              k: "Jewellery",
              label: "Temple gold · long haram and jhumkas",
              note: "Antique 22k tones rather than polished. White metal fights the zari under warm light.",
              image: "images/jewelry_regal.jpg",
              swatch: ["#7B2D3B", "#C89B3C", "#E8D9B5"],
            },
            {
              k: "Drape",
              label: "Nivi, pleats set in the morning",
