    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-1,
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 { -webkit-line-clamp: 1; }
      .line-clamp-2 { -webkit-line-clamp: 2; }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
    </style>
    <style id="aura-sheet-motion">
      /* ---- Bottom sheets move like the side drawer ----
         The sheet slides on the same curve and timing as the nav drawer,
         and only the backdrop fades, never the sheet, so opening reads as
         a panel arriving rather than the screen reloading. Closing plays
         it in reverse (see the script at the end of the body). Placed last
         in <head> so it wins over each page's older sheet timing. */
      .aura-sheet-up {
        animation: auraSheetIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      @keyframes auraSheetIn {
        from { transform: translate3d(0, 100%, 0); }
        to { transform: translate3d(0, 0, 0); }
      }
      /* The overlay that holds a sheet fades its backdrop colour only. */
      .aura-fade-in:has(.aura-sheet-up) {
        animation: auraScrimBgIn 0.3s ease-out both;
      }
      @keyframes auraScrimBgIn {
        from { background-color: transparent; }
      }
      /* A closed sheet's stand-in, playing the exit before it is removed. */
      .aura-sheet-ghost.aura-sheet-ghost {
        pointer-events: none;
        animation: auraScrimBgOut 0.26s ease-in both;
      }
      .aura-sheet-ghost .aura-sheet-up,
      .aura-sheet-ghost.aura-sheet-up {
        animation: auraSheetGhostOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraScrimBgOut {
        to { background-color: transparent; }
      }
      @keyframes auraSheetGhostOut {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(0, 100%, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .aura-sheet-up,
        .aura-fade-in:has(.aura-sheet-up) { animation-duration: 1ms; }
      }
    </style>
    <script id="aura-home-handoff">
      /* Going back to Home (Home icon, back button, history.back) leaves Home
         the drawer-hop flag, so it opens on its skeleton instead of a blank
         reload. See the aura-tab-transition block in index.html. */
      window.addEventListener("pageswap", function (e) {
        try {
          var a = e.activation;
          var u = new URL(a.entry.url, location.href);
          if (
            a.navigationType !== "reload" &&
            u.origin === location.origin &&
            /\/(index\.html)?$/.test(u.pathname)
          )
            sessionStorage.setItem("aura-drawer-nav", "1");
        } catch (err) {}
      });
    </script>

    <script type="text/babel">
      const { useState, useRef, useEffect, useCallback } = React;

      /* ===================================================================
       WHERE "BACK" GOES
       Every screen is reachable from several others now — the drawer opens
       Discover from home, from a chat, from the wardrobe — so a hard-coded
       destination sends people somewhere they have never been. Read the page
       we actually arrived from and name it, so the control tells the truth.

       Falls back to the old fixed destination when there is no referrer to
       read: a bookmark, a typed URL, or a cross-origin arrival.
       =================================================================== */
      const BACK_LABELS = {
        "index.html": "home",
        "conversation.html": "chat",
        "discover.html": "Discover",
        "collection.html": "the collection",
        "wardrobe.html": "wardrobe",
        "orders.html": "orders",
        "profile.html": "profile",
      };

      /* The browser's own history is the one thing that is always right,
         and it works when the referrer does not — opening these files
         straight off disk (file://) sends no referrer at all. So history
         decides WHERE back goes; the referrer only decides what we CALL it,
         and we say plain "Back" when we cannot name the place. */
      const CAN_GO_BACK = (function () {
        try {
          return window.history.length > 1;
        } catch (e) {
          return false;
        }
      })();

      const BACK_FROM_REFERRER = (function () {
        try {
          const ref = document.referrer;
          if (!ref) return null;
          const u = new URL(ref);
          if (u.origin !== window.location.origin) return null;
          const file = u.pathname.split("/").pop() || "index.html";
          const here = window.location.pathname.split("/").pop() || "index.html";
          // A reload, or a jump within the same screen, is not a way back.
          if (file === here) return null;
          if (!BACK_LABELS[file]) return null;
          return { href: file, label: BACK_LABELS[file] };
        } catch (e) {
          return null;
        }
      })();

      function backTarget(fallbackHref, fallbackLabel) {
        // Name it from the referrer when we have one. With history to fall
        // back on we stay honest and say "Back"; with neither, the old fixed
        // destination is all that is left, so name that.
        const named =
          BACK_FROM_REFERRER ||
          (CAN_GO_BACK ? null : { href: fallbackHref, label: fallbackLabel });

        return {
          href: (named && named.href) || fallbackHref,
          label: named && named.label,
          text: named ? "Back to " + named.label : "Back",
          short: (named && named.label) || "Back",
          useHistory: CAN_GO_BACK,
        };
      }

      /* Same fallback contract as the stylist thread: a photograph when we

/* ===================================================================

const WISHLIST_KEY = "aura.wishlist";

function readWishlist() {
  try {
    const raw = window.localStorage.getItem(WISHLIST_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.filter((x) => typeof x === "string")
      : [];
  } catch (e) {
    return [];
  }
}

function writeWishlist(ids) {
  try {
    window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
  } catch (e) {
    /* saving is a convenience, never a blocker */
  }
}

// One source of truth per screen, so a heart tapped on a card updates
// the sheet sitting on top of it and vice versa.
function useWishlist() {
  const [ids, setIds] = useState(readWishlist);

  const toggle = useCallback((id) => {
    if (!id) return;
    setIds((cur) => {
      const next =
        cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
      writeWishlist(next);
      return next;
    });
  }, []);

  // Another tab, or a return trip through the back button.
  useEffect(() => {
    const sync = (e) => {
      if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
    };
    window.addEventListener("storage", sync);
    window.addEventListener("pageshow", sync);
    return () => {
      window.removeEventListener("storage", sync);
      window.removeEventListener("pageshow", sync);
    };
  }, []);

  return {
    ids,
    saved: (id) => ids.indexOf(id) !== -1,
    toggle,
  };
}

                  </p>
                </div>
              </div>

              {/* Price stays put while everything above it scrolls. */}
              <div className="shrink-0 border-t border-hairline bg-canvas px-5 pt-4 pb-6 flex items-center gap-3">
                <div className="min-w-0 flex-1">
                  <span className="block font-display text-[38px] text-ink leading-none">
                    {ship.symbol}
                    {piece.from}
                  </span>
                  <span className="block font-mono text-[11px] text-muted leading-snug mt-2 whitespace-nowrap">
                    {ship.duty} · {courierName}
                  </span>
                  <span className="block font-mono text-[11px] text-muted leading-snug">{courierDays}</span>
                </div>


                <button


                  type="button"


                  onClick={() => onRequest(piece)}


                  className="shrink-0 min-h-[52px] pl-6 pr-5 rounded-full bg-primary text-onprimary font-mono text-[15px] tracking-[0.04em] flex items-center gap-3 hover:bg-primary/90 active:scale-95 transition-all"


                >


                  See Fit


                  <svg


                    width="18"


                    height="18"


                    viewBox="0 0 24 24"


                    fill="none"


                    stroke="currentColor"


                    strokeWidth="1.8"


                    strokeLinecap="round"


                    strokeLinejoin="round"


                    aria-hidden="true"


                    focusable="false"


                  >


                    <path d="M5 12h14M13 6l6 6-6 6" />


                  </svg>


                </button>
              </div>
              {/* Full-screen photo */}
              {enlarged && (
                <div
                  className="absolute inset-0 z-20 flex flex-col aura-fade-in"
                  style={{ background: "rgb(var(--ink-rgb) / 0.94)" }}
                  role="dialog"
                  aria-modal="true"
                  aria-label={`${piece.name} — ${enlarged.label}`}
                >
                  <div className="flex items-center justify-between px-4 pt-3 pb-2 text-onprimary">
                    <span className="font-mono text-[11px] uppercase tracking-[0.1em]">{enlarged.label}</span>
                    <button
                      type="button"
                      autoFocus
                      onClick={() => setEnlarged(null)}
                      aria-label="Close the enlarged photo"
                      className="w-11 h-11 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20"
                    >
                      <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="1.6"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                      </svg>
                    </button>
                  </div>
                  <div className="relative flex-1 m-4 rounded-2xl overflow-hidden">
                    <SheetPhoto piece={piece} view={{ ...enlarged, fit: "contain" }} alt={`${piece.name} — ${enlarged.label}`} />
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }
      /* ===================================================================
       MAIN — full collection page
       Reached from a rail's "Show more" slide. Shows every item in that
       section in a two-column grid, carrying through the garment filter
       that was active on Discover.
       =================================================================== */
      function App() {
        const wish = useWishlist();
        const back = backTarget("discover.html", "Discover");
        const params = new URLSearchParams(window.location.search);
        const sectionId = (params.get("section") || "").trim();
        const section = CURATIONS.find((s) => s.id === sectionId) || CURATIONS[0];

        const [active, setActive] = useState("all");
        const [activeCountry, setActiveCountry] = useState(SHIP_TO[0]);
        const [openPiece, setOpenPiece] = useState(null);
        const [toastMsg, setToastMsg] = useState("");
        const toastTimer = useRef(null);

        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        useEffect(() => () => clearTimeout(toastTimer.current), []);

        const facets = facetsFor(section);
        const items = filterItems(section.items, active);

        const openCurationItem = (item) => {
          const piece = item.piece && PIECES.find((p) => p.id === item.piece);
          if (piece) {
            setOpenPiece(piece);
            return;
          }
          showToast(`${item.title} — full story opens in the next release`);
        };

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>

            {toastMsg && (
              <div
                className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] max-w-[calc(100%-2rem)] px-4 py-2.5 rounded-full bg-ink text-canvas text-[12.5px] shadow-lg aura-toast-in"
                aria-hidden="true"
              >
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              {/* ---------- Header ---------- */}
              <header className="shrink-0 flex items-center gap-2 px-4 pt-4 pb-2">
                <a
                  href={back.href}
                  aria-label={back.text}
                  onClick={(e) => {
                    // history.back() keeps the previous screen's scroll
                    // position; the href is the no-JS fallback.
                    if (!back.useHistory) return;
                    e.preventDefault();
                    window.history.back();
                  }}
                  className="shrink-0 -ml-1.5 min-h-[44px] pr-2 pl-1.5 flex items-center gap-1.5 rounded-lg text-ink hover:text-primary active:scale-95 transition-all"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                  <span className="text-[13.5px] font-medium">{back.short}</span>
                </a>

                <div className="min-w-0 flex-1 text-right pr-1">
                  <h1 className="font-display text-[20px] text-primary leading-tight truncate">
                    {section.label}
                  </h1>
                </div>
              </header>

              {/* ---------- Facet filter, specific to this section ---------- */}
              <div className="shrink-0 px-4 pb-1 pt-1.5">
                <div
                  className="flex gap-2 overflow-x-auto pb-1.5 no-scrollbar"
                  role="group"
                  aria-label={`Filter by ${(section.facetLabel || "type").toLowerCase()}`}
                >
                  {["all", ...facets].map((f) => (
                    <button
                      key={f}
                      type="button"
                      onClick={() => setActive(f)}
                      aria-pressed={active === f}
                      className={`reply-chip shrink-0 ${
                        active === f ? "!bg-primary !text-onprimary !border-primary" : ""
                      }`}
                    >
                      {f === "all" ? "All" : f}
                    </button>
                  ))}
                </div>
              </div>

              {/* ---------- Full collection, two across ---------- */}
              <div className="thread-scroll px-4 pt-2 pb-24">
                <p className="text-[12px] text-muted leading-relaxed mb-4">{section.blurb}</p>

                {items.length === 0 ? (
                  <p className="text-[13px] text-muted leading-relaxed text-center py-10">
                    Nothing in this collection under that filter yet.
                  </p>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {items.map((it) => (
                      <CurationCard
                        key={it.id}
                        item={it}
                        onOpen={openCurationItem}
                        saved={wish.saved(it.id)}
                        onSave={() => wish.toggle(it.id)}
                      />
                    ))}
                  </div>
                )}

                <p className="font-mono text-[10.5px] text-muted text-center pt-5">
                  {items.length} of {section.items.length} shown
                </p>
              </div>

              {/* ---------- Product detail sheet ---------- */}
              {openPiece && (
                <ProductDetailSheet
                  saved={wish.saved(openPiece.name)}
                  onSave={() => wish.toggle(openPiece.name)}
                  piece={openPiece}
                  ship={activeCountry}
                  onClose={() => setOpenPiece(null)}
                  onRequest={(p) => {
                    // See Fit opens the thread on the measurements the piece would
                    // be cut to, rather than on a request for it. The picture and
                    // name travel with it so the thread never has to look the piece
                    // up in a catalogue that may not carry it.
                    window.location.href =
                      "conversation.html?prompt=" +
                      encodeURIComponent(`See how the ${p.name} fits me.`) +
                      "&piece=" +
                      encodeURIComponent(p.id) +
                      "&name=" +
                      encodeURIComponent(p.name) +
                      "&craft=" +
                      encodeURIComponent(p.craft || "") +
                      "&img=" +
                      encodeURIComponent(p.image || "") +
                      "&from=" +
                      encodeURIComponent(p.from || "") +
                      "&fit=1&ship=" +
                      encodeURIComponent(activeCountry.code);
                  }}
                  onAsk={(p, view) => {
                    setOpenPiece(null);
                    showToast(`Asked Meera about the ${view.label.toLowerCase()} on ${p.name}`);
                  }}
                />
              )}

              {/* ---------- Minimised chat -- returns to home ---------- */}
              <a
                href="index.html"
                aria-label="Back to home"
                className="absolute bottom-7 right-4 w-14 h-14 rounded-full bg-primary text-onprimary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-all"
              >
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.9"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script id="aura-sheet-motion-exit">
      /* Sheets unmount the instant they close. So the exit can mirror the
         drawer's, a copy of the closed sheet stays for one short slide down
         while its backdrop fades, then goes. Overlays that already animate
         their own exit (class aura-leaving) are left alone. */
      (function () {
        if (!window.MutationObserver) return;
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        function isSheetOverlay(n) {
          if (!n || n.nodeType !== 1 || n.classList.contains("aura-leaving")) return false;
          if (n.classList.contains("aura-sheet-ghost")) return false;
          var holds = n.classList.contains("aura-sheet-up") || n.querySelector(".aura-sheet-up");
          if (!holds) return false;
          return (
            n.classList.contains("aura-sheet-up") ||
            n.classList.contains("aura-fade-in") ||
            /(^|\s)inset-0(\s|$)/.test(n.className || "")
          );
        }
        new MutationObserver(function (records) {
          if (reduce && reduce.matches) return;
          records.forEach(function (r) {
            if (!r.target.isConnected) return;
            r.removedNodes.forEach(function (n) {
              if (!isSheetOverlay(n)) return;
              var ghost = n.cloneNode(true);
              ghost.classList.add("aura-sheet-ghost");
              ghost.setAttribute("aria-hidden", "true");
              ghost.removeAttribute("id");
              ghost.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
              ghost.querySelectorAll("video").forEach(function (v) { v.remove(); });
              r.target.appendChild(ghost);
              setTimeout(function () { ghost.remove(); }, 300);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
