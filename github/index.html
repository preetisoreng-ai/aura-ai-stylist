              </span>
            </span>
            <EventArt event={event} size={42} />
            <Chevron className="shrink-0 text-ink" />
          </button>
        );
      }

      /* "Add your own date": a row that opens into a two-field form. */
      function AddOwnDate({ onAdd }) {
        const [open, setOpen] = useState(false);
        const [name, setName] = useState("");
        const [date, setDate] = useState("");
        const nameRef = useRef(null);
        const pad = (n) => String(n).padStart(2, "0");
        const t = new Date();
        const today = t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
        const ready = name.trim() && date && date >= today;

        useEffect(() => {
          if (open && nameRef.current) nameRef.current.focus();
        }, [open]);

        if (!open) {
          return (
            <button
              type="button"
              onClick={() => setOpen(true)}
              className="w-full mt-3 flex items-center gap-4 py-1.5 rounded-2xl text-left hover:bg-inset/60 transition-colors"
            >
              <span className="w-12 h-12 rounded-full bg-inset flex items-center justify-center text-ink shrink-0">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.6"
                  strokeLinecap="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </span>
              <span className="flex-1 text-[16px] text-muted">Add your own date</span>
              <Chevron className="shrink-0 text-ink mr-1" />
            </button>
          );
        }

        return (
          <form
            className="mt-3 rounded-2xl border border-hairline bg-card p-4 space-y-3"
            onSubmit={(e) => {
              e.preventDefault();
              if (!ready) return;
              onAdd(name.trim(), date);
              setOpen(false);
              setName("");
              setDate("");
            }}
          >
            <p className="font-read text-[18px] text-ink m-0">Add your own date</p>
            <label className="block">
              <span className="block font-mono text-[10.5px] uppercase tracking-[0.12em] text-muted mb-1">
                What is it?
              </span>
              <input
                ref={nameRef}
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g. Cousin’s sangeet, Toronto"
                className="w-full min-h-[44px] px-3 rounded-xl border border-ctrl/50 bg-canvas text-[15px] text-ink placeholder:text-muted focus:outline-none focus:border-primary"
              />
            </label>
            <label className="block">
              <span className="block font-mono text-[10.5px] uppercase tracking-[0.12em] text-muted mb-1">
                When?
              </span>
              <input
                type="date"
                value={date}
                min={today}
                onChange={(e) => setDate(e.target.value)}
                className="w-full min-h-[44px] px-3 rounded-xl border border-ctrl/50 bg-canvas text-[15px] text-ink focus:outline-none focus:border-primary"
              />
            </label>
            <div className="flex justify-end gap-2 pt-1">
              <button
                type="button"
                onClick={() => setOpen(false)}
                className="min-h-[44px] px-4 rounded-full text-[14px] text-ink hover:bg-inset"
              >
                Cancel
              </button>
              <button
                type="submit"
                disabled={!ready}
                className="min-h-[44px] px-5 rounded-full bg-primary text-onprimary text-[14px] font-medium disabled:opacity-40"
              >
                Save date
              </button>
            </div>
          </form>
        );
      }

      /* The calendar behind the rail. Month marks the days that carry
         something and days without an event stay plain text, so the sheet
         never hands you thirty empty tab stops. */
      function CalendarSheet({ events, onPick, onClose, onAddDate }) {
        const [mode, setMode] = useState("month");
        const firstEvent = events[0];
        const anchor = firstEvent ? new Date(firstEvent.date + "T00:00:00") : new Date();
        const [cursor, setCursor] = useState({
          y: anchor.getFullYear(),
          m: anchor.getMonth(),
        });
        const [selected, setSelected] = useState(firstEvent ? firstEvent.date : null);

        const byDate = {};
        events.forEach((e) => {
          byDate[e.date] = (byDate[e.date] || []).concat(e);
        });

        const pad = (n) => String(n).padStart(2, "0");
        const iso = (d) => cursor.y + "-" + pad(cursor.m + 1) + "-" + pad(d);

        // Days from the neighbouring months fill the first and last weeks, faded.
        const leading = new Date(cursor.y, cursor.m, 1).getDay();
        const length = new Date(cursor.y, cursor.m + 1, 0).getDate();
        const prevLength = new Date(cursor.y, cursor.m, 0).getDate();
        const cells = [];
        for (let i = leading - 1; i >= 0; i--) cells.push({ d: prevLength - i, out: true });
        for (let d = 1; d <= length; d++) cells.push({ d });
        for (let d = 1; cells.length % 7; d++) cells.push({ d, out: true });

        const now = new Date();
        const isToday = (d) =>
          now.getFullYear() === cursor.y && now.getMonth() === cursor.m && now.getDate() === d;

        // Moving months drops the selection: a day highlighted in a month you
        // can no longer see is just a stale caption.
        const step = (n) => {
          const m = cursor.m + n;
          setCursor({ y: cursor.y + Math.floor(m / 12), m: ((m % 12) + 12) % 12 });
          setSelected(null);
        };

        const chosen = selected && byDate[selected] ? byDate[selected] : [];
        const chosenDate = selected ? new Date(selected + "T00:00:00") : null;

        // A new date jumps the month view to it, already selected.
        const addDate = (name, date) => {
          onAddDate(name, date);
          const d = new Date(date + "T00:00:00");
          setMode("month");
          setCursor({ y: d.getFullYear(), m: d.getMonth() });
          setSelected(date);
        };

        return (
          <div className="bg-canvas w-full rounded-t-[28px] px-6 pt-3 pb-8 shadow-2xl aura-sheet-up max-h-[92%] overflow-y-auto no-scrollbar">
            <div className="w-10 h-1 rounded-full bg-ctrl/40 mx-auto mb-3" aria-hidden="true" />

            <div className="flex items-start justify-between">
              <div className="pt-4">
                <h2
                  id="calendar-sheet-title"
                  className="font-editorial text-[34px] font-normal text-ink leading-none"
                >
                  Your calendar
                </h2>
                <p className="text-[14px] text-muted leading-snug mt-2">
                  Festivals and your own dates. Tap one to start the brief.
                </p>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Close the calendar"
                className="shrink-0 -mr-3 w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.6"
                  strokeLinecap="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>

            <div className="flex items-center gap-2.5 mt-5" role="group" aria-label="Calendar view">
              {[
                ["month", "Month"],
                ["list", "List"],
              ].map(([id, label]) => (
                <button
                  key={id}
                  type="button"
                  aria-pressed={mode === id}
                  onClick={() => setMode(id)}
                  className={`min-h-[44px] px-6 rounded-full text-[15px] transition-colors ${
                    mode === id
                      ? "bg-primary text-onprimary"
                      : "bg-inset text-ink border border-hairline hover:border-ctrl/60"
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>

            {mode === "month" ? (
              <div className="mt-4">
                <div className="flex items-center justify-between">
                  <button
                    type="button"
                    onClick={() => step(-1)}
                    aria-label="Previous month"
                    className="-ml-2 w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all"
                  >
                    <Chevron dir="left" size={20} />
                  </button>
                  <span className="font-editorial italic text-[24px] text-ink" aria-live="polite">
                    {MONTH_NAMES[cursor.m]} {cursor.y}
                  </span>
                  <button
                    type="button"
                    onClick={() => step(1)}
                    aria-label="Next month"
                    className="-mr-2 w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all"
                  >
                    <Chevron size={20} />
                  </button>
                </div>

                <div className="grid grid-cols-7 gap-1.5 mt-2" aria-hidden="true">
                  {WEEKDAY_LABELS.map((w, i) => (
                    <span
                      key={i}
                      className="py-1 text-center text-[11px] uppercase tracking-[0.06em] text-muted"
                    >
                      {w}
                    </span>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-x-1.5 gap-y-1 mt-1">
                  {cells.map((c, i) => {
                    if (c.out) {
                      return (
                        <span
                          key={"out-" + i}
                          aria-hidden="true"
                          className="h-11 flex items-center justify-center font-read text-[16px] text-ink/25"
                        >
                          {c.d}
                        </span>
                      );
                    }
                    const d = c.d;
                    const key = iso(d);
                    const dayEvents = byDate[key];
                    if (!dayEvents) {
                      return (
                        <span
                          key={key}
                          className={`h-11 flex items-center justify-center font-read text-[16px] ${
                            isToday(d)
                              ? "text-primary font-medium underline underline-offset-4 decoration-gold"
                              : "text-ink"
                          }`}
                        >
                          {d}
                        </span>
                      );
                    }
                    const on = selected === key;
                    const tone = eventTone(dayEvents[0]);
                    return (
                      <button
                        key={key}
                        type="button"
                        aria-pressed={on}
                        onClick={() => setSelected(key)}
                        aria-label={
                          d +
                          " " +
                          MONTH_NAMES[cursor.m] +
                          " " +
                          cursor.y +
                          " — " +
                          dayEvents.map((e) => e.name).join(", ")
                        }
                        className={`h-11 rounded-xl border flex flex-col items-center justify-center font-read text-[16px] leading-none transition-colors ${
                          on
                            ? "border-primary bg-primary text-onprimary"
                            : `${tone.day} text-ink hover:border-primary/60`
                        }`}
                      >
                        {d}
                        <span
                          className={`w-1 h-1 rounded-full mt-1 ${on ? "bg-onprimary" : tone.dot}`}
                          aria-hidden="true"
                        />
                      </button>
                    );
                  })}
                </div>

                <div className="mt-4 pt-4 border-t border-hairline">
                  {chosen.length ? (
                    <>
                      <div className="flex items-baseline justify-between mb-3">
                        <h3 className="font-editorial text-[24px] font-normal text-ink leading-none">
                          Events on {chosenDate.getDate()} {MONTH_NAMES[chosenDate.getMonth()]}
                        </h3>
                        <span className="text-[14px] text-muted">
                          {chosen.length} {chosen.length === 1 ? "event" : "events"}
                        </span>
                      </div>
                      <div className="space-y-2.5">
                        {chosen.map((e) => (
                          <EventCard key={e.id} event={e} onPick={onPick} />
                        ))}
                      </div>
                    </>
                  ) : (
                    <p className="text-[14px] text-muted py-2 m-0">
                      Tap a marked day to see what falls on it.
                    </p>
                  )}
                  <AddOwnDate onAdd={addDate} />
                </div>
              </div>
            ) : (
              <div className="mt-4">
                <div className="space-y-2.5">
                  {events.map((e) => (
                    <EventCard key={e.id} event={e} onPick={onPick} />
                  ))}
                </div>
                <AddOwnDate onAdd={addDate} />
              </div>
            )}
          </div>
        );
      }
      /* ===================================================================
       HERO CAROUSEL — 5 Editorial Pillars
       1. Curated collection
       2. Editorial stories
       3. Designer spotlight
       4. Inspiration feed
       5. Community looks
       =================================================================== */
      const HERO_SLIDES = [
        {
          id: "curated",
          category: "Curated collection",
          title: "Curated\nCollection",
          subtitle: "Edits our stylists are building now.",
          image: "images/hero_modern_rituals.jpg",
          menswearImage: "images/sherwani_emerald_velvet.jpg",
          link: "collection.html?section=curated",
        },
        {
          id: "editorial",
          category: "Editorial stories",
          title: "Editorial\nStories",
          subtitle: "How the craft actually works.",
          image: "images/aura_hero_arch.jpg",
          menswearImage: "images/sherwani_midnight_navy.jpg",
          link: "collection.html?section=editorial",
        },
        {
          id: "designers",
          category: "Designer spotlight",
          title: "Designer\nSpotlight",
          subtitle: "The hands behind the cloth.",
          image: "images/hero_anarkali.jpg",
          link: "designers.html",
        },
        {
          id: "inspiration",
          category: "Inspiration feed",
          title: "Inspiration\nFeed",
          subtitle: "Colour and cloth, by occasion.",
          image: "images/lehenga_contemporary.jpg",
          menswearImage: "images/sherwani_mint_pastel.jpg",
          link: "collection.html?section=inspiration",
        },
        {
          id: "community",
          category: "Community looks",
          title: "Community\nLooks",
          subtitle: "Worn by Aura customers.",
          image: "images/family_lilac_collection.jpg",
          link: "collection.html?section=community",
        },
      ];

      function HeroSection({ onExplore }) {
        // `cycle` counts full passes through the slides. Even passes show the
        // womenswear photos; odd passes swap in menswear where a slide has one.
        const [{ idx: activeIdx, cycle }, setPos] = useState({ idx: 0, cycle: 0 });
        const [touchStartX, setTouchStartX] = useState(null);
        const count = HERO_SLIDES.length;
        const next = () =>
          setPos(({ idx, cycle }) =>
            idx === count - 1 ? { idx: 0, cycle: cycle + 1 } : { idx: idx + 1, cycle }
          );
        const prev = () =>
          setPos(({ idx, cycle }) =>
            idx === 0 ? { idx: count - 1, cycle: Math.max(0, cycle - 1) } : { idx: idx - 1, cycle }
          );
        const goTo = (idx) => setPos(({ cycle }) => ({ idx, cycle }));
        const showMenswear = cycle % 2 === 1;
        const imageFor = (s) => (showMenswear && s.menswearImage) || s.image;

        // Gentle auto-slideshow rotation every 5.5s; restarts after manual navigation
        useEffect(() => {
          const timer = setInterval(next, 5500);
          return () => clearInterval(timer);
        }, [activeIdx]);

        const slide = HERO_SLIDES[activeIdx];

        const handleTouchStart = (e) => {
          setTouchStartX(e.touches[0].clientX);
        };

        const handleTouchEnd = (e) => {
          if (touchStartX === null) return;
          const diff = touchStartX - e.changedTouches[0].clientX;
          if (diff > 40) next();
          else if (diff < -40) prev();
          setTouchStartX(null);
        };

        const caret = (dir) => (
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.8"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
          >
            <polyline points={dir === "left" ? "15 18 9 12 15 6" : "9 18 15 12 9 6"} />
          </svg>
        );

        return (
          <section
            className="relative -mx-5 px-8 pt-5 pb-4 select-none bg-gradient-to-r from-inset to-transparent"
            aria-roledescription="carousel"
            aria-label="Aura collections"
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
          >
            <div className="flex items-center justify-center gap-5 h-[244px]" aria-live="polite">
              {/* Left Editorial Column */}
              <div className="w-[152px] shrink-0 flex flex-col gap-5">
                <div className="flex flex-col gap-2">
                  <h1 className="font-editorial italic text-[36px] leading-[40px] tracking-[0.02em] text-ink font-normal">
                    {slide.title.split("\n").map((line, i, lines) => (
                      <React.Fragment key={i}>
                        {line}
                        {i < lines.length - 1 && <br />}
                      </React.Fragment>
                    ))}
                  </h1>
                  <p className="font-sans text-[12px] leading-[16px] text-muted">
                    {slide.subtitle}
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => onExplore(slide)}
                  className="self-start inline-flex items-center gap-2 font-sans font-medium text-[12px] leading-[19.5px] uppercase tracking-[0.2em] text-ink border-b border-ink hover:opacity-75 transition-opacity cursor-pointer"
                >
                  <span>Explore</span>
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                  >
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                  </svg>
                </button>
              </div>

              {/* Right Arched Portrait */}
              <div
                role="button"
                tabIndex={0}
                onClick={() => onExplore(slide)}
                onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && onExplore(slide)}
                aria-label={`Explore ${slide.category}`}
                className="relative w-[160px] h-[244px] shrink-0 rounded-t-[80px] rounded-b-md overflow-hidden bg-inset border border-hairline shadow-[0_8px_20px_rgba(30,27,46,0.12)] cursor-pointer group"
              >
                {/* Every photo stays mounted so switching crossfades instead of flashing empty */}
                {HERO_SLIDES.flatMap((s, idx) =>
                  [s.image, s.menswearImage]
                    .filter(Boolean)
                    .map((src) => (
                      <img
                        key={src}
                        src={src}
                        alt=""
                        className={`absolute inset-0 w-full h-full object-cover object-center transition-[opacity,transform] duration-500 group-hover:scale-105 ${
                          idx === activeIdx && src === imageFor(s) ? "opacity-100" : "opacity-0"
                        }`}
                      />
                    ))
                )}
              </div>
            </div>

            {/* Prev / next */}
            <button
              type="button"
              onClick={prev}
              aria-label="Previous collection"
              className="absolute left-0 top-[154px] -translate-y-1/2 w-8 h-11 flex items-center justify-center text-ink/80 hover:text-ink cursor-pointer"
            >
              {caret("left")}
            </button>
            <button
              type="button"
              onClick={next}
              aria-label="Next collection"
              className="absolute right-0 top-[154px] -translate-y-1/2 w-8 h-11 flex items-center justify-center text-ink/80 hover:text-ink cursor-pointer"
            >
              {caret("right")}
            </button>

            {/* Carousel Dot Indicators (— • • • •) */}
            <div className="flex items-center justify-center gap-1.5 mt-5">
              {HERO_SLIDES.map((s, idx) => (
                <button
                  key={s.id}
                  type="button"
                  onClick={() => goTo(idx)}
                  aria-label={`Go to ${s.category}`}
                  aria-current={activeIdx === idx ? "true" : undefined}
                  className={`transition-all cursor-pointer ${
                    activeIdx === idx
                      ? "w-6 h-1 rounded-full bg-ink"
                      : "w-1.5 h-1.5 rounded-full bg-ink/30 hover:bg-ink/60"
                  }`}
                />
              ))}
            </div>
          </section>
        );
      }
      /* ===================================================================
       UPCOMING EVENTS — Exact editorial card rail matching screenshot
       =================================================================== */
      function UpcomingEvents({ events, onPick, onOpenCalendar }) {
        if (!events.length) return null;
        return (
          <section aria-labelledby="rail-upcoming" className="mt-5 mb-0 select-none">
            <button
              type="button"
              onClick={onOpenCalendar}
              className="flex items-center gap-1 mb-3 text-ink hover:opacity-75 transition-opacity cursor-pointer"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="1.9"
                strokeLinecap="round"
                strokeLinejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="18" rx="2.5" ry="2.5" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <h2
                id="rail-upcoming"
                className="font-editorial text-[16px] leading-[21px] tracking-[0.02em] font-normal"
              >
                Upcoming events
              </h2>
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                aria-hidden="true"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>

            <div className="flex gap-2.5 overflow-x-auto no-scrollbar -mx-5 px-5 pb-1">
              {events.slice(0, 3).map((e) => {
                const tone = eventTone(e);
                const isSisterWedding = e.id === "sister-wedding";

                return (
                  <button
                    key={e.id}
                    type="button"
                    onClick={() => onPick(e)}
                    aria-label={`Ask Aura what to wear for ${e.name} on ${e.when}`}
                    className={`shrink-0 w-[185px] sm:w-[205px] min-h-[84px] text-left p-3 rounded-2xl border transition-all flex items-center justify-between gap-2 hover:shadow-md active:scale-[0.985] cursor-pointer ${tone.card}`}
                  >
                    <div className="flex-1 min-w-0 self-stretch flex flex-col justify-between">
                      <span className="block font-serif text-[13.5px] font-normal text-ink leading-[1.2]">
                        {isSisterWedding ? (
                          <>
                            Sister's wedding,
                            <br />
                            Chicago
                          </>
                        ) : (
                          e.name
                        )}
                      </span>
                      <div className="mt-2">
                        <span className={`block font-mono text-[10.5px] ${tone.date}`}>
                          {e.when}
                        </span>
                      </div>
                    </div>
                    <EventArt event={e} />
                  </button>
                );
              })}
            </div>
          </section>
        );
      }

      /* ===================================================================
       WEDDING CATEGORY RAILS — Bridal Lehengas, Groom Sherwanis, Wedding
       Sarees, Menswear Suits (Family Collections reuses the same rail)
       =================================================================== */
      const WEDDING_RAILS = [
        {
          id: "lehengas",
          title: "Bridal Lehengas",
          items: [
            {
              id: "bridal-lehenga",
              label: "BRIDAL",
              name: "Bridal Antique Brocade Zari Weave",

            },
            {

              label: "FESTIVE",
              name: "Festive Emerald Green Bridal Lehenga",
              craft: "Heavy Gold & Copper Zardozi · Palace atelier",
              image: "images/lehenga_festive.jpg",
            },
            {
              id: "cocktail-lehenga",
              label: "COCKTAIL",
              name: "Cocktail Blush Flowing Lehenga",
              craft: "Lightweight Resham & Modern Silhouette · Jaipur atelier",

            },
            {

      function App() {
        const [drawerOpen, setDrawerOpen] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("drawer") === "true";
          } catch (e) {
            return false;
          }
        });
        const [moreOpen, setMoreOpen] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("more") === "true";
          } catch (e) {
            return false;
          }
        });
        const [selectedChipId, setSelectedChipId] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("chip") || null;
          } catch (e) {
            return null;
          }
        });
        const [inputVal, setInputVal] = useState(() => {
          try {
            const p = new URLSearchParams(window.location.search).get("chip");
            if (p) {
              const all = [...CHIPS_DATA, ...MORE_OCCASIONS];
              const match = all.find((c) => c.id === p);
              return match ? match.prompt : "";
            }
          } catch (e) {}
          return "";
        });
        const [isListening, setIsListening] = useState(false);
        const [activeCountry, setActiveCountry] = useState(SHIP_TO_COUNTRIES[0]);
        const [toastMsg, setToastMsg] = useState("");
        // Compose mode: the text editor is active, so the orb, headline and
        // chips clear out and the bar rides just above the keyboard.
        const [composing, setComposing] = useState(false);

        // Attachment popup (Figma 36:1267) — Camera / Photos / Files.
        const [attachOpen, setAttachOpen] = useState(false);

        // Chat history drawer, opened from the Aura wordmark. The log is read
        // on open so it reflects conversations started since this page loaded.
        const [historyOpen, setHistoryOpen] = useState(false);
        const [chatLog, setChatLog] = useState([]);

        // Calendar sync is set in Wardrobe; coming back here is a full page
        // load, so reading it once on mount is enough.
        const [calendarSync] = useState(readCalendarSync);
        const [events, setEvents] = useState(upcomingEvents);
        const [calendarOpen, setCalendarOpen] = useState(false);
        const [openFamilyCollection, setOpenFamilyCollection] = useState(null);

        const inputRef = useRef(null);
        const attachRef = useRef(null);
        const toastTimer = useRef(null);
        const micTimer = useRef(null);

        // All selectable occasion chips for lookup
        const allOccasions = [...CHIPS_DATA, ...MORE_OCCASIONS];
        const selectedChip = allOccasions.find((c) => c.id === selectedChipId);
        const isCardExpanded =
          Boolean(selectedChipId) || inputVal.includes("\n") || inputVal.length > 35;

        // Track the visual viewport. When the mobile keyboard opens it
        // shrinks the visual viewport without changing the layout viewport,
        // so a bottom-anchored bar would otherwise sit underneath it.
        useEffect(() => {
          const vv = window.visualViewport;
          if (!vv) return;
          const root = document.documentElement;
          const apply = () => {
            root.style.setProperty("--app-h", vv.height + "px");
          };
          apply();
          vv.addEventListener("resize", apply);
          vv.addEventListener("scroll", apply);
          return () => {
            vv.removeEventListener("resize", apply);
            vv.removeEventListener("scroll", apply);
            root.style.removeProperty("--app-h");
          };
        }, []);

        const exitCompose = () => {
          if (inputRef.current) inputRef.current.blur();
          setComposing(false);
        };

        // Read the log at open time rather than on mount: a chat started in
        // this tab and navigated back from should already be in the list.
        const openHistory = () => {
          setChatLog(readChatLog());
          setHistoryOpen(true);
        };

        const openChat = (chat) => {
          window.location.href =
            "conversation.html?prompt=" +
            encodeURIComponent(chat.prompt) +
            "&ship=" +
            encodeURIComponent(chat.ship || activeCountry.code);
        };

        // Attachment popup dismisses on Escape or a click outside it. The
        // popup is a menu, not a dialog, so it does not trap focus.
        useEffect(() => {
          if (!attachOpen) return;
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              setAttachOpen(false);
            }
          };
          const onPointer = (e) => {
            if (attachRef.current && !attachRef.current.contains(e.target)) {
              setAttachOpen(false);
            }
          };
          document.addEventListener("keydown", onKey);
          document.addEventListener("pointerdown", onPointer);
          return () => {
            document.removeEventListener("keydown", onKey);
            document.removeEventListener("pointerdown", onPointer);
          };
        }, [attachOpen]);

        // A single pending toast at a time — a new message replaces the old
        // timer rather than racing it.
        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        useEffect(
          () => () => {
            if (toastTimer.current) clearTimeout(toastTimer.current);
            if (micTimer.current) clearTimeout(micTimer.current);
          },
          []
        );

        const isMultiline = inputVal.includes("\n") || inputVal.length > 35;

        const handleMic = () => {
          if (isListening) {
            if (micTimer.current) clearTimeout(micTimer.current);
            setIsListening(false);
            showToast("Voice input stopped");
            return;
          }
          setIsListening(true);
          showToast("Listening — English, Hindi or Hinglish");
          micTimer.current = setTimeout(() => {
            setInputVal(
              "Sister's wedding in Chicago, October.\nA pastel lehenga with a lightweight drape, budget $600."
            );
            setIsListening(false);
            showToast("Voice transcribed into the conversation bar");
          }, 1800);
        };

        // A category is a Discover section; home only ever links into it.
        const openCategory = (cat) => {
          window.location.href = "collection.html?section=" + encodeURIComponent(cat.id);
        };

        // Garments have no product page here. Tapping one hands the stylist
        // an opening line about that piece.
        const startGarmentChat = (g) => {
          const prompt = "Tell me about the " + g.name + " \u2014 " + g.craft + ".";
          showToast("Opening your stylist conversation\u2026");
          setTimeout(() => {
            // The piece travels with the prompt so the chat can show what you
            // tapped, and open its details when you tap it again.
            window.location.href =
              "conversation.html?prompt=" +
              encodeURIComponent(prompt) +
              "&piece=" +
              encodeURIComponent(g.id) +
              "&ship=" +
              encodeURIComponent(activeCountry.code);
          }, 400);
        };

        // An event hands the stylist the date itself, so the thread opens on
        // what you are dressing for rather than on a garment.
        const startEventChat = (e) => {
          showToast("Opening your stylist conversation\u2026");
          setTimeout(() => {
            window.location.href =
              "conversation.html?prompt=" +
              encodeURIComponent(e.prompt) +
              "&ship=" +
              encodeURIComponent(activeCountry.code);
          }, 400);
        };

        const handleAsk = (text) => {
          const trimmed = (text || "").trim();
          if (!trimmed) {
            showToast("Tell Aura about your occasion first");
            if (inputRef.current) inputRef.current.focus();
            return;
          }
          showToast("Opening your stylist conversation…");
          setTimeout(() => {
            window.location.href =
              "conversation.html?prompt=" +
              encodeURIComponent(trimmed) +
              "&ship=" +
              encodeURIComponent(activeCountry.code);
          }, 500);
        };

        const loadPrompt = (prompt, label, chipId) => {
          setSelectedChipId(chipId || null);
          setInputVal(prompt);
          showToast(`${label} selected — other chips removed`);
          setTimeout(() => {
            const el = inputRef.current;
            if (!el) return;
            el.focus();
            el.setSelectionRange(prompt.length, prompt.length);
          }, 60);
        };

        const handleChipClick = (chip) => {
          if (chip.isMore) {
            setMoreOpen(true);
          } else {
            loadPrompt(chip.prompt, chip.label, chip.id);
          }
        };

        const handleDeselectChip = () => {
          setSelectedChipId(null);
          setInputVal("");
          showToast("Occasion reset — all chips restored");
        };

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            {/* Toast — announced politely, single entrance, no looping motion */}
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>
            {toastMsg && (
              <div
                aria-hidden="true"
                className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
              >
                <span className="text-gold" aria-hidden="true">
                  ✦
                </span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              <div className="canvas-wash" aria-hidden="true" />
              {/* ---------- 1. Header (Aura / STYLIST DESK, AI Assistant pill, Hamburger) ---------- */}
              {!composing && (
                <header className="relative px-6 pt-4 pb-3 flex items-center justify-between z-20 shrink-0 bg-canvas">
                  {/* Left: Brand Logo */}
                  <div className="flex flex-col select-none">
                    <button
                      type="button"
                      onClick={openHistory}
                      className="text-left group cursor-pointer"
                      aria-label="Aura Stylist Desk"
                    >
                      <span className="font-editorial text-[30px] leading-[34px] tracking-[-0.02em] text-ink font-normal block group-hover:opacity-85 transition-opacity">
                        Aura
                      </span>
                    </button>
                  </div>

                  {/* Right: Clean 3-Line Hamburger Menu Button */}
                  <button
                    type="button"
                    onClick={() => setDrawerOpen(true)}
                    aria-label="Open navigation menu"
                    aria-haspopup="dialog"
                    aria-expanded={drawerOpen}
                    className="w-10 h-10 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all -mr-1 cursor-pointer"
                  >
                    <svg
                      width="22"
                      height="15"
                      viewBox="0 0 22 15"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2.2"
                      strokeLinecap="round"
                    >
                      <line x1="2" y1="2" x2="20" y2="2" />
                      <line x1="2" y1="7.5" x2="20" y2="7.5" />
                      <line x1="2" y1="13" x2="20" y2="13" />
                    </svg>
                  </button>
                </header>
              )}

              {/* ---------- 2. Main Content ---------- */}
              {!composing ? (
                <main className="relative flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pt-0 pb-24 z-10">
                  {/* Hero Section with Arched Portrait */}
                  <HeroSection
                    onExplore={(slide) => {
                      if (slide && slide.link) {
                        window.location.href = slide.link;
                      } else {
                        window.location.href = "discover.html";
                      }
                    }}
                  />

                  {/* Upcoming Events Section */}
                  <UpcomingEvents
                    events={events}
                    onPick={startEventChat}
                    onOpenCalendar={() => setCalendarOpen(true)}
                  />

                  {/* Wedding category rails */}
                  {WEDDING_RAILS.map((rail) => (
                    <CategoryRail
                      key={rail.id}
                      id={rail.id}
                      title={rail.title}
                      items={rail.items}
                      onPick={(item) =>
                        startGarmentChat({
                          id: item.id,
                          name: item.name,
                          craft: item.craft,
                          image: item.image,
                        })
                      }
                      onOpenCategory={() => openCategory({ id: rail.id, name: rail.title })}
                    />
                  ))}

                  {/* Family Collections */}
                  <CategoryRail
                    id="family"
                    title="Family Collections"
                    items={FAMILY_COLLECTIONS.map((col) => ({
                      id: col.id,
                      label: col.title.split(" & ")[0],
                      name: `${col.title} family collection, ${col.members.length} pieces`,
                      image: col.image,
                      collection: col,
                    }))}
                    onPick={(item) => setOpenFamilyCollection(item.collection)}
                  />
                </main>
              ) : (
                <div
                  className="flex-1 z-10"
                  onMouseDown={(e) => {
                    e.preventDefault();
                    exitCompose();
                  }}
                  aria-hidden="true"
                />
              )}

              {/* ---------- 3. Floating Prompt Bar ("Ask Aura anything...") ---------- */}
              <div
                className="absolute inset-x-0 bottom-0 px-2 pt-2 pb-2 z-40 bg-white/10 backdrop-blur-md"
                ref={attachRef}
              >
                {attachOpen && (
                  <div className="absolute left-4 right-4 bottom-full mb-2 z-50">
                    <AttachmentPopup
                      onPick={(opt) => {
                        setAttachOpen(false);
                        showToast(opt.hint);
                      }}
                    />
                  </div>
                )}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    handleAsk(inputVal);
                  }}
                  className="w-full bg-card rounded-full border border-hairline/95 pl-1 pr-1.5 py-1.5 flex items-center gap-2 transition-shadow focus-within:border-primary/40"
                  style={{ boxShadow: "var(--e-float)" }}
                >
                  {/* Figma "Input box" (7:2876): + · field · mic (rest) or send (active) */}
                  <button
                    type="button"
                    onClick={() => setAttachOpen((v) => !v)}
                    aria-label="Add photo or moodboard"
                    className="w-11 h-11 rounded-full flex items-center justify-center text-primary hover:bg-inset active:scale-95 transition-all cursor-pointer shrink-0"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 18 18"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="1.4"
                      strokeLinecap="round"
                      aria-hidden="true"
                    >
                      <path d="M9 2v14M2 9h14" />
                    </svg>
                  </button>

                  <input
                    id="aura-ask"
                    ref={inputRef}
                    type="text"
                    value={inputVal}
                    onChange={(e) => setInputVal(e.target.value)}
                    placeholder="Ask me anything"
                    aria-label="Ask Aura anything"
                    className="flex-1 bg-transparent text-ink placeholder:text-muted text-[14px] leading-[19px] font-sans focus:outline-none py-1.5 pr-1 min-w-0"
                  />

                  {inputVal.trim() ? (
                    <button
                      type="submit"
                      aria-label="Send query to Aura"
                      className="w-11 h-11 rounded-full bg-primary hover:bg-primary/90 active:scale-95 flex items-center justify-center transition-all cursor-pointer shrink-0"
                    >
                      <img
                        src="images/input-box/icon-send-arrow.svg"
                        width="23"
                        height="24"
                        alt=""
                      />
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleMic}
                      aria-label={isListening ? "Stop voice input" : "Start voice input"}
                      className={`w-11 h-11 rounded-full flex items-center justify-center transition-all cursor-pointer shrink-0 ${
                        isListening
                          ? "bg-primary aura-listening"
                          : "bg-inset hover:bg-hairline active:scale-95"
                      }`}
                    >
                      <img
                        src="images/input-box/icon-mic.svg"
                        width="23.5517"
                        height="24.75"
                        alt=""
                        style={isListening ? { filter: "brightness(0) invert(1)" } : undefined}
                      />
                    </button>
                  )}
                </form>
              </div>
              {/* ---------- Calendar sheet ---------- */}
              <Overlay
                open={calendarOpen}
                onClose={() => setCalendarOpen(false)}
                labelledBy="calendar-sheet-title"
              >
                <CalendarSheet
                  events={events}
                  onClose={() => setCalendarOpen(false)}
                  onAddDate={(name, date) => {
                    addOwnDate(name, date);
                    setEvents(upcomingEvents());
                  }}
                  onPick={(e) => {
                    setCalendarOpen(false);
                    startEventChat(e);
                  }}
                />
              </Overlay>

              {/* ---------- More occasions sheet ---------- */}
              <Overlay
                open={moreOpen}
                onClose={() => setMoreOpen(false)}
                labelledBy="more-sheet-title"
              >
                <div className="bg-card w-full rounded-t-3xl px-5 pt-4 pb-6 border-t border-hairline shadow-2xl aura-sheet-up">
                  <div
                    className="w-10 h-1 rounded-full bg-hairline mx-auto mb-4"
                    aria-hidden="true"
                  />
                  <div className="flex items-start justify-between pb-3 border-b border-hairline">
                    <div>
                      <h2
                        id="more-sheet-title"
                        className="text-[22px] font-semibold text-ink leading-tight tracking-[-0.01em]"
                      >
                        More occasions
                      </h2>
                      <p className="text-[12.5px] text-muted leading-snug mt-1">
                        Pick one to load a starting brief — you can edit every word.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setMoreOpen(false)}
                      aria-label="Close more occasions"
                      className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                      </svg>
                    </button>
                  </div>

                  <ul className="divide-y divide-hairline">
                    {MORE_OCCASIONS.map((o) => (
                      <li key={o.id}>
                        <button
                          type="button"
                          onClick={() => {
                            setMoreOpen(false);
                            loadPrompt(o.prompt, o.label);
                          }}
                          className="w-full min-h-[56px] py-3 flex items-center justify-between gap-3 text-left hover:bg-inset/60 active:bg-inset transition-colors rounded-lg px-1"
                        >
                          <span className="text-[14.5px] text-ink font-medium">{o.label}</span>
                          <span className="flex items-center gap-2 shrink-0">
                            <span className="text-[12.5px] text-muted">{o.lead}</span>
                            <svg
                              width="15"
                              height="15"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              strokeWidth="2"
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              className="text-muted"
                              aria-hidden="true"
                              focusable="false"
                            >
                              <path d="m9 18 6-6-6-6" />
                            </svg>
                          </span>
                        </button>
                      </li>
                    ))}
                  </ul>

                  <p className="text-[11.5px] text-muted text-center mt-4">
                    Lead times shown for {activeCountry.flag} {activeCountry.symbol} delivery
                  </p>
                </div>
              </Overlay>

              {/* ---------- Family collection modal sheet ---------- */}
              <Overlay
                open={Boolean(openFamilyCollection)}
                onClose={() => setOpenFamilyCollection(null)}
                labelledBy="family-modal-title"
              >
                {openFamilyCollection && (
                  <FamilyCollectionModal
                    collection={openFamilyCollection}
                    activeCountry={activeCountry}
                    onClose={() => setOpenFamilyCollection(null)}
                    onCommission={(col, garment) => {
                      setOpenFamilyCollection(null);
                      const prompt = garment
                        ? `Tell me about the ${garment.garment} (${garment.role}) from the ${col.title} family collection.`
                        : `I'd like to commission the ${col.title} family collection for ${col.members.length} members. Theme: ${col.theme}.`;
                      showToast("Opening your stylist conversation…");
                      setTimeout(() => {
                        window.location.href =
                          "conversation.html?prompt=" +
                          encodeURIComponent(prompt) +
                          "&piece=" +
                          encodeURIComponent(col.id) +
                          "&ship=" +
                          encodeURIComponent(activeCountry.code);
                      }, 400);
                    }}
                  />
                )}
              </Overlay>

              {/* ---------- Chat history drawer (left) ---------- */}
              <Overlay
                open={historyOpen}
                onClose={() => setHistoryOpen(false)}
                labelledBy="history-title"
                align="start"
              >
                <div className="bg-card w-4/5 max-w-xs h-full flex flex-col border-r border-hairline shadow-2xl drawer-slide-in-left">
                  <div className="shrink-0 flex items-start justify-between gap-2 px-5 pt-5 pb-3 border-b border-hairline">
                    <div className="min-w-0">
                      <h2
                        id="history-title"
                        className="font-display text-[22px] text-ink leading-tight"
                      >
                        Your conversations
                      </h2>
                      <p className="text-[11.5px] text-muted leading-snug mt-0.5">
                        {chatLog.length
                          ? "Pick one up where you left it."
                          : "Briefs you start will be listed here."}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setHistoryOpen(false)}
                      aria-label="Close conversation history"
                      className="w-11 h-11 -mr-2 -mt-2 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                      </svg>
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto px-2 py-2">
                    {chatLog.length === 0 ? (
                      <p className="px-3 py-8 text-[13px] text-muted leading-relaxed text-center">
                        No conversations yet. Tell Aura about an occasion and it will appear here.
                      </p>
                    ) : (
                      <ul className="space-y-0.5">
                        {chatLog.map((chat) => (
                          <li key={chat.id}>
                            <button
                              type="button"
                              onClick={() => openChat(chat)}
                              className="w-full text-left px-3 py-2.5 min-h-[56px] rounded-xl hover:bg-inset active:scale-[0.99] transition-colors"
                            >
                              <span className="flex items-baseline justify-between gap-3">
                                <span className="text-[13.5px] font-medium text-ink truncate">
                                  {deriveChatTitle(chat.prompt)}
                                </span>
                                <span className="font-mono text-[10.5px] text-muted shrink-0">
                                  {formatChatTime(chat.at)}
                                </span>
                              </span>
                              <span className="block text-[11.5px] text-muted leading-snug mt-0.5 line-clamp-2">
                                {chat.prompt}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>

                  {chatLog.length > 0 && (
                    <div className="shrink-0 px-5 py-3 border-t border-hairline">
                      <button
                        type="button"
                        onClick={() => {
                          clearChatLog();
                          setChatLog([]);
                          showToast("Conversation history cleared");
                        }}
                        className="min-h-[44px] -my-1 text-[12px] text-muted hover:text-ink transition-colors"
                      >
                        Clear history
                      </button>
                    </div>
                  )}
                </div>
              </Overlay>
              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <AuraDrawer
                  active="home"
                  countries={SHIP_TO_COUNTRIES}
                  current={activeCountry}
                  onPickCountry={(c) => {
                    setActiveCountry(c);
                    showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                  }}
                  onClose={() => setDrawerOpen(false)}
                />
              </Overlay>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
