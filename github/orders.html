<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE7" />
    <title>Aura — Orders</title>
    <meta
      name="description"
      content="Your Aura orders — live production tracking, delivery, returns, alterations and group commissions."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
              success: "rgb(var(--success-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        /* Aura / Iteration 2 / Colors — Figma node 110:5432. */
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;
        --success-rgb: 63 122 75; /* Figma status/success #3F7A4B */

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-1,
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 {
        -webkit-line-clamp: 1;
      }
      .line-clamp-2 {
        -webkit-line-clamp: 2;
      }

      @keyframes auraPing {
        0% { transform: scale(1); opacity: 0.6; }
        75%, 100% { transform: scale(2.4); opacity: 0; }
      }
      .aura-ping {
        animation: auraPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
      /* ---- Overlay motion: the scrim fades on its own, panels only move.
         Transform-only animation stays on the compositor, so the slide is
         smooth; closing plays the same motion in reverse before unmount. */
      html {
        scrollbar-gutter: stable;
      }
      .drawer-slide-in {
        animation: auraDrawerIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      .aura-scrim {
        animation: auraScrimIn 0.3s ease-out both;
      }
      .aura-leaving {
        pointer-events: none;
      }
      .aura-leaving .aura-scrim {
        animation: auraScrimOut 0.26s ease-in both;
      }
      .aura-leaving .drawer-slide-in {
        animation: auraDrawerOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .drawer-slide-in-left {
        animation: auraDrawerOutLeft 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .aura-sheet-up {
        animation: auraSheetOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraDrawerIn {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes auraDrawerOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }
      @keyframes auraDrawerOutLeft {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-100%, 0, 0);
        }
      }
      @keyframes auraSheetOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 100%, 0);
        }
      }
      @keyframes auraScrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes auraScrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer-slide-in,
        .aura-scrim,
        .aura-leaving .aura-scrim,
        .aura-leaving .drawer-slide-in,
        .aura-leaving .drawer-slide-in-left,
        .aura-leaving .aura-sheet-up {
          animation-duration: 1ms;
        }
      }

      /* Compact editorial order list, shared with the mobile reference. */
      .orders-list { padding: 8px 16px 88px; }
      .orders-list section { margin-bottom: 22px; }
      .orders-list .section-title { margin-bottom: 8px; }
      .orders-list .section-title h2 { font-size: 25px; }
      .orders-list .section-title span { font-size: 9px; color: rgb(var(--muted-rgb)); }
      .orders-list section:nth-of-type(-n+2) .section-title h2 { font-style: normal; font-size: 21px; }
      .order-card { gap: 14px; padding: 8px; border: 1px solid rgb(var(--hairline-rgb)); border-radius: 16px; background: rgb(var(--card-rgb)); }
      .order-card > .order-thumb { width: 23%; min-height: 0; height: 104px; border-radius: 10px; }
      .order-card > .order-content { padding: 4px 5px 3px 0; }
      .order-card .order-title { gap: 6px; }
      .order-card .order-title > :first-child { font-size: 18px; white-space: normal; }
      .order-card .order-title > :last-child { font-size: 9px; color: rgb(var(--muted-rgb)); }
      .order-card .order-content > .text-\[12px\], .order-card .order-content > .text-\[12\.5px\], .order-card .order-content > .text-\[11\.5px\] { font-size: 11px; }
      .order-card .order-content > .font-mono { font-size: 9px; }
      .order-card .order-content > p:last-child { padding-right: 12px; }
      .order-card > svg { right: 10px; bottom: 13px; width: 14px; }
      #prod-title { font-style: normal; }
      [aria-labelledby="prod-title"] .order-thumb { height: 140px; }
      .stage-track { margin-top: 13px; }
      .stage-track > p { font-size: 9px; margin-top: 7px; }
      .stage-track > div > span { height: 5px; }
      .orders-list .arrow-link { font-size: 11px; min-height: 32px; margin-top: 3px; margin-bottom: -4px; font-weight: 400; }
      .group-card { border: 1px solid rgb(var(--hairline-rgb)); border-radius: 16px; background: rgb(var(--card-rgb)); overflow: hidden; }
      .group-summary { display: flex; align-items: center; gap: 14px; padding: 8px; border-bottom: 1px solid rgb(var(--hairline-rgb)); }
      .group-summary img { width: 23%; height: 74px; object-fit: cover; border-radius: 10px; }
      .group-summary > div { flex: 1; min-width: 0; }
      .group-summary p { font-size: 10px; color: rgb(var(--muted-rgb)); margin-top: 3px; }
      .group-summary .order-title > :first-child { font-size: 18px; }
      .group-summary .order-title > :last-child { font-size: 9px; color: rgb(var(--muted-rgb)); }
      .group-member { gap: 12px; padding: 12px; }
      .group-member > span:first-child { width: 39px; height: 39px; font-size: 16px; }
      .group-member .member-name { font-size: 16px; }
      .group-member .member-piece { font-size: 10px; }
      .group-member .member-state { font-size: 8px; letter-spacing: .02em; padding: 3px 9px; }
      .group-member > svg { width: 13px; color: rgb(var(--muted-rgb)); }
      .group-footer { padding: 9px 12px; gap: 14px; background: rgb(var(--inset-rgb)); }
      .group-footer > svg { width: 42px; height: 44px; }
      .group-footer > span { font-size: 10px; }
      [aria-labelledby="ret-title"] .order-thumb { height: 65px; }
      @media (max-width: 370px) {
        .orders-list { padding-left: 12px; padding-right: 12px; }
        .order-card { gap: 11px; padding: 7px; border-radius: 14px; }
        .order-card > .order-thumb { height: 82px; }
        [aria-labelledby="prod-title"] .order-thumb { height: 112px; }
        .order-card .order-title > :first-child, .group-summary .order-title > :first-child { font-size: 15px; }
        .order-card .order-title > :last-child { font-size: 7px; }
        .order-card .order-content > .text-\[12px\], .order-card .order-content > .text-\[12\.5px\], .order-card .order-content > .text-\[11\.5px\] { font-size: 9px; }
        .order-card .order-content > .font-mono, .stage-track > p { font-size: 7.5px; }
        .stage-track { margin-top: 10px; }
        .stage-track > div > span { height: 4px; }
        .orders-list .arrow-link { font-size: 10px; }
        .group-member { gap: 10px; padding: 9px 10px; }
        .group-member > span:first-child { width: 32px; height: 32px; }
        .group-member .member-name { font-size: 13px; }
        .group-member .member-piece { font-size: 9px; }
        .group-member .member-state { font-size: 7px; padding: 3px 7px; }
        [aria-labelledby="ret-title"] .order-thumb { height: 54px; }
      }


      /* Production cards: proportions follow the supplied mobile reference. */
      .production-section { container-type: inline-size; }
      .orders-list .production-section .section-title { margin-bottom: 8px; }
      .orders-list .production-section .section-title h2 { font-size: clamp(17px, 5.25cqw, 21px); }
      .orders-list .production-section .section-title > span { font-size: clamp(7px, 2.2cqw, 9px); }
      .production-cards { display: grid; gap: 7px; }
      .production-card {
        position: relative; display: grid; grid-template-columns: 23.5% minmax(0, 1fr);
        gap: 3.8%; width: 100%; padding: 2%; text-align: left; cursor: pointer;
        color: rgb(var(--ink-rgb)); border: 1px solid rgb(var(--hairline-rgb)); border-radius: 15px;
        background: rgb(var(--card-rgb)); transition: background .18s, border-color .18s;
      }
      .production-card:hover { background: rgb(var(--sel-fill-rgb)); border-color: rgb(var(--primary-rgb)); }
      .production-card:focus-visible { outline: 2px solid rgb(var(--primary-rgb)); outline-offset: 3px; }
      .production-photo { display: block; width: 100%; height: 100%; min-height: 35cqw; object-fit: cover; border-radius: 9px; }
      .production-details { min-width: 0; padding: 1.3cqw 1.3cqw 1cqw 0; }
      .production-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 5px; }
      .production-name { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(14px, 4.5cqw, 18px); line-height: 1.15; }
      .production-id { flex: none; font-family: 'DM Mono', monospace; font-size: clamp(6px, 2cqw, 8px); color: rgb(var(--muted-rgb)); }
      .production-craft { display: block; margin-top: 2px; font-size: clamp(8px, 2.6cqw, 10.5px); line-height: 1.35; color: rgb(var(--muted-rgb)); }
      .production-card .stage-track { display: block; margin-top: 3.1cqw; }
      .production-card .stage-track > div { gap: 3px; }
      .production-card .stage-track > div > span { height: 4px; background: rgb(var(--hairline-rgb)); }
      .production-card .stage-track > div > span.bg-primary { background: rgb(var(--primary-rgb)); }
      .production-card .stage-track > div > span.bg-primary\/60 { background: rgb(var(--primary-rgb) / 0.6); }
      .production-card .stage-track > p { margin-top: 6px; gap: 5px; font-size: clamp(7px, 2.25cqw, 9px); line-height: 1.35; color: rgb(var(--muted-rgb)); }
      .production-card .stage-track > p > span { width: 4px; height: 4px; }
      .production-card .stage-track > p > span > span { width: 4px; height: 4px; background: rgb(var(--primary-rgb)); }
      .production-card .aura-ping { display: none; }
      .production-note { display: block; margin-top: 2.2cqw; color: rgb(var(--muted-rgb)); font-size: clamp(8px, 2.65cqw, 10.5px); line-height: 1.45; }
      .production-footer { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 2.1cqw; }
      .production-artisan { font-family: 'DM Mono', monospace; font-size: clamp(6px, 2.1cqw, 8.5px); line-height: 1.4; letter-spacing: .02em; color: rgb(var(--muted-rgb)); }
      .production-footer svg { width: 13px; height: 13px; color: rgb(var(--primary-rgb)); }

    </style>
    <style id="aura-sheet-motion">
      /* ---- Bottom sheets move like the side drawer ----
         The sheet slides on the same curve and timing as the nav drawer,
         and only the backdrop fades, never the sheet, so opening reads as
         a panel arriving rather than the screen reloading. Closing plays
         it in reverse (see the script at the end of the body). Placed last
         in <head> so it wins over each page's older sheet timing. */
      .aura-sheet-up {
        animation: auraSheetIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      @keyframes auraSheetIn {
        from { transform: translate3d(0, 100%, 0); }
        to { transform: translate3d(0, 0, 0); }
      }
      /* The overlay that holds a sheet fades its backdrop colour only. */
      .aura-fade-in:has(.aura-sheet-up) {
        animation: auraScrimBgIn 0.3s ease-out both;
      }
      @keyframes auraScrimBgIn {
        from { background-color: transparent; }
      }
      /* A closed sheet's stand-in, playing the exit before it is removed. */
      .aura-sheet-ghost.aura-sheet-ghost {
        pointer-events: none;
        animation: auraScrimBgOut 0.26s ease-in both;
      }
      .aura-sheet-ghost .aura-sheet-up,
      .aura-sheet-ghost.aura-sheet-up {
        animation: auraSheetGhostOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraScrimBgOut {
        to { background-color: transparent; }
      }
      @keyframes auraSheetGhostOut {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(0, 100%, 0); }
      }

/* ===================================================================
       WISHLIST
       Saved pieces, shared by every surface that shows a garment — the
       suggestion cards, the list rows and the detail sheet. Kept in
       localStorage so a heart tapped on Discover is still filled when the
       same piece turns up in a conversation.

       Storage is best-effort: a private window or blocked site data throws,
       and the hearts simply behave as an unsaved session.
       =================================================================== */
const WISHLIST_KEY = "aura.wishlist";

function readWishlist() {
  try {
    const raw = window.localStorage.getItem(WISHLIST_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.filter((x) => typeof x === "string")
      : [];
  } catch (e) {
    return [];
  }
}

function writeWishlist(ids) {
  try {
    window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
  } catch (e) {
    /* saving is a convenience, never a blocker */
  }
}

// One source of truth per screen, so a heart tapped on a card updates
// the sheet sitting on top of it and vice versa.
function useWishlist() {
  const [ids, setIds] = useState(readWishlist);

  const toggle = useCallback((id) => {
    if (!id) return;
    setIds((cur) => {
      const next =
        cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
      writeWishlist(next);
      return next;
    });
  }, []);

  // Another tab, or a return trip through the back button.
  useEffect(() => {
    const sync = (e) => {
      if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
    };
    window.addEventListener("storage", sync);
    window.addEventListener("pageshow", sync);
    return () => {
      window.removeEventListener("storage", sync);
      window.removeEventListener("pageshow", sync);
    };
  }, []);

  return {
    ids,
    saved: (id) => ids.indexOf(id) !== -1,
    toggle,
  };
}

/* `tone="overlay"` sits on a photograph; `tone="plain"` on a light
         surface. Saved flips to a filled plum heart on white either way. */
function HeartButton({ saved, onToggle, name, tone, className }) {
  const overlay = tone !== "plain";
  const base =
    "shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-90";
  const skin = saved
    ? "bg-card text-primary shadow-sm border border-hairline"
    : overlay
      ? "bg-black/35 text-white border border-white/25 hover:bg-black/55"
      : "bg-card text-muted border border-hairline hover:text-primary hover:border-primary/45";

  return (
    <button
      type="button"
      aria-pressed={saved}
      aria-label={
        saved
          ? `Remove ${name} from your wishlist`
          : `Save ${name} to your wishlist`
      }
      onClick={(e) => {
        // Cards are buttons themselves; never open the sheet from here.
        e.preventDefault();
        e.stopPropagation();
        onToggle();
      }}
      className={`${base} ${skin} ${className || ""}`}
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill={saved ? "currentColor" : "none"}
        stroke="currentColor"
        strokeWidth={saved ? 0 : 1.9}
        strokeLinecap="round"
        strokeLinejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 20.5 3.9 12.6a5 5 0 0 1 7.1-7.1l1 1 1-1a5 5 0 0 1 7.1 7.1Z" />
      </svg>
    </button>
  );
}

                     COMPONENT: OVERLAY — same contract as the home screen's drawer.
                     Escape to close, background scroll lock, focus moved in on open
                     and restored to the trigger on close, focus kept inside while open.
                     =================================================================== */
            function Overlay({ open, onClose, labelledBy, align, children }) {
              const panelRef = useRef(null);
              const restoreRef = useRef(null);
              // Stays mounted briefly after closing so the panel can move back out.
              const [shown, setShown] = useState(open);
              useEffect(() => {
                if (open) {
                  setShown(true);
                  return;
                }
                const t = setTimeout(() => setShown(false), 260);
                return () => clearTimeout(t);
              }, [open]);

              useEffect(() => {
                if (!open) return;

                restoreRef.current = document.activeElement;
                document.body.classList.add("aura-locked");

                const panel = panelRef.current;
                const focusables = () =>
                  Array.from(
                    panel.querySelectorAll(
                      'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
                    )
                  ).filter((el) => el.offsetParent !== null);

                const first = focusables()[0];
                if (first) first.focus({ preventScroll: true });
                else panel.focus({ preventScroll: true });

                const onKeyDown = (e) => {
                  if (e.key === "Escape") {
                    e.stopPropagation();
                    onClose();
                    return;
                  }
                  if (e.key !== "Tab") return;
                  const items = focusables();
                  if (items.length === 0) return;
                  const firstEl = items[0];
                  const lastEl = items[items.length - 1];
                  if (e.shiftKey && document.activeElement === firstEl) {
                    e.preventDefault();
                    lastEl.focus();
                  } else if (!e.shiftKey && document.activeElement === lastEl) {
                    e.preventDefault();
                    firstEl.focus();
                  }
                };

                document.addEventListener("keydown", onKeyDown, true);
                return () => {
                  document.removeEventListener("keydown", onKeyDown, true);
                  document.body.classList.remove("aura-locked");
                  const restore = restoreRef.current;
                  if (restore && typeof restore.focus === "function") restore.focus({ preventScroll: true });
                };
              }, [open, onClose]);

              if (!open && !shown) return null;

              return (
                <div
                  className={`absolute inset-0 z-50 flex ${open ? "" : "aura-leaving "}${align === "end" ? "justify-end" : "items-end justify-center"}`}
                  onMouseDown={(e) => {
                    if (e.target === e.currentTarget) onClose();
                  }}
                >
                  <div
                    className="aura-scrim absolute inset-0 -z-10"
                    style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)" }}
                    onMouseDown={onClose}
                    aria-hidden="true"
                  />
                  <div
                    ref={panelRef}
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby={labelledBy}
                    tabIndex={-1}
                    className="focus:outline-none contents"
                  >
                    {children}
                  </div>
                </div>
              );

    const raw = window.localStorage.getItem(REVIEW_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function useStageReviews() {
  const [map, setMap] = useState(readReviews);

  const set = useCallback((orderId, stage, verdict, note) => {
    setMap((cur) => {
      const next = {
        ...cur,
        [orderId + ":" + stage]: {
          verdict,
          note: note || "",
          at: new Date().toLocaleDateString(undefined, { day: "numeric", month: "short" }),
          status: verdict === "concern" ? "pending" : undefined,
        },
      };
      try {
        window.localStorage.setItem(REVIEW_KEY, JSON.stringify(next));
      } catch (e) {
        /* a verdict that cannot be stored still shows for this session */
      }
      return next;
    });
  }, []);

  return {
    map,
    get: (orderId, stage) => map[orderId + ":" + stage] || null,
    set,
  };
}

function StageShot({ order, entry, label, className }) {
  const [failed, setFailed] = useState(false);
  const src = entry.image;

  if (failed || !src) {
    return (
      <span
        className={className}
        role="img"
        aria-label={`${label} — no photograph for this stage`}
        style={{
          background: `linear-gradient(150deg, ${order.swatch[0]} 0%, ${order.swatch[2]} 55%, ${order.swatch[1]} 100%)`,
        }}
      />
    );
  }
  return (
    <img
      src={src}
      alt={`${order.name} — ${label}`}
      loading="lazy"
      onError={() => setFailed(true)}
      className={`${className} object-cover`}
      draggable="false"
    />
  );
}

function StageReviewSheet({ order, reviews, onVerdict, onMessage, onClose }) {
  const entries = order.log || [];
  const trackRef = useRef(null);
  const panelRef = useRef(null);
  const restoreRef = useRef(null);
  const [slide, setSlide] = useState(Math.max(0, entries.length - 1));
  const [concern, setConcern] = useState(false);
  const [text, setText] = useState("");

  useEffect(() => {
    restoreRef.current = document.activeElement;
    document.body.classList.add("aura-locked");
    const onKey = (e) => {
      if (e.key === "Escape") {
        e.stopPropagation();
        onClose();
      }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      document.removeEventListener("keydown", onKey, true);
      document.body.classList.remove("aura-locked");
      const r = restoreRef.current;
      if (r && typeof r.focus === "function") r.focus();
    };
  }, [onClose]);

  // Open on the newest stage rather than the oldest. Wait a frame — at mount
  // the slides have no width yet, so offsetLeft is still 0.
  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    const id = requestAnimationFrame(() => {
      const child = el.children[slide];
      if (child) el.scrollLeft = child.offsetLeft - el.offsetLeft;
    });
    return () => cancelAnimationFrame(id);
  }, []);

  const onScroll = () => {
    const el = trackRef.current;
    if (!el) return;
    const i = Math.round(el.scrollLeft / el.clientWidth);
    if (i !== slide) {
      setSlide(Math.max(0, Math.min(entries.length - 1, i)));
      setConcern(false);
    }
  };

  const goTo = (i) => {
    const el = trackRef.current;
    const child = el && el.children[i];
    if (!el || !child) return;
    setSlide(i);
    setConcern(false);
    el.scrollTo({ left: child.offsetLeft - el.offsetLeft, behavior: "smooth" });
  };

  const entry = entries[slide] || {};
  const label = STAGES[slide] || "Stage";
  const verdict = reviews.get(order.id, slide);
  const approved = verdict && verdict.verdict === "approved";
  // Yours, raised on this device, or one already on the order.
  const raised =
    verdict && verdict.verdict === "concern"
      ? verdict
      : entry.concern || null;

  const send = () => {
    const note = text.trim();
    if (!note) return;
    onVerdict(order.id, slide, "concern", note);
    setConcern(false);
    setText("");
  };

  return (
    <div
      className="absolute inset-0 z-50 aura-fade-in"
      style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div
        ref={panelRef}
        role="dialog"
        aria-modal="true"
        aria-labelledby="stage-sheet-title"
        tabIndex={-1}
        className="absolute inset-x-0 bottom-0 h-[92%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
      >
        <div className="relative shrink-0 pt-2.5 pb-2.5">
          <span
            className="block w-10 h-1 rounded-full bg-hairline mx-auto"
            aria-hidden="true"
          />
          <button
            type="button"
            onClick={onClose}
            aria-label="Close stage photographs"
            className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div className="flex-1 overflow-y-auto thread-scroll">
          <div className="px-5 pb-3">
            <h2
              id="stage-sheet-title"
              className="font-display text-[24px] text-ink leading-tight"
            >
              {order.name}
            </h2>
            <p className="font-mono text-[10.5px] text-muted mt-1">
              {order.id} · {order.artisan}
            </p>
          </div>

          {/* One photograph per stage reached. */}
          <div
            ref={trackRef}
            onScroll={onScroll}
            className="flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
            role="group"
            aria-label={`${order.name} stage photographs`}
            tabIndex={0}
            onKeyDown={(e) => {
              if (e.key === "ArrowRight") {
                e.preventDefault();
                goTo(Math.min(entries.length - 1, slide + 1));
              } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                goTo(Math.max(0, slide - 1));
              }
            }}
          >
            {entries.map((en, i) => {
              const v = reviews.get(order.id, i);
              return (
                <div key={i} className="snap-center shrink-0 w-full px-5">
                  <div className="relative w-full h-[38vh] rounded-2xl overflow-hidden bg-inset border border-hairline">
                    <StageShot
                      order={order}
                      entry={en}
                      label={STAGES[i]}
                      className="block w-full h-full"
                    />
                    <span className="absolute bottom-3 left-3 text-[12px] font-medium text-white bg-black/55 px-3 py-1.5 rounded-full">
                      {i + 1}. {STAGES[i]}
                    </span>
                    {v && v.verdict && (
                      <span
                        className={`absolute top-3 right-3 font-mono text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-full ${
                          v.verdict === "approved"
                            ? "bg-card text-primary"
                            : "bg-goldtext text-canvas"
                        }`}
                      >
                        {v.verdict === "approved"
                          ? "Approved"
                          : "Concern raised"}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Dots */}
          <div className="flex items-center justify-center gap-1.5 mt-3 px-5 flex-wrap">
            {entries.map((en, i) => {
              const v = reviews.get(order.id, i);
              return (
                <button
                  key={i}
                  type="button"
                  onClick={() => goTo(i)}
                  aria-label={`Show stage ${i + 1}, ${STAGES[i]}`}
                  aria-current={i === slide}
                  className="w-8 h-8 flex items-center justify-center"
                >
                  <span
                    className={`block rounded-full transition-all ${
                      i === slide ? "w-5 h-1.5" : "w-1.5 h-1.5"
                    } ${
                      (v && v.verdict === "concern") || en.concern
                        ? "bg-goldtext"
                        : i === slide
                          ? "bg-primary"
                          : "bg-hairline"
                    }`}
                  />
                </button>
              );
            })}
          </div>

          <div className="px-5 pb-5">
            <p className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-1">
              {STAGES[slide]} · {entry.at}
            </p>
            <p className="text-[13.5px] text-ink leading-relaxed mt-1.5">
              {entry.note}
            </p>

            {raised && (
              <div className="mt-3.5 rounded-2xl border border-hairline bg-inset/50 p-3.5">
                <div className="flex items-center justify-between gap-3">
                  <span className="font-mono text-[10px] uppercase tracking-wider text-muted">
                    Your concern · {raised.at}
                  </span>
                  <span
                    className={`member-state shrink-0 font-mono text-[9.5px] uppercase tracking-wider px-2 py-0.5 rounded-full border ${
                      (CONCERN_STATUS[raised.status] || CONCERN_STATUS.pending).tone
                    }`}
                    style={
                      raised.status === "done"
                        ? { color: "rgb(var(--success-rgb))", borderColor: "rgb(var(--success-rgb) / 0.45)" }
                        : undefined
                    }
                  >
                    {(CONCERN_STATUS[raised.status] || CONCERN_STATUS.pending).label}
                  </span>
                </div>

                <p className="text-[13px] text-ink leading-relaxed mt-2">“{raised.note}”</p>

                {raised.reply ? (
                  <p className="text-[12px] text-muted leading-snug mt-2.5">
                    Meera: {raised.reply}
                  </p>
                ) : (
                  <p className="text-[11.5px] text-muted leading-snug mt-2.5">
                    Nothing moves on until this is answered.
                  </p>
                )}

                {/* Carries the order, the stage and the concern into the
                    stylist thread so the conversation starts in context. */}
                <button
                  type="button"
                  onClick={() => onMessage(order, slide, raised)}
                  className="mt-3 min-h-[40px] px-3.5 rounded-full bg-card border border-ctrl text-ink text-[12px] font-medium flex items-center gap-1.5 hover:bg-inset hover:border-primary/45 active:scale-95 transition-all"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.9"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                  </svg>
                  Message Meera about this
                </button>
              </div>
            )}

            <p className="text-[11px] text-muted leading-relaxed mt-4">
              Nothing moves to the next stage while a concern is open. Approving
              the final stage releases the piece for dispatch.
            </p>
          </div>
        </div>

        {/* Fixed under the scroll area, so the controls stay put however long
            the stage note above them runs. */}
        <div className="shrink-0 border-t border-hairline bg-card px-5 pt-3.5 pb-5">
          {approved ? (
            <p
              className="flex items-center justify-center gap-2 min-h-[48px] text-[14px] font-medium"
              style={{ color: "rgb(var(--success-rgb))" }}
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2.4"
                strokeLinecap="round"
                strokeLinejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
              Approved
            </p>
          ) : concern ? (
            <div>
              <label
                htmlFor="concern-note"
                className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
              >
                What is wrong?
              </label>
              <textarea
                id="concern-note"
                rows={3}
                value={text}
                onChange={(e) => setText(e.target.value)}

                className="w-full px-3.5 py-3 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted resize-none focus:outline-none focus:border-primary transition-colors"
              />
              <div className="flex items-center gap-2.5 mt-2.5">
                <button
                  type="button"
                  onClick={() => {
                    setConcern(false);
                    setText("");
                  }}
                  className="min-h-[44px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13px] font-medium hover:bg-inset active:scale-95 transition-all"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  disabled={!text.trim()}
                  onClick={send}
                  className="flex-1 min-h-[44px] px-4 rounded-full bg-goldtext text-canvas text-[13.5px] font-medium hover:opacity-90 active:scale-95 transition-all disabled:opacity-40"
                >
                  Send to Meera
                </button>
              </div>
            </div>
          ) : (
            <div className="flex items-center gap-2.5">
              <button
                type="button"
                onClick={() => setConcern(true)}
                className="min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13px] font-medium hover:bg-inset active:scale-95 transition-all"
              >
                Raise a concern
              </button>
              <button
                type="button"
                onClick={() => onVerdict(order.id, slide, "approved")}
                className="flex-1 min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
              >
                Approve this stage
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                    <path d="M20.5603 10.189L13.0603 2.68899C12.779 2.4079 12.3977 2.25 12 2.25C11.6024 2.25 11.221 2.4079 10.9397 2.68899L3.4397 10.189C3.29973 10.3279 3.18878 10.4933 3.1133 10.6755C3.03782 10.8577 2.99931 11.053 3.00001 11.2502V20.2502C3.00001 20.4492 3.07903 20.6399 3.21968 20.7806C3.36033 20.9212 3.5511 21.0002 3.75001 21.0002H9.75001C9.94892 21.0002 10.1397 20.9212 10.2803 20.7806C10.421 20.6399 10.5 20.4492 10.5 20.2502V15.0002H13.5V20.2502C13.5 20.4492 13.579 20.6399 13.7197 20.7806C13.8603 20.9212 14.0511 21.0002 14.25 21.0002H20.25C20.4489 21.0002 20.6397 20.9212 20.7803 20.7806C20.921 20.6399 21 20.4492 21 20.2502V11.2502C21.0007 11.053 20.9622 10.8577 20.8867 10.6755C20.8112 10.4933 20.7003 10.3279 20.5603 10.189ZM19.5 19.5002H15V14.2502C15 14.0513 14.921 13.8606 14.7803 13.7199C14.6397 13.5793 14.4489 13.5002 14.25 13.5002H9.75001C9.5511 13.5002 9.36033 13.5793 9.21968 13.7199C9.07903 13.8606 9.00001 14.0513 9.00001 14.2502V19.5002H4.50001V11.2502L12 3.75024L19.5 11.2502V19.5002Z" />
                  </svg>
                  <span className="flex items-center gap-0.5">
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="m15 18-6-6 6-6" />
                    </svg>
                    <span className="text-[13.5px] font-medium">Back to chat</span>
                  </span>
                </a>

                <div className="min-w-0 flex-1 text-right pr-1">
                  <h1 className="font-display text-[20px] text-primary leading-tight truncate">
                    Orders
                  </h1>
                </div>

                <button
                  type="button"
                  onClick={() => setDrawerOpen(true)}
                  aria-label="Open navigation menu"
                  aria-haspopup="dialog"
                  aria-expanded={drawerOpen}
                  className="w-11 h-11 -mr-2 rounded-lg flex items-center justify-center text-ink hover:text-primary active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="22"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.1"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line x1="3" y1="7" x2="21" y2="7" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="17" x2="21" y2="17" />
                  </svg>
                </button>
              </header>

              <div className="thread-scroll orders-list">
                {/* ---------- Live production tracker ---------- */}
                <section className="production-section mb-7" aria-labelledby="prod-title">
                  <SectionTitle id="prod-title" count={`${PRODUCTION.length} in progress`}>
                    In production
                  </SectionTitle>

                  <div className="production-cards">
                    {PRODUCTION.map((o) => (
                      <button
                        key={o.id}
                        type="button"
                        className="production-card"
                        onClick={() => setReviewing(o)}
                        aria-haspopup="dialog"
                        aria-label={`${o.name} — ${STAGES[o.stage]}, open stage photographs`}
                      >
                        <Thumb item={o} className="production-photo" />
                        <div className="production-details">
                          <span className="production-heading">
                            <span className="production-name">{o.name}</span>
                            <span className="production-id">{o.id}</span>
                          </span>
                          <span className="production-craft">{o.craft}</span>
                          <StageTrack stage={o.stage} />
                          <span className="production-note">{o.note}</span>
                          <span className="production-footer">
                            <span className="production-artisan">{o.artisan} · {o.eta}</span>
                            <Chevron />
                          </span>
                        </div>
                      </button>
                    ))}
                  </div>
                </section>

                {/* ---------- Group order ---------- */}
                <section className="mb-7" aria-labelledby="grp-title">
                  <SectionTitle id="grp-title" count="4 pieces">
                    Group order
                  </SectionTitle>

                  <div className="group-card">
                    <div className="group-summary">
                      <img src="images/blush_pastel_saree.jpg" alt="Blush silk and embroidered wedding fabrics" />
                      <div>
                        <OrderTitle name="Sister’s wedding trousseau" id="AUR-2480" />
                        <p>Lehenga · 2 Kurtas · Dupatta</p>
                        <p className="font-mono">{GROUP.when}</p>
                      </div>
                      <Chevron />
                    </div>
                    <ul className="divide-y divide-hairline">
                      {GROUP.members.slice(1).map((m, i) => (
                        <li key={m.name}>
                          <button
                            type="button"
                            onClick={() => showToast(`${m.name} · ${m.piece} — ${m.state}`)}
                            className="group-member w-full text-left flex items-center gap-3 px-4 py-3 hover:bg-inset/40 transition-colors"
                          >
                            <span
                              aria-hidden="true"
                              className={`shrink-0 w-11 h-11 rounded-full font-display text-[16px] flex items-center justify-center ${
                                AVATAR_TONE[i % AVATAR_TONE.length]
                              }`}
                            >
                              {initialsOf(m.name)}
                            </span>
                            <span className="min-w-0 flex-1">
                              <span className="member-name block font-display text-[17px] leading-tight text-ink truncate">
                                {m.name}
                              </span>
                              <span className="member-piece block text-[12px] text-muted truncate mt-0.5">
                                {m.piece}
                              </span>
                            </span>
                            <span
                              className={`shrink-0 font-mono text-[9.5px] uppercase tracking-wider px-2.5 py-1 rounded-full border ${
                                MEMBER_TONE[m.state] || "bg-inset text-muted border-hairline"
                              }`}
                            >
                              {m.state}
                            </span>
                            <Chevron />
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </section>

                {/* ---------- Delivery ---------- */}
                <section className="mb-7" aria-labelledby="del-title">
                  <SectionTitle id="del-title" count={`${DELIVERY.length} shipments`}>
                    Delivery
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {DELIVERY.map((d) => (
                      <OrderCard key={d.id} item={d}>
                        <OrderTitle name={d.name} id={d.id} />
                        <StatusLine status={d.status} />
                        <span className="block font-mono text-[10.5px] text-muted mt-1.5">
                          {d.courier} · {d.eta}
                        </span>
                        {d.duties && (
                          <span className="block text-[11.5px] text-muted leading-snug mt-1">
                            {d.duties}
                          </span>
                        )}
                        <ArrowLink onClick={() => showToast(`Tracking ${d.tracking} · ${d.courier}`)}>
                          Track this parcel
                        </ArrowLink>
                      </OrderCard>
                    ))}
                  </div>
                </section>

                {/* ---------- Returns ---------- */}
                <section className="mb-7" aria-labelledby="ret-title">
                  <SectionTitle id="ret-title" count={`${RETURNS.length} open`}>
                    Returns
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {RETURNS.map((r) => (
                      <OrderCard key={r.id} item={r}>
                        <OrderTitle name={r.name} id={r.id} />
                        <StatusLine status={r.status} muted={r.settled} />
                        <span className="block text-[11.5px] text-muted leading-snug mt-1">
                          {r.reason}
                        </span>
                        {!r.settled && (
                          <ArrowLink onClick={() => showToast(`Meera will pick up the return for ${r.name}`)}>
                            Start a return
                          </ArrowLink>
                        )}
                      </OrderCard>
                    ))}
                  </div>
                </section>

                {/* ---------- Alterations ---------- */}
                <section className="mb-7" aria-labelledby="alt-title">
                  <SectionTitle id="alt-title" count={`${ALTERATIONS.length} in hand`}>
                    Alterations
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {ALTERATIONS.map((a) => (
                      <OrderCard key={a.id} item={a}>
                        <OrderTitle name={a.name} id={a.id} />
                        <span className="block text-[12px] text-ink leading-snug mt-1">
                          {a.what}
                        </span>
                        <span className="block font-mono text-[10.5px] text-muted mt-1">
                          {a.status}
                        </span>
                        <span className="block text-[11px] text-goldtext leading-snug mt-1">
                          {a.credit}
                        </span>
                      </OrderCard>
                    ))}
                  </div>

                  <a
                    href="wardrobe.html"
                    className="block mt-2.5 min-h-[52px] rounded-3xl border border-dashed border-gold/60 text-[13px] font-medium text-ink flex items-center justify-center hover:bg-card/60 active:scale-[0.99] transition-all"
                  >
                    Use a credit on something you own
                  </a>
                </section>

                <p className="font-mono text-[10.5px] text-muted text-center pt-1">
                  Nothing is added at checkout
                </p>
              </div>

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <AuraDrawer
                  active="orders"
                  countries={SHIP_TO}
                  current={activeCountry}
                  onPickCountry={(c) => {
                    setActiveCountry(c);
                    showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                  }}
                  onClose={() => setDrawerOpen(false)}
                />
              </Overlay>

              {reviewing && (
                <StageReviewSheet
                  order={reviewing}
                  reviews={reviews}
                  onClose={() => setReviewing(null)}
                  onMessage={(order, stage, concern) => {
                    const lines = [
                      `${order.name} (${order.id}) — about the ${STAGES[stage]} stage.`,
                      `My concern: “${concern.note}”`,
                    ];
                    if (concern.reply) lines.push(`Meera replied: “${concern.reply}”`);
                    lines.push("Can we talk this through?");
                    window.location.href =
                      "conversation.html?prompt=" +
                      encodeURIComponent(lines.join("\n")) +
                      "&ship=" +
                      encodeURIComponent(activeCountry.code);
                  }}
                  onVerdict={(orderId, stage, verdict, note) => {
                    reviews.set(orderId, stage, verdict, note);
                    showToast(
                      verdict === "approved"
                        ? `${STAGES[stage]} approved — the piece moves on`
                        : `Concern sent to Meera — ${STAGES[stage]} is on hold`
                    );
                  }}
                />
              )}

              <a
                href="index.html"
                aria-label="Back to home"
                className="absolute bottom-7 right-4 w-14 h-14 rounded-full bg-primary text-onprimary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-all"
              >
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.9"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script id="aura-sheet-motion-exit">
      /* Sheets unmount the instant they close. So the exit can mirror the
         drawer's, a copy of the closed sheet stays for one short slide down
         while its backdrop fades, then goes. Overlays that already animate
         their own exit (class aura-leaving) are left alone. */
      (function () {
        if (!window.MutationObserver) return;
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        function isSheetOverlay(n) {
          if (!n || n.nodeType !== 1 || n.classList.contains("aura-leaving")) return false;
          if (n.classList.contains("aura-sheet-ghost")) return false;
          var holds = n.classList.contains("aura-sheet-up") || n.querySelector(".aura-sheet-up");
          if (!holds) return false;
          return (
            n.classList.contains("aura-sheet-up") ||
            n.classList.contains("aura-fade-in") ||
            /(^|\s)inset-0(\s|$)/.test(n.className || "")
          );
        }
        new MutationObserver(function (records) {
          if (reduce && reduce.matches) return;
          records.forEach(function (r) {
            if (!r.target.isConnected) return;
            r.removedNodes.forEach(function (n) {
              if (!isSheetOverlay(n)) return;
              var ghost = n.cloneNode(true);
              ghost.classList.add("aura-sheet-ghost");
              ghost.setAttribute("aria-hidden", "true");
              ghost.removeAttribute("id");
              ghost.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
              ghost.querySelectorAll("video").forEach(function (v) { v.remove(); });
              r.target.appendChild(ghost);
              setTimeout(function () { ghost.remove(); }, 300);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
