<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE7" />
    <title>Aura — Design</title>
    <meta
      name="description"
      content="Aura Discover — the catalogue of bespoke directions by garment category, with craft provenance and landed pricing."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-1,
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 {
        -webkit-line-clamp: 1;
      }
      .line-clamp-2 {
        -webkit-line-clamp: 2;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* Horizontal category rail without a scrollbar */
      .rail {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }

      /* Selected category ring — matching reference Figma 161:6334 */
      .cat-selected {
        box-shadow:
          0 0 3px 2px rgb(var(--gold-rgb) / 0.45),
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }

      /* Right-edge fade over the category rail */
      .rail-fade {
        background: linear-gradient(
          to left,
          rgb(var(--canvas-rgb)) 24%,
          rgb(var(--canvas-rgb) / 0.8) 65%,
          rgb(var(--canvas-rgb) / 0)
        );
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
      /* ---- Overlay motion: the scrim fades on its own, panels only move.
         Transform-only animation stays on the compositor, so the slide is
         smooth; closing plays the same motion in reverse before unmount. */
      html {
        scrollbar-gutter: stable;
      }
      .drawer-slide-in {
        animation: auraDrawerIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      .aura-scrim {
        animation: auraScrimIn 0.3s ease-out both;
      }
      .aura-leaving {
        pointer-events: none;
      }
      .aura-leaving .aura-scrim {
        animation: auraScrimOut 0.26s ease-in both;
      }
      .aura-leaving .drawer-slide-in {
        animation: auraDrawerOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .drawer-slide-in-left {
        animation: auraDrawerOutLeft 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .aura-sheet-up {
        animation: auraSheetOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraDrawerIn {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes auraDrawerOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }
      @keyframes auraDrawerOutLeft {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-100%, 0, 0);
        }
      }
      @keyframes auraSheetOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 100%, 0);
        }
      }
      @keyframes auraScrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes auraScrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer-slide-in,
        .aura-scrim,
        .aura-leaving .aura-scrim,
        .aura-leaving .drawer-slide-in,
        .aura-leaving .drawer-slide-in-left,
        .aura-leaving .aura-sheet-up {
          animation-duration: 1ms;
        }
      }
    </style>
    <style id="aura-sheet-motion">
      /* ---- Bottom sheets move like the side drawer ----
         The sheet slides on the same curve and timing as the nav drawer,
         and only the backdrop fades, never the sheet, so opening reads as
         a panel arriving rather than the screen reloading. Closing plays
         it in reverse (see the script at the end of the body). Placed last
         in <head> so it wins over each page's older sheet timing. */
      .aura-sheet-up {
        animation: auraSheetIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      @keyframes auraSheetIn {
        from { transform: translate3d(0, 100%, 0); }
        to { transform: translate3d(0, 0, 0); }
      }
      /* The overlay that holds a sheet fades its backdrop colour only. */
      .aura-fade-in:has(.aura-sheet-up) {
        animation: auraScrimBgIn 0.3s ease-out both;
      }
      @keyframes auraScrimBgIn {
        from { background-color: transparent; }
      }
      /* A closed sheet's stand-in, playing the exit before it is removed. */
      .aura-sheet-ghost.aura-sheet-ghost {
        pointer-events: none;
        animation: auraScrimBgOut 0.26s ease-in both;
      }
      .aura-sheet-ghost .aura-sheet-up,
      .aura-sheet-ghost.aura-sheet-up {
        animation: auraSheetGhostOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraScrimBgOut {
        to { background-color: transparent; }
      }
      @keyframes auraSheetGhostOut {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(0, 100%, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .aura-sheet-up,
        .aura-fade-in:has(.aura-sheet-up) { animation-duration: 1ms; }
      }
    </style>
<!-- aura-tab-transition:start -->
<style id="aura-tab-transition-style">
  /* ---- Drawer tab transition ----
         Picking a tab in the right drawer slides the drawer out, then the
         next page opens with its top bar held still while the content below
         crossfades into a skeleton; the skeleton dissolves once the real
         screen and its first images are ready. */
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(aura-topbar) {
    animation: none !important;
  }
  ::view-transition-old(aura-topbar),
  ::view-transition-new(aura-topbar) {
    animation-duration: 220ms !important;
    animation-timing-function: ease !important;
    mix-blend-mode: normal;
  }
  /* The old screen holds still underneath while the new one fades up over
     it, so the two never leave a see-through gap. */
  html,
  ::view-transition {
    background-color: rgb(243 239 231);
  }
  html:active-view-transition-type(aura-tab)::view-transition-old(root) {
    animation: none !important;
    opacity: 1;
  }
  html:active-view-transition-type(aura-tab)::view-transition-new(root) {
    animation: auraTabIn 300ms cubic-bezier(0.22, 1, 0.36, 1) both !important;
  }
  @keyframes auraTabIn {
    from {
      opacity: 0;
      transform: translate3d(0, 10px, 0);
    }
  }

  .aura-boot {
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    background: rgb(243 239 231);
    transition: opacity 320ms ease;
  }
  .aura-boot.is-done {
    opacity: 0;
    pointer-events: none;
  }
  .aura-boot-vp {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .aura-boot-top {
    view-transition-name: aura-topbar;
  }
  .aura-boot-body {
    flex: 1;
    min-height: 0;
    padding: 12px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sk {
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgb(30 27 46 / 0.07);
  }
  .sk::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(
      90deg,
      transparent,
      rgb(255 255 255 / 0.55),
      transparent
    );
    animation: auraShimmer 1.3s ease-in-out infinite;
  }
  @keyframes auraShimmer {
    to {
      transform: translateX(100%);
    }
  }
  .sk-t {
    height: 12px;
    border-radius: 6px;
  }
  .sk-h {
    height: 24px;
    border-radius: 8px;
  }
  .sk-o {
    border-radius: 9999px;
  }
  .sk-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  .sk-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .sk-card {
    flex-shrink: 0;
    border-radius: 16px;
    background: rgb(255 255 255 / 0.6);
    border: 1px solid rgb(229 223 213);
    padding: 12px;
  }
  .sk-f1 {
    flex: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .sk::after {
      animation: none;
      display: none;
    }
    .aura-boot {
      transition: none;
    }
    html:active-view-transition-type(aura-tab)::view-transition-old(root),
    html:active-view-transition-type(aura-tab)::view-transition-new(root) {
      animation: none !important;
    }
  }
</style>

<script id="aura-tab-transition-head">
  (function () {
    var KEY = "aura-drawer-nav";
    var arriving = false;
    try {
      arriving = !!sessionStorage.getItem(KEY);
      sessionStorage.removeItem(KEY);
    } catch (e) {}
    window.__auraTabArriving = arriving;
    window.__auraTabLeaving = false;

    // Only a drawer hop uses the transition; every other link behaves as before.
    window.addEventListener("pagereveal", function (e) {
      // A prerendered page ran the lines above before the hop, so read the
      // flag again now that it is being shown.
      if (!arriving) {
        try {
          if (sessionStorage.getItem(KEY)) {
            sessionStorage.removeItem(KEY);
            arriving = window.__auraTabArriving = true;
            if (window.__auraShowBoot) window.__auraShowBoot();
          }
        } catch (err) {}
      }
      if (!e.viewTransition) return;
      if (arriving) e.viewTransition.types.add("aura-tab");
      else if (true) e.viewTransition.skipTransition();
    });

    // Outgoing page: pin its top bar so it stays put across the hop. A trip
    // to Home (Home icon, back button, history.back) also leaves Home the
    // flag, so Home opens on its skeleton instead of a blank reload.
    window.addEventListener("pageswap", function (e) {
      var toHome = false;
      try {
        var a = e.activation;
        var u = new URL(a.entry.url, location.href);
        toHome =
          a.navigationType !== "reload" &&
          u.origin === location.origin &&
          /\/(index\.html)?$/.test(u.pathname);
      } catch (err) {}
      if (toHome) {
        try {
          sessionStorage.setItem(KEY, "1");
        } catch (err) {}
      }
      if (!e.viewTransition || !(window.__auraTabLeaving || toHome)) return;
      e.viewTransition.types.add("aura-tab");
      var bar =
        document.querySelector(".app-viewport > header") ||
        document.querySelector("#root header");
      if (bar) bar.style.viewTransitionName = "aura-topbar";
    });
  })();
</script>
<!-- aura-tab-transition:end -->

      /* ===================================================================
       WHERE "BACK" GOES
       Every screen is reachable from several others now — the drawer opens
       Discover from home, from a chat, from the wardrobe — so a hard-coded
       destination sends people somewhere they have never been. Read the page
       we actually arrived from and name it, so the control tells the truth.

       Falls back to the old fixed destination when there is no referrer to
       read: a bookmark, a typed URL, or a cross-origin arrival.
       =================================================================== */
      const BACK_LABELS = {
        "index.html": "home",
        "conversation.html": "chat",
        "discover.html": "Discover",
        "collection.html": "the collection",
        "wardrobe.html": "wardrobe",
        "orders.html": "orders",
        "profile.html": "profile",
      };

      /* The browser's own history is the one thing that is always right,
         and it works when the referrer does not — opening these files
         straight off disk (file://) sends no referrer at all. So history
         decides WHERE back goes; the referrer only decides what we CALL it,
         and we say plain "Back" when we cannot name the place. */
      const CAN_GO_BACK = (function () {
        try {
          return window.history.length > 1;
        } catch (e) {
          return false;
        }
      })();

      const BACK_FROM_REFERRER = (function () {
        try {
          const ref = document.referrer;
          if (!ref) return null;
          const u = new URL(ref);
          if (u.origin !== window.location.origin) return null;
          const file = u.pathname.split("/").pop() || "index.html";
          const here = window.location.pathname.split("/").pop() || "index.html";
          // A reload, or a jump within the same screen, is not a way back.
          if (file === here) return null;
          if (!BACK_LABELS[file]) return null;
          return { href: file, label: BACK_LABELS[file] };
        } catch (e) {
          return null;
        }
      })();

        // destination is all that is left, so name that.
        const named =
          BACK_FROM_REFERRER ||
          (CAN_GO_BACK ? null : { href: fallbackHref, label: fallbackLabel });

          label: named && named.label,
          text: named ? "Back to " + named.label : "Back",
          short: (named && named.label) || "Back",

            function Overlay({ open, onClose, labelledBy, align, children }) {
              const panelRef = useRef(null);
              const restoreRef = useRef(null);
              // Stays mounted briefly after closing so the panel can move back out.
              const [shown, setShown] = useState(open);
              useEffect(() => {
                if (open) {

                const t = setTimeout(() => setShown(false), 260);
                return () => clearTimeout(t);

                const panel = panelRef.current;
                const focusables = () =>
                  Array.from(
                    panel.querySelectorAll(
                      'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
                    )
                  ).filter((el) => el.offsetParent !== null);

                if (first) first.focus({ preventScroll: true });
                else panel.focus({ preventScroll: true });

                  if (e.key === "Escape") {

                    onClose();
                    return;

                        <h2 className="font-display text-[22px] text-ink leading-tight">
                          How we vet designers
                        </h2>
                        <p className="text-[12.5px] text-muted leading-relaxed mt-1.5 mb-4">
                          Verification isn't a badge — it's a checklist you can read.
                          Every designer in the network has cleared all five.
                        </p>

                        <ol className="flex flex-col gap-4">
                          {VETTING.map(([label, detail]) => (
                            <li key={label} className="flex items-start gap-3">
                              <span
                                aria-hidden="true"
                                className="shrink-0 w-2 h-2 rounded-full bg-gold mt-[7px]"
                              />
                              <span className="min-w-0">
                                <span className="block text-[14px] font-medium text-ink leading-snug">
                                  {label}
                                </span>
                                <span className="block text-[12.5px] text-muted leading-snug mt-0.5">
                                  {detail}
                                </span>
                              </span>
                            </li>
                          ))}
                        </ol>

                        <p className="text-[11.5px] text-muted leading-relaxed mt-6 pt-4 border-t border-hairline">
                          A designer who stops clearing these leaves the network.
                          Ratings, returns and disputes are reviewed every quarter.
                        </p>
                      </div>
                    )}


              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <AuraDrawer
                  active="design"
                  countries={SHIP_TO}
                  current={activeCountry}
                  onPickCountry={(c) => {
                    setActiveCountry(c);
                    showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                  }}
                  onClose={() => setDrawerOpen(false)}
                />
              </Overlay>

                    <div className="home-pill-line" aria-hidden="true" />
                  </div>
                </div>
              );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script id="aura-sheet-motion-exit">
      /* Sheets unmount the instant they close. So the exit can mirror the
         drawer's, a copy of the closed sheet stays for one short slide down
         while its backdrop fades, then goes. Overlays that already animate
         their own exit (class aura-leaving) are left alone. */
      (function () {
        if (!window.MutationObserver) return;
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        function isSheetOverlay(n) {
          if (!n || n.nodeType !== 1 || n.classList.contains("aura-leaving")) return false;
          if (n.classList.contains("aura-sheet-ghost")) return false;
          var holds = n.classList.contains("aura-sheet-up") || n.querySelector(".aura-sheet-up");
          if (!holds) return false;
          return (
            n.classList.contains("aura-sheet-up") ||
            n.classList.contains("aura-fade-in") ||
            /(^|\s)inset-0(\s|$)/.test(n.className || "")
          );
        }
        new MutationObserver(function (records) {
          if (reduce && reduce.matches) return;
          records.forEach(function (r) {
            if (!r.target.isConnected) return;
            r.removedNodes.forEach(function (n) {
              if (!isSheetOverlay(n)) return;
              var ghost = n.cloneNode(true);
              ghost.classList.add("aura-sheet-ghost");
              ghost.setAttribute("aria-hidden", "true");
              ghost.removeAttribute("id");
              ghost.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
              ghost.querySelectorAll("video").forEach(function (v) { v.remove(); });
              r.target.appendChild(ghost);
              setTimeout(function () { ghost.remove(); }, 300);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
