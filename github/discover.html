    <style id="aura-sheet-motion">
      /* ---- Bottom sheets move like the side drawer ----
         The sheet slides on the same curve and timing as the nav drawer,
         and only the backdrop fades, never the sheet, so opening reads as
         a panel arriving rather than the screen reloading. Closing plays
         it in reverse (see the script at the end of the body). Placed last
         in <head> so it wins over each page's older sheet timing. */

        animation: auraSheetIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      @keyframes auraSheetIn {
        from { transform: translate3d(0, 100%, 0); }
        to { transform: translate3d(0, 0, 0); }
      }
      /* The overlay that holds a sheet fades its backdrop colour only. */
      .aura-fade-in:has(.aura-sheet-up) {
        animation: auraScrimBgIn 0.3s ease-out both;
      }
      @keyframes auraScrimBgIn {
        from { background-color: transparent; }
      }
      /* A closed sheet's stand-in, playing the exit before it is removed. */

        pointer-events: none;

<script id="aura-tab-transition-head">
  (function () {
    var KEY = "aura-drawer-nav";
    var arriving = false;
    try {
      arriving = !!sessionStorage.getItem(KEY);
      sessionStorage.removeItem(KEY);
    } catch (e) {}
    window.__auraTabArriving = arriving;
    window.__auraTabLeaving = false;

    // Only a drawer hop uses the transition; every other link behaves as before.
    window.addEventListener("pagereveal", function (e) {
      // A prerendered page ran the lines above before the hop, so read the
      // flag again now that it is being shown.
      if (!arriving) {
        try {
          if (sessionStorage.getItem(KEY)) {
            sessionStorage.removeItem(KEY);
            arriving = window.__auraTabArriving = true;
            if (window.__auraShowBoot) window.__auraShowBoot();
          }
        } catch (err) {}
      }
      if (!e.viewTransition) return;
      if (arriving) e.viewTransition.types.add("aura-tab");
      else if (true) e.viewTransition.skipTransition();
    });

    // Outgoing page: pin its top bar so it stays put across the hop. A trip
    // to Home (Home icon, back button, history.back) also leaves Home the
    // flag, so Home opens on its skeleton instead of a blank reload.
    window.addEventListener("pageswap", function (e) {
      var toHome = false;
      try {
        var a = e.activation;
        var u = new URL(a.entry.url, location.href);
        toHome =
          a.navigationType !== "reload" &&
          u.origin === location.origin &&
          /\/(index\.html)?$/.test(u.pathname);
      } catch (err) {}
      if (toHome) {
        try {
          sessionStorage.setItem(KEY, "1");
        } catch (err) {}
      }
      if (!e.viewTransition || !(window.__auraTabLeaving || toHome)) return;
      e.viewTransition.types.add("aura-tab");
      var bar =
        document.querySelector(".app-viewport > header") ||
        document.querySelector("#root header");
      if (bar) bar.style.viewTransitionName = "aura-topbar";
    });
  })();
</script>

          },
        );
        var left = imgs.length;
        var cap = Math.max(250, 1200 - (Date.now() - started));
        var t = setTimeout(finish, cap);
        var one = function () {
          if (--left <= 0) {
            clearTimeout(t);
            setTimeout(finish, 60);
          }
        };
        if (!left) {
          clearTimeout(t);
          setTimeout(finish, 120);
          return;
        }
        imgs.forEach(function (img) {
          img.addEventListener("load", one, { once: true });
          img.addEventListener("error", one, { once: true });
        });
      };
      var ready = function () {
        return document.querySelector("#root header");
      };
      if (ready()) whenPainted();
      else if (window.MutationObserver) {
        var mo = new MutationObserver(function () {
          if (!ready()) return;
          mo.disconnect();

    // lands on it, so it is often ready before the drawer has left.
    var speculated = {};
    var canPrerender =
      window.HTMLScriptElement &&

      if (link.getAttribute("aria-current") === "page" || speculated[link.href]) return;
      speculated[link.href] = true;
      var rules = document.createElement("script");
      rules.type = "speculationrules";
      rules.textContent = JSON.stringify({ prerender: [{ source: "list", urls: [link.href] }] });
      document.head.appendChild(rules);

      document.addEventListener(type, warm, { capture: true, passive: true });

    var leaving = false;
    document.addEventListener(
      "click",
      function (e) {

          e.defaultPrevented ||
          e.button !== 0 ||

          e.shiftKey ||
          e.altKey

        var link =
          e.target.closest &&
          e.target.closest('nav[aria-label="Primary"] a[href]');
        if (!link) return;
        var drawer = link.closest(".drawer-slide-in");
        if (!drawer) return;
        e.preventDefault();
        if (leaving) return;
        var close = drawer.querySelector(
          '[aria-label="Close navigation menu"]',
        );

      function App() {
        // Deep links: discover.html?category=sarees (older singular ids still work).
        const [category, setCategory] = useState(() => {
          const ALIASES = {
            lehenga: "lehengas",
            saree: "sarees",
            anarkali: "anarkalis",
            kurta: "kurta-sets",
            sherwani: "sherwanis",
          };
          try {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get("category") || params.get("cat") || "";
            const id = ALIASES[raw] || raw;
            if (CATEGORIES.some((c) => c.id === id)) return id;
          } catch (e) {}
          return "all";
        });
        const [saved, setSaved] = useState({});
        const [menuOpen, setMenuOpen] = useState(false);

        const toggleSave = (key) => setSaved((s) => ({ ...s, [key]: !s[key] }));
        const closeMenu = React.useCallback(() => setMenuOpen(false), []);

        const catLabel = CATEGORIES.find((c) => c.id === category).label;
        const rails = [
          { id: "designers", title: "Designer Spotlight", items: DESIGNERS, more: 17 },
          {
            id: "inspiration",
            title: "Inspiration Feed",
            caption: category === "all" ? null : "Showing " + catLabel.toLowerCase(),
            items: LOOKS[category],
            more: 12,
          },
          { id: "community", title: "Community Highlight", items: COMMUNITY, more: 24 },
        ];

        return (
          <div className="app-viewport">
            <Header onMenu={() => setMenuOpen(true)} menuOpen={menuOpen} />
            <main>
              <CategoryRail selected={category} onSelect={setCategory} />
              <CuratedCollections />
              <EditorialStories />
              {rails.map((r) => (
                <CardRail key={r.id} rail={r} saved={saved} onToggleSave={toggleSave} />
              ))}
            </main>
            <Drawer open={menuOpen} onClose={closeMenu} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script id="aura-sheet-motion-exit">
      /* Sheets unmount the instant they close. So the exit can mirror the
         drawer's, a copy of the closed sheet stays for one short slide down
         while its backdrop fades, then goes. Overlays that already animate
         their own exit (class aura-leaving) are left alone. */
      (function () {
        if (!window.MutationObserver) return;
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
        function isSheetOverlay(n) {
          if (!n || n.nodeType !== 1 || n.classList.contains("aura-leaving")) return false;
          if (n.classList.contains("aura-sheet-ghost")) return false;
          var holds = n.classList.contains("aura-sheet-up") || n.querySelector(".aura-sheet-up");
          if (!holds) return false;
          return (
            n.classList.contains("aura-sheet-up") ||
            n.classList.contains("aura-fade-in") ||
            /(^|\s)inset-0(\s|$)/.test(n.className || "")
          );
        }
        new MutationObserver(function (records) {
          if (reduce && reduce.matches) return;
          records.forEach(function (r) {
            if (!r.target.isConnected) return;
            r.removedNodes.forEach(function (n) {
              if (!isSheetOverlay(n)) return;
              var ghost = n.cloneNode(true);
              ghost.classList.add("aura-sheet-ghost");
              ghost.setAttribute("aria-hidden", "true");
              ghost.removeAttribute("id");
              ghost.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
              ghost.querySelectorAll("video").forEach(function (v) { v.remove(); });
              r.target.appendChild(ghost);
              setTimeout(function () { ghost.remove(); }, 300);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
