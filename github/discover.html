<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EFE7" />
    <title>Aura — Discover</title>
    <meta
      name="description"
      content="Aura Discover, full view — browse by category, curated collections, editorial stories, designers, inspiration and community."
    />
    <!-- Figma: Aura · Screens Iteration 2 · "Discover full page" (161:5895) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Inter:wght@400&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as discover.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
              inter: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 surface/canvas · Warm Ivory */
        --card-rgb: 255 255 255; /* #FFFFFF surface/card */
        --sel-fill-rgb: 245 244 247; /* #F5F4F7 surface/selected */
        --onprimary-rgb: 255 255 255; /* brand/on-primary */
        --inset-rgb: 243 238 228; /* #F3EEE4 */
        --primary-rgb: 59 42 90; /* #3B2A5A */
        --ink-rgb: 30 27 46; /* #1E1B2E */
        --muted-rgb: 90 84 104; /* #5A5468 */
        --hairline-rgb: 229 223 213; /* #E5DFD5 */
        --ctrl-border-rgb: 124 123 134; /* #7C7B86 */
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36; /* #785D24 */
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        background-color: rgb(var(--canvas-rgb));
      }

      body {
        color: rgb(var(--ink-rgb));
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-variation-settings: "opsz" 14;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: rgb(var(--canvas-rgb));
        position: relative;
        padding-bottom: calc(40px + env(safe-area-inset-bottom));
      }

      /* Horizontal rails scroll by touch without a visible bar. */
      .rail {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }

      /* Photo tile scrim — Figma: black 75% → 25% (mid) → 0, bottom to top. */
      .scrim {
        background: linear-gradient(
          to top,
          rgb(var(--ink-rgb) / 0.75),
          rgb(var(--ink-rgb) / 0.25) 50%,
          rgb(var(--ink-rgb) / 0)
        );
      }

      .tile-shadow {
        box-shadow: 0 1px 2px 0 rgb(var(--ink-rgb) / 0.05);
      }

      /* Selected category ring — Figma 161:6334. */
      .cat-selected {
        box-shadow:
          0 0 3px 2px rgb(var(--gold-rgb) / 0.35),
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }

      /* Right-edge fade over the category rail — Figma 161:6378. */
      .rail-fade {
        background: linear-gradient(
          to left,
          rgb(var(--canvas-rgb)) 24%,
          rgb(var(--canvas-rgb) / 0.8) 65%,
          rgb(var(--canvas-rgb) / 0)
        );
      }

      @keyframes drawer-in {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .drawer-slide-in {
          animation: none;
        }
        .rail {
          scroll-behavior: auto;
        }
        * {
          transition: none !important;
        }
      }
      /* ---- Overlay motion: the scrim fades on its own, panels only move.
         Transform-only animation stays on the compositor, so the slide is
         smooth; closing plays the same motion in reverse before unmount. */
      html {
        scrollbar-gutter: stable;
      }
      .drawer-slide-in {
        animation: auraDrawerIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform;
      }
      .aura-scrim {
        animation: auraScrimIn 0.3s ease-out both;
      }
      .aura-leaving {
        pointer-events: none;
      }
      .aura-leaving .aura-scrim {
        animation: auraScrimOut 0.26s ease-in both;
      }
      .aura-leaving .drawer-slide-in {
        animation: auraDrawerOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .drawer-slide-in-left {
        animation: auraDrawerOutLeft 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .aura-leaving .aura-sheet-up {
        animation: auraSheetOut 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      @keyframes auraDrawerIn {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes auraDrawerOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }
      @keyframes auraDrawerOutLeft {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-100%, 0, 0);
        }
      }
      @keyframes auraSheetOut {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 100%, 0);
        }
      }
      @keyframes auraScrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes auraScrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer-slide-in,
        .aura-scrim,
        .aura-leaving .aura-scrim,
        .aura-leaving .drawer-slide-in,
        .aura-leaving .drawer-slide-in-left,
        .aura-leaving .aura-sheet-up {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const IMG = "images/discover-full/";

      /* ===================================================================

       rail use the photos from the Figma frame (images/discover-full/).
       The three lower rails were placeholders in the design (the same three
       cards repeated, two without photos); they now carry real content from
       the shared library in images/. The Inspiration Feed follows the
       selected category.

      const LIB = "images/";

      const CATEGORIES = [

        { id: "lehengas", label: "Lehengas", img: "cat-lehengas.jpg" },

        { id: "kurta-sets", label: "Kurta Sets", img: "cat-kurta-sets.jpg" },
        { id: "sherwanis", label: "Sherwanis", img: "cat-sherwanis.jpg" },
        { id: "jewellery", label: "Jewellery", img: "cat-jewellery.jpg" },
        { id: "accessories", label: "Accessories", img: "cat-accessories.jpg" },
        { id: "occasions", label: "Occasions", img: "cat-occasions.jpg" },
      ];

      const STORIES = [
        { id: "banarasi", title: ["The story", "behind a Banarasi"], img: "story-banarasi.jpg" },
        { id: "crafting", title: ["Crafting", "for today"], img: "story-crafting.jpg" },
        { id: "rituals", title: ["Rituals", "at home"], img: "../hero_modern_rituals.jpg" },
      ];

      /* Each designer is shown through a piece in their own craft. */
      const DESIGNERS = [
        { id: "meera", name: "Meera R.", role: "Master draper · Varanasi", img: "heritage_banarasi.jpg" },
        { id: "farida", name: "Farida S.", role: "Chikankari atelier · Lucknow", img: "hero_anarkali.jpg" },
        { id: "ilango", name: "Ilango V.", role: "Korvai weaver · Kanchipuram", img: "kanjivaram_gold.png" },
        { id: "rehan", name: "Rehan K.", role: "Zardozi atelier · Delhi", img: "regal_zardozi.jpg" },
      ];

      /* Inspiration looks, grouped by category. "All Pieces" shows a mix. */
      const LOOKS = {
        lehengas: [
          { id: "emerald", name: "Emerald mehendi", img: "lehenga_festive.jpg" },
          { id: "lilac-organza", name: "Lilac organza", img: "lilac_organza_lehenga.jpg" },
          { id: "velvet-bridal", name: "Velvet bridal", img: "velvet_bridal_lehenga.jpg" },
          { id: "blush", name: "Blush reception", img: "lehenga_contemporary.jpg" },
        ],
        sarees: [
          { id: "gold-tissue", name: "Gold tissue", img: "gold_tissue_saree.jpg" },
          { id: "blush-pastel", name: "Blush pastel", img: "blush_pastel_saree.jpg" },
          { id: "chanderi", name: "Modern Chanderi", img: "modern_chanderi.jpg" },
          { id: "kanjivaram", name: "Kanjivaram gold", img: "kanjivaram_gold.png" },
        ],
        anarkalis: [
          { id: "lilac-anarkali", name: "Lilac garden", img: "hero_anarkali.jpg" },
          { id: "featherweight", name: "Featherweight organza", img: "featherweight_organza.jpg" },
          { id: "aari", name: "Aari companion", img: "lilac_aari_companion.jpg" },
        ],
        "kurta-sets": [
          { id: "lilac-kurta", name: "Lilac kurta set", img: "hero_kurta.jpg" },
          { id: "bundi", name: "Bundi layer", img: "lilac_mens_bundi.jpg" },
          { id: "boy-gold", name: "Little gold kurta", img: "boy_gold_kurta.jpg" },
          { id: "boy-lilac", name: "Garden kurta", img: "lilac_boys_kurta.jpg" },
        ],
        sherwanis: [
          { id: "emerald-velvet", name: "Emerald velvet", img: "sherwani_emerald_velvet.jpg" },
          { id: "midnight", name: "Midnight navy", img: "sherwani_midnight_navy.jpg" },
          { id: "ruby", name: "Ruby heritage", img: "men_ruby_sherwani.jpg" },
          { id: "ivory", name: "Ivory groom", img: "groom_ivory_sherwani.jpg" },
        ],
        jewellery: [
          { id: "heritage", name: "Heritage polki", img: "jewelry_heritage.jpg" },
          { id: "regal", name: "Regal kundan", img: "jewelry_regal.jpg" },
          { id: "modern", name: "Modern amethyst", img: "jewelry_modern.jpg" },
          { id: "featherweight-j", name: "Featherweight pearls", img: "jewelry_featherweight.jpg" },
        ],
        accessories: [
          { id: "juttis", name: "Gold-thread juttis", img: "juttis_gold_thread.jpg" },
          { id: "dupatta", name: "Organza dupatta", img: "dupatta_lilac_organza.jpg" },
          { id: "ruby-blouse", name: "Banarasi blouse", img: "blouse_banarasi_ruby.jpg" },
          { id: "aari-blouse", name: "Aari blouse", img: "blouse_pastel_aari.jpg" },
        ],

          { id: "sangeet", name: "Sangeet night", img: "regal_zardozi.jpg" },

      LOOKS.all = [

        LOOKS.sarees[0],
        LOOKS.sherwanis[0],
        LOOKS.jewellery[0],
        LOOKS.anarkalis[0],
      ];

      const COMMUNITY = [
        { id: "sangeet", name: "Sangeet in lilac", img: "family_lilac_collection.jpg" },
        { id: "wedding", name: "A ruby wedding", img: "family_ruby_heritage.jpg" },
        { id: "diwali", name: "Diwali together", img: "family_silks.png" },
        { id: "pattu", name: "Her first pattu", img: "girl_gold_pattu.jpg" },
      ];

      /* ---------- Header (Figma 161:6134) ---------- */
      function Header({ onMenu, menuOpen }) {
        return (
          <header
            className="sticky top-0 z-20 bg-canvas/95 backdrop-blur-sm flex items-center gap-2 px-4 pt-4 pb-3"
            style={{ paddingTop: "calc(16px + env(safe-area-inset-top))" }}
          >
            <a
              href="index.html"
              aria-label="Go to home"
              className="w-11 h-11 shrink-0 rounded-full flex items-center justify-center hover:bg-inset transition-colors"
            >
              <img src={IMG + "icon-home.svg"} width="19" height="19" alt="" />
            </a>
            <div className="flex-1 min-w-0 flex items-center justify-between">
              <a
                href="conversation.html"
                className="flex items-center gap-1 min-h-[44px] pr-2 font-inter text-[14px] text-ink whitespace-nowrap"
              >
                <img src={IMG + "icon-chevron-left.svg"} width="20" height="20" alt="" />
                Back to chat
              </a>
              <h1 className="font-display text-[22px] leading-none text-primary whitespace-nowrap">
                Discover
              </h1>
            </div>
            <button
              type="button"
              onClick={onMenu}
              aria-label="Open navigation menu"
              aria-expanded={menuOpen}
              aria-controls="nav-drawer"
              className="w-11 h-11 -mr-2.5 shrink-0 rounded-full flex items-center justify-center hover:bg-inset transition-colors"
            >
              <img src={IMG + "icon-hamburger.svg"} width="24" height="24" alt="" />
            </button>
          </header>
        );
      }

      /* ---------- Category rail (Figma 161:6333 → 161:6373) ---------- */
      function CategoryRail({ selected, onSelect }) {
        return (
          <nav aria-label="Categories" className="relative mt-3">
            <ul className="rail flex gap-[14px] pl-2 pr-7 pt-1 pb-1 list-none m-0">
              {CATEGORIES.map((c) => {
                const active = c.id === selected;
                return (
                  <li key={c.id} className="shrink-0">
                    <button
                      type="button"
                      onClick={() => onSelect(c.id)}
                      aria-pressed={active}
                      className="w-16 flex flex-col items-center gap-1.5 rounded-2xl"
                    >
                      <span
                        className={
                          "block w-[60px] h-[60px] rounded-full overflow-hidden bg-inset border-[0.8px] " +
                          (active ? "border-primary cat-selected" : "border-hairline")
                        }
                      >
                        <img src={IMG + c.img} alt="" className="w-full h-full object-cover" />
                      </span>
                      <span
                        className={
                          "text-[11px] leading-[14px] whitespace-nowrap " +
                          (active ? "font-semibold text-ink" : "text-ink/75")
                        }
                      >
                        {c.label}
                      </span>
                      <span
                        aria-hidden="true"
                        className={"w-1 h-1 rounded-full " + (active ? "bg-goldtext" : "")}
                      />
                    </button>
                  </li>
                );
              })}
            </ul>
            <div
              aria-hidden="true"
              className="rail-fade pointer-events-none absolute top-0 right-0 w-7 h-full"
            />
          </nav>
        );
      }

      /* ---------- Section heading row (Figma 161:7030) ---------- */
      function SectionHeader({ id, title, href }) {
        const inner = (
          <>
            View all
            <img src={IMG + "icon-arrow-right.svg"} width="16" height="16" alt="" />
          </>
        );
        const cls =
          "flex items-center gap-1.5 min-h-[44px] -my-3 pl-2 text-[12.5px] leading-[18.75px] text-ink/80";
        return (
          <div className="flex items-center justify-between px-4">
            <h2
              id={id}
              className="font-display text-[16px] leading-normal tracking-[0.32px] text-black m-0 font-normal"
            >
              {title}
            </h2>
            {href ? (
              <a href={href} className={cls} aria-label={"View all " + title.toLowerCase()}>
                {inner}
              </a>
            ) : (
              <button type="button" className={cls} aria-label={"View all " + title.toLowerCase()}>
                {inner}
              </button>
            )}
          </div>
        );
      }

      /* ---------- Photo tile (Figma component "PhotoTile") ---------- */
      function PhotoTile({ img, title, big, className = "", style }) {
        return (
          <button
            type="button"
            className={
              "relative overflow-hidden rounded-2xl bg-inset border-[0.8px] border-hairline/80 tile-shadow text-left " +
              className
            }
            style={style}
          >
            <img src={IMG + img} alt="" className="absolute inset-0 w-full h-full object-cover" />
            <span aria-hidden="true" className="scrim absolute inset-0" />
            <span
              className={
                "absolute left-3 right-3 bottom-3 font-semibold leading-[18px] text-white " +
                (big ? "text-[14px]" : "text-[12px]")
              }
              style={{ textShadow: "0 1px 1px rgba(0,0,0,0.05)" }}
            >
              {title[0]}
              <br />
              {title[1]}
            </span>
          </button>
        );
      }

      /* ---------- Curated collections mosaic (Figma 165:5327) ---------- */
      function CuratedCollections() {
        return (
          <section aria-labelledby="curated-h" className="mt-8">
            <SectionHeader id="curated-h" title="Curated collections" href="collection.html" />
            <div
              className="grid gap-2 px-2 mt-2"
              style={{ gridTemplateColumns: "132fr 121fr 110fr", gridTemplateRows: "128px 128px" }}
            >
              <PhotoTile
                img="cat-lehengas.jpg"
                title={["The Wedding", "Guest Edit"]}
                style={{ gridColumn: "1", gridRow: "1 / span 2" }}
              />
              <PhotoTile
                img="heirloom-weaves.jpg"
                title={["Heirloom", "Weaves"]}
                big
                style={{ gridColumn: "2 / span 2", gridRow: "1" }}
              />
              <PhotoTile
                img="festive-favourites.jpg"
                title={["Festive", "Favourites"]}
                style={{ gridColumn: "2", gridRow: "2" }}
              />
              <PhotoTile
                img="minimal-grace.jpg"
                title={["Minimal", "Grace"]}
                style={{ gridColumn: "3", gridRow: "2" }}
              />
            </div>
          </section>
        );
      }

      /* ---------- Editorial stories rail (Figma 165:5463) ---------- */
      function EditorialStories() {
        return (
          <section aria-labelledby="stories-h" className="mt-8">
            <SectionHeader id="stories-h" title="Editorial Stories" />
            <div className="rail flex gap-2 px-4 pb-1 mt-2">
              {STORIES.map((s) => (
                <PhotoTile
                  key={s.id}
                  img={s.img}
                  title={s.title}
                  className="shrink-0 w-[140px] h-[112px]"
                />
              ))}
            </div>
          </section>
        );
      }

      /* ---------- Curation card (Figma component "CurationCard") ---------- */
      function CurationCard({ person, saved, onToggleSave }) {
        return (
          <div className="relative shrink-0 w-[136px]">
            <button
              type="button"
              className="block w-full text-left"
              aria-label={person.role ? person.name + " — " + person.role : person.name}
            >
              <span className="block h-[181px] rounded-2xl overflow-hidden bg-inset border-[0.8px] border-hairline/80 tile-shadow">
                <img
                  src={LIB + person.img}
                  alt=""
                  loading="lazy"
                  className="w-full h-full object-cover"
                />
              </span>
              <span className="block pt-2.5 px-0.5 text-[12px] leading-[19px] text-ink">
                {person.name}
              </span>
            </button>
            <button
              type="button"
              onClick={onToggleSave}
              aria-pressed={saved}
              aria-label={
                (saved ? "Remove " : "Save ") +
                person.name +
                (saved ? " from favourites" : " to favourites")
              }
              className={
                "absolute top-1 right-1 w-11 h-11 flex items-center justify-center rounded-full"
              }
            >
              <span
                className={
                  "w-9 h-9 rounded-full flex items-center justify-center border-[0.8px] border-white/25 transition-colors " +
                  (saved ? "bg-primary" : "bg-ink/35")
                }
              >
                <img src={IMG + "icon-heart.svg"} width="17" height="17" alt="" />
              </span>
            </button>
          </div>
        );
      }

      /* ---------- Show-more card (Figma 166:5572) ---------- */
      function ShowMoreCard({ count, label }) {
        return (
          <button
            type="button"
            aria-label={"Show " + count + " more in " + label}
            className="shrink-0 w-[136px] h-[215px] rounded-2xl border-[0.8px] border-dashed border-ctrl/60 bg-inset/50 flex flex-col items-center justify-center gap-2"
          >
            <span className="w-9 h-9 rounded-full bg-white border-[0.8px] border-hairline flex items-center justify-center">
              <img src={IMG + "icon-plus.svg"} width="16" height="16" alt="" />
            </span>
            <span className="text-[13px] leading-[19.5px] font-medium text-primary">Show more</span>
            <span className="font-mono text-[10.5px] leading-[15.75px] text-muted">
              +{count} more
            </span>
          </button>
        );
      }

      function CardRail({ rail, saved, onToggleSave }) {
        const hid = rail.id + "-h";
        return (
          <section aria-labelledby={hid} className="mt-9">
            <SectionHeader id={hid} title={rail.title} />
            {rail.caption && (
              <p className="px-4 mt-1 mb-0 font-mono text-[10.5px] leading-[15.75px] text-muted">
                {rail.caption}
              </p>
            )}
            {/* Keyed on the items so a category change starts the rail at the beginning. */}
            <div key={rail.items.map((i) => i.id).join()} className="rail flex gap-3 px-4 pb-1 mt-2.5">
              {rail.items.map((p) => {
                const key = rail.id + ":" + p.id;
                return (
                  <CurationCard
                    key={key}
                    person={p}
                    saved={!!saved[key]}
                    onToggleSave={() => onToggleSave(key)}
                  />
                );
              })}
              <ShowMoreCard count={rail.more} label={rail.title} />
            </div>
          </section>
        );
      }

      /* ---------- Navigation drawer — same design as every other screen ---------- */
      const SHIP_TO = [
        {
          code: "US",
          flag: "🇺🇸",
          duty: "Duties prepaid",
          courier: "DHL Express · 4 days",
        },
        {
          code: "UK",
          flag: "🇬🇧",
          duty: "VAT prepaid",
          courier: "DHL Express · 3 days",
        },
        {
          code: "CA",
          flag: "🇨🇦",
          duty: "Duties prepaid",
          courier: "DHL Express · 5 days",
        },
        {
          code: "IN",
          flag: "🇮🇳",
          duty: "No import duty",
          courier: "Blue Dart · 2 days",
        },
      ];

      function Drawer({ open, onClose }) {
        const [country, setCountry] = useState(SHIP_TO[0]);
        // Stays mounted briefly after closing so the panel can move back out.
        const [shown, setShown] = useState(open);
        useEffect(() => {
          if (open) {
            setShown(true);
            return;
          }
          const t = setTimeout(() => setShown(false), 260);
          return () => clearTimeout(t);
        }, [open]);

        useEffect(() => {
          if (!open) return;
          document.body.classList.add("aura-locked");
          const closeBtn = document.querySelector('#nav-drawer button[aria-label="Close navigation menu"]');
          if (closeBtn) closeBtn.focus({ preventScroll: true });
          const onKey = (e) => e.key === "Escape" && onClose();
          window.addEventListener("keydown", onKey);
          return () => {
            document.body.classList.remove("aura-locked");
            window.removeEventListener("keydown", onKey);
          };
        }, [open, onClose]);

        if (!open && !shown) return null;
        return (
          <div
            className={"fixed inset-0 z-50 flex justify-end" + (open ? "" : " aura-leaving")}
            role="dialog"
            aria-modal="true"
            aria-labelledby="drawer-title"
            id="nav-drawer"
          >
            <div
              className="aura-scrim absolute inset-0 bg-ink/40"
              onClick={onClose}
              aria-hidden="true"
            />
            <AuraDrawer
              active="discover"
              countries={SHIP_TO}
              current={country}
              onPickCountry={setCountry}
              onClose={onClose}
            />
          </div>
        );
      }

      /* ===================================================================
       AURA DRAWER — the right-hand navigation panel, identical on every
       screen. Built to Figma "Right Drawer / v2" (173:2827) with its
       "Drawer / Nav Item" and "Drawer / Ship-to" components; icons are the
       component's own exports in images/drawer/. Each screen passes which
       tab is current and its own ship-to state.
       =================================================================== */
      const DRAWER_SERIF = {
        fontFamily: '"Instrument Serif", "Iowan Old Style", Georgia, serif',
      };
      const DRAWER_ICON = "images/drawer/";

      const DRAWER_TABS = [
        {
          id: "home",
          label: "Home",
          link: "index.html",
          desc: "Occasion-first landing",
        },
        {
          id: "discover",
          label: "Discover",
          link: "discover.html",
          desc: "Craft & regional provenance",
        },
        {
          id: "design",
          label: "Design",
          link: "designers.html",
          desc: "The makers behind the cloth",
        },
        {
          id: "wardrobe",
          label: "Wardrobe",
          link: "wardrobe.html",
          desc: "Memory & measurements",
        },
        {
          id: "orders",
          label: "Orders",
          link: "orders.html",
          desc: "Live artisan production tracker",
        },
      ];

      // The ship-to codes are markets (UK); the top line shows the ISO country (GB).
      const DRAWER_ISO = { US: "US", UK: "GB", CA: "CA", IN: "IN" };

      function AuraDrawer({ active, countries, current, onPickCountry, onClose }) {
        return (
          <div
            className="relative bg-canvas w-[88%] max-w-[346px] h-full flex flex-col px-5 py-6 border-l border-hairline drawer-slide-in overflow-y-auto overflow-x-hidden"
            style={{ boxShadow: "-12px 0 40px rgb(30 27 46 / 0.18)" }}
          >
            {/* Profile */}
            <div className="shrink-0 flex items-center gap-2.5 pb-5 border-b border-hairline">
              <span
                aria-hidden="true"
                className="shrink-0 p-[2px] rounded-full border border-gold/55"
              >
                <span
                  className="w-[52px] h-[52px] rounded-full bg-gold text-ink flex items-center justify-center text-[21px] leading-[26px]"
                  style={DRAWER_SERIF}
                >
                  PS
                </span>
              </span>
              <span className="flex-1 min-w-0 flex flex-col gap-2">
                <span className="flex items-center gap-1.5 min-w-0">
                  <span
                    id="drawer-title"
                    className="text-[20px] leading-[24px] text-ink truncate"
                    style={DRAWER_SERIF}
                  >
                    Priya Sharma
                  </span>
                  <a
                    href="profile.html"
                    aria-label="Edit your profile"
                    className="shrink-0 w-8 h-8 -m-[7px] rounded-full flex items-center justify-center hover:bg-inset transition-colors"
                  >
                    <img
                      src={DRAWER_ICON + "edit.svg"}
                      width="18"
                      height="18"
                      alt=""
                    />
                  </a>
                  <img
                    src={DRAWER_ICON + "online.svg"}
                    width="8"
                    height="8"
                    alt="Your stylist is online"
                    className="shrink-0"
                  />
                </span>
                <span className="font-mono text-[11px] leading-[14px] tracking-[1.98px] uppercase text-muted whitespace-nowrap">
                  Toronto, ON
                </span>
              </span>
              <button
                type="button"
                onClick={onClose}
                aria-label="Close navigation menu"
                className="shrink-0 w-11 h-11 rounded-full bg-hairline/70 flex items-center justify-center hover:bg-hairline transition-colors"
              >
                <img src={DRAWER_ICON + "close.svg"} width="18" height="18" alt="" />
              </button>
            </div>

            {/* 5 primary tabs */}
            <nav
              aria-label="Primary"
              className="shrink-0 py-3 border-b border-hairline"
            >
              <ul className="list-none m-0 p-0 flex flex-col gap-1">
                {DRAWER_TABS.map((t) => {
                  const on = t.id === active;
                  return (
                    <li key={t.id}>
                      <a
                        href={t.link}
                        aria-current={on ? "page" : undefined}
                        className={`relative flex flex-col gap-0.5 pl-[52px] pr-3 py-3 rounded-r-2xl border-l-[3px] transition-colors ${
                          on
                            ? "bg-primary/[0.07] border-primary"
                            : "border-transparent hover:bg-inset/70"
                        }`}
                      >
                        <img
                          src={DRAWER_ICON + t.id + ".svg"}
                          width="24"
                          height="24"
                          alt=""
                          className="absolute left-[9px] top-[15px]"
                        />
                        <span
                          className={`block font-sans text-[16px] leading-[28px] text-ink ${
                            on ? "font-semibold" : "font-normal"
                          }`}
                        >
                          {t.label}
                        </span>
                        <span className="block font-sans text-[12px] leading-[20px] text-muted">
                          {t.desc}
                        </span>
                      </a>
                    </li>
                  );
                })}
              </ul>
            </nav>

            {/* Dual-geography */}
            <div className="shrink-0 pt-5 flex flex-col gap-6">
              <div className="flex flex-col gap-3">
                <span
                  id="ship-to-label"
                  className="font-mono text-[11px] leading-[14px] tracking-[2.2px] uppercase text-muted"
                >
                  Ship to
                </span>
                <div
                  className="flex gap-2"
                  role="group"
                  aria-labelledby="ship-to-label"
                >
                  {countries.map((c) => {
                    const on = current.code === c.code;
                    return (
                      <button
                        key={c.code}
                        type="button"
                        aria-pressed={on}
                        aria-label={`Ship to ${c.code}`}
                        onClick={() => onPickCountry(c)}
                        className={`flex-1 min-w-0 h-14 rounded-xl border flex flex-col items-center justify-center gap-1 transition-colors ${
                          on
                            ? "bg-primary border-primary"
                            : "bg-inset border-hairline hover:border-ctrl/60"
                        }`}
                      >
                        <span
                          className={`text-[19px] leading-[23px] ${on ? "text-onprimary" : "text-ink"}`}
                          style={DRAWER_SERIF}
                        >
                          {DRAWER_ISO[c.code] || c.code}
                        </span>
                        <span
                          className={`font-sans text-[10.5px] leading-[13px] ${
                            on ? "text-onprimary/80" : "text-muted"
                          }`}
                        >
                          {c.code}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
              <p className="flex items-start gap-3 pt-1 m-0" aria-live="polite">
                <img
                  src={DRAWER_ICON + "globe.svg"}
                  width="20"
                  height="20"
                  alt=""
                  className="shrink-0"
                />
                <span className="flex-1 min-w-0 font-sans text-[12px] leading-[18px] text-muted">
                  Prices are landed to {current.code} — {current.duty},{" "}
                  {current.courier}. Nothing is added at checkout.
                </span>
              </p>
            </div>

            <div className="flex-1 min-h-6" aria-hidden="true" />

            {/* Sign-off */}
            <div className="shrink-0 relative h-[170px] border-t border-hairline">
              <span className="absolute left-0 top-[135px] font-mono text-[11px] leading-[13px] text-muted">
                Aura v1.0
              </span>
              <span className="absolute right-0 top-[127px] font-mono text-[10px] leading-[14px] tracking-[2px] uppercase text-ink pb-[5px] border-b border-ink/60 whitespace-nowrap">
                Perfect Fit Guarantee
              </span>
            </div>
          </div>
        );
      }

      function App() {
        // Deep links: discover.html?category=sarees (older singular ids still work).
        const [category, setCategory] = useState(() => {
          const ALIASES = { lehenga: "lehengas", saree: "sarees", anarkali: "anarkalis", kurta: "kurta-sets", sherwani: "sherwanis" };
          try {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get("category") || params.get("cat") || "";
            const id = ALIASES[raw] || raw;
            if (CATEGORIES.some((c) => c.id === id)) return id;
          } catch (e) {}
          return "all";
        });
        const [saved, setSaved] = useState({});
        const [menuOpen, setMenuOpen] = useState(false);

        const toggleSave = (key) => setSaved((s) => ({ ...s, [key]: !s[key] }));
        const closeMenu = React.useCallback(() => setMenuOpen(false), []);

        const catLabel = CATEGORIES.find((c) => c.id === category).label;
        const rails = [
          { id: "designers", title: "Designer Spotlight", items: DESIGNERS, more: 17 },
          {
            id: "inspiration",
            title: "Inspiration Feed",
            caption: category === "all" ? null : "Showing " + catLabel.toLowerCase(),
            items: LOOKS[category],
            more: 12,
          },
          { id: "community", title: "Community Highlight", items: COMMUNITY, more: 24 },
        ];

        return (
          <div className="app-viewport">
            <Header onMenu={() => setMenuOpen(true)} menuOpen={menuOpen} />
            <main>
              <CategoryRail selected={category} onSelect={setCategory} />
              <CuratedCollections />
              <EditorialStories />
              {rails.map((r) => (
                <CardRail key={r.id} rail={r} saved={saved} onToggleSave={toggleSave} />
              ))}
            </main>
            <Drawer open={menuOpen} onClose={closeMenu} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
