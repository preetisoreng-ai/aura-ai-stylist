<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Aura — Your Profile</title>
    <meta
      name="description"
      content="Aura profile — edit the customer details, measurements and delivery address your commission is cut and shipped to."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect, useCallback } = React;

      const STORE_KEY = "aura.profile.v1";

      const BLANK = {
        name: "Priya Sharma",
        email: "priya.sharma@example.com",
        phone: "+1 416 555 0143",
        pronouns: "",
        unit: "in",
        bust: "36",
        waist: "30",
        hip: "39",
        shoulder: "15",
        sleeve: "22",
        length: "41",
        height: "5'5\"",
        fitNote: "",
        // The address currently in the form. `addresses` holds every saved
        // one; these fields mirror whichever is selected.
        label: "Home",
        line1: "48 Wellesley Street East",
        line2: "Apt 1204",
        city: "Toronto",
        region: "ON",
        postcode: "M4Y 1H3",
        country: "Canada",
        activeAddress: "addr-home",
        addresses: [
          {
            id: "addr-home",
            label: "Home",
            line1: "48 Wellesley Street East",
            line2: "Apt 1204",
            city: "Toronto",
            region: "ON",
            postcode: "M4Y 1H3",
            country: "Canada",
          },
          {
            id: "addr-mum",
            label: "Mum's place",
            line1: "12 Turner Road",
            line2: "",
            city: "Mumbai",
            region: "MH",
            postcode: "400050",
            country: "India",
          },
        ],
      };

      /* The fields that travel with an address, as opposed to the rest of
         the profile. Switching shortcuts swaps exactly these. */
      const ADDRESS_KEYS = ["label", "line1", "line2", "city", "region", "postcode", "country"];

      const pick = (obj) => ADDRESS_KEYS.reduce((o, k) => ((o[k] = obj[k] || ""), o), {});

      // Fold whatever is in the form back into the saved list before moving.
      const commitAddress = (f) => ({
        ...f,
        addresses: (f.addresses || []).map((a) =>
          a.id === f.activeAddress ? { ...a, ...pick(f) } : a
        ),
      });

      /* Saved on this device only — the prototype has no server behind it. */
      const load = () => {
        try {
          const raw = window.localStorage.getItem(STORE_KEY);
          return raw ? { ...BLANK, ...JSON.parse(raw) } : BLANK;
        } catch (e) {
          return BLANK;
        }
      };

      function Field({ id, label, value, onChange, hint, type, inputMode, autoComplete }) {
        return (
          <div>
            <label
              htmlFor={id}
              className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
            >
              {label}
            </label>
            <input
              id={id}
              type={type || "text"}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              inputMode={inputMode}
              autoComplete={autoComplete}
              style={{ fontSize: 16 }}
              className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink focus:outline-none focus:border-primary transition-colors"
            />
            {hint && <p className="text-[11px] text-muted mt-1 leading-snug">{hint}</p>}
          </div>
        );
      }

      function Section({ title, note, children }) {
        return (
          <section className="mb-6">
            <h2 className="font-display text-[19px] text-ink leading-tight">{title}</h2>
            {note && <p className="text-[12px] text-muted leading-relaxed mt-1 mb-3">{note}</p>}
            <div className={note ? "space-y-3.5" : "space-y-3.5 mt-3"}>{children}</div>
          </section>
        );
      }

/* ===================================================================
       AI SCAN
       Three photographs — front, back and side — framed against an on-screen
       guide so the whole body lands in shot at a consistent distance. The
       frames never leave the device in this prototype; a draper confirms the
       fourteen points afterwards, which is what the Measurements note
       already promises.
       =================================================================== */
const SHOTS = [
  {
    id: "front",
    label: "Front",
    cue: "Face the camera. Arms a hand's width from your sides, feet hip-width apart.",
  },
  {
    id: "back",
    label: "Back",
    cue: "Turn around, same stance. Keep your heels on the lower line.",
  },
  {
    id: "side",
    label: "Side profile",
    cue: "Turn a quarter. Arms straight down, looking ahead, not at the camera.",
  },
];

const STANDING_GUIDE = [
  "Stand 2.5 metres (about 8 feet) back — far enough that your whole body sits inside the outline.",
  "Prop the phone at hip height, portrait, against something steady.",
  "Plain wall behind you. Light on your face, not behind you.",
  "Wear fitted clothes. No coat, nothing bunched at the waist.",
  "Crown of your head on the top line, heels on the bottom one.",
];

/* The body guide drawn over the viewfinder. Deliberately a guide rather
         than a silhouette — you line yourself up with it, you do not have to
         match its shape. */
function BodyGuide({ view }) {
  const side = view === "side";
  return (
    <svg
      viewBox="0 0 120 300"
      preserveAspectRatio="xMidYMid meet"
      className="absolute inset-0 w-full h-full pointer-events-none"
      aria-hidden="true"
      focusable="false"
    >
      {/* Crown and heel lines */}
      <line
        x1="8"
        y1="10"
        x2="112"
        y2="10"
        stroke="rgba(255,255,255,0.9)"
        strokeWidth="1"
        strokeDasharray="4 4"
      />
      <line
        x1="8"
        y1="278"
        x2="112"
        y2="278"
        stroke="rgba(255,255,255,0.9)"
        strokeWidth="1"
        strokeDasharray="4 4"
      />
      <text
        x="10"
        y="7"
        fill="rgba(255,255,255,0.9)"
        fontSize="6"
        fontFamily="monospace"
      >
        CROWN
      </text>
      <text
        x="10"
        y="288"
        fill="rgba(255,255,255,0.9)"
        fontSize="6"
        fontFamily="monospace"
      >
        HEELS
      </text>

      <g
        stroke="rgba(255,255,255,0.75)"
        strokeWidth="2.5"
        strokeLinecap="round"
        fill="none"
        strokeDasharray="6 5"
      >
        <circle cx="60" cy="30" r="17" />
        <line x1="60" y1="47" x2="60" y2="158" />
        {side ? (
          <>
            <line x1="60" y1="66" x2="64" y2="150" />
            <line x1="60" y1="158" x2="62" y2="272" />
          </>
        ) : (
          <>
            <line x1="34" y1="66" x2="86" y2="66" />
            <line x1="34" y1="66" x2="26" y2="150" />
            <line x1="86" y1="66" x2="94" y2="150" />
            <line x1="60" y1="158" x2="42" y2="272" />
            <line x1="60" y1="158" x2="78" y2="272" />
          </>
        )}
      </g>
    </svg>
  );
}

function AiScanModal({ onClose, onDone }) {
  const [shots, setShots] = useState({});
  const [capturing, setCapturing] = useState(null); // shot id while the camera is live
  const [countdown, setCountdown] = useState(0);
  const [camError, setCamError] = useState("");
  const [picking, setPicking] = useState(null); // the shot whose picker is open
  const [streamTick, setStreamTick] = useState(0);

  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const panelRef = useRef(null);
  const restoreRef = useRef(null);
  const timerRef = useRef(null);

  const stopCamera = useCallback(() => {
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = null;
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
  }, []);

  useEffect(() => {
    restoreRef.current = document.activeElement;
    document.body.classList.add("aura-locked");
    const onKey = (e) => {
      if (e.key === "Escape") {
        e.stopPropagation();
        onClose();
      }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      document.removeEventListener("keydown", onKey, true);
      document.body.classList.remove("aura-locked");
      stopCamera();
      const r = restoreRef.current;
      if (r && typeof r.focus === "function") r.focus();
    };
  }, [onClose, stopCamera]);

  // Attach once both the element and the stream exist.
  useEffect(() => {
    const v = videoRef.current;
    const stream = streamRef.current;
    if (!capturing || !v || !stream) return;
    v.srcObject = stream;
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }, [capturing, streamTick]);

  const openCamera = async (id) => {
    setCamError("");
    setCapturing(id);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1080 },
          height: { ideal: 1920 },
        },
        audio: false,
      });
      streamRef.current = stream;
      // The <video> only mounts on the re-render that `capturing` triggers,
      // so hand off to an effect rather than touching the ref here, where it
      // is still null.
      setStreamTick((n) => n + 1);
    } catch (err) {
      // No camera, or permission refused — the upload path still works.
      setCamError(
        err && err.name === "NotAllowedError"
          ? "Camera permission was declined. You can upload a photograph instead."
          : "No camera available on this device. Upload a photograph instead.",
      );
    }
  };

  const grabFrame = (id) => {
    const v = videoRef.current;
    if (!v || !v.videoWidth) {
      setCountdown(0);
      setCamError("Could not read a frame from the camera. Upload a photograph instead.");
      return;
    }
    const c = document.createElement("canvas");
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    const ctx = c.getContext("2d");
    // Mirror the front camera back, so the saved frame reads the way a
    // photograph would rather than the way a mirror does.
    ctx.translate(c.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(v, 0, 0, c.width, c.height);
    setShots((s) => ({ ...s, [id]: c.toDataURL("image/jpeg", 0.85) }));
    stopCamera();
    setCapturing(null);
    setCountdown(0);
  };

  // A self-taken full-body shot needs a delay — you cannot be 2.5m away
  // and holding the phone.
  const startTimer = (id) => {
    if (timerRef.current) clearInterval(timerRef.current);
    let n = 5;
    setCountdown(n);
    timerRef.current = setInterval(() => {
      n -= 1;
      setCountdown(n);
      if (n <= 0) {
        clearInterval(timerRef.current);
        timerRef.current = null;
        grabFrame(id);
      }
    }, 1000);
  };

  const onUpload = (id) => (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setShots((s) => ({ ...s, [id]: reader.result }));
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const taken = SHOTS.filter((s) => shots[s.id]).length;
  const active = SHOTS.find((s) => s.id === capturing);

  return (
    <div
      className="absolute inset-0 z-50 aura-fade-in"
      style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
    >
      <div
        ref={panelRef}
        role="dialog"
        aria-modal="true"
        aria-labelledby="scan-title"
        tabIndex={-1}
        className="absolute inset-x-0 bottom-0 h-[92%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
      >
        <div className="relative shrink-0 pt-2.5 pb-2.5">
          <span
            className="block w-10 h-1 rounded-full bg-hairline mx-auto"
            aria-hidden="true"
          />
          <button
            type="button"
            onClick={onClose}
            aria-label="Close AI scan"
            className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        {capturing ? (
          /* ---------- Viewfinder ---------- */
          <div className="flex-1 flex flex-col min-h-0">
            <div className="px-5 pb-3">
              <h2
                id="scan-title"
                className="font-display text-[22px] text-ink leading-tight"
              >
                {active.label}
              </h2>
              <p className="text-[12px] text-muted leading-snug mt-1">
                {active.cue}
              </p>
            </div>

            <div className="relative flex-1 min-h-0 mx-5 rounded-2xl overflow-hidden bg-ink">
              <video
                ref={videoRef}
                playsInline
                muted
                className="absolute inset-0 w-full h-full object-cover"
                style={{ transform: "scaleX(-1)" }}
              />
              <BodyGuide view={active.id} />

              {countdown > 0 && (
                <div className="absolute inset-0 flex items-center justify-center">
                  <span className="font-display text-[72px] text-white drop-shadow-lg">
                    {countdown}
                  </span>
                </div>
              )}

              {camError && (
                <div className="absolute inset-0 flex items-center justify-center p-6 text-center">
                  <p className="text-[13px] text-white leading-relaxed">
                    {camError}
                  </p>
                </div>
              )}

              <p className="absolute left-0 right-0 bottom-3 text-center font-mono text-[10.5px] text-white/90">
                2.5 m back · phone at hip height
              </p>
            </div>

            <div className="shrink-0 px-5 pt-4 pb-5 flex items-center gap-3">
              <button
                type="button"
                onClick={() => {
                  stopCamera();
                  setCapturing(null);
                  setCountdown(0);
                }}
                className="min-h-[48px] px-5 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
              >
                Back
              </button>
              <button
                type="button"
                disabled={!!camError || countdown > 0}
                onClick={() => startTimer(active.id)}
                className="flex-1 min-h-[48px] px-5 rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
              >
                {countdown > 0
                  ? `Hold still — ${countdown}`
                  : "Take it in 5 seconds"}
              </button>
            </div>
          </div>
        ) : (
          /* ---------- Setup and review ---------- */
          <div className="flex-1 overflow-y-auto px-5 pb-5">
            <h2
              id="scan-title"
              className="font-display text-[24px] text-ink leading-tight"
            >
              AI scan
            </h2>
            <div className="mt-5 rounded-2xl border border-hairline bg-inset/50 p-4">
              <h3 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2">
                How to stand
              </h3>
              <ul className="space-y-1.5">
                {STANDING_GUIDE.map((g, i) => (
                  <li
                    key={i}
                    className="flex gap-2 text-[12px] text-ink leading-snug"
                  >
                    <span className="font-mono text-[10.5px] text-goldtext shrink-0 mt-0.5">
                      {String(i + 1).padStart(2, "0")}
                    </span>
                    <span>{g}</span>
                  </li>
                ))}
              </ul>
            </div>

            {/* Three shots, three cards, side by side — the stance cue moves
                into the picker, where it is read at the moment it matters. */}
            <div className="mt-4 grid grid-cols-3 gap-2.5">
              {SHOTS.map((s) => (
                <button
                  key={s.id}
                  type="button"
                  onClick={() => setPicking(s)}
                  aria-haspopup="dialog"
                  aria-label={
                    shots[s.id]
                      ? `${s.label} — captured, choose how to retake it`
                      : `${s.label} — choose how to take it`
                  }
                  className={`p-2 rounded-2xl border bg-card text-left transition-all active:scale-[0.98] ${
                    shots[s.id]
                      ? "border-primary/50"
                      : "border-hairline hover:border-primary/45"
                  }`}
                >
                  <span className="block w-full aspect-[3/4] rounded-xl overflow-hidden bg-inset border border-hairline flex items-center justify-center">
                    {shots[s.id] ? (
                      <img
                        src={shots[s.id]}
                        alt={`${s.label} photograph`}
                        className="w-full h-full object-cover"
                      />
                    ) : (
                      <svg
                        viewBox="0 0 120 300"
                        className="w-full h-full p-2 opacity-35"
                        aria-hidden="true"
                      >
                        <g
                          stroke="currentColor"
                          strokeWidth="9"
                          strokeLinecap="round"
                          fill="none"
                          className="text-muted"
                        >
                          <circle cx="60" cy="34" r="20" />
                          <line x1="60" y1="54" x2="60" y2="170" />
                          <line x1="30" y1="76" x2="90" y2="76" />
                          <line x1="60" y1="170" x2="38" y2="270" />
                          <line x1="60" y1="170" x2="82" y2="270" />
                        </g>
                      </svg>
                    )}
                  </span>

                  <span className="block text-[12.5px] font-medium text-ink mt-1.5 truncate">
                    {s.label}
                  </span>
                  <span
                    className={`block font-mono text-[10px] mt-0.5 ${
                      shots[s.id] ? "text-primary" : "text-muted"
                    }`}
                  >
                    {shots[s.id] ? "Captured" : "Not yet"}
                  </span>
                </button>
              ))}
            </div>

            {picking && (
              <div
                className="absolute inset-0 z-50 flex items-center justify-center px-6 aura-fade-in"
                style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
                onMouseDown={(e) => {
                  if (e.target === e.currentTarget) setPicking(null);
                }}
              >
                <div
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="shot-choice-title"
                  className="w-full max-w-[300px] bg-card rounded-3xl border border-hairline shadow-2xl p-5"
                >
                  <h3
                    id="shot-choice-title"
                    className="font-display text-[20px] text-ink leading-tight"
                  >
                    {picking.label}
                  </h3>
                  <p className="text-[12px] text-muted leading-relaxed mt-1.5 mb-4">
                    {picking.cue}
                  </p>

                  <button
                    type="button"
                    onClick={() => {
                      const id = picking.id;
                      setPicking(null);
                      openCamera(id);
                    }}
                    className="w-full min-h-[48px] rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                  >
                    Use camera
                  </button>

                  <label className="mt-2.5 w-full min-h-[48px] rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium flex items-center justify-center cursor-pointer hover:bg-inset active:scale-95 transition-all">
                    Upload a photograph
                    <input
                      type="file"
                      accept="image/*"
                      className="sr-only"
                      onChange={(e) => {
                        const handler = onUpload(picking.id);
                        setPicking(null);
                        handler(e);
                      }}
                    />
                  </label>

                  <button
                    type="button"
                    onClick={() => setPicking(null)}
                    className="w-full min-h-[44px] mt-1.5 text-[12.5px] font-medium text-muted hover:text-ink transition-colors"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            )}

            <button
              type="button"
              disabled={taken < SHOTS.length}
              onClick={() => onDone(taken)}
              className="w-full mt-5 min-h-[48px] rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
            >
              {taken < SHOTS.length
                ? `Extract measurements — ${taken} of ${SHOTS.length}`
                : "Extract measurements"}
            </button>

            <p className="text-[11px] text-muted leading-relaxed mt-3">
              Photographs stay on this device in this prototype — nothing is
              uploaded.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}
      function App() {
        const [form, setForm] = useState(load);
        const [toastMsg, setToastMsg] = useState("");
        const [scanOpen, setScanOpen] = useState(false);
        const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

        const selectAddress = (id) =>
          setForm((f) => {
            if (id === f.activeAddress) return f;
            const saved = commitAddress(f);
            const target = saved.addresses.find((a) => a.id === id);
            return target ? { ...saved, ...pick(target), activeAddress: id } : saved;
          });

        const addAddress = () =>
          setForm((f) => {
            const saved = commitAddress(f);
            const id = "addr-" + Date.now().toString(36);
            const fresh = {
              id,
              label: "",
              line1: "",
              line2: "",
              city: "",
              region: "",
              postcode: "",
              // A new address usually lands in the same country as the last.
              country: saved.country || "",
            };
            return {
              ...saved,
              addresses: [...saved.addresses, fresh],
              ...pick(fresh),
              activeAddress: id,
            };
          });

        const removeAddress = (id) =>
          setForm((f) => {
            if ((f.addresses || []).length <= 1) return f;
            const rest = f.addresses.filter((a) => a.id !== id);
            const next = rest[0];
            return { ...f, addresses: rest, ...pick(next), activeAddress: next.id };
          });

        const goBack = () => {
          if (window.history.length > 1) window.history.back();
          else window.location.href = "index.html";
        };

        const save = (e) => {
          e.preventDefault();
          let saved = true;
          const payload = commitAddress(form);
          setForm(payload);
          try {
            window.localStorage.setItem(STORE_KEY, JSON.stringify(payload));
          } catch (err) {
            saved = false;
          }
          setToastMsg(
            saved
              ? "Saved on this device — Meera will work from these"
              : "Could not save on this device"
          );
          window.setTimeout(() => setToastMsg(""), 3200);
        };

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>
            {toastMsg && (
              <div
                aria-hidden="true"
                className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
              >
                <span className="text-gold" aria-hidden="true">
                  ✦
                </span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              {/* ---------- Top bar ---------- */}
              <header className="shrink-0 flex items-center gap-1 px-2 pt-3 pb-2 border-b border-hairline bg-canvas">
                <button
                  type="button"
                  onClick={goBack}
                  aria-label="Back"
                  className="w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.1"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                </button>

                <div className="min-w-0 flex-1">
                  <h1 className="font-display text-[18px] text-ink leading-tight truncate">
                    Your profile
                  </h1>
                  <p className="font-mono text-[10.5px] text-muted truncate">
                    details · measurements · address
                  </p>
                </div>
              </header>

              <form onSubmit={save} className="contents">
                <div className="thread-scroll px-4 pt-4 pb-4">
                  <Section title="Customer details">
                    <Field
                      id="p-name"
                      label="Full name"
                      value={form.name}
                      onChange={set("name")}
                      autoComplete="name"
                    />
                    <Field
                      id="p-email"
                      label="Email"
                      type="email"
                      inputMode="email"
                      value={form.email}
                      onChange={set("email")}
                      autoComplete="email"
                    />
                    <Field
                      id="p-phone"
                      label="Phone"
                      type="tel"
                      inputMode="tel"
                      value={form.phone}
                      onChange={set("phone")}
                      autoComplete="tel"
                      hint="Used only for delivery and fitting calls."
                    />
                    <Field
                      id="p-pronouns"
                      label="Pronouns"
                      value={form.pronouns}
                      onChange={set("pronouns")}
                      hint="Optional."
                    />
                  </Section>

                  <Section title="Measurements">
                    <div>
                      <span
                        id="unit-label"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Units
                      </span>
                      {/* Underline tabs: the rule runs the full width and the
                          active tab sits on a thicker segment of it. */}
                      <div className="flex items-stretch border-b border-hairline">
                        <div className="flex items-stretch" role="group" aria-labelledby="unit-label">
                        {[
                          { id: "in", label: "Inches" },
                          { id: "cm", label: "Centimetres" },
                        ].map((u) => {
                          const on = form.unit === u.id;
                          return (
                            <button
                              key={u.id}
                              type="button"
                              aria-pressed={on}
                              onClick={() => set("unit")(u.id)}
                              className={`relative min-h-[44px] px-4 -mb-px border-b-2 text-[13px] font-mono transition-colors ${
                                on
                                  ? "border-primary text-primary"
                                  : "border-transparent text-muted hover:text-ink"
                              }`}
                            >
                              {u.label}
                            </button>
                          );
                        })}
                        </div>

                        <span className="flex-1" aria-hidden="true" />

                        {/* Photograph your way to fourteen points instead of
                            typing them in. */}
                        <button
                          type="button"
                          onClick={() => setScanOpen(true)}
                          aria-haspopup="dialog"
                          className="self-center -mb-px mb-1.5 ml-2 min-h-[40px] pl-2.5 pr-3.5 rounded-full bg-primary text-onprimary text-[12.5px] font-medium flex items-center gap-1.5 hover:bg-primary/90 active:scale-95 transition-all"
                        >
                          <svg
                            width="15"
                            height="15"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M12 2.5 13.9 8.1 19.5 10 13.9 11.9 12 17.5 10.1 11.9 4.5 10 10.1 8.1z" />
                            <path d="M18.5 15.5 19.4 18.1 22 19 19.4 19.9 18.5 22.5 17.6 19.9 15 19 17.6 18.1z" />
                          </svg>
                          AI scan
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {[
                        { k: "bust", label: "Bust" },
                        { k: "waist", label: "Waist" },
                        { k: "hip", label: "Hip" },
                        { k: "shoulder", label: "Shoulder" },
                        { k: "sleeve", label: "Sleeve length" },
                        { k: "length", label: "Garment length" },
                      ].map((m) => (
                        <Field
                          key={m.k}
                          id={`p-${m.k}`}
                          label={`${m.label} (${form.unit})`}
                          value={form[m.k]}
                          onChange={set(m.k)}
                          inputMode="decimal"
                        />
                      ))}
                    </div>

                    <Field
                      id="p-height"
                      label="Height"
                      value={form.height}
                      onChange={set("height")}
                    />

                    <div>
                      <label
                        htmlFor="p-fit"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Fit notes
                      </label>
                      <textarea
                        id="p-fit"
                        rows={3}
                        value={form.fitNote}
                        onChange={(e) => set("fitNote")(e.target.value)}
                        placeholder="Anything a draper should know — posture, a shoulder that sits lower, sleeves you prefer looser."
                        style={{ fontSize: 16 }}
                        className="w-full px-3.5 py-3 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted resize-none focus:outline-none focus:border-primary transition-colors"
                      />
                    </div>
                  </Section>

                  <Section
                    title="Address"
                    note="Where the finished piece is dispatched. Duties are prepaid to this country."
                  >
                    {/* Saved shortcuts. Tapping one swaps the fields below;
                        the open one is committed first so edits are not lost. */}
                    <div>
                      <span
                        id="saved-label"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Saved addresses
                      </span>
                      <div
                        className="flex flex-wrap items-center gap-2"
                        role="group"
                        aria-labelledby="saved-label"
                      >
                        {(form.addresses || []).map((a) => {
                          const on = a.id === form.activeAddress;
                          return (
                            <button
                              key={a.id}
                              type="button"
                              aria-pressed={on}
                              onClick={() => selectAddress(a.id)}
                              className={`min-h-[44px] px-3.5 rounded-full border text-[12.5px] transition-colors ${
                                on
                                  ? "border-primary bg-primary text-onprimary font-medium"
                                  : "border-hairline bg-card text-ink hover:border-ctrl"
                              }`}
                            >
                              {a.label || "Untitled address"}
                            </button>
                          );
                        })}

                        <button
                          type="button"
                          onClick={addAddress}
                          className="min-h-[44px] px-3.5 rounded-full border border-dashed border-ctrl text-[12.5px] font-medium text-primary hover:bg-inset active:scale-95 transition-all"
                        >
                          + Add new
                        </button>
                      </div>
                    </div>

                    <Field
                      id="p-label"
                      label="Shortcut name"
                      value={form.label}
                      onChange={set("label")}
                      autoComplete="off"
                    />

                    <Field
                      id="p-line1"
                      label="Address line 1"
                      value={form.line1}
                      onChange={set("line1")}
                      autoComplete="address-line1"
                    />
                    <Field
                      id="p-line2"
                      label="Address line 2"
                      value={form.line2}
                      onChange={set("line2")}
                      autoComplete="address-line2"
                    />
                    <div className="grid grid-cols-2 gap-3">
                      <Field
                        id="p-city"
                        label="City"
                        value={form.city}
                        onChange={set("city")}
                        autoComplete="address-level2"
                      />
                      <Field
                        id="p-region"
                        label="State / Province"
                        value={form.region}
                        onChange={set("region")}
                        autoComplete="address-level1"
                      />
                      <Field
                        id="p-postcode"
                        label="Postal code"
                        value={form.postcode}
                        onChange={set("postcode")}
                        autoComplete="postal-code"
                      />
                      <Field
                        id="p-country"
                        label="Country"
                        value={form.country}
                        onChange={set("country")}
                        autoComplete="country-name"
                      />
                    </div>

                    {(form.addresses || []).length > 1 && (
                      <button
                        type="button"
                        onClick={() => removeAddress(form.activeAddress)}
                        className="self-start min-h-[44px] -my-1 text-[14px] font-medium text-ink underline underline-offset-4 decoration-2 decoration-ctrl hover:text-primary hover:decoration-primary transition-colors"
                      >
                        Remove this address
                      </button>
                    )}
                  </Section>

                  <p className="text-[11.5px] text-muted leading-relaxed">
                    Your measurements stay with your commission and are never shown on a
                    public profile. Alterations are covered under the Perfect Fit Guarantee.
                  </p>
                </div>

                {/* Save stays put while the form scrolls. */}
                <div className="shrink-0 border-t border-hairline bg-card px-4 pt-3.5 pb-5 flex items-center gap-3">
                  <button
                    type="button"
                    onClick={goBack}
                    className="min-h-[48px] px-5 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 min-h-[48px] px-5 rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                  >
                    Save changes
                  </button>
                </div>
              </form>

              {scanOpen && (
                <AiScanModal
                  onClose={() => setScanOpen(false)}
                  onDone={(n) => {
                    setScanOpen(false);
                    setToastMsg(
                      `${n} photographs saved — Meera will confirm your fourteen points within a day`
                    );
                    window.setTimeout(() => setToastMsg(""), 3800);
                  }}
                />
              )}

              <div className="home-pill-line" aria-hidden="true" />
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
