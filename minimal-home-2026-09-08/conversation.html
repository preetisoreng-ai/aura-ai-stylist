<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Aura — Stylist Conversation</title>
    <meta
      name="description"
      content="Aura stylist workbench — the conversational thread where an occasion brief becomes a set of bespoke design directions, with transparent lead times and landed cost."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      /* Attachment popup — Figma 36:1267. Frosted glass over the canvas. */
      .attachment-popup {
        background: rgb(255 255 255 / 0.7);
        border: 1px solid rgb(255 255 255 / 0.6);
        box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .attachment-popup {
          background: var(--card);
          border-color: rgb(var(--hairline-rgb) / 0.9);
        }
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect, useLayoutEffect, useCallback } = React;

      const reducedMotion = () =>
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const SHIP_TO = {
        US: {
          code: "US",
          symbol: "$",
          label: "US $",
          flag: "🇺🇸",
          duty: "Duties prepaid",
          courier: "DHL Express · 4 days",
        },
        UK: {
          code: "UK",
          symbol: "£",
          label: "UK £",
          flag: "🇬🇧",
          duty: "VAT prepaid",
          courier: "DHL Express · 3 days",
        },
        CA: {
          code: "CA",
          symbol: "C$",
          label: "CA $",
          flag: "🇨🇦",
          duty: "Duties prepaid",
          courier: "DHL Express · 5 days",
        },
        IN: {
          code: "IN",
          symbol: "₹",
          label: "INR ₹",
          flag: "🇮🇳",
          duty: "No import duty",
          courier: "Blue Dart · 2 days",
        },
      };

      /* ===================================================================
       BRIEF PARSING
       A light, honest read of the free-text brief. Anything Aura cannot
       infer is shown as "Not set yet" rather than invented — the customer
       should always see which facts are theirs and which are assumed.
       =================================================================== */
      const OCCASIONS = [
        { key: "wedding", match: /\bwedding\b/i, label: "Wedding", weeks: "3 to 5 weeks" },
        { key: "sangeet", match: /\bsangeet\b/i, label: "Sangeet", weeks: "3 to 4 weeks" },
        { key: "reception", match: /\breception\b/i, label: "Reception", weeks: "4 to 6 weeks" },
        { key: "diwali", match: /\bdiwali\b/i, label: "Diwali", weeks: "2 to 3 weeks" },
        {
          key: "temple",
          match: /\btemple|puja|pooja\b/i,
          label: "Temple / Puja",
          weeks: "1 to 2 weeks",
        },
        { key: "mehendi", match: /\bmehendi|mehndi\b/i, label: "Mehendi", weeks: "3 to 4 weeks" },
        { key: "haldi", match: /\bhaldi\b/i, label: "Haldi", weeks: "2 to 3 weeks" },
        {
          key: "griha",
          match: /\bgriha|housewarming\b/i,
          label: "Griha Pravesh",
          weeks: "2 to 3 weeks",
        },
        {
          key: "cocktail",
          match: /\bcocktail\b/i,
          label: "Cocktail evening",
          weeks: "4 to 5 weeks",
        },
        { key: "annapras", match: /\bannaprashan\b/i, label: "Annaprashan", weeks: "2 to 3 weeks" },
      ];

      const GARMENTS = [
        { match: /\blehenga\b/i, label: "Lehenga" },
        { match: /\bsaree|sari\b/i, label: "Saree" },
        { match: /\bsherwani\b/i, label: "Sherwani" },
        { match: /\banarkali\b/i, label: "Anarkali" },
        { match: /\bkurta\b/i, label: "Kurta set" },
        { match: /\bsuit\b/i, label: "Suit set" },
      ];

      const CITIES = [
        "Jaipur",
        "London",
        "Chicago",
        "New York",
        "Chennai",
        "Toronto",
        "Delhi",
        "Mumbai",
        "Dubai",
        "Singapore",
        "Bangalore",
        "Hyderabad",
        "San Francisco",
        "Houston",
        "Vancouver",
        "Melbourne",
        "Sydney",
      ];

      const MONTHS = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      function parseBrief(text, ship) {
        const t = text || "";

        const occasion = OCCASIONS.find((o) => o.match.test(t)) || null;
        const garment = GARMENTS.find((g) => g.match.test(t)) || null;
        const city = CITIES.find((c) => new RegExp("\\b" + c + "\\b", "i").test(t)) || null;
        const month = MONTHS.find((m) => new RegExp("\\b" + m + "\\b", "i").test(t)) || null;

        // Budget: a currency symbol or code followed by a number, either order.
        const budgetMatch =
          t.match(/(?:budget[^0-9]{0,12})?([$£₹]|C\$|USD|GBP|INR|CAD)\s?([0-9][0-9,\.]*)/i) ||
          t.match(/([0-9][0-9,\.]*)\s?(USD|GBP|INR|CAD|dollars|pounds|rupees)/i);

        let budget = null;
        if (budgetMatch) {
          const digits =
            budgetMatch[2] && /[0-9]/.test(budgetMatch[2]) ? budgetMatch[2] : budgetMatch[1];
          const unit =
            budgetMatch[2] && /[0-9]/.test(budgetMatch[2]) ? budgetMatch[1] : budgetMatch[2];
          const symbol = /[$£₹]|C\$/.test(unit)
            ? unit
            : { USD: "$", GBP: "£", INR: "₹", CAD: "C$", dollars: "$", pounds: "£", rupees: "₹" }[
                unit
              ] || ship.symbol;
          // Trim sentence punctuation the number pattern picks up ("$600." → "$600").
          budget = symbol + digits.replace(/[.,]+$/, "");
        }

        return {
          occasion: occasion ? occasion.label : null,
          lead: occasion ? occasion.weeks : "3 to 5 weeks",
          leadAssumed: !occasion,
          garment: garment ? garment.label : null,
          city,
          month,
          budget,
        };
      }

       =================================================================== */

        return [

            },
            note: `A cleaner, architectural take — fewer surface motifs, more shape. Easy to move in, and reads contemporary against traditional dress codes.`,
            fabric: "Chanderi silk-cotton, hand-finished seams",
            weight: "Approx. 1.3 kg finished",
            care: "Dry clean · steam rather than press",
            includes: "Blouse, skirt, sculpted stole",
            from: 640,
            weeks: brief.lead,
            swatch: ["#3B2A5A", "#B7A7C6", "#FBF8F3"],
          },
          {
            id: "light",

            image: "images/featherweight_organza.jpg",
            jewelry: {
              name: "Lilac Meenakari & Pearl Chandbalis",
              type: "Meenakari Chandbalis & Choker",
              craft: "Hand-painted enamel & tourmaline drops",
              image: "images/jewelry_featherweight.jpg",
              pairingNote:
                "Airy pastel hues match lightweight organza and delicate hand Chikankari.",
            },
            note: `Built for long events and warm rooms. Under 900g finished, packs flat, and holds its shape after a full day of wear.`,
            fabric: "Silk organza, hand aari embroidery",
            weight: "Under 900 g finished",
            care: "Dry clean · hang on a padded hanger",
            includes: "Blouse, skirt, sheer dupatta",
            from: 520,

            swatch: ["#D9C7A7", "#C89B3C", "#6A5D82"],
          },
          {
            id: "regal",

                "Regal ruby warmth anchors deep wine velvet and raised metallic zardozi.",
            },
            note: `The most formal of the four — silk velvet carrying raised zardozi on the bodice and hem. Built for evening light and photographs.`,
            fabric: "Silk velvet, raised zardozi handwork",
            weight: "Approx. 2.6 kg finished",
            care: "Dry clean only · never fold across the work",
            includes: "Blouse, skirt, embroidered dupatta",

      }

      /* Framings of the garment photograph and the paired jewelry close-up. */
      /* ===================================================================
       PIECES YOU CAN ARRIVE WITH
       Tapping a garment on home opens this screen with that piece attached
       to your opening line. Four of them are the same pieces the stylist
       offers as directions, so they reuse those records rather than
       restating them; the rest are described here.
       =================================================================== */
      const TILE_TO_DIRECTION = {

      const EXTRA_PIECES = {

          fabric: "Pure mulberry silk, three-ply zari",
          weight: "Approx. 800 g",

          includes: "Saree with unstitched blouse piece",

          weight: "Varies by piece",
          care: "Dry clean only \u00b7 store flat in muslin",
          includes: "Priced per piece \u00b7 measured together",
          from: 540,
          weeks: "6 to 8 weeks",
          swatch: ["#C89B3C", "#E8D9B5", "#F3EEE4"],
        },
        "blush-pastel": {
          id: "blush-pastel",
          name: "Blush silk, pastel set",
          short: "Raw silk with meenakari",
          craft: "Meenakari pairing \u00b7 Jaipur",
          image: "images/jewelry_featherweight.jpg",
          note: "Blush raw silk paired with hand-enamelled meenakari and freshwater pearl. Built for daytime \u2014 mehendi, haldi, a morning ceremony where heavy gold reads wrong.",
          fabric: "Raw silk, hand-enamelled meenakari, pearl",
          weight: "Under 700 g",
          care: "Dry clean \u00b7 keep enamel away from scent",
          includes: "Drape and blouse \u00b7 jewellery sold separately",
          from: 460,
          weeks: "3 to 4 weeks",
          swatch: ["#E9C9CE", "#C89B3C", "#F4EEE8"],
        },
      };

      // Null whenever the key names nothing we can actually describe, so the
      // attachment stays a picture rather than a button that opens nothing.
      function pieceFor(key, directions) {
        if (!key) return null;
        const dirId = TILE_TO_DIRECTION[key];
        if (dirId) return directions.find((d) => d.id === dirId) || null;
        return EXTRA_PIECES[key] || null;
      }

      /* ===================================================================
       SEE FIT
       The measurements a piece would be cut to, shown before anything is
       cut. They come from the same store the Profile and Wardrobe screens
       write to, so all three agree. You either confirm them or replace them.
       =================================================================== */
      const FIT_STORE = "aura.profile.v1";

      const FIT_ROWS = [
        { k: "bust", label: "Bust" },
        { k: "waist", label: "Waist" },
        { k: "hip", label: "Hip" },
        { k: "shoulder", label: "Shoulder" },
        { k: "sleeve", label: "Sleeve length" },
        { k: "length", label: "Garment length" },
        { k: "height", label: "Height" },
      ];

      // What the Profile screen starts from, so the thread never shows blanks
      // to somebody who has simply never opened Profile.
      const FIT_SEED = {
        unit: "in",
        bust: "36",
        waist: "30",
        hip: "39",
        shoulder: "15",
        sleeve: "22",
        length: "41",
        height: "5'5\"",
        fitNote: "",
      };

      function readFit() {
        try {
          const raw = window.localStorage.getItem(FIT_STORE);
          const saved = raw ? JSON.parse(raw) : null;
          return Object.assign({}, FIT_SEED, saved && typeof saved === "object" ? saved : {});
        } catch (e) {
          return Object.assign({}, FIT_SEED);
        }
      }

      /* Family members and their measurements, as the Wardrobe screen keeps
         them. Read-only here — this screen only picks from the list. */
      const FIT_FAMILY_STORE = "aura.family.v1";

      function readFitPeople() {
        const self = readFit();
        const people = [
          {
            id: "self",
            name: "Your measurements",
            relation: "",
            m: self,
            values:
              self.measuredCount !== undefined
                ? self.measuredCount
                : FIT_ROWS.filter((r) => (self[r.k] || "").trim()).length,
            updated: self.measuredAt || "",
          },
        ];

        try {
          const raw = window.localStorage.getItem(FIT_FAMILY_STORE);
          const saved = raw ? JSON.parse(raw) : null;
          if (Array.isArray(saved)) {
            saved.forEach((f) => {
              people.push({
                id: f.id,
                name: f.name,
                relation: f.relation || "",
                m: Object.assign({}, FIT_SEED, f.m || {}),
                values: f.values || 0,
                updated: f.updated || "",
              });
            });
          }
        } catch (e) {
          /* nobody saved yet, or storage is blocked */
        }

        return people;
      }

      function writeFit(values) {
        try {
          const raw = window.localStorage.getItem(FIT_STORE);
          const saved = raw ? JSON.parse(raw) : {};
          const next = Object.assign({}, saved, values, {
            measuredAt: fitStamp(),
            measuredCount: FIT_ROWS.filter((r) => (values[r.k] || "").trim()).length,
          });
          window.localStorage.setItem(FIT_STORE, JSON.stringify(next));
          return next;
        } catch (e) {
          return Object.assign({}, values);
        }
      }

      function fitStamp() {
        const d = new Date();
        const m = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return "Updated " + d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear();
      }

      /* ===================================================================
       CHECKOUT
       Reached by confirming the measurements a piece will be cut to. Every
       price in Aura is landed, so there is nothing to add here — the summary
       restates what was agreed and the order is placed against it.
       =================================================================== */
      /* Which kind of payment, not the credentials. Card and account numbers
         are taken by the payment provider on its own screen, never here. */
      const PAY_METHODS = [
        { id: "credit", label: "Credit card", note: "Visa, Mastercard, Amex" },
        { id: "debit", label: "Debit card", note: "Visa, Mastercard, RuPay" },
        { id: "upi", label: "UPI", note: "Any UPI app" },
      ];

      function CheckoutPanel({ piece, who, ship, onBack, onPlace }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const [placing, setPlacing] = useState(false);
        const [payOpen, setPayOpen] = useState(false);
        const [payMethod, setPayMethod] = useState("credit");
        const [card, setCard] = useState({ number: "", name: "", exp: "", cvc: "" });
        const [upi, setUpi] = useState("");
        const chosenPay =
          PAY_METHODS.find((m) => m.id === payMethod) || PAY_METHODS[0];

        const isCard = payMethod === "credit" || payMethod === "debit";
        const digits = card.number.replace(/\D/g, "");

        /* Enough to know the field was filled in, not a validity check — a
           real one belongs to the payment provider, along with the details
           themselves. */
        const payReady = isCard
          ? digits.length >= 12 &&
            card.name.trim().length > 1 &&
            /^\d{2}\/\d{2}$/.test(card.exp) &&
            /^\d{3,4}$/.test(card.cvc)
          : /^[\w.\-]{2,}@[\w.\-]{2,}$/.test(upi.trim());

        const setCardField = (k) => (v) =>
          setCard((c) => Object.assign({}, c, { [k]: v }));

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (panelRef.current) panelRef.current.focus();
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onBack();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onBack]);

        const [courierName, courierDays] = (ship.courier || " · ").split(" · ");
        const total = piece.from ? ship.symbol + piece.from : "—";
        const cutFor = who.id === "self" ? "your measurements" : who.name + "'s measurements";

        return (
          <div
            ref={panelRef}
            role="dialog"
            aria-modal="true"
            aria-labelledby="checkout-title"
            tabIndex={-1}
            className="absolute inset-0 z-50 bg-canvas flex flex-col focus:outline-none aura-fade-in"
          >
            <header className="shrink-0 flex items-center gap-1 px-2 pt-3 pb-2 border-b border-hairline bg-canvas">
              <button
                type="button"
                onClick={onBack}
                aria-label="Back to your conversation"
                className="flex items-center gap-1 min-h-[44px] pl-1.5 pr-3 rounded-full text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2.1"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m15 18-6-6 6-6" />
                </svg>
                <span className="text-[13.5px] font-medium">Back to chat</span>
              </button>
              <div className="min-w-0 flex-1 text-right pr-2">
                <h1
                  id="checkout-title"
                  className="font-display text-[20px] text-primary leading-tight truncate"
                >
                  Checkout
                </h1>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto thread-scroll px-4 pt-4 pb-6">
              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2">
                Order summary
              </h2>

              <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                <div className="flex items-center gap-3 p-3">
                  <span className="shrink-0 w-[58px] h-[76px] rounded-xl overflow-hidden bg-inset border border-hairline">
                    {piece.image ? (
                      <img
                        src={piece.image}
                        alt={piece.name}
                        className="w-full h-full object-cover"
                      />
                    ) : (
                      <span
                        aria-hidden="true"
                        className="block w-full h-full"
                        style={{
                          backgroundImage:
                            "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 7px)",
                        }}
                      />
                    )}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-[14px] font-medium text-ink leading-snug">
                      {piece.name}
                    </span>
                    {piece.craft && (
                      <span className="block text-[11.5px] text-muted leading-snug mt-0.5">
                        {piece.craft}
                      </span>
                    )}
                    <span className="block font-mono text-[10.5px] text-muted mt-1.5">
                      Cut to {cutFor}
                    </span>
                  </span>
                </div>

                <dl className="border-t border-hairline divide-y divide-hairline">
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">Garment, cut to measure</dt>
                    <dd className="font-mono text-[13px] text-ink">{total}</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">{ship.duty}</dt>
                    <dd className="font-mono text-[13px] text-muted">Included</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-2.5">
                    <dt className="text-[12.5px] text-muted">{courierName}</dt>
                    <dd className="font-mono text-[13px] text-muted">Included</dd>
                  </div>
                  <div className="flex items-baseline justify-between gap-3 px-4 py-3 bg-inset/50">
                    <dt className="text-[13px] font-medium text-ink">Total, landed</dt>
                    <dd className="font-mono text-[17px] text-ink">{total}</dd>
                  </div>
                </dl>
              </div>

              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2">
                Delivery
              </h2>
              <div className="bg-card border border-hairline rounded-2xl px-4 py-3">
                <p className="text-[13px] text-ink leading-snug">{courierName}</p>
                <p className="font-mono text-[10.5px] text-muted mt-1">
                  {courierDays} once the piece is approved and dispatched
                </p>
              </div>

              <h2 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2">
                Payment
              </h2>
              <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                <button
                  type="button"
                  onClick={() => setPayOpen((v) => !v)}
                  aria-expanded={payOpen}
                  aria-controls="pay-methods"
                  className="w-full text-left px-4 py-3 flex items-center justify-between gap-3 hover:bg-inset/50 transition-all"
                >
                  <span className="min-w-0">
                    <span className="block text-[13px] text-ink leading-snug">
                      {chosenPay.label}
                    </span>
                    <span className="block font-mono text-[10.5px] text-muted mt-1 truncate">
                      {chosenPay.note}
                    </span>
                  </span>
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                    className={
                      "shrink-0 text-muted transition-transform " +
                      (payOpen ? "rotate-180" : "")
                    }
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>

                {payOpen && (
                  <div
                    id="pay-methods"
                    role="radiogroup"
                    aria-label="Payment method"
                    className="border-t border-hairline p-2 flex flex-col gap-1.5 aura-fade-in"
                  >
                    {PAY_METHODS.map((pm) => {
                      const on = pm.id === payMethod;
                      return (
                        <button
                          key={pm.id}
                          type="button"
                          role="radio"
                          aria-checked={on}
                          onClick={() => {
                            setPayMethod(pm.id);
                            setPayOpen(false);
                          }}
                          className={
                            "w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-xl border transition-all active:scale-[0.99] " +
                            (on
                              ? "border-primary bg-inset/60"
                              : "border-hairline hover:border-primary/45")
                          }
                        >
                          <span
                            aria-hidden="true"
                            className={
                              "shrink-0 w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center " +
                              (on ? "border-primary" : "border-ctrl")
                            }
                          >
                            {on && <span className="w-2 h-2 rounded-full bg-primary" />}
                          </span>
                          <span className="min-w-0 flex-1">
                            <span className="block text-[13px] font-medium text-ink truncate">
                              {pm.label}
                            </span>
                            <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                              {pm.note}
                            </span>
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              {isCard ? (
                <div className="bg-card border border-hairline rounded-2xl p-4 mt-2.5 aura-fade-in">
                  <label
                    htmlFor="pay-number"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                  >
                    Card number
                  </label>
                  <input
                    id="pay-number"
                    type="text"
                    inputMode="numeric"
                    autoComplete="cc-number"
                    value={card.number}
                    onChange={(e) =>
                      setCardField("number")(
                        e.target.value
                          .replace(/\D/g, "")
                          .slice(0, 16)
                          .replace(/(.{4})/g, "$1 ")
                          .trim()
                      )
                    }
                    placeholder="0000 0000 0000 0000"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />

                  <label
                    htmlFor="pay-name"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5 mt-3.5"
                  >
                    Name on card
                  </label>
                  <input
                    id="pay-name"
                    type="text"
                    autoComplete="cc-name"
                    value={card.name}
                    onChange={(e) => setCardField("name")(e.target.value)}
                    placeholder="As printed on the card"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />

                  <div className="grid grid-cols-2 gap-3 mt-3.5">
                    <div>
                      <label
                        htmlFor="pay-exp"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Expiry
                      </label>
                      <input
                        id="pay-exp"
                        type="text"
                        inputMode="numeric"
                        autoComplete="cc-exp"
                        value={card.exp}
                        onChange={(e) => {
                          const d = e.target.value.replace(/\D/g, "").slice(0, 4);
                          setCardField("exp")(
                            d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d
                          );
                        }}
                        placeholder="MM/YY"
                        style={{ fontSize: 16 }}
                        className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                      />
                    </div>
                    <div>
                      <label
                        htmlFor="pay-cvc"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        CVC
                      </label>
                      <input
                        id="pay-cvc"
                        type="text"
                        inputMode="numeric"
                        autoComplete="cc-csc"
                        value={card.cvc}
                        onChange={(e) =>
                          setCardField("cvc")(e.target.value.replace(/\D/g, "").slice(0, 4))
                        }
                        placeholder="123"
                        style={{ fontSize: 16 }}
                        className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                      />
                    </div>
                  </div>
                </div>
              ) : (
                <div className="bg-card border border-hairline rounded-2xl p-4 mt-2.5 aura-fade-in">
                  <label
                    htmlFor="pay-upi"
                    className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                  >
                    UPI ID
                  </label>
                  <input
                    id="pay-upi"
                    type="text"
                    inputMode="email"
                    autoComplete="off"
                    value={upi}
                    onChange={(e) => setUpi(e.target.value)}
                    placeholder="yourname@bank"
                    style={{ fontSize: 16 }}
                    className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink font-mono placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
                  />
                  <p className="text-[11.5px] text-muted leading-relaxed mt-2">
                    You will approve the request in your UPI app.
                  </p>
                </div>
              )}

              <p className="text-[11.5px] text-muted leading-relaxed mt-4">
                Nothing is charged until Meera confirms the brief. You approve photographs of the
                finished garment before it is dispatched.
              </p>
            </div>

            <div className="shrink-0 px-4 py-3 bg-canvas">
              <button
                type="button"
                disabled={placing || !payReady}
                onClick={() => {
                  setPlacing(true);
                  onPlace();
                }}
                className="w-full min-h-[52px] rounded-full bg-primary text-onprimary text-[14.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
              >
                {placing
                  ? "Placing\u2026"
                  : payReady
                    ? "Place order"
                    : isCard
                      ? "Add card details"
                      : "Add your UPI ID"}
              </button>
            </div>
          </div>
        );
      }

      /* Every set on file — yours and each family member's — so the piece can
         be cut for whoever it is actually for. Picking one shows its figures. */
      function FitCard({ people, chosenId, onChoose, pieceName }) {
        const chosen = people.find((p) => p.id === chosenId) || people[0];
        const fit = chosen.m;

        return (
          <div className="mt-2.5 bg-card border border-hairline rounded-2xl overflow-hidden">
            <div className="px-4 pt-3 pb-2">
              <h4 className="font-display text-[16px] text-ink leading-tight">
                Whose measurements?
              </h4>
            </div>

            <div
              className="px-3 pb-3 flex flex-col gap-1.5"
              role="radiogroup"
              aria-label="Measurements on file"
            >
              {people.map((p) => {
                const on = p.id === chosen.id;
                return (
                  <button
                    key={p.id}
                    type="button"
                    role="radio"
                    aria-checked={on}
                    onClick={() => onChoose(p.id)}
                    className={
                      "w-full text-left flex items-center gap-2.5 px-3 py-2.5 rounded-xl border transition-all active:scale-[0.99] " +
                      (on
                        ? "border-primary bg-inset/60"
                        : "border-hairline hover:border-primary/45")
                    }
                  >
                    <span
                      aria-hidden="true"
                      className={
                        "shrink-0 w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center " +
                        (on ? "border-primary" : "border-ctrl")
                      }
                    >
                      {on && <span className="w-2 h-2 rounded-full bg-primary" />}
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block text-[13px] font-medium text-ink truncate">
                        {p.name}
                        {p.relation && (
                          <span className="text-muted font-normal">{" \u00b7 " + p.relation}</span>
                        )}
                      </span>
                      <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                        {p.values
                          ? p.values + " values" + (p.updated ? " \u00b7 " + p.updated : "")
                          : "No measurements yet"}
                      </span>
                    </span>
                  </button>
                );
              })}
            </div>

            <div className="px-4 pt-3 pb-2 flex items-baseline justify-between gap-3 border-t border-hairline">
              <h4 className="font-display text-[16px] text-ink leading-tight truncate">
                {chosen.name}
              </h4>
              <span className="font-mono text-[10px] uppercase tracking-wider text-muted shrink-0">
                {fit.unit === "cm" ? "Centimetres" : "Inches"}
              </span>
            </div>
            <dl className="divide-y divide-hairline border-t border-hairline">
              {FIT_ROWS.map((r) => (
                <div key={r.k} className="flex items-baseline justify-between gap-3 px-4 py-2">
                  <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted">
                    {r.label}
                  </dt>
                  <dd className="font-mono text-[13px] text-ink">
                    {(fit[r.k] || "").trim() || "—"}
                  </dd>
                </div>
              ))}
            </dl>
            {fit.fitNote && (fit.fitNote || "").trim() ? (
              <p className="px-4 py-2.5 text-[12px] text-muted leading-relaxed border-t border-hairline">
                {fit.fitNote}
              </p>
            ) : null}
            {pieceName && (
              <p className="px-4 py-2.5 font-mono text-[10px] text-muted border-t border-hairline">
                {pieceName} would be cut to these
              </p>
            )}
          </div>
        );
      }

      /* Confirm them, or replace them. Nothing is cut until one is chosen. */
      function FitChoiceCard({ onApprove, onUpdate }) {
        return (
          <div className="mt-2.5 bg-inset/60 border border-hairline rounded-2xl p-4">
            <p className="text-[13px] text-ink leading-relaxed">
              Are these still right? A piece is cut to them once you confirm.
            </p>
            <div className="flex flex-col gap-2 mt-3">
              <button
                type="button"
                onClick={onApprove}
                className="w-full min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
              >
                Yes, cut to these
              </button>
              <button
                type="button"
                onClick={onUpdate}
                aria-haspopup="dialog"

      /* The same seven points the Profile screen asks for. */
      function FitSheet({ initial, onClose, onSave }) {

        useEffect(() => {

      function getViewsForDirection(d) {
        return [
          {
            id: "full",
            label: "Full length",
            image: d.image,
            scale: 1,
            origin: "50% 50%",
            fit: "contain",
          },
          {
            id: "bodice",
            label: "Bodice & Neckline",
            image: d.image,
            scale: 2.1,
            origin: "50% 20%",
          },
          {
            id: "jewelry",
            label: "Jewellery pairing",
            image: d.jewelry && d.jewelry.image ? d.jewelry.image : d.image,
            isJewelry: true,
            fit: "cover",
          },
          { id: "hem", label: "Hem & Border", image: d.image, scale: 2.1, origin: "50% 86%" },

      }

      const QUICK_REPLIES = [
        "Show me lighter fabrics",
        "Keep it under budget",
        "Something more traditional",
        "How does fitting work?",
        "What's the total landed cost?",
      ];

      /* ===================================================================
       AURA REPLY LOGIC — deterministic, honest responses to follow-ups
       =================================================================== */
      function auraReplyTo(text, brief, ship, directions) {
        const t = text.toLowerCase();
        /* Follow-ups answer with the garments themselves, not a wall of prose —
           the same cards as the opening reply, narrowed to what was asked. */
        const pick = (...ids) =>
          ids.map((id) => directions.find((d) => d.id === id)).filter(Boolean);

        if (/\blight|lighter|weight|heavy|hot|warm\b/.test(t)) {
          return {
            text: "Noted — I'll weight the lighter end. Organza, chanderi and fine cotton-silk all sit under 900g finished, which makes a real difference across a long event.",
            cardsLabel: "Lightest on the body",
            cards: pick("light", "modern"),
          };
        }
        if (/\bbudget|cheap|afford|cost|price|expensive\b/.test(t)) {
          const b = brief.budget ? `your ${brief.budget} budget` : "your budget";
          const cheapest = directions
            .slice()
            .sort((a, x) => a.from - x.from)
            .slice(0, 2);
          return {
            text: `Every price shown is landed — fabric, tailoring, ${ship.duty.toLowerCase()} and ${ship.courier.split(" · ")[0]} shipping to ${ship.code}. Nothing is added at checkout. If ${b} is firm, say so and I'll only show directions that finish inside it.`,
            cardsLabel: `Gentlest on ${brief.budget ? "the budget" : "spend"} · landed to ${ship.code}`,
            cards: cheapest,
          };
        }
        if (/\btradition|classic|heritage|authentic\b/.test(t)) {
          return {
            text: "Then Heritage handloom is your direction. It's a kadhwa Banarasi — the motifs are woven in, not printed or stitched on, so the reverse is as clean as the face. It takes longer on the loom, and it lasts a generation.",
            cardsLabel: "Woven, not printed",
            cards: pick("heritage", "regal"),
          };
        }
        if (/\bfit|fitting|measure|measurement|size\b/.test(t)) {
          return {
            text: "Two options. Send measurements from a tailor you already trust, or do a 6-minute guided video fitting with one of our drapers — they'll take 14 points and note posture. Either way, you approve photos of the finished piece before it's dispatched, and alterations are covered under the Perfect Fit Guarantee.",
            steps: [
              {
                k: "01",
                label: "Measure",
                note: "Your tailor, or a 6-minute video fitting · 14 points",
              },
              {
                k: "02",
                label: "Approve",
                note: "Photographs of the finished garment before dispatch",
              },
              { k: "03", label: "Alter", note: "Covered under the Perfect Fit Guarantee" },
            ],
          };
        }
        if (/\btime|when|deadline|rush|urgent|fast|soon\b/.test(t)) {
          return {
            text: `Realistic lead time for this brief is ${brief.lead} on the loom, plus ${ship.courier.split(" · ")[1]} in transit to ${ship.code}. If your date is tighter than that, say so now — I'd rather change the direction than promise a date the artisan can't hold.`,
            cardsLabel: "Ready soonest",
            cards: pick("light", "modern"),
          };
        }
        return {
          text: "Got it — that's on the brief. Anything else you'd like me to weigh: colour, weight, budget, or how soon you need it in hand?",
        };
      }

      /* ===================================================================
       PRESENTATIONAL PIECES
       =================================================================== */
      /* ===================================================================
       WISHLIST
       Saved pieces, shared by every surface that shows a garment — the
       suggestion cards, the list rows and the detail sheet. Kept in
       localStorage so a heart tapped on Discover is still filled when the
       same piece turns up in a conversation.

       Storage is best-effort: a private window or blocked site data throws,
       and the hearts simply behave as an unsaved session.
       =================================================================== */
      const WISHLIST_KEY = "aura.wishlist";

      function readWishlist() {
        try {
          const raw = window.localStorage.getItem(WISHLIST_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter((x) => typeof x === "string") : [];
        } catch (e) {
          return [];
        }
      }

      function writeWishlist(ids) {
        try {
          window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
        } catch (e) {
          /* saving is a convenience, never a blocker */
        }
      }

      // One source of truth per screen, so a heart tapped on a card updates
      // the sheet sitting on top of it and vice versa.
      function useWishlist() {
        const [ids, setIds] = useState(readWishlist);

        const toggle = useCallback((id) => {
          if (!id) return;
          setIds((cur) => {
            const next = cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
            writeWishlist(next);
            return next;
          });
        }, []);

        // Another tab, or a return trip through the back button.
        useEffect(() => {
          const sync = (e) => {
            if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
          };
          window.addEventListener("storage", sync);
          window.addEventListener("pageshow", sync);
          return () => {
            window.removeEventListener("storage", sync);
            window.removeEventListener("pageshow", sync);
          };
        }, []);

        return {
          ids,
          saved: (id) => ids.indexOf(id) !== -1,
          toggle,
        };
      }

      /* `tone="overlay"` sits on a photograph; `tone="plain"` on a light
         surface. Saved flips to a filled plum heart on white either way. */
      function HeartButton({ saved, onToggle, name, tone, className }) {
        const overlay = tone !== "plain";
        const base =
          "shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-90";
        const skin = saved
          ? "bg-card text-primary shadow-sm border border-hairline"

            ? "bg-black/35 text-white border border-white/25 hover:bg-black/55"
            : "bg-card text-muted border border-hairline hover:text-primary hover:border-primary/45";

        return (
          <button
            type="button"
            aria-pressed={saved}
            aria-label={
              saved ? `Remove ${name} from your wishlist` : `Save ${name} to your wishlist`
            }
            onClick={(e) => {
              // Cards are buttons themselves; never open the sheet from here.
              e.preventDefault();
              e.stopPropagation();
              onToggle();
            }}
            className={`${base} ${skin} ${className || ""}`}
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill={saved ? "currentColor" : "none"}
              stroke="currentColor"
              strokeWidth={saved ? 0 : 1.9}
              strokeLinecap="round"
              strokeLinejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 20.5 3.9 12.6a5 5 0 0 1 7.1-7.1l1 1 1-1a5 5 0 0 1 7.1 7.1Z" />
            </svg>
          </button>
        );
      }
      function BriefCard({ brief, ship }) {
        const rows = [
          { k: "Occasion", v: brief.occasion, fallback: "Not set yet" },
          { k: "Garment", v: brief.garment, fallback: "Open to suggestions" },

              {rows.map((r) => (

              <div className="flex items-baseline justify-between gap-3 pt-2 border-t border-hairline">
                <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted shrink-0">
                  Ship to
                </dt>
                <dd className="font-mono text-[12px] text-ink font-medium text-right">

                </dd>
              </div>
              <div className="flex items-baseline justify-between gap-3">
                <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted shrink-0">
                  Lead time
                </dt>
                <dd className="font-mono text-[12px] text-ink font-medium text-right">
                  {brief.lead}
                  {brief.leadAssumed && (
                    <span className="block font-sans text-[11px] text-muted font-normal italic">
                      estimated — confirm your date
                    </span>
                  )}

              </div>
            </dl>
          </div>
        );
      }

      /* A garment photograph, framed. Falls back to a woven-pattern panel in
         the direction's own palette if the file is missing. */
      function Photo({ d, view, alt }) {
        const [failed, setFailed] = React.useState(false);

        const src = (view && view.image) || d.image;

        if (failed || !src) {
          return (
            <div
              className="w-full h-full"
              role="img"
              aria-label={`${d.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${d.swatch[0]} 0%, ${d.swatch[2]} 55%, ${d.swatch[1]} 100%)`,
              }}
            >
              <div
                className="w-full h-full opacity-30"
                style={{
                  backgroundImage:
                    "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 7px)",
                }}
              />
            </div>
          );
        }

        return (
          <img
            src={(view && view.image) || d.image}
            alt={alt}
            loading="eager"
            onError={() => setFailed(true)}
            className="w-full h-full select-none"
            style={{
              objectFit: view.fit || "cover",
              transform: `scale(${view.scale})`,
              transformOrigin: view.origin,
            }}
            draggable="false"
          />
        );
      }

      /* Grid card: photograph first, then one line of title, price, description. */
      function DirectionCard({ d, ship, onOpen, saved, onSave }) {
        return (
          <div className="relative">
            <button
              type="button"
              onClick={() => onOpen(d)}
              aria-haspopup="dialog"
              className="group block w-full text-left bg-card border border-hairline rounded-2xl overflow-hidden hover:border-primary/45 hover:shadow-md active:scale-[0.985] transition-all"
            >
              <span className="block relative w-full aspect-[3/4] bg-inset overflow-hidden">
                <Photo
                  d={d}
                  view={{ ...getViewsForDirection(d)[0], fit: "cover" }}
                  alt={`${d.name} — ${d.short}`}
                />
                <span
                  className="absolute bottom-2 right-2 flex gap-1 items-center rounded-full bg-black/45 px-1.5 py-1 border border-white/25"
                  aria-hidden="true"
                >
                  {d.swatch.map((c, i) => (
                    <span
                      key={i}
                      className="w-2.5 h-2.5 rounded-full border border-white/50"
                      style={{ backgroundColor: c }}
                    />
                  ))}
                </span>
              </span>

              <span className="block px-2.5 py-2.5">
                <span className="block font-display text-[17px] text-ink leading-tight truncate">
                  {d.name}
                </span>
                <span className="block font-mono text-[14px] text-ink font-semibold mt-1">
                  {ship.symbol}
                  {d.from}
                </span>
                <span className="block font-sans text-[11.5px] text-muted truncate mt-0.5">
                  {d.short}
                </span>
              </span>

            {onSave && (
              <HeartButton
                saved={saved}
                onToggle={onSave}
                name={d.name}
                className="absolute top-2 right-2"
              />
            )}
          </div>

      }

      /* Full view: slides up from the bottom over 90% of the screen, with a
         swipeable carousel of framings and a close control at top right. */
      /* What you tapped, carried into the conversation. It opens the piece's
         details when there are details to open. */
      function MessageAttachment({ context, directions, onOpen }) {
        // A name is enough to show something; not every piece has a
        // photograph yet, and a woven placeholder reads better than nothing.
        if (!context || (!context.image && !context.name)) return null;
        const piece = pieceFor(context.piece, directions);

        const inner = (
          <React.Fragment>
            {context.image ? (
              <img
                src={context.image}
                alt={context.name + " \u2014 " + (context.label || "")}
                loading="eager"
                className="block w-full h-[112px] object-cover"
              />
            ) : (
              <span
                role="img"
                aria-label={context.name + " \u2014 photograph not yet available"}
                className="block w-full h-[112px] bg-inset"
                style={{
                  backgroundImage:
                    "repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 7px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 7px)",
                }}
              />
            )}
            <span className="block px-2.5 py-1.5">
              <span className="block text-[11.5px] text-ink font-medium leading-tight truncate">
                {context.name}
              </span>
              <span className="block font-mono text-[10px] text-muted truncate mt-0.5">
                {piece ? "Tap for details" : context.label}
              </span>
            </span>
          </React.Fragment>
        );

        const skin =
          "mb-1.5 ml-auto w-[136px] rounded-2xl overflow-hidden border border-hairline bg-card shadow-sm";

        if (!piece) {
          return <figure className={skin}>{inner}</figure>;
        }

        return (
          <button
            type="button"
            onClick={() => onOpen(piece)}
            aria-haspopup="dialog"
            aria-label={"Open details for " + piece.name}
            className={
              skin +
              " block text-left hover:border-primary/45 hover:shadow-md active:scale-[0.98] transition-all"
            }
          >
            {inner}
          </button>
        );
      }

      function DirectionSheet({ d, ship, onClose, onRequest, onAsk, saved, onSave }) {
        const trackRef = React.useRef(null);
        const panelRef = React.useRef(null);
        const restoreRef = React.useRef(null);
        const [slide, setSlide] = React.useState(0);
        const views = getViewsForDirection(d);

        React.useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (!items.length) return;
            const a = items[0];
            const z = items[items.length - 1];
            if (e.shiftKey && document.activeElement === a) {
              e.preventDefault();
              z.focus();
            } else if (!e.shiftKey && document.activeElement === z) {
              e.preventDefault();
              a.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        // Derive the active slide from scroll position so a swipe and the dots
        // always agree about which framing is showing.
        const onScroll = () => {
          const el = trackRef.current;
          if (!el) return;
          const i = Math.round(el.scrollLeft / el.clientWidth);
          if (i !== slide) setSlide(Math.max(0, Math.min(views.length - 1, i)));
        };

        const goTo = (i) => {
          const el = trackRef.current;

      /* ===================================================================
         COMPONENT: OVERLAY — same contract as the home screen's drawer.
         Escape to close, background scroll lock, focus moved in on open
         and restored to the trigger on close, focus kept inside while open.
         =================================================================== */
      function Overlay({ open, onClose, labelledBy, align, children }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);

        useEffect(() => {
          if (!open) return;

          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (items.length === 0) return;
            const firstEl = items[0];
            const lastEl = items[items.length - 1];
            if (e.shiftKey && document.activeElement === firstEl) {
              e.preventDefault();
              lastEl.focus();
            } else if (!e.shiftKey && document.activeElement === lastEl) {
              e.preventDefault();
              firstEl.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const restore = restoreRef.current;
            if (restore && typeof restore.focus === "function") restore.focus();
          };
        }, [open, onClose]);

        if (!open) return null;

        return (
          <div
            className={`absolute inset-0 z-50 flex aura-fade-in ${align === "end" ? "justify-end" : "items-end justify-center"}`}
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)", backdropFilter: "blur(2px)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby={labelledBy}
              tabIndex={-1}
              className="focus:outline-none contents"
            >
              {children}
            </div>
          </div>
        );
      }
