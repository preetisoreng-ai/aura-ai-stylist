      /* ===================================================================
       CHAT HISTORY
       Every conversation arrives here with its opening prompt in the URL —
       from the home screen, or from a Request on Discover — so this is the
       one place a chat needs recording. The home screen reads the log back
       and derives the titles.

       Storage is per-browser and best-effort: in a private window or with
       site data blocked this throws, and the log is simply not kept.
       =================================================================== */
      const CHAT_LOG_KEY = "aura.chats";
      const CHAT_LOG_LIMIT = 30;

      function recordChat(prompt, shipCode) {
        const text = (prompt || "").replace(/\s+/g, " ").trim();
        if (!text) return;
        try {
          const raw = window.localStorage.getItem(CHAT_LOG_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          const log = Array.isArray(parsed) ? parsed : [];

          // Re-opening or reloading the same brief bumps the existing entry
          // rather than stacking duplicates in the drawer.
          const existing = log.find((c) => c && c.prompt === text);
          if (existing) {
            existing.at = Date.now();
            existing.ship = shipCode;
          } else {
            log.push({
              id: "c" + Date.now().toString(36),
              prompt: text,
              ship: shipCode,
              at: Date.now(),
            });
          }

          log.sort((a, b) => (b.at || 0) - (a.at || 0));
          window.localStorage.setItem(CHAT_LOG_KEY, JSON.stringify(log.slice(0, CHAT_LOG_LIMIT)));
        } catch (e) {
          /* history is a convenience, never a blocker for the conversation */
        }
      }

      /* ===================================================================
       MAIN
       =================================================================== */
      function App() {
        const wish = useWishlist();
        const params = new URLSearchParams(window.location.search);
        const initialPrompt = (params.get("prompt") || "").trim();
        const [shipCode, setShipCode] = useState(() => (params.get("ship") || "US").toUpperCase());
        const ship = SHIP_TO[shipCode] || SHIP_TO.US;

        const brief = parseBrief(initialPrompt, ship);
        const directions = buildDirections(brief, ship);

        // Keep the key we arrived with: the record it resolves to may be a
        // design direction whose own id ("regal") is not the key ("regal-lehenga").
        const openingPieceKey = (params.get("piece") || "").trim();
        const openingPiece = pieceFor(openingPieceKey, directions);

        /* The screen that sent us here knows the piece even when this one
           does not, so fall back to what it put in the URL. */
        const openingContext = openingPiece
          ? {
              image: openingPiece.image,
              name: openingPiece.name,
              label: openingPiece.craft,
              piece: openingPieceKey,
            }
          : (params.get("name") || "").trim()
            ? {
                image: (params.get("img") || "").trim(),
                name: (params.get("name") || "").trim(),
                label: (params.get("craft") || "").trim(),
                piece: openingPieceKey,
              }
            : undefined;

        // What checkout needs to restate the order.
        const openingPieceRecord = openingContext
          ? {
              name: openingContext.name,
              craft: openingContext.label,
              image: openingContext.image,
              from: (openingPiece && openingPiece.from) || Number(params.get("from")) || null,
            }
          : null;

        // "See Fit" opens the thread on measurements instead of on a brief.
        const isFit = params.get("fit") === "1";
        const fitPieceName =
          (openingContext && openingContext.name) ||
          (initialPrompt.match(/See how the (.+) fits me\./) || [])[1] ||
          "";
        const [fit, setFit] = useState(readFit);
        const [fitPeople, setFitPeople] = useState(readFitPeople);
        const [checkout, setCheckout] = useState(null);
        const [fitWho, setFitWho] = useState("self");
        // A thread can hold more than one fit check, so which card is settled
        // and which one opened the sheet are both tracked per message.
        const [fitSheet, setFitSheet] = useState(null);
        const [settledFits, setSettledFits] = useState({});

        const [messages, setMessages] = useState(() => {
          if (!initialPrompt) return [];
          return [
            {
              id: "u0",
              from: "user",
              text: initialPrompt,
              // Arriving from a garment: show it, and let it be opened.
              context: openingContext,
            },
          ];
        });
        const [typing, setTyping] = useState(Boolean(initialPrompt));
        const [showWork, setShowWork] = useState(false);
        const [inputVal, setInputVal] = useState("");
        const [isListening, setIsListening] = useState(false);
        const [toastMsg, setToastMsg] = useState("");
        const [openDirection, setOpenDirection] = useState(null);
        const [drawerOpen, setDrawerOpen] = useState(false);
        const [composerExpanded, setComposerExpanded] = useState(false);
        // Attachment popup (Figma 36:1267) — Camera / Photos / Files.
        const [attachOpen, setAttachOpen] = useState(false);

        const attachRef = useRef(null);
        const threadRef = useRef(null);
        const bottomRef = useRef(null);
        const inputRef = useRef(null);
        const toastTimer = useRef(null);
        const timers = useRef([]);

        const track = (id) => {
          timers.current.push(id);
          return id;
        };

        // Log the opening brief once per mount so it appears in the home
        // screen's history drawer.
        useEffect(() => {
          recordChat(initialPrompt, shipCode);
        }, [initialPrompt, shipCode]);

        // Attachment popup dismisses on Escape or a click outside it. The
        // popup is a menu, not a dialog, so it does not trap focus.
        useEffect(() => {
          if (!attachOpen) return;
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              setAttachOpen(false);
            }
          };
          const onPointer = (e) => {
            if (attachRef.current && !attachRef.current.contains(e.target)) {
              setAttachOpen(false);
            }
          };
          document.addEventListener("keydown", onKey);
          document.addEventListener("pointerdown", onPointer);
          return () => {
            document.removeEventListener("keydown", onKey);
            document.removeEventListener("pointerdown", onPointer);
          };
        }, [attachOpen]);

        useEffect(
          () => () => {
            timers.current.forEach(clearTimeout);
            if (toastTimer.current) clearTimeout(toastTimer.current);
          },
          []
        );

        // The mobile keyboard shrinks the visual viewport without changing
        // the layout viewport — track it so the composer is never covered.
        useEffect(() => {
          const vv = window.visualViewport;
          if (!vv) return;
          const root = document.documentElement;
          const apply = () => {
            root.style.setProperty("--app-h", vv.height + "px");
          };
          apply();
          vv.addEventListener("resize", apply);
          vv.addEventListener("scroll", apply);
          return () => {
            vv.removeEventListener("resize", apply);
            vv.removeEventListener("scroll", apply);
            root.style.removeProperty("--app-h");
          };
        }, []);

        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        // Opening reply to the brief carried over from the home screen.
        useEffect(() => {
          if (!initialPrompt) return;
          const id = track(
            setTimeout(
              () => {
                setTyping(false);
                setShowWork(!isFit);
                setMessages((m) => [
                  ...m,
                  isFit
                    ? {
                        id: "a0",
                        from: "aura",
                        text: fitPieceName
                          ? `Here are the measurements the ${fitPieceName} would be cut to.`
                          : "Here are the measurements this piece would be cut to.",
                        fit: true,
                        fitChoice: true,
                        fitPiece: fitPieceName,
                        fitRecord: openingPieceRecord,
                      }
                    : {
                        id: "a0",
                        from: "aura",
                        text: brief.occasion
                          ? `${brief.occasion} — good brief to work with. Here's how I've read it, and four directions that answer it differently. Every price is landed to ${ship.code}, and every lead time is what the artisan can actually hold.`
                          : `Here's how I've read your brief, and four directions that answer it differently. Every price is landed to ${ship.code}, and every lead time is what the artisan can actually hold. Tell me what's missing and I'll tighten it.`,
                        work: true,
                      },
                ]);
              },
              reducedMotion() ? 120 : 1100
            )
          );
          return () => clearTimeout(id);
        }, []);

        // Keep the newest message in view without yanking the whole page.
        useEffect(() => {
          const el = bottomRef.current;
          if (!el) return;
          el.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "end" });
        }, [messages, typing]);

        /* `context` attaches the photograph the question came from, so the
           thread shows what was being looked at and Meera answers about it. */
        const send = (raw, context) => {
          const text = (raw || "").trim();
          if (!text) {
            if (inputRef.current) inputRef.current.focus();
            return;
          }
          const uid = "u" + Date.now();
          setMessages((m) => [...m, { id: uid, from: "user", text, context }]);
          setInputVal("");
          setComposerExpanded(false);
          setTyping(true);

          track(
            setTimeout(
              () => {
                setTyping(false);
                setMessages((m) => [
                  ...m,
                  {
                    id: "a" + Date.now(),
                    from: "aura",
                    ...(context && context.replyWith
                      ? context.replyWith
                      : auraReplyTo(text, brief, ship, directions)),
                  },
                ]);
              },
              reducedMotion() ? 120 : 900
            )
          );
        };

        const handleMic = () => {
          if (isListening) {
            setIsListening(false);
            showToast("Voice input stopped");
            return;
          }
          setIsListening(true);
          showToast("Listening — English, Hindi or Hinglish");
          track(
            setTimeout(() => {
              setIsListening(false);
              setInputVal("Kuch lightweight dikhao — the venue gets warm by evening.");
              showToast("Voice transcribed into the composer");
              if (inputRef.current) inputRef.current.focus();
            }, 1800)
          );
        };

        const hasText = inputVal.trim().length > 0;
        const composerOpen = hasText || composerExpanded;

        /* One mic, two homes: inside the resting pill, or in the button row
           once the composer has opened up. */
        const renderMic = (inRow) => (
          <button
            type="button"
            onClick={handleMic}
            aria-label={isListening ? "Stop voice input" : "Start voice input"}
            aria-pressed={isListening}
            className={`w-11 h-11 rounded-full flex items-center justify-center transition-colors ${
              isListening
                ? "bg-primary text-onprimary aura-listening"
                : inRow
                  ? "text-muted hover:text-ink hover:bg-inset active:scale-95"
                  : "bg-inset text-primary hover:bg-selfill active:scale-95"
            }`}
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="22" />
            </svg>
          </button>
        );

        /* Grow the field to fit what has been typed, then scroll inside it. */
        const fitComposer = useCallback(() => {
          const el = inputRef.current;
          if (!el) return;
          if (!composerOpen) {
            el.style.height = "";
            el.style.overflowY = "hidden";
            return;
          }
          el.style.height = "auto";
          const full = el.scrollHeight;
          const max = composerExpanded ? Math.round(window.innerHeight * 0.55) : 198;
          el.style.height = Math.min(full, max) + "px";
          el.style.overflowY = full > max ? "auto" : "hidden";
        }, [composerOpen, composerExpanded]);

        useLayoutEffect(() => {
          fitComposer();
          const frame = requestAnimationFrame(fitComposer);
          window.addEventListener("resize", fitComposer);
          return () => {
            cancelAnimationFrame(frame);
            window.removeEventListener("resize", fitComposer);
          };
        }, [inputVal, fitComposer]);

        /* Webfonts land after first paint and reflow the reply taller, so
           measure again once they have settled. */
        useEffect(() => {
          if (!document.fonts || !document.fonts.ready) return;
          let live = true;
          document.fonts.ready.then(() => {
            if (live) fitComposer();
          });
          return () => {
            live = false;
          };
        }, [fitComposer]);

        /* Rotation, a late stylesheet or a resized window all change how the
           reply wraps -- re-fit on width changes only, never on our own
           height writes. */
        useEffect(() => {
          const el = inputRef.current;
          if (!el || typeof ResizeObserver === "undefined") return;
          let lastWidth = el.clientWidth;
          const ro = new ResizeObserver((entries) => {
            const width = entries[0].contentRect.width;
            if (Math.abs(width - lastWidth) < 0.5) return;
            lastWidth = width;
            fitComposer();
          });
          ro.observe(el);
          return () => ro.disconnect();
        }, [fitComposer]);

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>
            {toastMsg && (
              <div
                aria-hidden="true"
                className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
              >
                <span className="text-gold" aria-hidden="true">
                  ✦
                </span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              {/* ---------- Header ---------- */}
              <header className="shrink-0 z-20 px-3 pt-3 pb-2.5 flex items-center gap-2 border-b border-hairline bg-canvas">
                <a
                  href="index.html"
                  aria-label="Back to home"
                  className="w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.1"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                </a>

                <div className="min-w-0 flex-1">
                  <h1 className="font-display text-[18px] text-ink leading-tight truncate">
                    Personal Designer
                  </h1>
                  <p className="font-mono text-[10.5px] text-muted truncate">
                    Meera R. · master draper · replies in minutes
                  </p>
                </div>

                <button
                  type="button"
                  onClick={() => setDrawerOpen(true)}
                  aria-label="Open navigation menu"
                  aria-haspopup="dialog"
                  aria-expanded={drawerOpen}
                  className="w-11 h-11 mr-1 rounded-full bg-card border border-hairline flex items-center justify-center text-ink shadow-sm hover:border-primary/40 active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.1"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line x1="4" y1="7" x2="20" y2="7" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="17" x2="20" y2="17" />
                  </svg>
                </button>
              </header>

              {/* ---------- Thread ---------- */}
              <div ref={threadRef} className="thread-scroll px-4 py-4">
                <div
                  className="space-y-3.5"
                  role="log"
                  aria-live="polite"
                  aria-label="Conversation with your stylist"
                >
                  {messages.length === 0 && (
                    <div className="text-center pt-10 px-4">
                      <h2 className="font-display text-[24px] text-ink leading-tight">
                        Tell me about the occasion
                      </h2>
                      <p className="text-[13px] text-muted mt-2 leading-relaxed max-w-[280px] mx-auto">
                        Where it is, when it is, and how you want to feel in the room. I'll take it
                        from there.
                      </p>
                    </div>
                  )}

                  {messages.map((m) => (
                    <div
                      key={m.id}
                      className={m.from === "user" ? "flex justify-end" : "flex justify-start"}
                    >
                      <div className={m.from === "user" ? "max-w-[85%]" : "w-full"}>
                        {m.from === "user" ? (
                          <div className="aura-msg-in">
                            <MessageAttachment
                              context={m.context}
                              directions={directions}
                              onOpen={setOpenDirection}
                            />
                            <p className="bg-primary text-onprimary text-[13.5px] leading-relaxed px-4 py-3 rounded-2xl rounded-br-md whitespace-pre-line">
                              {m.text}
                            </p>
                          </div>
                        ) : (
                          <div className="aura-msg-in">
                            <div className="flex items-center gap-2 mb-1.5">
                              <span
                                aria-hidden="true"
                                className="w-5 h-5 rounded-full border-[1.5px] border-primary bg-card flex items-center justify-center"
                              >
                                <span className="w-1.5 h-1.5 rounded-full bg-gold" />
                              </span>
                              <span className="font-mono text-[10px] uppercase tracking-wider text-muted">
                                Aura
                              </span>
                            </div>
                            <p className="bg-card border border-hairline text-ink text-[13.5px] leading-relaxed px-4 py-3 rounded-2xl rounded-tl-md whitespace-pre-line">
                              {m.text}
                            </p>

                            {m.cards && m.cards.length > 0 && (
                              <div className="mt-2.5">
                                <h4 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2 px-0.5">
                                  {m.cardsLabel}
                                </h4>
                                <div className="grid grid-cols-2 gap-2.5">
                                  {m.cards.map((d) => (
                                    <DirectionCard
                                      saved={wish.saved(d.name)}
                                      onSave={() => wish.toggle(d.name)}
                                      key={d.id}
                                      d={d}
                                      ship={ship}
                                      onOpen={setOpenDirection}
                                    />
                                  ))}
                                </div>
                              </div>
                            )}

                            {m.steps && (
                              <ol className="mt-2.5 bg-card border border-hairline rounded-2xl divide-y divide-hairline overflow-hidden">
                                {m.steps.map((st) => (
                                  <li key={st.k} className="flex items-start gap-3 px-4 py-3">
                                    <span
                                      aria-hidden="true"
                                      className="font-mono text-[10.5px] text-goldtext pt-0.5 shrink-0"
                                    >
                                      {st.k}
                                    </span>
                                    <span className="min-w-0">
                                      <span className="block text-[13px] text-ink font-medium leading-tight">
                                        {st.label}
                                      </span>
                                      <span className="block text-[11.5px] text-muted leading-relaxed mt-0.5">
                                        {st.note}
                                      </span>
                                    </span>
                                  </li>
                                ))}
                              </ol>
                            )}

                            {m.order && !m.orderPlaced && (
                              <button
                                type="button"
                                onClick={() => setCheckout(m.order)}
                                aria-haspopup="dialog"
                                className="mt-2.5 w-full min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Review order
                              </button>
                            )}

                            {m.fit && (
                              <FitCard
                                people={fitPeople}
                                chosenId={fitWho}
                                onChoose={setFitWho}
                                pieceName={m.fitPiece}
                              />
                            )}

                            {m.fitChoice && !settledFits[m.id] && (
                              <FitChoiceCard
                                onApprove={() => {
                                  setSettledFits((f) => Object.assign({}, f, { [m.id]: true }));
                                  const who =
                                    fitPeople.find((p) => p.id === fitWho) || fitPeople[0];
                                  // "Meera R." already ends in a stop; do not
                                  // give the sentence a second one.
                                  const forWhom =
                                    who.id === "self" ? "me" : who.name.replace(/\.$/, "");
                                  send(
                                    m.fitPiece
                                      ? `These are right — cut the ${m.fitPiece} for ${forWhom}.`
                                      : `These are right — cut for ${forWhom}.`,
                                    {
                                      replyWith: {
                                        text:
                                          "Noted \u2014 cutting to " +
                                          (who.id === "self"
                                            ? "your measurements"
                                            : who.name + "'s measurements") +
                                          ". Here is what you are placing.",
                                        order: m.fitRecord
                                          ? { piece: m.fitRecord, who: who }
                                          : null,
                                      },
                                    }
                                  );
                                  if (m.fitRecord) {
                                    setCheckout({ piece: m.fitRecord, who: who });
                                  }
                                }}
                                onUpdate={() => setFitSheet({ id: m.id, piece: m.fitPiece })}
                              />
                            )}

                            {/* Measurements can change after the piece is
                                agreed, so the way to replace them stays put
                                however far the conversation runs on. */}
                            {m.fit && (!m.fitChoice || settledFits[m.id]) && (
                              <button
                                type="button"
                                onClick={() => setFitSheet({ id: m.id, piece: m.fitPiece })}
                                aria-haspopup="dialog"
                                className="mt-2.5 w-full min-h-[48px] px-4 rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Add new measurements
                              </button>
                            )}

                            {m.work && showWork && (
                              <div className="mt-1">
                                <BriefCard brief={brief} ship={ship} />

                                <h3 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-5 mb-2 px-0.5">
                                  Four directions
                                </h3>
                                <div className="grid grid-cols-2 gap-2.5">
                                  {directions.map((d) => (
                                    <DirectionCard
                                      saved={wish.saved(d.name)}
                                      onSave={() => wish.toggle(d.name)}
                                      key={d.id}
                                      d={d}
                                      ship={ship}
                                      onOpen={setOpenDirection}
                                    />
                                  ))}
                                </div>

                                <p className="text-[11.5px] text-muted leading-relaxed mt-3 px-0.5">
                                  Prices are landed to {ship.code} — {ship.duty.toLowerCase()},{" "}
                                  {ship.courier}. Nothing is added at checkout. You approve
                                  photographs of the finished garment before it is dispatched.
                                </p>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}

                  {typing && (
                    <div className="flex justify-start">
                      <TypingBubble />
                    </div>
                  )}

                  <div ref={bottomRef} />
                </div>
              </div>

              {/* ---------- Full view: 90% bottom sheet ---------- */}
              {openDirection && (
                <DirectionSheet
                  saved={wish.saved(openDirection.name)}
                  onSave={() => wish.toggle(openDirection.name)}
                  d={openDirection}
                  ship={ship}
                  onClose={() => setOpenDirection(null)}
                  onRequest={(dir) => {
                    // Already in the thread, so the fit check happens here
                    // rather than by navigating to a fresh one.
                    setOpenDirection(null);
                    send(`See how the ${dir.name} fits me.`, {
                      image: dir.image,
                      name: dir.name,
                      label: dir.craft,
                      replyWith: {
                        text: `Here are the measurements the ${dir.name} would be cut to.`,
                        fit: true,
                        fitChoice: true,
                        fitPiece: dir.name,
                        fitRecord: {
                          name: dir.name,
                          craft: dir.craft,
                          image: dir.image,
                          from: dir.from,
                        },
                      },
                    });
                  }}
                  onAsk={(dir, view) => {
                    setOpenDirection(null);
                    const isJewellery = view.id === "jewelry" && dir.jewelry;
                    send(
                      view.id === "full"
                        ? `Tell me more about ${dir.name}`
                        : `Tell me more about the ${view.label.toLowerCase()} of ${dir.name}`,
                      {
                        image: view.image,
                        label: view.label,
                        name: dir.name,
                        replyWith: {
                          text: isJewellery
                            ? `${dir.jewelry.name} — ${dir.jewelry.craft}. ${dir.jewelry.pairingNote}`
                            : `${dir.craft}. ${dir.note} It is ${dir.weeks.toLowerCase()} on the loom once you approve the direction.`,
                          cardsLabel: "The piece you asked about",
                          cards: [dir],
                        },
                      }
                    );
                  }}
                />
              )}

              {/* ---------- Quick replies ---------- */}
              {!composerOpen && (
                <div className="shrink-0 px-4 pb-1 pt-2">
                  <div
                    className="flex gap-2 overflow-x-auto pb-1.5"
                    style={{ scrollbarWidth: "none" }}
                    role="group"
                    aria-label="Suggested replies"
                  >
                    {QUICK_REPLIES.map((q) => (
                      <button
                        key={q}
                        type="button"
                        onClick={() => send(q)}
                        className="reply-chip shrink-0"
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* ---------- Composer ----------
               Rests as a single-line pill. The moment there is text it opens
               into a card: the reply grows upward line by line, and the
               controls move to their own row underneath it. */}
              <div className="relative shrink-0 px-4 pb-2 pt-1 z-40" ref={attachRef}>
                {attachOpen && (
                  <div className="absolute left-4 right-4 bottom-full z-50">
                    <AttachmentPopup
                      onPick={(opt) => {
                        setAttachOpen(false);
                        showToast(opt.hint);
                      }}
                    />
                  </div>
                )}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    send(inputVal);
                  }}
                  className={`composer-bar transition-[border-radius,box-shadow] duration-200 ${
                    composerOpen
                      ? "rounded-[26px] px-3.5 pt-3 pb-2"
                      : "flex items-center gap-1 rounded-full pl-1.5 pr-2 py-1.5"
                  }`}
                >
                  {!composerOpen && (
                    <button
                      type="button"
                      onClick={() => setAttachOpen((v) => !v)}
                      aria-label="Add an attachment"
                      aria-haspopup="menu"
                      aria-expanded={attachOpen}
                      className={`w-11 h-11 shrink-0 self-center rounded-full flex items-center justify-center transition-colors ${
                        attachOpen
                          ? "bg-primary text-onprimary"
                          : "text-primary hover:bg-inset active:scale-95"
                      }`}
                    >
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                      </svg>
                    </button>
                  )}

                  <label htmlFor="aura-reply" className="sr-only">
                    Reply to your stylist
                  </label>

                  <div
                    className={`relative ${composerOpen ? "" : "flex flex-1 min-w-0 items-center min-h-[40px]"}`}
                  >
                    <textarea
                      id="aura-reply"
                      ref={inputRef}
                      rows={1}
                      value={inputVal}
                      onChange={(e) => setInputVal(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" && !e.shiftKey && !composerExpanded) {
                          e.preventDefault();
                          send(inputVal);
                        }
                      }}
                      placeholder="Reply to Meera"
                      className={`aura-reply-field w-full bg-transparent text-ink placeholder:text-muted focus:outline-none resize-none ${
                        composerOpen ? "is-open" : ""
                      }`}
                    />

                    {composerOpen && (
                      <button
                        type="button"
                        onClick={() => setComposerExpanded((v) => !v)}
                        aria-label={
                          composerExpanded ? "Shrink the reply box" : "Expand the reply box"
                        }
                        aria-pressed={composerExpanded}
                        className="absolute -top-2.5 -right-1.5 w-11 h-11 rounded-lg flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition"
                      >
                        <svg
                          width="14"
                          height="14"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2.1"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          {composerExpanded ? (
                            <React.Fragment>
                              <path d="M10 4v6H4" />
                              <path d="M14 20v-6h6" />
                              <path d="m3 21 7-7" />
                              <path d="m21 3-7 7" />
                            </React.Fragment>
                          ) : (
                            <React.Fragment>
                              <path d="M15 3h6v6" />
                              <path d="M9 21H3v-6" />
                              <path d="m21 3-7 7" />
                              <path d="m3 21 7-7" />
                            </React.Fragment>
                          )}
                        </svg>
                      </button>
                    )}

                    {!composerOpen && (
                      <div className="absolute right-0 top-1/2 -translate-y-1/2">
                        {renderMic(false)}
                      </div>
                    )}
                  </div>

                  {composerOpen && (
                    <div className="flex items-center justify-between pt-2">
                      <button
                        type="button"
                        onClick={() => showToast("Attach a photo of a piece you already love")}
                        aria-label="Attach a photo or file"
                        className="w-11 h-11 -ml-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition"
                      >
                        <svg
                          width="19"
                          height="19"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M12 5v14" />
                          <path d="M5 12h14" />
                        </svg>
                      </button>

                      <div className="flex items-center gap-1">
                        {renderMic(true)}
                        {hasText && (
                          <button
                            type="submit"
                            aria-label="Send reply"
                            className="w-11 h-11 rounded-full bg-primary text-onprimary flex items-center justify-center hover:bg-primary/90 active:scale-95 transition-all"
                          >
                            <svg
                              width="17"
                              height="17"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              strokeWidth="2.4"
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              aria-hidden="true"
                              focusable="false"
                            >
                              <path d="M12 19V5" />
                              <path d="m5 12 7-7 7 7" />
                            </svg>
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                </form>

                <div className="home-pill-line" aria-hidden="true" />
              </div>

              {checkout && (
                <CheckoutPanel
                  piece={checkout.piece}
                  who={checkout.who}
                  ship={ship}
                  onBack={() => setCheckout(null)}
                  onPlace={() => {
                    const ref = "AUR-" + String(1000 + Math.floor(Math.random() * 9000));
                    setCheckout(null);
                    // The order is placed; its card must not offer a second go.
                    setMessages((ms) =>
                      ms.map((x) => (x.order ? Object.assign({}, x, { orderPlaced: true }) : x))
                    );
                    send(`Place the order for the ${checkout.piece.name}.`, {
                      replyWith: {
                        text:
                          "Order " +
                          ref +
                          " is placed. Meera starts on it today, and you will see each stage photographed in Orders before anything ships.",
                      },
                    });
                  }}
                />
              )}

              {fitSheet && (
                <FitSheet
                  initial={fit}
                  onClose={() => setFitSheet(null)}
                  onSave={(values) => {
                    const next = writeFit(values);
                    const from = fitSheet;
                    setFit(next);
                    setFitPeople(readFitPeople());
                    setFitWho("self");
                    setFitSheet(null);
                    setSettledFits((f) => Object.assign({}, f, { [from.id]: true }));
                    send("I've measured again — use these instead.", {
                      replyWith: {
                        text: "Updated. Meera will cut to the new figures and send photographs before dispatch.",
                        fit: true,
                        fitPiece: from.piece,
                      },
                    });
                  }}
                />
              )}

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <div className="bg-card w-4/5 max-w-xs h-full p-5 flex flex-col justify-between border-l border-hairline shadow-2xl drawer-slide-in overflow-y-auto">
                  <div className="space-y-6">
                    {/* Profile */}
                    <div className="pb-3.5 border-b border-hairline">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span
                            aria-hidden="true"
                            className="relative w-12 h-12 rounded-full bg-gold text-ink font-display text-[19px] flex items-center justify-center shadow-sm"
                          >
                            PS
                          </span>
                          <span className="flex flex-col">
                            <span className="flex items-center gap-1">
                              <span
                                id="drawer-title"
                                className="font-semibold text-[16px] text-ink leading-tight tracking-tight"
                              >
                                Priya Sharma
                              </span>
                              <button
                                type="button"
                                onClick={() => (window.location.href = "profile.html")}
                                aria-label="Edit your profile"
                                className="w-11 h-11 -my-3 -ml-1 -mr-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition-colors shrink-0"
                              >
                                <svg
                                  width="14"
                                  height="14"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="2"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M12 20h9" />
                                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                                </svg>
                              </button>
                              <span
                                className="w-2 h-2 rounded-full bg-[#3F7A4B] shrink-0"
                                role="img"
                                aria-label="Your stylist is online"
                              />
                            </span>
                            <span className="font-mono text-[11px] text-muted mt-0.5">
                              Toronto, ON
                            </span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setDrawerOpen(false)}
                          aria-label="Close navigation menu"
                          className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {/* 5 primary tabs */}
                    <nav aria-label="Primary">
                      <ul className="space-y-1">
                        {[
                          {
                            id: "home",
                            label: "01 · Home",
                            link: "index.html",
                            desc: "Occasion-first landing",
                          },
                          {
                            id: "discover",
                            label: "02 · Discover",
                            link: "discover.html",
                            desc: "Craft & regional provenance",
                          },
                          {
                            id: "design",
                            label: "03 · Design",
                            link: "designers.html",
                            desc: "The makers behind the cloth",
                          },
                          {
                            id: "wardrobe",
                            label: "04 · Wardrobe",
                            link: "wardrobe.html",
                            desc: "Memory & measurements",
                          },
                          {
                            id: "orders",
                            label: "05 · Orders",
                            link: "orders.html",
                            desc: "Live artisan production tracker",
                          },
                        ].map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              aria-current={item.active ? "page" : undefined}
                              onClick={() => {
                                if (item.link) {
                                  window.location.href = item.link;
                                  return;
                                }
                                setDrawerOpen(false);
                                showToast(`${item.label.split("· ")[1]} opens in the next release`);
                              }}
                              className={`w-full text-left p-2.5 min-h-[52px] rounded-r-xl transition-colors border-l-[3px] ${
                                item.active
                                  ? "bg-inset text-primary font-semibold border-primary"
                                  : "hover:bg-selfill text-ink border-transparent"
                              }`}
                            >
                              <span className="block text-[14px]">{item.label}</span>
                              <span className="block text-[11px] text-muted font-normal mt-0.5">
                                {item.desc}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </nav>

                    {/* Dual-geography */}
                    <div className="pt-4 border-t border-hairline space-y-2">
                      <span
                        id="ship-to-label"
                        className="font-mono text-[10.5px] uppercase tracking-wider text-muted font-medium block"
                      >
                        Ship to
                      </span>
                      <div
                        className="flex items-center gap-1.5"
                        role="group"
                        aria-labelledby="ship-to-label"
                      >
                        {Object.values(SHIP_TO).map((c) => (
                          <button
                            key={c.code}
                            type="button"
                            aria-pressed={shipCode === c.code}
                            onClick={() => {
                              setShipCode(c.code);
                              showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                            }}
                            className={`flex-1 min-h-[44px] px-1 rounded-lg border text-[11.5px] font-mono transition-colors ${
                              shipCode === c.code
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            <span aria-hidden="true">{c.flag}</span> {c.code}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Landed-cost disclosure sits at the foot of the drawer
                      (Figma 31:1282) and restates the selected market. */}
                  <div className="pt-6">
                    <p className="text-[11px] text-muted leading-snug">
                      Prices are landed to {shipCode} — {ship.duty}, {ship.courier}. Nothing is
                      added at checkout.
                    </p>
                    <div className="flex items-center justify-between gap-3 pt-3 mt-3 border-t border-hairline text-muted text-[11px] font-mono">
                      <span>Aura v1.0</span>
                      <span className="text-ink">Perfect Fit Guarantee</span>
                    </div>
                  </div>
                </div>
              </Overlay>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
