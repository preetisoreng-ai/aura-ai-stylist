    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */

        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),

      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-1,
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 {
        -webkit-line-clamp: 1;
      }
      .line-clamp-2 {
        -webkit-line-clamp: 2;
      }

      @keyframes auraPing {
        0% { transform: scale(1); opacity: 0.6; }
        75%, 100% { transform: scale(2.4); opacity: 0; }
      }
      .aura-ping {
        animation: auraPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;

      .aura-reply-field {

          opacity: 1;

        from {

        }
        to {

        to {

        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        scrollbar-width: none;
        -ms-overflow-style: none;
      }

          opacity: 1;
        }
      }

        from {

        }

          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {

        *::after {

          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;

        }

        }

    </style>

      /* ===================================================================
             PIECE ROW — the catalogue result when a garment pill is selected.
             A full-width row rather than a grid card, so a filtered lookup reads
             as a list and never gets confused with the curated rails.
             =================================================================== */
/* ===================================================================
       WISHLIST
       Saved pieces, shared by every surface that shows a garment — the
       suggestion cards, the list rows and the detail sheet. Kept in
       localStorage so a heart tapped on Discover is still filled when the
       same piece turns up in a conversation.

       Storage is best-effort: a private window or blocked site data throws,
       and the hearts simply behave as an unsaved session.
       =================================================================== */
const WISHLIST_KEY = "aura.wishlist";

function readWishlist() {
  try {
    const raw = window.localStorage.getItem(WISHLIST_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.filter((x) => typeof x === "string")
      : [];
  } catch (e) {
    return [];
  }
}

function writeWishlist(ids) {
  try {
    window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
  } catch (e) {
    /* saving is a convenience, never a blocker */
  }
}

// One source of truth per screen, so a heart tapped on a card updates
// the sheet sitting on top of it and vice versa.
function useWishlist() {
  const [ids, setIds] = useState(readWishlist);

  const toggle = useCallback((id) => {
    if (!id) return;
    setIds((cur) => {
      const next =
        cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
      writeWishlist(next);
      return next;
    });
  }, []);

  // Another tab, or a return trip through the back button.
  useEffect(() => {
    const sync = (e) => {
      if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
    };
    window.addEventListener("storage", sync);
    window.addEventListener("pageshow", sync);
    return () => {
      window.removeEventListener("storage", sync);
      window.removeEventListener("pageshow", sync);
    };
  }, []);

  return {
    ids,
    saved: (id) => ids.indexOf(id) !== -1,
    toggle,
  };
}

/* `tone="overlay"` sits on a photograph; `tone="plain"` on a light
         surface. Saved flips to a filled plum heart on white either way. */
function HeartButton({ saved, onToggle, name, tone, className }) {
  const overlay = tone !== "plain";
  const base =
    "shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-90";
  const skin = saved
    ? "bg-card text-primary shadow-sm border border-hairline"
    : overlay
      ? "bg-black/35 text-white border border-white/25 hover:bg-black/55"
      : "bg-card text-muted border border-hairline hover:text-primary hover:border-primary/45";

  return (
    <button
      type="button"
      aria-pressed={saved}
      aria-label={
        saved
          ? `Remove ${name} from your wishlist`
          : `Save ${name} to your wishlist`
      }
      onClick={(e) => {
        // Cards are buttons themselves; never open the sheet from here.
        e.preventDefault();
        e.stopPropagation();
        onToggle();
      }}
      className={`${base} ${skin} ${className || ""}`}
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill={saved ? "currentColor" : "none"}
        stroke="currentColor"
        strokeWidth={saved ? 0 : 1.9}
        strokeLinecap="round"
        strokeLinejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 20.5 3.9 12.6a5 5 0 0 1 7.1-7.1l1 1 1-1a5 5 0 0 1 7.1 7.1Z" />
      </svg>
    </button>
  );
}

                     COMPONENT: OVERLAY — same contract as the home screen's drawer.
                     Escape to close, background scroll lock, focus moved in on open
                     and restored to the trigger on close, focus kept inside while open.
                     =================================================================== */
            function Overlay({ open, onClose, labelledBy, align, children }) {
              const panelRef = useRef(null);
              const restoreRef = useRef(null);

              useEffect(() => {
                if (!open) return;

                restoreRef.current = document.activeElement;
                document.body.classList.add("aura-locked");

                const panel = panelRef.current;
                const focusables = () =>
                  Array.from(
                    panel.querySelectorAll(
                      'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
                    )
                  ).filter((el) => el.offsetParent !== null);

                const first = focusables()[0];
                if (first) first.focus();
                else panel.focus();

                const onKeyDown = (e) => {
                  if (e.key === "Escape") {
                    e.stopPropagation();
                    onClose();
                    return;
                  }
                  if (e.key !== "Tab") return;
                  const items = focusables();
                  if (items.length === 0) return;
                  const firstEl = items[0];
                  const lastEl = items[items.length - 1];
                  if (e.shiftKey && document.activeElement === firstEl) {
                    e.preventDefault();
                    lastEl.focus();
                  } else if (!e.shiftKey && document.activeElement === lastEl) {
                    e.preventDefault();
                    firstEl.focus();
                  }
                };

                document.addEventListener("keydown", onKeyDown, true);
                return () => {
                  document.removeEventListener("keydown", onKeyDown, true);
                  document.body.classList.remove("aura-locked");
                  const restore = restoreRef.current;
                  if (restore && typeof restore.focus === "function") restore.focus();
                };
              }, [open, onClose]);

              if (!open) return null;

              return (
                <div
                  className={`absolute inset-0 z-50 flex aura-fade-in ${align === "end" ? "justify-end" : "items-end justify-center"}`}
                  style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)", backdropFilter: "blur(2px)" }}
                  onMouseDown={(e) => {
                    if (e.target === e.currentTarget) onClose();
                  }}
                >
                  <div
                    ref={panelRef}
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby={labelledBy}
                    tabIndex={-1}
                    className="focus:outline-none contents"
                  >
                    {children}
                  </div>
                </div>
              );
            }

/* ===================================================================
       STAGE REVIEW
       Every stage is photographed as it is reached. You can approve what
       you see, or say what is wrong — a concern stops the piece moving on
       until the atelier answers it.

       Verdicts are kept per order and stage so they survive a reload.
       =================================================================== */
const REVIEW_KEY = "aura.stageReviews";

function readReviews() {
  try {
    const raw = window.localStorage.getItem(REVIEW_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function useStageReviews() {
  const [map, setMap] = useState(readReviews);

  const set = useCallback((orderId, stage, verdict, note) => {
    setMap((cur) => {
      const next = {
        ...cur,
        [orderId + ":" + stage]: {
          verdict,
          note: note || "",
          at: new Date().toLocaleDateString(undefined, { day: "numeric", month: "short" }),
          status: verdict === "concern" ? "pending" : undefined,
        },
      };
      try {
        window.localStorage.setItem(REVIEW_KEY, JSON.stringify(next));
      } catch (e) {
        /* a verdict that cannot be stored still shows for this session */
      }
      return next;
    });
  }, []);

  return {
    map,
    get: (orderId, stage) => map[orderId + ":" + stage] || null,
    set,
  };
}

function StageShot({ order, entry, label, className }) {
  const [failed, setFailed] = useState(false);
  const src = entry.image;

  if (failed || !src) {
    return (
      <span
        className={className}
        role="img"
        aria-label={`${label} — no photograph for this stage`}
        style={{
          background: `linear-gradient(150deg, ${order.swatch[0]} 0%, ${order.swatch[2]} 55%, ${order.swatch[1]} 100%)`,
        }}
      />
    );
  }
  return (
    <img
      src={src}
      alt={`${order.name} — ${label}`}
      loading="lazy"
      onError={() => setFailed(true)}
      className={`${className} object-cover`}
      draggable="false"
    />
  );
}

function StageReviewSheet({ order, reviews, onVerdict, onMessage, onClose }) {
  const entries = order.log || [];
  const trackRef = useRef(null);
  const panelRef = useRef(null);
  const restoreRef = useRef(null);
  const [slide, setSlide] = useState(Math.max(0, entries.length - 1));
  const [concern, setConcern] = useState(false);
  const [text, setText] = useState("");

  useEffect(() => {
    restoreRef.current = document.activeElement;
    document.body.classList.add("aura-locked");
    const onKey = (e) => {
      if (e.key === "Escape") {
        e.stopPropagation();
        onClose();
      }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      document.removeEventListener("keydown", onKey, true);
      document.body.classList.remove("aura-locked");
      const r = restoreRef.current;
      if (r && typeof r.focus === "function") r.focus();
    };
  }, [onClose]);

  // Open on the newest stage rather than the oldest. Wait a frame — at mount
  // the slides have no width yet, so offsetLeft is still 0.
  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    const id = requestAnimationFrame(() => {
      const child = el.children[slide];
      if (child) el.scrollLeft = child.offsetLeft - el.offsetLeft;
    });
    return () => cancelAnimationFrame(id);
  }, []);

  const onScroll = () => {
    const el = trackRef.current;
    if (!el) return;
    const i = Math.round(el.scrollLeft / el.clientWidth);
    if (i !== slide) {
      setSlide(Math.max(0, Math.min(entries.length - 1, i)));
      setConcern(false);
    }
  };

  const goTo = (i) => {
    const el = trackRef.current;
    const child = el && el.children[i];
    if (!el || !child) return;
    setSlide(i);
    setConcern(false);
    el.scrollTo({ left: child.offsetLeft - el.offsetLeft, behavior: "smooth" });
  };

  const entry = entries[slide] || {};
  const label = STAGES[slide] || "Stage";
  const verdict = reviews.get(order.id, slide);
  const approved = verdict && verdict.verdict === "approved";
  // Yours, raised on this device, or one already on the order.
  const raised =
    verdict && verdict.verdict === "concern"
      ? verdict
      : entry.concern || null;

  const send = () => {
    const note = text.trim();
    if (!note) return;
    onVerdict(order.id, slide, "concern", note);
    setConcern(false);
    setText("");
  };

  return (
    <div
      className="absolute inset-0 z-50 aura-fade-in"
      style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
      onMouseDown={(e) => {
        if (e.target === e.currentTarget) onClose();

    >
      <div
        ref={panelRef}
        role="dialog"
        aria-modal="true"
        aria-labelledby="stage-sheet-title"
        tabIndex={-1}
        className="absolute inset-x-0 bottom-0 h-[92%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
      >

            className="block w-10 h-1 rounded-full bg-hairline mx-auto"

          <button
            type="button"
            onClick={onClose}
            aria-label="Close stage photographs"
            className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div className="flex-1 overflow-y-auto thread-scroll">
          <div className="px-5 pb-3">
            <h2
              id="stage-sheet-title"
              className="font-display text-[24px] text-ink leading-tight"
            >
              {order.name}
            </h2>
            <p className="font-mono text-[10.5px] text-muted mt-1">
              {order.id} · {order.artisan}
            </p>
          </div>

          {/* One photograph per stage reached. */}
          <div
            ref={trackRef}
            onScroll={onScroll}
            className="flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
            role="group"
            aria-label={`${order.name} stage photographs`}
            tabIndex={0}
            onKeyDown={(e) => {
              if (e.key === "ArrowRight") {
                e.preventDefault();
                goTo(Math.min(entries.length - 1, slide + 1));
              } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                goTo(Math.max(0, slide - 1));
              }
            }}
          >
            {entries.map((en, i) => {
              const v = reviews.get(order.id, i);
              return (
                <div key={i} className="snap-center shrink-0 w-full px-5">
                  <div className="relative w-full h-[38vh] rounded-2xl overflow-hidden bg-inset border border-hairline">
                    <StageShot
                      order={order}

                    />
                    <span className="absolute bottom-3 left-3 text-[12px] font-medium text-white bg-black/55 px-3 py-1.5 rounded-full">
                      {i + 1}. {STAGES[i]}
                    </span>
                    {v && v.verdict && (
                      <span
                        className={`absolute top-3 right-3 font-mono text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-full ${
                          v.verdict === "approved"
                            ? "bg-card text-primary"
                            : "bg-goldtext text-canvas"
                        }`}
                      >
                        {v.verdict === "approved"
                          ? "Approved"
                          : "Concern raised"}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Dots */}
          <div className="flex items-center justify-center gap-1.5 mt-3 px-5 flex-wrap">
            {entries.map((en, i) => {

                    className={`block rounded-full transition-all ${
                      i === slide ? "w-5 h-1.5" : "w-1.5 h-1.5"
                    } ${
                      (v && v.verdict === "concern") || en.concern
                        ? "bg-goldtext"
                        : i === slide
                          ? "bg-primary"
                          : "bg-hairline"
                    }`}
                  />
                </button>
              );
            })}
          </div>

          <div className="px-5 pb-5">
            <p className="font-mono text-[10.5px] uppercase tracking-wider text-muted mt-1">
              {STAGES[slide]} · {entry.at}
            </p>
            <p className="text-[13.5px] text-ink leading-relaxed mt-1.5">
              {entry.note}
            </p>

            {raised && (
              <div className="mt-3.5 rounded-2xl border border-hairline bg-inset/50 p-3.5">
                <div className="flex items-center justify-between gap-3">
                  <span className="font-mono text-[10px] uppercase tracking-wider text-muted">
                    Your concern · {raised.at}

                  <span
                    className={`shrink-0 font-mono text-[9.5px] uppercase tracking-wider px-2 py-0.5 rounded-full border ${
                      (CONCERN_STATUS[raised.status] || CONCERN_STATUS.pending).tone
                    }`}
                    style={
                      raised.status === "done"
                        ? { color: "#3F7A4B", borderColor: "rgba(63,122,75,0.45)" }
                        : undefined
                    }
                  >
                    {(CONCERN_STATUS[raised.status] || CONCERN_STATUS.pending).label}
                  </span>
                </div>

                <p className="text-[13px] text-ink leading-relaxed mt-2">“{raised.note}”</p>

                {raised.reply ? (
                  <p className="text-[12px] text-muted leading-snug mt-2.5">

                )}

                {/* Carries the order, the stage and the concern into the
                    stylist thread so the conversation starts in context. */}
                <button
                  type="button"
                  onClick={() => onMessage(order, slide, raised)}
                  className="mt-3 min-h-[40px] px-3.5 rounded-full bg-card border border-ctrl text-ink text-[12px] font-medium flex items-center gap-1.5 hover:bg-inset hover:border-primary/45 active:scale-95 transition-all"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.9"

        {/* Fixed under the scroll area, so the controls stay put however long

        <div className="shrink-0 border-t border-hairline bg-card px-5 pt-3.5 pb-5">

              >
                Approve this stage
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );

                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="17" x2="21" y2="17" />
                  </svg>
                </button>
              </header>

              <div className="thread-scroll px-4 pt-1 pb-24">
                <p className="text-[12px] text-muted leading-relaxed mb-5">
                  Every commission from the day it is placed. Lead times are what the artisan can
                  actually hold, and you approve photographs before anything is dispatched.
                </p>

                {awaitingYou > 0 && (
                  <div className="mb-6 p-3.5 rounded-2xl border border-goldtext/45 bg-inset/60">
                    <p className="font-mono text-[10.5px] uppercase tracking-wider text-goldtext">
                      Waiting on you
                    </p>
                    <p className="text-[12.5px] text-ink leading-snug mt-1.5">
                      {awaitingYou} piece
                      {awaitingYou > 1 ? "s are" : " is"} finished and needs your approval before it
                      ships.
                    </p>
                  </div>
                )}

                {/* ---------- Live production tracker ---------- */}
                <section className="mb-7" aria-labelledby="prod-title">
                  <SectionTitle id="prod-title" count={`${PRODUCTION.length} in progress`}>
                    In production
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {PRODUCTION.map((o) => (
                      <OrderCard
                        key={o.id}
                        item={o}
                        tone={o.needsYou ? "attention" : undefined}
                        onClick={() => setReviewing(o)}
                        label={`${o.name} — ${STAGES[o.stage]}, open stage photographs`}
                      >
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="text-[14px] font-medium text-ink truncate">{o.name}</span>
                          <span className="font-mono text-[10px] text-muted shrink-0">{o.id}</span>
                        </span>
                        <span className="block text-[11.5px] text-muted leading-snug mt-0.5 line-clamp-1">
                          {o.craft}
                        </span>

                        <StageTrack stage={o.stage} />

                        <p className="text-[11.5px] text-ink leading-snug mt-2">{o.note}</p>
                        <p className="font-mono text-[10.5px] text-muted mt-1.5">
                          {o.artisan} · {o.eta}
                        </p>

                      </OrderCard>
                    ))}
                  </div>
                </section>

                {/* ---------- Group order ---------- */}
                <section className="mb-7" aria-labelledby="grp-title">
                  <SectionTitle id="grp-title" count={`${GROUP.members.length} people`}>
                    Group order
                  </SectionTitle>

                  <div className="rounded-2xl border border-hairline bg-card overflow-hidden">
                    <div className="p-3.5 border-b border-hairline">
                      <p className="text-[14px] font-medium text-ink">{GROUP.title}</p>
                      <p className="font-mono text-[10.5px] text-muted mt-1">
                        {GROUP.when} · {GROUP.organiser}
                      </p>
                      <p className="text-[11.5px] text-goldtext leading-snug mt-1.5">
                        {GROUP.deadline}
                      </p>
                    </div>

                    <ul className="divide-y divide-hairline">
                      {GROUP.members.map((m) => (
                        <li
                          key={m.name}
                          className="flex items-center justify-between gap-3 px-3.5 py-3"
                        >
                          <span className="min-w-0">
                            <span className="block text-[13.5px] text-ink truncate">{m.name}</span>
                            <span className="block text-[11.5px] text-muted truncate mt-0.5">
                              {m.piece}
                            </span>
                          </span>
                          <span
                            className={`shrink-0 font-mono text-[10px] uppercase tracking-wider px-2 py-1 rounded-full border ${
                              m.ok
                                ? "text-muted border-hairline"
                                : "text-goldtext border-goldtext/45"
                            }`}
                          >
                            {m.state}
                          </span>
                        </li>
                      ))}
                    </ul>

                    <div className="px-3.5 py-3 border-t border-hairline bg-inset/50 flex items-center justify-between gap-3">
                      <span className="text-[11px] text-muted leading-snug">
                        Everyone is cut to their own measurements from one shared brief.
                      </span>
                      <button
                        type="button"
                        onClick={() => showToast("Invite sent — they can add measurements from the link")}
                        className="shrink-0 min-h-[44px] -my-2 px-1 text-[12px] font-medium text-primary hover:text-ink transition-colors"
                      >
                        Invite
                      </button>
                    </div>
                  </div>
                </section>

                {/* ---------- Delivery ---------- */}
                <section className="mb-7" aria-labelledby="del-title">
                  <SectionTitle id="del-title" count={`${DELIVERY.length} shipments`}>
                    Delivery
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {DELIVERY.map((d) => (
                      <OrderCard key={d.id} item={d}>
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="text-[14px] font-medium text-ink truncate">{d.name}</span>
                          <span className="font-mono text-[10px] text-muted shrink-0">{d.id}</span>
                        </span>
                        <span
                          className={`block text-[11.5px] leading-snug mt-1 ${
                            d.done ? "text-muted" : "text-ink"
                          }`}
                        >
                          {d.status}
                        </span>
                        <span className="block font-mono text-[10.5px] text-muted mt-1">
                          {d.courier} · {d.eta}
                        </span>
                        {d.duties && (
                          <span className="block text-[11px] text-muted leading-snug mt-1">
                            {d.duties}
                          </span>
                        )}
                        <button
                          type="button"
                          onClick={() => showToast(`Tracking ${d.tracking} · ${d.courier}`)}
                          className="mt-1.5 min-h-[40px] -my-1 text-[12px] font-medium text-primary underline underline-offset-4 decoration-ctrl hover:decoration-primary transition-colors"
                        >
                          Track this parcel
                        </button>
                      </OrderCard>
                    ))}
                  </div>
                </section>

                {/* ---------- Returns ---------- */}
                <section className="mb-7" aria-labelledby="ret-title">
                  <SectionTitle id="ret-title" count={`${RETURNS.length} open`}>
                    Returns
                  </SectionTitle>
                  <p className="text-[11.5px] text-muted leading-snug -mt-1 mb-2.5">
                    Bespoke pieces are cut to you, so returns are for genuine faults or a fit we
                    could not put right. Fourteen days from delivery.
                  </p>

                  <div className="flex flex-col gap-2.5">
                    {RETURNS.map((r) => (
                      <OrderCard key={r.id} item={r}>
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="text-[14px] font-medium text-ink truncate">{r.name}</span>
                          <span className="font-mono text-[10px] text-muted shrink-0">{r.id}</span>
                        </span>
                        <span className="block text-[11.5px] text-muted leading-snug mt-1">
                          {r.reason}
                        </span>
                        <span
                          className={`block text-[11.5px] leading-snug mt-1 ${
                            r.settled ? "text-muted" : "text-ink"
                          }`}
                        >
                          {r.status}
                        </span>
                        {!r.settled && (
                          <button
                            type="button"
                            onClick={() => showToast(`Meera will pick up the return for ${r.name}`)}
                            className="mt-1.5 min-h-[40px] -my-1 text-[12px] font-medium text-primary underline underline-offset-4 decoration-ctrl hover:decoration-primary transition-colors"
                          >
                            Start a return
                          </button>
                        )}
                      </OrderCard>
                    ))}
                  </div>
                </section>

                {/* ---------- Alterations ---------- */}
                <section className="mb-7" aria-labelledby="alt-title">
                  <SectionTitle id="alt-title" count={`${ALTERATIONS.length} in hand`}>
                    Alterations
                  </SectionTitle>

                  <div className="flex flex-col gap-2.5">
                    {ALTERATIONS.map((a) => (
                      <OrderCard key={a.id} item={a}>
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="text-[14px] font-medium text-ink truncate">{a.name}</span>
                          <span className="font-mono text-[10px] text-muted shrink-0">{a.id}</span>
                        </span>
                        <span className="block text-[11.5px] text-ink leading-snug mt-1">
                          {a.what}
                        </span>
                        <span className="block font-mono text-[10.5px] text-muted mt-1">
                          {a.status}
                        </span>
                        <span className="block text-[11px] text-goldtext leading-snug mt-1">
                          {a.credit}
                        </span>
                      </OrderCard>
                    ))}
                  </div>

                  <a
                    href="wardrobe.html"
                    className="block mt-2.5 min-h-[44px] rounded-2xl border border-dashed border-ctrl/60 text-[12.5px] font-medium text-primary flex items-center justify-center hover:bg-inset active:scale-[0.99] transition-all"
                  >
                    Use a credit on something you own
                  </a>
                </section>

                <p className="font-mono text-[10.5px] text-muted text-center pt-1">
                  Nothing is added at checkout
                </p>
              </div>

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <div className="bg-card w-4/5 max-w-xs h-full p-5 flex flex-col justify-between border-l border-hairline shadow-2xl drawer-slide-in overflow-y-auto">
                  <div className="space-y-6">
                    {/* Profile */}
                    <div className="pb-3.5 border-b border-hairline">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span
                            aria-hidden="true"
                            className="relative w-12 h-12 rounded-full bg-gold text-ink font-display text-[19px] flex items-center justify-center shadow-sm"
                          >
                            PS
                          </span>
                          <span className="flex flex-col">
                            <span className="flex items-center gap-1">
                              <span
                                id="drawer-title"
                                className="font-semibold text-[16px] text-ink leading-tight tracking-tight"
                              >
                                Priya Sharma
                              </span>
                              <button
                                type="button"
                                onClick={() => (window.location.href = "profile.html")}
                                aria-label="Edit your profile"
                                className="w-11 h-11 -my-3 -ml-1 -mr-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition-colors shrink-0"
                              >
                                <svg
                                  width="14"
                                  height="14"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="2"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M12 20h9" />
                                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                                </svg>
                              </button>
                              <span
                                className="w-2 h-2 rounded-full bg-[#3F7A4B] shrink-0"
                                role="img"
                                aria-label="Your stylist is online"
                              />
                            </span>
                            <span className="font-mono text-[11px] text-muted mt-0.5">
                              Toronto, ON
                            </span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setDrawerOpen(false)}
                          aria-label="Close navigation menu"
                          className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {/* 5 primary tabs */}
                    <nav aria-label="Primary">
                      <ul className="space-y-1">
                        {[
                          {
                            id: "home",
                            label: "01 · Home",
                            link: "index.html",
                            desc: "Occasion-first landing",
                          },
                          {
                            id: "discover",
                            label: "02 · Discover",
                            link: "discover.html",
                            desc: "Craft & regional provenance",
                          },
                          {
                            id: "design",
                            label: "03 · Design",
                            link: "designers.html",
                            desc: "The makers behind the cloth",
                          },
                          {
                            id: "wardrobe",
                            label: "04 · Wardrobe",
                            link: "wardrobe.html",
                            desc: "Memory & measurements",
                          },
                          {
                            id: "orders",
                            active: true,
                            label: "05 · Orders",
                            desc: "Live artisan production tracker",
                          },
                        ].map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              aria-current={item.active ? "page" : undefined}
                              onClick={() => {
                                if (item.link) {
                                  window.location.href = item.link;
                                  return;
                                }
                                setDrawerOpen(false);
                                showToast(`${item.label.split("· ")[1]} opens in the next release`);
                              }}
                              className={`w-full text-left p-2.5 min-h-[52px] rounded-r-xl transition-colors border-l-[3px] ${
                                item.active
                                  ? "bg-inset text-primary font-semibold border-primary"
                                  : "hover:bg-selfill text-ink border-transparent"
                              }`}
                            >
                              <span className="block text-[14px]">{item.label}</span>
                              <span className="block text-[11px] text-muted font-normal mt-0.5">
                                {item.desc}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </nav>

                    {/* Dual-geography */}
                    <div className="pt-4 border-t border-hairline space-y-2">
                      <span
                        id="ship-to-label"
                        className="font-mono text-[10.5px] uppercase tracking-wider text-muted font-medium block"
                      >
                        Ship to
                      </span>
                      <div
                        className="flex items-center gap-1.5"
                        role="group"
                        aria-labelledby="ship-to-label"
                      >
                        {SHIP_TO.map((c) => (
                          <button
                            key={c.code}
                            type="button"
                            aria-pressed={activeCountry.code === c.code}
                            onClick={() => {
                              setActiveCountry(c);
                              showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                            }}
                            className={`flex-1 min-h-[44px] px-1 rounded-lg border text-[11.5px] font-mono transition-colors ${
                              activeCountry.code === c.code
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            <span aria-hidden="true">{c.flag}</span> {c.code}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Landed-cost disclosure sits at the foot of the drawer
                      (Figma 31:1282) and restates the selected market. */}
                  <div className="pt-6">
                    <p className="text-[11px] text-muted leading-snug">
                      Prices are landed to {activeCountry.code} — {activeCountry.duty},{" "}
                      {activeCountry.courier}. Nothing is added at checkout.
                    </p>
                    <div className="flex items-center justify-between gap-3 pt-3 mt-3 border-t border-hairline text-muted text-[11px] font-mono">
                      <span>Aura v1.0</span>
                      <span className="text-ink">Perfect Fit Guarantee</span>
                    </div>
                  </div>
                </div>
              </Overlay>

              {reviewing && (
                <StageReviewSheet
                  order={reviewing}
                  reviews={reviews}
                  onClose={() => setReviewing(null)}
                  onMessage={(order, stage, concern) => {
                    const lines = [
                      `${order.name} (${order.id}) — about the ${STAGES[stage]} stage.`,
                      `My concern: “${concern.note}”`,
                    ];
                    if (concern.reply) lines.push(`Meera replied: “${concern.reply}”`);
                    lines.push("Can we talk this through?");
                    window.location.href =
                      "conversation.html?prompt=" +
                      encodeURIComponent(lines.join("\n")) +
                      "&ship=" +
                      encodeURIComponent(activeCountry.code);
                  }}
                  onVerdict={(orderId, stage, verdict, note) => {
                    reviews.set(orderId, stage, verdict, note);
                    showToast(
                      verdict === "approved"
                        ? `${STAGES[stage]} approved — the piece moves on`
                        : `Concern sent to Meera — ${STAGES[stage]} is on hold`
                    );
                  }}
                />
              )}

              <a
                href="index.html"
                aria-label="Back to home"
                className="absolute bottom-7 right-4 w-14 h-14 rounded-full bg-primary text-onprimary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-all"
              >
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.9"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
