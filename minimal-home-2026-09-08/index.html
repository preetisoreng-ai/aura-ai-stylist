                      }`}
                    >
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                      </svg>
                    </button>
                  )}

                  <label htmlFor="aura-ask" className="sr-only">
                    Describe your occasion for the Aura stylist
                  </label>

                  {/* Textarea with generous top and bottom margin */}
                  <textarea
                    id="aura-ask"
                    ref={inputRef}
                    onFocus={() => setComposing(true)}
                    onBlur={(e) => {
                      // Staying inside the form (mic, send) is not leaving.
                      const form = e.currentTarget.closest("form");
                      if (!form || !form.contains(e.relatedTarget)) setComposing(false);
                    }}
                    rows={isCardExpanded ? 2 : 1}
                    value={inputVal}
                    onChange={(e) => {
                      setInputVal(e.target.value);
                      if (!e.target.value.trim() && selectedChipId) {
                        setSelectedChipId(null);
                      }
                    }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleAsk(inputVal);
                      }
                      if (e.key === "Escape") {
                        e.preventDefault();
                        exitCompose();
                      }
                    }}
                    placeholder="Ask me anything"
                    className={`w-full bg-transparent text-ink placeholder:text-muted text-[14px] focus:outline-none resize-none transition-all ${
                      isCardExpanded
                        ? "my-4 py-2 min-h-[58px] leading-[24px]"
                        : "py-1.5 self-center pr-1 leading-[19px]"
                    }`}
                  />

                  {/* Action Bar: bottom row when card expanded, inline when compact */}
                  {isCardExpanded ? (
                    <div className="flex items-center justify-end gap-2 pt-2 border-t border-hairline/50">
                      <button
                        type="button"
                        onClick={handleMic}
                        aria-label={isListening ? "Stop voice input" : "Start voice input"}
                        aria-pressed={isListening}
                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors shrink-0 ${
                          isListening
                            ? "bg-primary text-onprimary aura-listening"
                            : "bg-inset text-primary hover:bg-selfill active:scale-95"
                        }`}
                      >
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                          <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                      </button>

                      <button
                        type="submit"
                        aria-label="Send to your stylist"
                        className="w-10 h-10 rounded-full bg-primary text-onprimary flex items-center justify-center hover:bg-primary/90 active:scale-95 transition-all shadow-sm shrink-0"
                      >
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2.4"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M5 12h14" />
                          <path d="m12 5 7 7-7 7" />
                        </svg>
                      </button>
                    </div>
                  ) : (
                    <div className="flex items-center shrink-0 self-center">
                      {inputVal.trim() ? (
                        <button
                          type="submit"
                          aria-label="Send to your stylist"
                          className="w-11 h-11 rounded-full bg-primary text-onprimary flex items-center justify-center hover:bg-primary/90 active:scale-95 transition-all"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2.4"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                          </svg>
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={handleMic}
                          aria-label={isListening ? "Stop voice input" : "Start voice input"}
                          aria-pressed={isListening}
                          className={`w-11 h-11 rounded-full flex items-center justify-center transition-colors ${
                            isListening
                              ? "bg-primary text-onprimary aura-listening"
                              : "bg-inset text-primary hover:bg-selfill active:scale-95"
                          }`}
                        >
                          <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                          </svg>
                        </button>
                      )}
                    </div>
                  )}
                </form>

                {!composing && <div className="home-pill-line" aria-hidden="true" />}
              </div>
              {/* ---------- More occasions sheet ---------- */}
              <Overlay
                open={moreOpen}
                onClose={() => setMoreOpen(false)}
                labelledBy="more-sheet-title"
              >
                <div className="bg-card w-full rounded-t-3xl px-5 pt-4 pb-6 border-t border-hairline shadow-2xl aura-sheet-up">
                  <div
                    className="w-10 h-1 rounded-full bg-hairline mx-auto mb-4"
                    aria-hidden="true"
                  />
                  <div className="flex items-start justify-between pb-3 border-b border-hairline">
                    <div>
                      <h2
                        id="more-sheet-title"
                        className="text-[22px] font-semibold text-ink leading-tight tracking-[-0.01em]"
                      >
                        More occasions
                      </h2>
                      <p className="text-[12.5px] text-muted leading-snug mt-1">
                        Pick one to load a starting brief — you can edit every word.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setMoreOpen(false)}
                      aria-label="Close more occasions"
                      className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                      </svg>
                    </button>
                  </div>

                  <ul className="divide-y divide-hairline">
                    {MORE_OCCASIONS.map((o) => (
                      <li key={o.id}>
                        <button
                          type="button"
                          onClick={() => {
                            setMoreOpen(false);
                            loadPrompt(o.prompt, o.label);
                          }}
                          className="w-full min-h-[56px] py-3 flex items-center justify-between gap-3 text-left hover:bg-inset/60 active:bg-inset transition-colors rounded-lg px-1"
                        >
                          <span className="text-[14.5px] text-ink font-medium">{o.label}</span>
                          <span className="flex items-center gap-2 shrink-0">
                            <span className="text-[12.5px] text-muted">{o.lead}</span>
                            <svg
                              width="15"
                              height="15"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              strokeWidth="2"
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              className="text-muted"
                              aria-hidden="true"
                              focusable="false"
                            >
                              <path d="m9 18 6-6-6-6" />
                            </svg>
                          </span>
                        </button>
                      </li>
                    ))}
                  </ul>

                  <p className="text-[11.5px] text-muted text-center mt-4">
                    Lead times shown for {activeCountry.flag} {activeCountry.symbol} delivery
                  </p>
                </div>
              </Overlay>
              {/* ---------- Chat history drawer (left) ---------- */}
              <Overlay
                open={historyOpen}
                onClose={() => setHistoryOpen(false)}
                labelledBy="history-title"
                align="start"
              >
                <div className="bg-card w-4/5 max-w-xs h-full flex flex-col border-r border-hairline shadow-2xl drawer-slide-in-left">
                  <div className="shrink-0 flex items-start justify-between gap-2 px-5 pt-5 pb-3 border-b border-hairline">
                    <div className="min-w-0">
                      <h2
                        id="history-title"
                        className="font-display text-[22px] text-ink leading-tight"
                      >
                        Your conversations
                      </h2>
                      <p className="text-[11.5px] text-muted leading-snug mt-0.5">
                        {chatLog.length
                          ? "Pick one up where you left it."
                          : "Briefs you start will be listed here."}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setHistoryOpen(false)}
                      aria-label="Close conversation history"
                      className="w-11 h-11 -mr-2 -mt-2 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                    >
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                      </svg>
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto px-2 py-2">
                    {chatLog.length === 0 ? (
                      <p className="px-3 py-8 text-[13px] text-muted leading-relaxed text-center">
                        No conversations yet. Tell Aura about an occasion and it will appear here.
                      </p>
                    ) : (
                      <ul className="space-y-0.5">
                        {chatLog.map((chat) => (
                          <li key={chat.id}>
                            <button
                              type="button"
                              onClick={() => openChat(chat)}
                              className="w-full text-left px-3 py-2.5 min-h-[56px] rounded-xl hover:bg-inset active:scale-[0.99] transition-colors"
                            >
                              <span className="flex items-baseline justify-between gap-3">
                                <span className="text-[13.5px] font-medium text-ink truncate">
                                  {deriveChatTitle(chat.prompt)}
                                </span>
                                <span className="font-mono text-[10.5px] text-muted shrink-0">
                                  {formatChatTime(chat.at)}
                                </span>
                              </span>
                              <span className="block text-[11.5px] text-muted leading-snug mt-0.5 line-clamp-2">
                                {chat.prompt}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>

                  {chatLog.length > 0 && (
                    <div className="shrink-0 px-5 py-3 border-t border-hairline">
                      <button
                        type="button"
                        onClick={() => {
                          clearChatLog();
                          setChatLog([]);
                          showToast("Conversation history cleared");
                        }}
                        className="min-h-[44px] -my-1 text-[12px] text-muted hover:text-ink transition-colors"
                      >
                        Clear history
                      </button>
                    </div>
                  )}
                </div>
              </Overlay>
              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <div className="bg-card w-4/5 max-w-xs h-full p-5 flex flex-col justify-between border-l border-hairline shadow-2xl drawer-slide-in overflow-y-auto">
                  <div className="space-y-6">
                    {/* Profile */}
                    <div className="pb-3.5 border-b border-hairline">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span
                            aria-hidden="true"
                            className="relative w-12 h-12 rounded-full bg-gold text-ink font-display text-[19px] flex items-center justify-center shadow-sm"
                          >
                            PS
                          </span>
                          <span className="flex flex-col">
                            <span className="flex items-center gap-1">
                              <span
                                id="drawer-title"
                                className="font-semibold text-[16px] text-ink leading-tight tracking-tight"
                              >
                                Priya Sharma
                              </span>
                              <button
                                type="button"
                                onClick={() => (window.location.href = "profile.html")}
                                aria-label="Edit your profile"
                                className="w-11 h-11 -my-3 -ml-1 -mr-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition-colors shrink-0"
                              >
                                <svg
                                  width="14"
                                  height="14"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="2"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M12 20h9" />
                                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                                </svg>
                              </button>
                              <span
                                className="w-2 h-2 rounded-full bg-[#3F7A4B] shrink-0"
                                role="img"
                                aria-label="Your stylist is online"
                              />
                            </span>
                            <span className="font-mono text-[11px] text-muted mt-0.5">
                              Toronto, ON
                            </span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setDrawerOpen(false)}
                          aria-label="Close navigation menu"
                          className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {/* 5 primary tabs */}
                    <nav aria-label="Primary">
                      <ul className="space-y-1">
                        {[
                          {
                            id: "home",
                            label: "01 · Home",
                            active: true,
                            desc: "Occasion-first landing",
                          },
                          {
                            id: "discover",
                            label: "02 · Discover",
                            link: "discover.html",
                            desc: "Craft & regional provenance",
                          },
                          {
                            id: "design",
                            label: "03 · Design",
                            link: "designers.html",
                            desc: "The makers behind the cloth",
                          },
                          {
                            id: "wardrobe",
                            label: "04 · Wardrobe",
                            link: "wardrobe.html",
                            desc: "Memory & measurements",
                          },
                          {
                            id: "orders",
                            label: "05 · Orders",
                            link: "orders.html",
                            desc: "Live artisan production tracker",
                          },
                        ].map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              aria-current={item.active ? "page" : undefined}
                              onClick={() => {
                                if (item.link) {
                                  window.location.href = item.link;
                                  return;
                                }
                                setDrawerOpen(false);
                                showToast(`${item.label.split("· ")[1]} opens in the next release`);
                              }}
                              className={`w-full text-left p-2.5 min-h-[52px] rounded-r-xl transition-colors border-l-[3px] ${
                                item.active
                                  ? "bg-inset text-primary font-semibold border-primary"
                                  : "hover:bg-selfill text-ink border-transparent"
                              }`}
                            >
                              <span className="block text-[14px]">{item.label}</span>
                              <span className="block text-[11px] text-muted font-normal mt-0.5">
                                {item.desc}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </nav>

                    {/* Dual-geography */}
                    <div className="pt-4 border-t border-hairline space-y-2">
                      <span
                        id="ship-to-label"
                        className="font-mono text-[10.5px] uppercase tracking-wider text-muted font-medium block"
                      >
                        Ship to
                      </span>
                      <div
                        className="flex items-center gap-1.5"
                        role="group"
                        aria-labelledby="ship-to-label"
                      >
                        {SHIP_TO_COUNTRIES.map((c) => (
                          <button
                            key={c.code}
                            type="button"
                            aria-pressed={activeCountry.code === c.code}
                            onClick={() => {
                              setActiveCountry(c);
                              showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                            }}
                            className={`flex-1 min-h-[44px] px-1 rounded-lg border text-[11.5px] font-mono transition-colors ${
                              activeCountry.code === c.code
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            <span aria-hidden="true">{c.flag}</span> {c.code}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Landed-cost disclosure sits at the foot of the drawer
                      (Figma 31:1282) and restates the selected market. */}
                  <div className="pt-6">
                    <p className="text-[11px] text-muted leading-snug">
                      Prices are landed to {activeCountry.code} — {activeCountry.duty},{" "}
                      {activeCountry.courier}. Nothing is added at checkout.
                    </p>
                    <div className="flex items-center justify-between gap-3 pt-3 mt-3 border-t border-hairline text-muted text-[11px] font-mono">
                      <span>Aura v1.0</span>
                      <span className="text-ink">Perfect Fit Guarantee</span>
                    </div>
                  </div>
                </div>
              </Overlay>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
