<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Aura — Minimal Home</title>
    <meta
      name="description"
      content="Aura Minimal Home Screen — an intent-first conversational front door for bespoke Indian occasion wear. Ethereal Aura orb, occasion chips, and a voice-or-text stylist bar."
    />

    <!-- Typography: Instrument Serif, DM Sans, DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <!-- React 18, ReactDOM, Babel, Tailwind CSS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Colours are declared as raw RGB channels so Tailwind's `/opacity`
       modifier (bg-primary/90, border-hairline/60 …) resolves correctly.
       A bare `var(--primary)` silently drops the alpha modifier on v3. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      /* ===================================================================
       AURA DESIGN TOKENS — WCAG 2.1/2.2 AA verified pairings
       Channels first, then convenience hex aliases for plain CSS.
       =================================================================== */
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255; /* #FFFFFF Pristine White · surface-1 */
        --inset-rgb: 243 238 228; /* #F3EEE4 Warm Sand · surface-2 */
        --primary-rgb: 59 42 90; /* #3B2A5A Deep Royal Plum · 11.91:1 on Ivory */
        --onprimary-rgb: 255 255 255; /* 12.61:1 on Plum */
        --sel-fill-rgb: 245 244 247; /* Plum 50 · selected state */
        --ink-rgb: 30 27 46; /* #1E1B2E · 15.84:1 on Ivory */
        --muted-rgb: 90 84 104; /* #5A5468 · 6.83:1 on Ivory */
        --hairline-rgb: 229 223 213; /* #E5DFD5 warm divider */
        --ctrl-border-rgb: 124 123 134; /* #7C7B86 · 3.94:1 boundary */
        --gold-rgb: 200 155 60; /* #C89B3C decorative only */
        --gold-text-rgb: 120 93 36; /* #785D24 · 5.85:1 on Ivory */

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --inset: rgb(var(--inset-rgb));
        --primary: rgb(var(--primary-rgb));
        --ink: rgb(var(--ink-rgb));
        --muted: rgb(var(--muted-rgb));
        --hairline: rgb(var(--hairline-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;

        --e1: 0 1px 3px rgb(var(--ink-rgb) / 0.04);
        --e2: 0 4px 16px rgb(var(--ink-rgb) / 0.08), 0 1px 3px rgb(var(--ink-rgb) / 0.04);
        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      /* Visible, consistent keyboard focus on every interactive element. */
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* ===================================================================
       APP VIEWPORT — native, frameless mobile canvas
       =================================================================== */
      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h is set from window.visualViewport while the on-screen
           keyboard is open; it falls back to the full viewport otherwise. */
        height: var(--app-h, 100dvh);
        min-height: var(--app-h, 100vh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Soft ambient wash sitting behind the orb — anchors the composition
       without adding a visible object to the minimal layout. */
      .canvas-wash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            120% 55% at 50% 26%,
            rgb(var(--gold-rgb) / 0.1) 0%,
            rgb(var(--gold-rgb) / 0.03) 38%,
            transparent 70%
          ),
          radial-gradient(90% 45% at 50% 20%, rgb(var(--primary-rgb) / 0.06) 0%, transparent 68%);
      }

      /* ===================================================================
       OCCASION CHIPS — 44px minimum target (Apple HIG · WCAG 2.2 AA)
       =================================================================== */
      .minimal-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.88);
        border: 1px solid rgb(var(--hairline-rgb) / 0.9);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: -0.005em;
        line-height: 1;
        white-space: nowrap;
        transition:
          border-color 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
          background-color 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
          transform 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
        cursor: pointer;
        user-select: none;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
        backdrop-filter: blur(8px);
      }

      .minimal-chip .chip-icon {
        display: inline-flex;
        flex: none;
        color: var(--gold-text, #785d24);
      }

      .minimal-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
        background: rgb(var(--card-rgb) / 1);
        color: var(--primary);
      }

      .minimal-chip:active {
        transform: scale(0.975);
      }

      /* ===================================================================
       FLOATING CONVERSATION BAR
       =================================================================== */
      .minimal-floating-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .minimal-floating-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* Attachment popup — Figma 36:1267. Frosted glass over the canvas. */
      .attachment-popup {
        background: rgb(255 255 255 / 0.7);
        border: 1px solid rgb(255 255 255 / 0.6);
        box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Without backdrop-filter the 70% white reads as muddy over the wash,
         so fall back to an opaque card. */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .attachment-popup {
          background: var(--card);
          border-color: rgb(var(--hairline-rgb) / 0.9);
        }
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ===================================================================
       MOTION — every animation below is disabled under reduced-motion
       =================================================================== */
      @keyframes auraSlideFromLeft {
        from {
          transform: translateX(-100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(24px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .drawer-slide-in-left {
        animation: auraSlideFromLeft 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }
      .aura-sheet-up {
        animation: auraSheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      /* Rails scroll by finger, not by a visible bar. */
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .minimal-chip:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect, useCallback } = React;

      const prefersReducedMotion = () =>
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ===================================================================
       OCCASION TAXONOMY (Aura PRD §Occasion-first IA)
       =================================================================== */
      const chipIcon = (paths, strokeWidth = 1.8) => (
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          {paths}
        </svg>
      );

      const CHIPS_DATA = [
        {
          id: "wedding_guest",
          label: "Wedding guest",
          icon: chipIcon(
            <>
              <path d="M6 3h12l4 6-10 12L2 9z" />
              <path d="M11 3 8 9l4 12 4-12-3-6" />
            </>
          ),
          prompt:
            "Guest at a 3-day wedding in Jaipur.\nSomething celebratory that I can dance in comfortably.",
          role: "Guest",
          city: "Jaipur",
          lead: "3 to 5 weeks",
        },
        {
          id: "diwali",
          label: "Diwali",
          icon: chipIcon(
            <>
              <path d="M12 2v4" />
              <path d="m4.93 10.93 2.83-2.83" />
              <path d="M2 18h20" />
              <path d="M20 18a8 8 0 0 1-16 0" />
            </>
          ),
          prompt:
            "A timeless piece for Diwali family dinner.\nHandloom I can wear and treasure for years.",
          role: "Family",
          city: "London",
          lead: "2 to 3 weeks",
        },
        {
          id: "sangeet",
          label: "Sangeet",
          icon: chipIcon(
            <>
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </>
          ),
          prompt:
            "A dramatic sangeet look for evening stage lighting.\nLightweight silhouette that moves freely when I dance.",
          role: "Performer / Friend",
          city: "Chicago",
          lead: "3 to 4 weeks",
        },
        {
          id: "reception",
          label: "Reception",
          icon: chipIcon(
            <>
              <path d="m8 22 4-11h-4" />
              <path d="M16 22l-4-11h4" />
              <path d="M5 2h14l-2 9H7z" />
            </>
          ),
          prompt:
            "A modern reception look with sculptural draping.\nMade in authentic Indian handloom silk.",
          role: "Guest",
          city: "New York",
          lead: "4 to 6 weeks",
        },
        {
          id: "temple",
          label: "Temple morning",
          icon: chipIcon(
            <>
              <path d="M3 21h18" />
              <path d="M5 21V9l7-5 7 5v12" />
              <path d="M9 21v-7a3 3 0 0 1 6 0v7" />
            </>
          ),
          prompt:
            "A morning temple visit — modest neckline, covered shoulders.\nPure organic silk handloom, easy in the heat.",
          role: "Devotee",
          city: "Chennai",
          lead: "1 to 2 weeks",
        },
        {
          id: "more",
          label: "Show more",
          isMore: true,
          icon: chipIcon(
            <>
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </>,
            2.1
          ),
        },
      ];

      /* Secondary taxonomy surfaced by the "More occasions" sheet. */
      const MORE_OCCASIONS = [
        {
          id: "griha",
          label: "Griha Pravesh",
          lead: "2 to 3 weeks",
          prompt:
            "Griha Pravesh housewarming puja at home.\nSomething traditional but easy to move and host in.",
        },
        {
          id: "mehendi",
          label: "Mehendi",
          lead: "3 to 4 weeks",
          prompt:
            "Mehendi morning in a garden setting.\nLight, colourful, and comfortable to sit in for hours.",
        },
        {
          id: "haldi",
          label: "Haldi",
          lead: "2 to 3 weeks",
          prompt:
            "Haldi ceremony — something I won't mind staining.\nBreathable cotton or lightweight handloom.",
        },
        {
          id: "cocktail",
          label: "Cocktail evening",
          lead: "4 to 5 weeks",
          prompt:
            "Indo-western cocktail evening look.\nSharp and modern, still rooted in Indian craft.",
        },
        {
          id: "annaprashan",
          label: "Annaprashan",
          lead: "2 to 3 weeks",
          prompt:
            "My child's Annaprashan ceremony.\nSomething soft, traditional, and easy to hold a baby in.",
        },
        {
          id: "destination",
          label: "Destination wedding",
          lead: "6 to 8 weeks",
          prompt:
            "Destination wedding abroad, packing light.\nPieces that travel well and restyle across three events.",
        },
      ];

      /* ===================================================================
       SHIP-TO MARKETS (Figma 31:1282 · drawer footer)
       Duty wording and courier drive the landed-cost disclosure, so the
       sentence in the drawer stays true to the selected market.
       =================================================================== */
      /* ===================================================================
       CHAT HISTORY
       Every conversation starts by handing a prompt to conversation.html,
       so that is the single place a chat is recorded. This screen only
       reads the log back and derives a title from the opening prompt.

       Storage is per-browser and best-effort: a private window or blocked
       site data throws or returns nothing, and the drawer simply shows its
       empty state rather than failing.
       =================================================================== */
      const CHAT_LOG_KEY = "aura.chats";

      function readChatLog() {
        try {
          const raw = window.localStorage.getItem(CHAT_LOG_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter((c) => c && typeof c.prompt === "string" && c.prompt.trim())
            .sort((a, b) => (b.at || 0) - (a.at || 0));
        } catch (e) {
          return [];
        }
      }

      function clearChatLog() {
        try {
          window.localStorage.removeItem(CHAT_LOG_KEY);
        } catch (e) {
          /* nothing to clear if storage is unavailable */
        }
      }

      /* --- Contextual title -------------------------------------------
       The title answers "which conversation was this?", so it leads with
       the occasion and qualifies it with the city or the garment — the two
       things that actually distinguish two wedding briefs from each other.
       Nothing is invented: if none of it is in the prompt, we fall back to
       the customer's own opening words with the filler trimmed off.
       ----------------------------------------------------------------- */
      const TITLE_OCCASIONS = [
        { match: /\bsangeet\b/i, label: "Sangeet" },
        { match: /\bmehendi|mehndi\b/i, label: "Mehendi" },
        { match: /\bhaldi\b/i, label: "Haldi" },
        { match: /\breception\b/i, label: "Reception" },
        { match: /\bcocktail\b/i, label: "Cocktail evening" },
        { match: /\bdiwali\b/i, label: "Diwali" },
        { match: /\bannaprashan\b/i, label: "Annaprashan" },
        { match: /\bgriha|housewarming\b/i, label: "Griha Pravesh" },
        { match: /\btemple|puja|pooja\b/i, label: "Temple morning" },
        { match: /\bengagement|roka\b/i, label: "Engagement" },
        { match: /\bwedding\b/i, label: "Wedding" },
      ];

      const TITLE_GARMENTS = [
        { match: /\blehenga\b/i, label: "Lehenga" },
        { match: /\bsaree|sari\b/i, label: "Saree" },
        { match: /\bsherwani\b/i, label: "Sherwani" },
        { match: /\banarkali\b/i, label: "Anarkali" },
        { match: /\bkurta\b/i, label: "Kurta set" },
        { match: /\bsuit\b/i, label: "Suit set" },
        { match: /\bgown\b/i, label: "Gown" },
      ];

      const TITLE_CITIES = [
        "Jaipur",
        "London",
        "Chicago",
        "New York",
        "Chennai",
        "Toronto",
        "Delhi",
        "Mumbai",
        "Dubai",
        "Singapore",
        "Bangalore",
        "Hyderabad",
        "San Francisco",
        "Houston",
        "Vancouver",
        "Melbourne",
        "Sydney",
        "Varanasi",
        "Lucknow",
      ];

      // Openers that carry no meaning in a list of titles.
      const TITLE_FILLER =
        /^(?:i(?:'d| would)? ?(?:like|want|need)(?: to)?|i'm |i am |can you |could you |please |help me |looking for |show me |find me |suggest |hi[, ]+|hey[, ]+|hello[, ]+)/i;

      function deriveChatTitle(prompt) {
        const text = (prompt || "").replace(/\s+/g, " ").trim();
        if (!text) return "Untitled conversation";

        // A concern raised from Orders names its garment and stage — that is
        // a better title than the garment alone.
        const fromOrder = text.match(/^(.+?) \(AUR-\d+\) — about the (.+?) stage\./);
        if (fromOrder) return `${fromOrder[2]} · ${fromOrder[1]}`;

        const occasion = TITLE_OCCASIONS.find((o) => o.match.test(text));
        const garment = TITLE_GARMENTS.find((g) => g.match.test(text));
        const city = TITLE_CITIES.find((c) => new RegExp("\\b" + c + "\\b", "i").test(text));
        const isGuest = /\bguest\b/i.test(text);

        if (occasion) {
          const head = isGuest && occasion.label === "Wedding" ? "Wedding guest" : occasion.label;
          const qualifier = city || (garment && garment.label);
          return qualifier ? `${head} · ${qualifier}` : head;
        }

        if (garment) return city ? `${garment.label} · ${city}` : garment.label;

        // No vocabulary matched — use the customer's own words, minus the
        // filler, capped at a length that still fits one line in the drawer.
        let rest = text.replace(TITLE_FILLER, "").trim();
        if (!rest) rest = text;
        const words = rest.split(" ").slice(0, 6).join(" ");
        const clipped = words.replace(/[\s,.;:—–-]+$/, "");
        const title = clipped.charAt(0).toUpperCase() + clipped.slice(1);
        return rest.split(" ").length > 6 ? title + "…" : title;
      }

      /* --- Timestamp ---------------------------------------------------
       Recent chats read better relative ("2h ago"); anything older than a
       week reads better as a date.
       ----------------------------------------------------------------- */
      function formatChatTime(ms) {
        if (!ms) return "";
        const then = new Date(ms);
        if (isNaN(then.getTime())) return "";

        const diff = Date.now() - ms;
        const min = Math.floor(diff / 60000);
        const hr = Math.floor(diff / 3600000);
        const day = Math.floor(diff / 86400000);

        if (diff < 0 || min < 1) return "Just now";
        if (min < 60) return `${min}m ago`;
        if (hr < 24) return `${hr}h ago`;
        if (day === 1) return "Yesterday";
        if (day < 7) return `${day}d ago`;

        const sameYear = then.getFullYear() === new Date().getFullYear();
        return then.toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
          year: sameYear ? undefined : "numeric",
        });
      }
      const SHIP_TO_COUNTRIES = [

      /* ===================================================================
       COMPONENT: TRANSPARENT FLUID ORB
       Canvas glass sphere with swirling internal caustics. Honours
       prefers-reduced-motion by painting exactly one static frame.
       =================================================================== */
      function TransparentFluidOrb({ isListening, onActivate }) {
        const canvasRef = useRef(null);
        const animFrameRef = useRef(null);
        const listeningRef = useRef(isListening);

        /* Kept in a ref so changing listening state re-tunes the running
         animation instead of tearing down and restarting the timeline. */
        useEffect(() => {
          listeningRef.current = isListening;
        }, [isListening]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");

          const size = 230;
          const dpr = window.devicePixelRatio || 1;
          canvas.width = size * dpr;
          canvas.height = size * dpr;
          ctx.scale(dpr, dpr);

          const still = prefersReducedMotion();
          const startTime = Date.now();
          let phase = 0;
          let lastFrame = startTime;

          const paint = (t) => {
            const width = size,
              height = size;
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2;
            const cy = height / 2;

            // 1. Outermost organic fluid wave ripple
            ctx.save();
            ctx.beginPath();
            for (let a = 0; a <= Math.PI * 2 + 0.04; a += 0.04) {
              const deform = Math.sin(a * 4 + t * 0.9) * 3.5 + Math.cos(a * 3 - t * 0.7) * 2.5;
              const r = 92 + deform;
              const x = cx + Math.cos(a) * r;
              const y = cy + Math.sin(a) * r;
              if (a === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = "rgba(200, 155, 60, 0.32)";
            ctx.stroke();
            ctx.fillStyle = "rgba(200, 155, 60, 0.02)";
            ctx.fill();
            ctx.restore();

            // 2. Middle counter-swirling ripple
            ctx.save();
            ctx.beginPath();
            for (let a = 0; a <= Math.PI * 2 + 0.04; a += 0.04) {
              const deform = Math.sin(a * 5 - t * 1.3) * 3 + Math.cos(a * 2 + t * 0.8) * 2;
              const r = 79 + deform;
              const x = cx + Math.cos(a) * r;
              const y = cy + Math.sin(a) * r;
              if (a === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctx.stroke();
            ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
            ctx.fill();
            ctx.restore();

            // 3. Central transparent glass sphere
            const sphereR = 64;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, sphereR, 0, Math.PI * 2);
            ctx.clip();

            const baseGrad = ctx.createRadialGradient(cx - 15, cy - 18, 4, cx, cy, sphereR);
            baseGrad.addColorStop(0, "rgba(255, 255, 255, 0.55)");
            baseGrad.addColorStop(0.25, "rgba(250, 246, 238, 0.15)");
            baseGrad.addColorStop(0.65, "rgba(200, 155, 60, 0.12)");
            baseGrad.addColorStop(0.85, "rgba(59, 42, 90, 0.22)");
            baseGrad.addColorStop(1, "rgba(35, 25, 54, 0.38)");
            ctx.fillStyle = baseGrad;
            ctx.fill();

            // Gold caustic
            const b1x = cx + Math.cos(t * 1.1) * 22;
            const b1y = cy + Math.sin(t * 0.85) * 18;
            const g1 = ctx.createRadialGradient(b1x, b1y, 2, b1x, b1y, 34);
            g1.addColorStop(0, "rgba(200, 155, 60, 0.55)");
            g1.addColorStop(0.5, "rgba(200, 155, 60, 0.2)");
            g1.addColorStop(1, "rgba(200, 155, 60, 0)");
            ctx.fillStyle = g1;
            ctx.fill();

            // Plum caustic
            const b2x = cx + Math.sin(t * 0.95) * 20;
            const b2y = cy + Math.cos(t * 1.15) * 20;
            const g2 = ctx.createRadialGradient(b2x, b2y, 2, b2x, b2y, 38);
            g2.addColorStop(0, "rgba(106, 93, 130, 0.48)");
            g2.addColorStop(0.55, "rgba(59, 42, 90, 0.18)");
            g2.addColorStop(1, "rgba(59, 42, 90, 0)");
            ctx.fillStyle = g2;
            ctx.fill();

            // Champagne shimmer
            const b3x = cx + Math.cos(t * 1.6 + 1.5) * 16;
            const b3y = cy + Math.sin(t * 1.4 + 0.8) * 16;
            const g3 = ctx.createRadialGradient(b3x, b3y, 1, b3x, b3y, 28);
            g3.addColorStop(0, "rgba(255, 255, 255, 0.65)");
            g3.addColorStop(0.5, "rgba(250, 245, 235, 0.22)");
            g3.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.fillStyle = g3;
            ctx.fill();

            ctx.restore(); // end sphere clip

            // 4. Glass rim + specular gleams
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, sphereR, 0, Math.PI * 2);
            ctx.lineWidth = 1.6;
            const rimGrad = ctx.createLinearGradient(cx - 45, cy - 45, cx + 45, cy + 45);
            rimGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
            rimGrad.addColorStop(0.35, "rgba(200, 155, 60, 0.6)");
            rimGrad.addColorStop(0.7, "rgba(59, 42, 90, 0.45)");
            rimGrad.addColorStop(1, "rgba(255, 255, 255, 0.75)");
            ctx.strokeStyle = rimGrad;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx - 22, cy - 24, 26, 14, -Math.PI / 4, 0, Math.PI * 2);
            const glint = ctx.createLinearGradient(cx - 36, cy - 36, cx - 10, cy - 10);
            glint.addColorStop(0, "rgba(255, 255, 255, 0.9)");
            glint.addColorStop(0.6, "rgba(255, 255, 255, 0.25)");
            glint.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.fillStyle = glint;
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(cx + 24, cy + 24, 20, 9, -Math.PI / 4, 0, Math.PI * 2);
            const glint2 = ctx.createLinearGradient(cx + 34, cy + 34, cx + 12, cy + 12);
            glint2.addColorStop(0, "rgba(200, 155, 60, 0.55)");
            glint2.addColorStop(1, "rgba(200, 155, 60, 0)");
            ctx.fillStyle = glint2;
            ctx.fill();
            ctx.restore();
          };

          if (still) {
            // One representative frame, no rAF loop at all.
            paint(1.2);
            return;
          }

          const render = () => {
            const now = Date.now();
            const dt = Math.min((now - lastFrame) / 1000, 0.05);
            lastFrame = now;
            // Advancing a phase (rather than scaling absolute elapsed time)
            // keeps the fluid continuous when the speed changes.
            phase += dt * (listeningRef.current ? 2.4 : 1.0);
            paint(phase);
            animFrameRef.current = requestAnimationFrame(render);
          };

          render();

          return () => {
            if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          };
        }, []);

        return (
          <button
            type="button"
            onClick={onActivate}
            aria-label={isListening ? "Listening — tap to stop" : "Ask Aura by voice"}
            className="relative flex items-center justify-center mx-auto rounded-full bg-transparent border-0 p-0 cursor-pointer transition-transform duration-200 hover:scale-[1.02] active:scale-[0.98]"
            style={{ width: "230px", height: "230px" }}
          >
            <span
              aria-hidden="true"
              className="absolute inset-0 rounded-full pointer-events-none blur-xl"
              style={{
                background:
                  "radial-gradient(circle, rgb(var(--gold-rgb) / 0.22) 0%, rgb(var(--primary-rgb) / 0.12) 45%, transparent 72%)",
              }}
            />
            <canvas
              ref={canvasRef}
              aria-hidden="true"
              style={{ width: "230px", height: "230px" }}
              className="relative z-10 block"
            />
          </button>
        );
      }

      /* ===================================================================
       COMPONENT: OVERLAY — shared dialog behaviour for drawer + sheet
       Escape to close, background scroll lock, focus moved in on open
       and restored to the trigger on close, focus kept inside while open.
       =================================================================== */
      function Overlay({ open, onClose, labelledBy, align, children }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);

        useEffect(() => {
          if (!open) return;

          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (items.length === 0) return;
            const firstEl = items[0];
            const lastEl = items[items.length - 1];
            if (e.shiftKey && document.activeElement === firstEl) {
              e.preventDefault();
              lastEl.focus();
            } else if (!e.shiftKey && document.activeElement === lastEl) {
              e.preventDefault();
              firstEl.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const restore = restoreRef.current;
            if (restore && typeof restore.focus === "function") restore.focus();
          };
        }, [open, onClose]);

        if (!open) return null;

        return (
          <div
            className={`absolute inset-0 z-50 flex aura-fade-in ${
              align === "end"
                ? "justify-end"
                : align === "start"
                  ? "justify-start"
                  : "items-end justify-center"
            }`}
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)", backdropFilter: "blur(2px)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby={labelledBy}
              tabIndex={-1}
              className="focus:outline-none contents"
            >
              {children}
            </div>
          </div>
        );
      }

      /* ===================================================================
       HOME BROWSE SURFACE
       The categories are the same five curates Discover lists, so the rail
       on home and the sections on Discover can never drift apart. Tapping
       one opens that category's page; tapping a garment opens a
       conversation about it rather than a product page — Aura sells through

      /* Same gradient fallback the catalogue uses, so a missing photograph
         still reads as cloth rather than as a broken box. */
      function HomeImage({ item, alt, className }) {
        const [failed, setFailed] = useState(false);
        const sw = item.swatch || ["#E5DFD5", "#C89B3C", "#F3EEE4"];

        if (failed || !item.image) {
          return (
            <span
              className={className}
              role="img"
              aria-label={alt + " \u2014 photograph not yet available"}
              style={{
                background:
                  "linear-gradient(150deg, " +
                  sw[0] +
                  " 0%, " +
                  sw[2] +
                  " 55%, " +
                  sw[1] +
                  " 100%)",
              }}
            />

        }
        return (
          <img
            src={item.image}
            alt={alt}
            loading="lazy"
            onError={() => setFailed(true)}
            className={className + " object-cover select-none"}

          />

      }

      /* The hero is a deck rather than a strip: the live category sits in
         front, and the one before and after it are tucked behind its edges,
         turned away from the reader so only a sliver of each shows. Moving
         on rotates the whole deck by one.

         Cards are positioned by transform, never by scrollLeft. An animated
         scroll fires onScroll the whole way there and those half-way
         positions round back to the slide we just left, so the index and the
         picture end up fighting each other. A transform has no such
         feedback. Swipe is handled directly since there is no native
         scrolling left to do it.

         It advances on its own every five seconds, stops the moment the
         reader touches it, and never starts at all for anyone who has asked
         the system to reduce motion. */
      function CategoryCarousel({ items, onOpen, paused }) {
        const [slide, setSlide] = useState(0);
        const [focusHeld, setFocusHeld] = useState(false);
        const dragRef = useRef(null);
        // Steering it by hand defers the next turn rather than ending it, so
        // a tap on a dot can never leave the deck stopped for good.
        const deferRef = useRef(0);
        const defer = () => {
          deferRef.current = Date.now() + 9000;
        };

        const reduced =
          typeof window !== "undefined" &&
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // It keeps turning on its own. Reduce-motion takes away the sliding,
        // not the rotation itself — the deck still cycles, it just cuts
        // between cards instead of travelling between them.
        useEffect(() => {
          if (focusHeld || paused || items.length < 2) return;
          const t = window.setInterval(() => {
            if (Date.now() < deferRef.current) return;
            setSlide((i) => (i + 1) % items.length);
          }, 3800);
          return () => window.clearInterval(t);
        }, [focusHeld, paused, items.length]);

        const count = items.length;
        const go = (i) => setSlide(((i % count) + count) % count);

        // How far a card sits from the front of the deck, counted the short
        // way round so the last card is the first one's left-hand neighbour.
        const offsetOf = (i) => {
          let off = i - slide;
          if (off > count / 2) off -= count;
          if (off < -count / 2) off += count;
          return off;
        };

        // A short horizontal drag turns the deck; anything less is a tap and
        // belongs to the card underneath.
        const onPointerDown = (e) => {
          defer();
          dragRef.current = { x: e.clientX, y: e.clientY };
        };
        const onPointerUp = (e) => {
          const from = dragRef.current;
          dragRef.current = null;
          if (!from) return;
          const dx = e.clientX - from.x;
          if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(e.clientY - from.y)) return;
          go(slide + (dx < 0 ? 1 : -1));
        };

        const current = items[slide] || items[0];

        return (
          <section aria-labelledby="home-category-title" aria-roledescription="carousel">
            <h2
              id="home-category-title"
              aria-live="polite"
              className="font-display text-[22px] leading-tight text-ink text-center mb-2.5"
            >
              {current.label}
            </h2>

            {/* The cards waiting their turn sit far off to either side. They
                are invisible but still count towards scrollable width, so the
                deck is clipped at the gutter — with room left for the front
                card's shadow. */}
            <div className="-mx-5 px-5 -my-4 py-4 overflow-hidden">
              <div
                className="relative mx-auto w-[68%] aspect-[7/5]"
                style={{ perspective: "1100px" }}
                onPointerDown={onPointerDown}
                onPointerUp={onPointerUp}
                onPointerCancel={() => (dragRef.current = null)}
                onFocusCapture={() => setFocusHeld(true)}
                onBlurCapture={() => setFocusHeld(false)}
                onKeyDown={(e) => {
                  if (e.key === "ArrowRight") {
                    e.preventDefault();
                    go(slide + 1);
                  } else if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    go(slide - 1);
                  }
                }}
              >
                {items.map((c, i) => {
                  const off = offsetOf(i);
                  const front = off === 0;
                  const buried = Math.abs(off) > 1;
                  const side = off < 0 ? -1 : 1;

                  return (
                    <div
                      key={c.id}
                      className="absolute inset-0"
                      aria-hidden={front ? undefined : true}
                      style={{
                        transform:
                          "translateX(" +
                          off * 42 +
                          "%) rotateY(" +
                          (front ? 0 : side * 38) +
                          "deg) scale(" +
                          (front ? 1 : 0.88) +
                          ")",
                        zIndex: 10 - Math.abs(off),
                        opacity: buried ? 0 : 1,
                        pointerEvents: front ? "auto" : "none",
                        transition: reduced
                          ? "none"
                          : "transform 0.62s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.62s ease",
                      }}
                    >
                      <button
                        type="button"
                        onClick={() => onOpen(c)}
                        tabIndex={front ? 0 : -1}
                        aria-label={"Open " + c.label + " \u2014 " + c.note}
                        className={
                          "block w-full h-full rounded-2xl overflow-hidden bg-inset border border-hairline " +
                          (front
                            ? "shadow-[0_10px_30px_-12px_rgb(var(--ink-rgb)/0.45)] hover:border-primary/45"
                            : "shadow-none")
                        }
                      >
                        <HomeImage item={c} alt={c.label} className="block w-full h-full" />
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex items-center justify-center gap-1.5 mt-3">
              {items.map((c, i) => (
                <button
                  key={c.id}
                  type="button"
                  onClick={() => {
                    defer();
                    go(i);
                  }}
                  aria-label={"Show " + c.label}
                  aria-current={i === slide}
                  className="w-6 h-6 flex items-center justify-center"
                >
                  <span
                    className={
                      "block rounded-full transition-all " +
                      (i === slide ? "w-5 h-1.5 bg-primary" : "w-1.5 h-1.5 bg-hairline")
                    }
                  />
                </button>
              ))}
            </div>
          </section>
        );
      }

      /* A rail of garments. Every tile opens a conversation, so its label is
         phrased as the question it will ask on your behalf. */
      function GarmentRail({ rail, onPick }) {
        const headingId = "rail-" + rail.id;
        return (

                >

                </button>
              ))}
            </div>
          </section>
        );
      }

      /* ===================================================================
       MAIN APPLICATION
       =================================================================== */
      function App() {
        const [drawerOpen, setDrawerOpen] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("drawer") === "true";
          } catch (e) {
            return false;
          }
        });
        const [moreOpen, setMoreOpen] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("more") === "true";
          } catch (e) {
            return false;
          }
        });
        const [selectedChipId, setSelectedChipId] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get("chip") || null;
          } catch (e) {
            return null;
          }
        });
        const [inputVal, setInputVal] = useState(() => {
          try {
            const p = new URLSearchParams(window.location.search).get("chip");
            if (p) {
              const all = [...CHIPS_DATA, ...MORE_OCCASIONS];
              const match = all.find((c) => c.id === p);
              return match ? match.prompt : "";
            }
          } catch (e) {}
          return "";
        });
        const [isListening, setIsListening] = useState(false);
        const [activeCountry, setActiveCountry] = useState(SHIP_TO_COUNTRIES[0]);
        const [toastMsg, setToastMsg] = useState("");
        // Compose mode: the text editor is active, so the orb, headline and
        // chips clear out and the bar rides just above the keyboard.
        const [composing, setComposing] = useState(false);

        // Attachment popup (Figma 36:1267) — Camera / Photos / Files.
        const [attachOpen, setAttachOpen] = useState(false);

        // Chat history drawer, opened from the Aura wordmark. The log is read
        // on open so it reflects conversations started since this page loaded.
        const [historyOpen, setHistoryOpen] = useState(false);
        const [chatLog, setChatLog] = useState([]);

        const inputRef = useRef(null);
        const attachRef = useRef(null);
        const toastTimer = useRef(null);
        const micTimer = useRef(null);

        // All selectable occasion chips for lookup
        const allOccasions = [...CHIPS_DATA, ...MORE_OCCASIONS];
        const selectedChip = allOccasions.find((c) => c.id === selectedChipId);
        const isCardExpanded =
          Boolean(selectedChipId) || inputVal.includes("\n") || inputVal.length > 35;

        // Track the visual viewport. When the mobile keyboard opens it
        // shrinks the visual viewport without changing the layout viewport,
        // so a bottom-anchored bar would otherwise sit underneath it.
        useEffect(() => {
          const vv = window.visualViewport;
          if (!vv) return;
          const root = document.documentElement;
          const apply = () => {
            root.style.setProperty("--app-h", vv.height + "px");
          };
          apply();
          vv.addEventListener("resize", apply);
          vv.addEventListener("scroll", apply);
          return () => {
            vv.removeEventListener("resize", apply);
            vv.removeEventListener("scroll", apply);
            root.style.removeProperty("--app-h");
          };
        }, []);

        const exitCompose = () => {
          if (inputRef.current) inputRef.current.blur();
          setComposing(false);
        };

        // Read the log at open time rather than on mount: a chat started in
        // this tab and navigated back from should already be in the list.
        const openHistory = () => {
          setChatLog(readChatLog());
          setHistoryOpen(true);
        };

        const openChat = (chat) => {
          window.location.href =
            "conversation.html?prompt=" +
            encodeURIComponent(chat.prompt) +
            "&ship=" +
            encodeURIComponent(chat.ship || activeCountry.code);
        };

        // Attachment popup dismisses on Escape or a click outside it. The
        // popup is a menu, not a dialog, so it does not trap focus.
        useEffect(() => {
          if (!attachOpen) return;
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.preventDefault();
              setAttachOpen(false);
            }
          };
          const onPointer = (e) => {
            if (attachRef.current && !attachRef.current.contains(e.target)) {
              setAttachOpen(false);
            }
          };
          document.addEventListener("keydown", onKey);
          document.addEventListener("pointerdown", onPointer);
          return () => {
            document.removeEventListener("keydown", onKey);
            document.removeEventListener("pointerdown", onPointer);
          };
        }, [attachOpen]);

        // A single pending toast at a time — a new message replaces the old
        // timer rather than racing it.
        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        useEffect(
          () => () => {
            if (toastTimer.current) clearTimeout(toastTimer.current);
            if (micTimer.current) clearTimeout(micTimer.current);
          },
          []
        );

        const isMultiline = inputVal.includes("\n") || inputVal.length > 35;

        const handleMic = () => {
          if (isListening) {
            if (micTimer.current) clearTimeout(micTimer.current);
            setIsListening(false);
            showToast("Voice input stopped");
            return;
          }
          setIsListening(true);
          showToast("Listening — English, Hindi or Hinglish");
          micTimer.current = setTimeout(() => {
            setInputVal(
              "Sister's wedding in Chicago, October.\nA pastel lehenga with a lightweight drape, budget $600."
            );
            setIsListening(false);
            showToast("Voice transcribed into the conversation bar");
          }, 1800);
        };

        // A category is a Discover section; home only ever links into it.
        const openCategory = (cat) => {
          window.location.href = "collection.html?section=" + encodeURIComponent(cat.id);
        };

        // Garments have no product page here. Tapping one hands the stylist
        // an opening line about that piece.
        const startGarmentChat = (g) => {
          const prompt = "Tell me about the " + g.name + " \u2014 " + g.craft + ".";
          showToast("Opening your stylist conversation\u2026");
          setTimeout(() => {
            // The piece travels with the prompt so the chat can show what you
            // tapped, and open its details when you tap it again.
            window.location.href =
              "conversation.html?prompt=" +
              encodeURIComponent(prompt) +
              "&piece=" +
              encodeURIComponent(g.id) +
              "&ship=" +
              encodeURIComponent(activeCountry.code);
          }, 400);
        };

        const handleAsk = (text) => {
          const trimmed = (text || "").trim();
          if (!trimmed) {
            showToast("Tell Aura about your occasion first");
            if (inputRef.current) inputRef.current.focus();
            return;
          }
          showToast("Opening your stylist conversation…");
          setTimeout(() => {
            window.location.href =
              "conversation.html?prompt=" +
              encodeURIComponent(trimmed) +
              "&ship=" +
              encodeURIComponent(activeCountry.code);
          }, 500);
        };

        const loadPrompt = (prompt, label, chipId) => {
          setSelectedChipId(chipId || null);
          setInputVal(prompt);
          showToast(`${label} selected — other chips removed`);
          setTimeout(() => {
            const el = inputRef.current;
            if (!el) return;
            el.focus();
            el.setSelectionRange(prompt.length, prompt.length);
          }, 60);
        };

        const handleChipClick = (chip) => {
          if (chip.isMore) {
            setMoreOpen(true);
          } else {
            loadPrompt(chip.prompt, chip.label, chip.id);
          }
        };

        const handleDeselectChip = () => {
          setSelectedChipId(null);
          setInputVal("");
          showToast("Occasion reset — all chips restored");
        };

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            {/* Toast — announced politely, single entrance, no looping motion */}
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>
            {toastMsg && (
              <div
                aria-hidden="true"
                className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
              >
                <span className="text-gold" aria-hidden="true">
                  ✦
                </span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              <div className="canvas-wash" aria-hidden="true" />
              {/* ---------- 1. Header (hidden while composing) ---------- */}
              {!composing && (
                <header className="relative px-5 pt-4 pb-2 flex items-end justify-between z-20 shrink-0">
                  <div className="flex items-center select-none">
                    <button
                      type="button"
                      onClick={openHistory}
                      aria-label="Open your conversation history"
                      aria-haspopup="dialog"
                      aria-expanded={historyOpen}
                      className="min-h-[44px] -my-2 -ml-1 px-1 flex items-center rounded-lg hover:opacity-70 active:scale-95 transition-all duration-150"
                    >
                      <span className="font-display text-[28px] leading-[22px] tracking-[0.22px] text-ink pt-[3px]">
                        Aura
                      </span>
                    </button>
                  </div>

                  <div className="flex items-end gap-2">
                    <button
                      type="button"
                      onClick={() => showToast("Stylist Desk — 3 master drapers available today")}
                      className="min-h-[44px] -my-2 px-1 flex items-center rounded-lg text-primary text-[16px] font-medium hover:text-ink active:scale-95 transition-all duration-150"
                    >
                      Stylist Desk
                    </button>

                    <button
                      type="button"
                      onClick={() => setDrawerOpen(true)}
                      aria-label="Open navigation menu"
                      aria-haspopup="dialog"
                      aria-expanded={drawerOpen}
                      className="w-11 h-11 -my-2 -mr-2.5 rounded-lg flex items-center justify-center text-ink hover:text-primary active:scale-95 transition-all"
                    >
                      <svg
                        width="22"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.1"
                        strokeLinecap="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <line x1="3" y1="7" x2="21" y2="7" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="17" x2="21" y2="17" />
                      </svg>
                    </button>
                  </div>
                </header>
              )}
              {/* ---------- 2. Ethereal body (hidden while composing) ---------- */}
              {!composing ? (
                <main className="relative flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pt-7 pb-5 z-10">
                  <CategoryCarousel
                    items={HOME_CATEGORIES}
                    onOpen={openCategory}
                    paused={drawerOpen || historyOpen || moreOpen || attachOpen}
                  />

                  {HOME_RAILS.map((rail) => (
                    <GarmentRail key={rail.id} rail={rail} onPick={startGarmentChat} />
                  ))}
                </main>
              ) : (
                /* Empty ground above the composer — tapping it dismisses the
                   keyboard and restores the home screen. */
                <div
                  className="flex-1 z-10"
                  onMouseDown={(e) => {
                    e.preventDefault();
                    exitCompose();
                  }}
                  aria-hidden="true"
                />
              )}
              {/* ---------- 3. Floating conversation card ---------- */}
              <div className="relative px-4 pb-2 pt-1 z-40 shrink-0" ref={attachRef}>
                {attachOpen && (
                  <div className="absolute left-4 right-4 bottom-full z-50">
                    <AttachmentPopup
                      onPick={(opt) => {
                        setAttachOpen(false);
                        showToast(opt.hint);
                      }}
                    />
                  </div>
                )}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    handleAsk(inputVal);
                  }}
                  className={`minimal-floating-bar transition-all duration-300 ${
                    isCardExpanded
                      ? "flex flex-col justify-between p-4 sm:p-5 rounded-[26px] min-h-[148px] shadow-lg border-primary/40"
                      : `flex items-center gap-1 pl-1.5 pr-1.5 py-1.5 ${isMultiline ? "rounded-[22px]" : "rounded-full"}`
                  }`}
                >
                  {!isCardExpanded && (
                    <button
                      type="button"
                      onClick={() => setAttachOpen((v) => !v)}
                      aria-label="Add an attachment"
                      aria-haspopup="menu"
                      aria-expanded={attachOpen}
                      className={`w-11 h-11 shrink-0 self-center rounded-full flex items-center justify-center transition-colors ${
                        attachOpen
                          ? "bg-primary text-onprimary"
