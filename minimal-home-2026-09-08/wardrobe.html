        unit: "in",
        bust: "36",
        waist: "30",
        hip: "39",
        shoulder: "15",
        sleeve: "22",
        length: "41",
        height: "5'5\"",
        fitNote: "",
      };

      function profileMeasurements(p) {
        return MEASURE_KEYS.reduce(function (o, k) {
          o[k] = p[k] !== undefined ? p[k] : PROFILE_SEED[k];
          return o;
        }, {});
      }

      const FAMILY_KEY = "aura.family.v1";

      function readFamily() {
        try {
          const raw = window.localStorage.getItem(FAMILY_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) && parsed.length ? parsed : FAMILY;
        } catch (e) {
          return FAMILY;
        }
      }

      function writeFamily(list) {
        try {
          window.localStorage.setItem(FAMILY_KEY, JSON.stringify(list));
        } catch (e) {
          /* a record that cannot be stored still shows for this session */
        }
      }

      const FAMILY = [
        {
          id: "fam-1",
          name: "Meera R.",
          relation: "Mother",
          values: 12,
          updated: "Updated 21 Jul 2026",
          initials: "MR",
        },
        {
          id: "fam-2",
          name: "Ravi",
          relation: "Partner",
          values: 10,
          updated: "Updated 28 Nov 2025",
          initials: "R",
        },
        {
          id: "fam-3",
          name: "Aarav",
          relation: "Son, 7",
          values: 8,
          updated: "Re-measure suggested — children grow",
          initials: "A",
          stale: true,
        },
      ];

      const CREDITS = [
        {
          id: "alter",
          label: "Alterations",
          count: 2,
          note: "Free re-fitting on any piece you own. Post it back, we adjust and return it.",
        },
        {
          id: "care",
          label: "Care services",
          count: 1,
          note: "Specialist clean and press, including zari and mirror work.",
        },
      ];

      /* A heart holds either a garment name or a curated entry's id, so
         resolve against both before falling back to the raw key. */
      function resolveFavourite(key) {
        const piece = PIECES.find((p) => p.name === key);
        if (piece) {
          return {
            key,
            name: piece.name,
            title: piece.name,
            meta: piece.craft,
            image: piece.image,
            swatch: piece.swatch,
            piece,
          };
        }
        for (const section of CURATIONS) {
          const it = section.items.find((i) => i.id === key);
          if (it) {
            return {
              key,
              name: it.title,
              title: it.title,
              meta: it.meta,
              image: it.image,
              swatch: it.swatch,
              piece: it.piece ? PIECES.find((p) => p.id === it.piece) : null,
            };
          }
        }
        return { key, name: key, title: key, meta: "Saved", swatch: SWATCHES.ivory };
      }

      /* ===================================================================
       SHARED ROW PIECES
       =================================================================== */
      function Swatch({ item, className }) {
        const [failed, setFailed] = useState(false);

        if (failed || !item.image) {
          return (
            <span
              className={className}
              role="img"
              aria-label={`${item.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${item.swatch[0]} 0%, ${item.swatch[2]} 55%, ${item.swatch[1]} 100%)`,
              }}
            />
          );
        }
        return (
          <img
            src={item.image}
            alt={item.name}
            loading="lazy"
            onError={() => setFailed(true)}
            className={`${className} object-cover`}
            draggable="false"
          />
        );
      }

      /* ===================================================================
       MAIN
       =================================================================== */
      function App() {
        const wish = useWishlist();

        const favourites = wish.ids.map(resolveFavourite);

        const openFavourite = (f) => {
          if (f.piece) setOpenPiece(f.piece);
          else showToast(`${f.title} — details open in the next release`);
        };
        const [drawerOpen, setDrawerOpen] = useState(false);
        const [activeCountry, setActiveCountry] = useState(SHIP_TO[0]);
        const [openPiece, setOpenPiece] = useState(null);
        // Family grows in-session, and the measurements somebody typed by hand
        // are worth keeping across a reload.
        const [family, setFamily] = useState(readFamily);
        const [addOpen, setAddOpen] = useState(false);
        const [measuring, setMeasuring] = useState(null);
        const [selfProfile, setSelfProfile] = useState(readProfile);

        useEffect(() => {
          writeFamily(family);
        }, [family]);
        // Owned items is the longest section, so it stays folded until asked for.
        const [ownedOpen, setOwnedOpen] = useState(false);
        const [toastMsg, setToastMsg] = useState("");
        const toastTimer = useRef(null);

        const showToast = useCallback((msg) => {
          setToastMsg(msg);
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
        }, []);

        useEffect(() => () => clearTimeout(toastTimer.current), []);

        // Reordering hands the piece to the stylist with its original
        // measurement set named, so the thread starts from what we know.
        const reorder = (owned) => {
          window.location.href =
            "conversation.html?prompt=" +
            encodeURIComponent(
              `Reorder the ${owned.name} — ${owned.craft}.\nCut to "${owned.profile}", same as ${owned.delivered}.`
            ) +
            "&ship=" +
            encodeURIComponent(activeCountry.code);
        };

        const viewPiece = (owned) => {
          const p = PIECES.find((x) => x.id === owned.piece);
          if (p) setOpenPiece(p);
          else showToast(`${owned.name} — details open in the next release`);
        };

        const totalCredits = CREDITS.reduce((n, c) => n + c.count, 0);

        return (
          <div className="min-h-screen w-full bg-canvas flex justify-center font-sans">
            <div className="sr-only" role="status" aria-live="polite">
              {toastMsg}
            </div>

            {toastMsg && (
              <div
                className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] max-w-[calc(100%-2rem)] px-4 py-2.5 rounded-full bg-ink text-canvas text-[12.5px] shadow-lg aura-toast-in"
                aria-hidden="true"
              >
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            <div className="app-viewport">
              {/* ---------- Header ---------- */}
              <header className="shrink-0 flex items-center gap-2 px-4 pt-4 pb-2">
                <a
                  href="index.html"
                  aria-label="Back to home"
                  className="shrink-0 -ml-1.5 min-h-[44px] pr-2 pl-1.5 flex items-center gap-1.5 rounded-lg text-ink hover:text-primary active:scale-95 transition-all"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                  <span className="text-[13.5px] font-medium">Back to chat</span>
                </a>

                <div className="min-w-0 flex-1 text-right pr-1">
                  <h1 className="font-display text-[20px] text-primary leading-tight truncate">
                    Wardrobe
                  </h1>
                </div>

                <button
                  type="button"
                  onClick={() => setDrawerOpen(true)}
                  aria-label="Open navigation menu"
                  aria-haspopup="dialog"
                  aria-expanded={drawerOpen}
                  className="w-11 h-11 -mr-2 rounded-lg flex items-center justify-center text-ink hover:text-primary active:scale-95 transition-all shrink-0"
                >
                  <svg
                    width="22"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.1"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <line x1="3" y1="7" x2="21" y2="7" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="17" x2="21" y2="17" />
                  </svg>
                </button>
              </header>

              <div className="thread-scroll px-4 pt-4 pb-24">
                {/* ---------- Favourites ---------- */}
                <section className="mb-7" aria-labelledby="fav-title">
                  <div className="flex items-baseline justify-between gap-3 mb-2.5">
                    <h2 id="fav-title" className="font-display text-[20px] leading-tight text-ink">
                      Favourites
                    </h2>
                    <span className="font-mono text-[10.5px] text-muted shrink-0">
                      {favourites.length} saved
                    </span>
                  </div>
                  {favourites.length === 0 ? (
                    <p className="text-[13px] text-muted leading-relaxed text-center py-6 rounded-2xl border border-dashed border-ctrl/50">
                      Nothing saved yet. Tap the heart on any piece and it will wait here.
                    </p>
                  ) : (
                    <div className="flex gap-2.5 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">
                      {favourites.map((f) => (
                        <div key={f.key} className="relative shrink-0 w-[124px]">
                          <button
                            type="button"
                            onClick={() => openFavourite(f)}
                            aria-label={`${f.title} — ${f.meta}`}
                            aria-haspopup={f.piece ? "dialog" : undefined}
                            className="block w-full text-left bg-card border border-hairline rounded-2xl overflow-hidden hover:border-primary/45 hover:shadow-md active:scale-[0.985] transition-all"
                          >
                            <Swatch item={f} className="block w-full aspect-[3/4] bg-inset" />
                            <span className="block p-2">
                              <span className="block text-[12.5px] font-medium text-ink leading-snug line-clamp-2 min-h-[32px]">
                                {f.title}
                              </span>
                              <span className="block text-[10.5px] text-muted leading-snug mt-0.5 line-clamp-1">
                                {f.meta}
                              </span>
                            </span>
                          </button>

                          <HeartButton
                            saved
                            onToggle={() => wish.toggle(f.key)}
                            name={f.title}
                            className="absolute top-2 right-2"
                          />
                        </div>
                      ))}
                    </div>
                  )}
                </section>
                {/* ---------- Owned items ---------- */}
                <section className="mb-7" aria-labelledby="owned-title">
                  <h2 id="owned-title" className="sr-only">
                    Owned items
                  </h2>

                  <button
                    type="button"
                    onClick={() => setOwnedOpen((v) => !v)}
                    aria-expanded={ownedOpen}
                    aria-controls="owned-list"
                    className="w-full text-left flex items-center gap-2 -mx-1 px-1 py-1 mb-2.5 rounded-xl hover:bg-inset/60 active:scale-[0.995] transition-colors"
                  >
                    <span className="font-display text-[20px] leading-tight text-ink">
                      Owned items
                    </span>
                    <span className="font-mono text-[10.5px] text-muted">
                      {OWNED.length} pieces
                    </span>
                    <span className="flex-1" />
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      className={`shrink-0 text-primary transition-transform duration-200 ${
                        ownedOpen ? "rotate-90" : ""
                      }`}
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="m9 18 6-6-6-6" />
                    </svg>
                  </button>

                  {ownedOpen && (
                    <div id="owned-list" className="flex flex-col gap-2.5 aura-fade-in">
                      {OWNED.map((o) => (
                        <div
                          key={o.id}
                          className="bg-card border border-hairline rounded-2xl overflow-hidden"
                        >
                          <button
                            type="button"
                            onClick={() => viewPiece(o)}
                            aria-label={`${o.name} — delivered ${o.delivered}`}
                            aria-haspopup="dialog"
                            className="w-full text-left flex items-stretch gap-3 p-2.5 hover:bg-inset/40 active:scale-[0.995] transition-colors"
                          >
                            <Swatch
                              item={o}
                              className="shrink-0 w-[58px] h-[76px] rounded-xl overflow-hidden bg-inset"
                            />
                            <span className="min-w-0 flex-1 flex flex-col justify-center">
                              <span className="block text-[14px] font-medium text-ink leading-snug">
                                {o.name}
                              </span>
                              <span className="block text-[11.5px] text-muted leading-snug mt-0.5 line-clamp-1">
                                {o.craft}
                              </span>
                              <span className="block font-mono text-[10.5px] text-muted mt-1">
                                Delivered {o.delivered}
                              </span>
                              <span className="block text-[11px] text-muted mt-0.5">
                                {o.worn} · cut to {o.profile}
                              </span>
                            </span>
                          </button>

                          <div className="flex border-t border-hairline divide-x divide-hairline">
                            <button
                              type="button"
                              onClick={() => reorder(o)}
                              className="flex-1 min-h-[44px] text-[12px] font-medium text-primary hover:bg-inset active:scale-[0.98] transition-colors"
                            >
                              Reorder
                            </button>
                            <button
                              type="button"
                              onClick={() =>
                                showToast(`Alteration requested for ${o.name} — 1 credit used`)
                              }
                              className="flex-1 min-h-[44px] text-[12px] font-medium text-ink hover:bg-inset active:scale-[0.98] transition-colors"
                            >
                              Alter
                            </button>
                            <button
                              type="button"
                              onClick={() => showToast(`Care service booked for ${o.name}`)}
                              className="flex-1 min-h-[44px] text-[12px] font-medium text-ink hover:bg-inset active:scale-[0.98] transition-colors"
                            >
                              Care
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* ---------- Measurement profiles ---------- */}
                <section className="mb-7" aria-labelledby="profiles-title">
                  <h2
                    id="profiles-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Measurement profiles
                  </h2>
                  <div className="flex flex-col gap-2.5">
                    {PROFILES.map((p) => (
                      <button
                        key={p.id}
                        type="button"
                        aria-haspopup="dialog"
                        onClick={() =>
                          setMeasuring({
                            id: "self",
                            self: true,
                            name: p.name,
                            relation: "",
                            m: profileMeasurements(selfProfile),
                          })
                        }
                        className="w-full text-left p-3 bg-card border border-hairline rounded-2xl hover:border-primary/45 active:scale-[0.99] transition-all"
                      >
                        <span className="flex items-center justify-between gap-3">
                          <span className="text-[14px] font-medium text-ink truncate">
                            {p.name}
                          </span>
                          {p.primary && (
                            <span className="shrink-0 font-mono text-[9.5px] uppercase tracking-wider text-goldtext border border-goldtext/40 rounded-full px-2 py-0.5">
                              Primary
                            </span>
                          )}
                        </span>
                        <span className="block text-[11.5px] text-muted leading-snug mt-1">
                          {p.note}
                        </span>
                        <span className="block font-mono text-[10.5px] text-muted mt-1.5">
                          {selfProfile.measuredCount !== undefined
                            ? selfProfile.measuredCount + " values · " + selfProfile.measuredAt
                            : p.values + " values · " + p.updated}
                        </span>
                      </button>
                    ))}
                  </div>
                </section>

                {/* ---------- Family members ---------- */}
                <section className="mb-7" aria-labelledby="family-title">
                  <h2
                    id="family-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Family members
                  </h2>
                  <div className="flex flex-col gap-2.5">
                    {family.map((f) => (
                      <button
                        key={f.id}
                        type="button"
                        onClick={() => setMeasuring(f)}
                        aria-haspopup="dialog"
                        className="w-full text-left flex items-center gap-3 p-3 bg-card border border-hairline rounded-2xl hover:border-primary/45 active:scale-[0.99] transition-all"
                      >
                        <span
                          aria-hidden="true"
                          className="shrink-0 w-10 h-10 rounded-full bg-gold text-ink font-display text-[15px] flex items-center justify-center"
                        >
                          {f.initials}
                        </span>
                        <span className="min-w-0 flex-1">
                          <span className="block text-[14px] font-medium text-ink truncate">
                            {f.name}
                            <span className="text-muted font-normal"> · {f.relation}</span>
                          </span>
                          <span
                            className={`block font-mono text-[10.5px] mt-1 ${
                              f.stale ? "text-goldtext" : "text-muted"
                            }`}
                          >
                            {f.values} values · {f.updated}
                          </span>
                        </span>
                      </button>
                    ))}

                    <button
                      type="button"
                      onClick={() => setAddOpen(true)}
                      aria-haspopup="dialog"
                      className="w-full min-h-[48px] rounded-2xl border border-dashed border-ctrl/60 text-[12.5px] font-medium text-primary hover:bg-inset active:scale-[0.99] transition-all"
                    >
                      Add someone
                    </button>
                  </div>
                </section>

                {/* ---------- Care & alteration credits ---------- */}
                <section className="mb-7" aria-labelledby="credits-title">
                  <h2
                    id="credits-title"
                    className="font-display text-[20px] leading-tight text-ink mb-2.5"
                  >
                    Care &amp; alteration credits
                  </h2>

                  <div className="bg-card border border-hairline rounded-2xl overflow-hidden">
                    {CREDITS.map((c, i) => (
                      <div
                        key={c.id}
                        className={`p-3.5 ${i > 0 ? "border-t border-hairline" : ""}`}
                      >
                        <div className="flex items-baseline justify-between gap-3">
                          <span className="font-mono text-[11px] uppercase tracking-wider text-muted">
                            {c.label}
                          </span>
                          <span className="font-mono text-[18px] font-medium text-ink leading-none">
                            {c.count}
                          </span>
                        </div>
                        <p className="text-[11.5px] text-muted leading-snug mt-1.5">{c.note}</p>
                      </div>
                    ))}

                    <div className="px-3.5 py-3 border-t border-hairline bg-inset/50 flex items-center justify-between gap-3">
                      <span className="text-[11px] text-muted leading-snug">
                        Credits never expire while you own the piece.
                      </span>
                      <button
                        type="button"
                        onClick={() =>
                          showToast(`${totalCredits} credits available — pick a piece to use one`)
                        }
                        className="shrink-0 min-h-[44px] -my-2 px-1 text-[12px] font-medium text-primary hover:text-ink transition-colors"
                      >
                        Use a credit
                      </button>
                    </div>
                  </div>
                </section>
              </div>

              {measuring && (
                <PersonMeasureSheet
                  person={measuring}
                  onToast={showToast}
                  onClose={() => setMeasuring(null)}
                  onSave={(m, filled) => {
                    if (measuring.self) {
                      // Merge into the Profile store; leave everything else alone.
                      const next = Object.assign({}, readProfile(), m, {
                        measuredAt: todayStamp(),
                        measuredCount: filled,
                      });
                      try {
                        window.localStorage.setItem(PROFILE_KEY, JSON.stringify(next));
                      } catch (e) {
                        /* still shows for this session */
                      }
                      setSelfProfile(next);
                      setMeasuring(null);
                      showToast("Your measurements saved");
                      return;
                    }
                    setFamily((list) =>
                      list.map((p) =>
                        p.id === measuring.id
                          ? Object.assign({}, p, {
                              m,
                              values: filled,
                              updated: todayStamp(),
                              stale: filled === 0,
                            })
                          : p
                      )
                    );
                    setMeasuring(null);
                    showToast(measuring.name + "'s measurements saved");
                  }}
                />
              )}

              {addOpen && (
                <AddPersonSheet
                  onClose={() => setAddOpen(false)}
                  onSave={(person) => {
                    setFamily((list) => list.concat(person));
                    setAddOpen(false);
                    showToast(person.name + " added — measurements next");
                  }}
                />
              )}

              {/* ---------- Product detail sheet ---------- */}
              {openPiece && (
                <ProductDetailSheet
                  saved={wish.saved(openPiece.name)}
                  onSave={() => wish.toggle(openPiece.name)}
                  piece={openPiece}
                  ship={activeCountry}
                  onClose={() => setOpenPiece(null)}
                  onRequest={(p) => {
                    // See Fit opens the thread on the measurements the piece would
                    // be cut to, rather than on a request for it. The picture and
                    // name travel with it so the thread never has to look the piece
                    // up in a catalogue that may not carry it.
                    window.location.href =
                      "conversation.html?prompt=" +
                      encodeURIComponent(`See how the ${p.name} fits me.`) +
                      "&piece=" +
                      encodeURIComponent(p.id) +
                      "&name=" +
                      encodeURIComponent(p.name) +
                      "&craft=" +
                      encodeURIComponent(p.craft || "") +
                      "&img=" +
                      encodeURIComponent(p.image || "") +
                      "&from=" +
                      encodeURIComponent(p.from || "") +
                      "&fit=1&ship=" +
                      encodeURIComponent(activeCountry.code);
                  }}
                  onAsk={(p, view) => {
                    setOpenPiece(null);
                    showToast(`Asked Meera about the ${view.label.toLowerCase()} on ${p.name}`);
                  }}
                />
              )}

              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <div className="bg-card w-4/5 max-w-xs h-full p-5 flex flex-col justify-between border-l border-hairline shadow-2xl drawer-slide-in overflow-y-auto">
                  <div className="space-y-6">
                    {/* Profile */}
                    <div className="pb-3.5 border-b border-hairline">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span
                            aria-hidden="true"
                            className="relative w-12 h-12 rounded-full bg-gold text-ink font-display text-[19px] flex items-center justify-center shadow-sm"
                          >
                            PS
                          </span>
                          <span className="flex flex-col">
                            <span className="flex items-center gap-1">
                              <span
                                id="drawer-title"
                                className="font-semibold text-[16px] text-ink leading-tight tracking-tight"
                              >
                                Priya Sharma
                              </span>
                              <button
                                type="button"
                                onClick={() => (window.location.href = "profile.html")}
                                aria-label="Edit your profile"
                                className="w-11 h-11 -my-3 -ml-1 -mr-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition-colors shrink-0"
                              >
                                <svg
                                  width="14"
                                  height="14"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="2"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M12 20h9" />
                                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                                </svg>
                              </button>
                              <span
                                className="w-2 h-2 rounded-full bg-[#3F7A4B] shrink-0"
                                role="img"
                                aria-label="Your stylist is online"
                              />
                            </span>
                            <span className="font-mono text-[11px] text-muted mt-0.5">
                              Toronto, ON
                            </span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setDrawerOpen(false)}
                          aria-label="Close navigation menu"
                          className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {/* 5 primary tabs */}
                    <nav aria-label="Primary">
                      <ul className="space-y-1">
                        {[
                          {
                            id: "home",
                            label: "01 · Home",
                            link: "index.html",
                            desc: "Occasion-first landing",
                          },
                          {
                            id: "discover",
                            label: "02 · Discover",
                            link: "discover.html",
                            desc: "Craft & regional provenance",
                          },
                          {
                            id: "design",
                            label: "03 · Design",
                            link: "designers.html",
                            desc: "The makers behind the cloth",
                          },
                          {
                            id: "wardrobe",
                            active: true,
                            label: "04 · Wardrobe",
                            link: "wardrobe.html",
                            desc: "Memory & measurements",
                          },
                          {
                            id: "orders",
                            label: "05 · Orders",
                            link: "orders.html",
                            desc: "Live artisan production tracker",
                          },
                        ].map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              aria-current={item.active ? "page" : undefined}
                              onClick={() => {
                                if (item.link) {
                                  window.location.href = item.link;
                                  return;
                                }
                                setDrawerOpen(false);
                                showToast(`${item.label.split("· ")[1]} opens in the next release`);
                              }}
                              className={`w-full text-left p-2.5 min-h-[52px] rounded-r-xl transition-colors border-l-[3px] ${
                                item.active
                                  ? "bg-inset text-primary font-semibold border-primary"
                                  : "hover:bg-selfill text-ink border-transparent"
                              }`}
                            >
                              <span className="block text-[14px]">{item.label}</span>
                              <span className="block text-[11px] text-muted font-normal mt-0.5">
                                {item.desc}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </nav>

                    {/* Dual-geography */}
                    <div className="pt-4 border-t border-hairline space-y-2">
                      <span
                        id="ship-to-label"
                        className="font-mono text-[10.5px] uppercase tracking-wider text-muted font-medium block"
                      >
                        Ship to
                      </span>
                      <div
                        className="flex items-center gap-1.5"
                        role="group"
                        aria-labelledby="ship-to-label"
                      >
                        {SHIP_TO.map((c) => (
                          <button
                            key={c.code}
                            type="button"
                            aria-pressed={activeCountry.code === c.code}
                            onClick={() => {
                              setActiveCountry(c);
                              showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                            }}
                            className={`flex-1 min-h-[44px] px-1 rounded-lg border text-[11.5px] font-mono transition-colors ${
                              activeCountry.code === c.code
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            <span aria-hidden="true">{c.flag}</span> {c.code}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Landed-cost disclosure sits at the foot of the drawer
                      (Figma 31:1282) and restates the selected market. */}
                  <div className="pt-6">
                    <p className="text-[11px] text-muted leading-snug">
                      Prices are landed to {activeCountry.code} — {activeCountry.duty},{" "}
                      {activeCountry.courier}. Nothing is added at checkout.
                    </p>
                    <div className="flex items-center justify-between gap-3 pt-3 mt-3 border-t border-hairline text-muted text-[11px] font-mono">
                      <span>Aura v1.0</span>
                      <span className="text-ink">Perfect Fit Guarantee</span>
                    </div>
                  </div>
                </div>
              </Overlay>

              {/* ---------- Minimised chat -- returns to home ---------- */}
              <a
                href="index.html"
                aria-label="Back to home"
                className="absolute bottom-7 right-4 w-14 h-14 rounded-full bg-primary text-onprimary flex items-center justify-center shadow-lg hover:bg-primary/90 active:scale-95 transition-all"
              >
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="1.9"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
