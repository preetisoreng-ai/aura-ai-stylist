<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Aura — Wardrobe</title>

      name="description"
      content="Your Aura wardrobe — pieces you own, measurement profiles, family members, reorders, and care and alteration credits."
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      /* Same channel-based token strategy as index.html so Tailwind's
       `/opacity` modifier resolves against CSS variables. */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: "rgb(var(--canvas-rgb) / <alpha-value>)",
              card: "rgb(var(--card-rgb) / <alpha-value>)",
              inset: "rgb(var(--inset-rgb) / <alpha-value>)",
              primary: "rgb(var(--primary-rgb) / <alpha-value>)",
              onprimary: "rgb(var(--onprimary-rgb) / <alpha-value>)",
              selfill: "rgb(var(--sel-fill-rgb) / <alpha-value>)",
              ink: "rgb(var(--ink-rgb) / <alpha-value>)",
              muted: "rgb(var(--muted-rgb) / <alpha-value>)",
              hairline: "rgb(var(--hairline-rgb) / <alpha-value>)",
              ctrl: "rgb(var(--ctrl-border-rgb) / <alpha-value>)",
              gold: "rgb(var(--gold-rgb) / <alpha-value>)",
              goldtext: "rgb(var(--gold-text-rgb) / <alpha-value>)",
            },
            fontFamily: {
              display: ['"Instrument Serif"', "Iowan Old Style", "Georgia", "serif"],
              sans: ['"DM Sans"', "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ['"DM Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --canvas-rgb: 243 239 231; /* #F3EFE7 Warm Ivory · surface-0 (Figma 1:2285) */
        --card-rgb: 255 255 255;
        --inset-rgb: 243 238 228;
        --primary-rgb: 59 42 90;
        --onprimary-rgb: 255 255 255;
        --sel-fill-rgb: 245 244 247;
        --ink-rgb: 30 27 46;
        --muted-rgb: 90 84 104;
        --hairline-rgb: 229 223 213;
        --ctrl-border-rgb: 124 123 134;
        --gold-rgb: 200 155 60;
        --gold-text-rgb: 120 93 36;

        --canvas: rgb(var(--canvas-rgb));
        --card: rgb(var(--card-rgb));
        --ink: rgb(var(--ink-rgb));

        --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        --e-float:
          0 14px 34px -8px rgb(var(--primary-rgb) / 0.16),
          0 3px 10px -2px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .app-viewport {
        width: 100%;
        max-width: 430px;
        /* --app-h follows window.visualViewport so the composer stays above
           the on-screen keyboard; the thread scrolls in the space left. */
        height: var(--app-h, 100vh);
        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Guaranteed regardless of the CDN build's utility coverage. */
      .line-clamp-1,
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 {
        -webkit-line-clamp: 1;
      }
      .line-clamp-2 {
        -webkit-line-clamp: 2;
      }

      .thread-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .thread-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .thread-scroll::-webkit-scrollbar-thumb {
        background: rgb(var(--hairline-rgb));
        border-radius: 9999px;
      }

      /* Reuse the home screen's chip geometry — 44px minimum target. */
      .reply-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 9999px;
        background: rgb(var(--card-rgb) / 0.9);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        color: rgb(var(--ink-rgb));
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgb(var(--ink-rgb) / 0.03);
      }

      .reply-chip:hover {
        border-color: rgb(var(--primary-rgb) / 0.55);
        background: rgb(var(--card-rgb));
        color: rgb(var(--primary-rgb));
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -4px rgb(var(--primary-rgb) / 0.14);
      }

      .reply-chip:active {
        transform: scale(0.975);
      }

      .composer-bar {
        background: var(--card);
        border: 1px solid rgb(var(--hairline-rgb) / 0.95);
        box-shadow: var(--e-float);
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease;
      }

      .composer-bar:focus-within {
        border-color: rgb(var(--primary-rgb) / 0.75);
        box-shadow:
          0 16px 40px -8px rgb(var(--primary-rgb) / 0.2),
          0 0 0 3px rgb(var(--primary-rgb) / 0.1);
      }

      /* The reply field is measured in JS to grow it line by line, so its
         metrics live here rather than in Tailwind's async JIT sheet -- those
         classes land after the first measurement and size it short. */
      .aura-reply-field {
        font-size: 16px;
        line-height: 22px;
        padding: 6px 44px 6px 0;
      }

      .aura-reply-field.is-open {
        padding: 2px 32px 2px 0;
      }

      .home-pill-line {
        width: 134px;
        height: 5px;
        background: var(--ink);
        opacity: 0.2;
        border-radius: 9999px;
        margin: 10px auto 4px auto;
      }

      /* ---------- Motion ---------- */
      @keyframes auraMsgIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes auraToastIn {
        from {
          transform: translate(-50%, -14px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      @keyframes auraTypingDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @keyframes auraListenRing {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / 0.35);
        }
        50% {
          box-shadow: 0 0 0 7px rgb(var(--primary-rgb) / 0);
        }
      }

      @keyframes auraSheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .aura-sheet-up {
        animation: auraSheetUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Carousel track: swipeable, but without a visible scrollbar. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .aura-msg-in {
        animation: auraMsgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;
      }

      .typing-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .reply-chip:hover {
          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
    </style>
  </head>

      /* Same fallback contract as the stylist thread: a photograph when we
                     have one, otherwise a woven panel in the piece's own palette. */
      /* ===================================================================
             PIECE ROW — the catalogue result when a garment pill is selected.
             A full-width row rather than a grid card, so a filtered lookup reads
             as a list and never gets confused with the curated rails.
             =================================================================== */
      /* ===================================================================
       WISHLIST
       Saved pieces, shared by every surface that shows a garment — the
       suggestion cards, the list rows and the detail sheet. Kept in
       localStorage so a heart tapped on Discover is still filled when the
       same piece turns up in a conversation.

       Storage is best-effort: a private window or blocked site data throws,
       and the hearts simply behave as an unsaved session.
       =================================================================== */
      const WISHLIST_KEY = "aura.wishlist";

      function readWishlist() {
        try {
          const raw = window.localStorage.getItem(WISHLIST_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter((x) => typeof x === "string") : [];
        } catch (e) {
          return [];
        }
      }

      function writeWishlist(ids) {
        try {
          window.localStorage.setItem(WISHLIST_KEY, JSON.stringify(ids));
        } catch (e) {
          /* saving is a convenience, never a blocker */
        }
      }

      // One source of truth per screen, so a heart tapped on a card updates
      // the sheet sitting on top of it and vice versa.
      function useWishlist() {
        const [ids, setIds] = useState(readWishlist);

        const toggle = useCallback((id) => {
          if (!id) return;
          setIds((cur) => {
            const next = cur.indexOf(id) === -1 ? cur.concat(id) : cur.filter((x) => x !== id);
            writeWishlist(next);
            return next;
          });
        }, []);

        // Another tab, or a return trip through the back button.
        useEffect(() => {
          const sync = (e) => {
            if (!e || e.key === WISHLIST_KEY) setIds(readWishlist());
          };
          window.addEventListener("storage", sync);
          window.addEventListener("pageshow", sync);
          return () => {
            window.removeEventListener("storage", sync);
            window.removeEventListener("pageshow", sync);
          };
        }, []);

        return {
          ids,
          saved: (id) => ids.indexOf(id) !== -1,
          toggle,
        };
      }

      /* `tone="overlay"` sits on a photograph; `tone="plain"` on a light
         surface. Saved flips to a filled plum heart on white either way. */
      function HeartButton({ saved, onToggle, name, tone, className }) {
        const overlay = tone !== "plain";
        const base =
          "shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-all active:scale-90";
        const skin = saved
          ? "bg-card text-primary shadow-sm border border-hairline"
          : overlay
            ? "bg-black/35 text-white border border-white/25 hover:bg-black/55"
            : "bg-card text-muted border border-hairline hover:text-primary hover:border-primary/45";

        return (
          <button
            type="button"
            aria-pressed={saved}
            aria-label={
              saved ? `Remove ${name} from your wishlist` : `Save ${name} to your wishlist`
            }
            onClick={(e) => {
              // Cards are buttons themselves; never open the sheet from here.
              e.preventDefault();
              e.stopPropagation();
              onToggle();
            }}
            className={`${base} ${skin} ${className || ""}`}
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill={saved ? "currentColor" : "none"}
              stroke="currentColor"
              strokeWidth={saved ? 0 : 1.9}
              strokeLinecap="round"
              strokeLinejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 20.5 3.9 12.6a5 5 0 0 1 7.1-7.1l1 1 1-1a5 5 0 0 1 7.1 7.1Z" />
            </svg>
          </button>
        );
      }
      function PieceThumb({ piece }) {
        const [failed, setFailed] = useState(false);

        if (failed || !piece.image) {
          return (
            <span
              className="block w-full h-full"
              role="img"
              aria-label={`${piece.name} — photograph not yet available`}
              style={{
                background: `linear-gradient(150deg, ${piece.swatch[0]} 0%, ${piece.swatch[2]} 55%, ${piece.swatch[1]} 100%)`,
              }}
            >
              <span
                className="block w-full h-full opacity-30"

                     COMPONENT: OVERLAY — same contract as the home screen's drawer.
                     Escape to close, background scroll lock, focus moved in on open
                     and restored to the trigger on close, focus kept inside while open.
                     =================================================================== */
      function Overlay({ open, onClose, labelledBy, align, children }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);

        useEffect(() => {
          if (!open) return;

          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (items.length === 0) return;
            const firstEl = items[0];
            const lastEl = items[items.length - 1];
            if (e.shiftKey && document.activeElement === firstEl) {
              e.preventDefault();
              lastEl.focus();
            } else if (!e.shiftKey && document.activeElement === lastEl) {
              e.preventDefault();
              firstEl.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const restore = restoreRef.current;
            if (restore && typeof restore.focus === "function") restore.focus();
          };
        }, [open, onClose]);

        if (!open) return null;

        return (
          <div
            className={`absolute inset-0 z-50 flex aura-fade-in ${align === "end" ? "justify-end" : "items-end justify-center"}`}
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)", backdropFilter: "blur(2px)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby={labelledBy}
              tabIndex={-1}
              className="focus:outline-none contents"
            >
              {children}
            </div>
          </div>
        );
      }

      function AiScanModal({ onClose, onDone }) {
        const [shots, setShots] = useState({});
        const [capturing, setCapturing] = useState(null); // shot id while the camera is live
        const [countdown, setCountdown] = useState(0);
        const [camError, setCamError] = useState("");
        const [picking, setPicking] = useState(null); // the shot whose picker is open
        const [streamTick, setStreamTick] = useState(0);

        const videoRef = useRef(null);
        const streamRef = useRef(null);
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const timerRef = useRef(null);

        const stopCamera = useCallback(() => {
          if (timerRef.current) clearInterval(timerRef.current);
          timerRef.current = null;
          if (streamRef.current) {
            streamRef.current.getTracks().forEach((t) => t.stop());
            streamRef.current = null;
          }
        }, []);

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            stopCamera();
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose, stopCamera]);

        // Attach once both the element and the stream exist.
        useEffect(() => {
          const v = videoRef.current;
          const stream = streamRef.current;
          if (!capturing || !v || !stream) return;
          v.srcObject = stream;
          const p = v.play();
          if (p && p.catch) p.catch(() => {});
        }, [capturing, streamTick]);

        const openCamera = async (id) => {
          setCamError("");
          setCapturing(id);
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: "user",
                width: { ideal: 1080 },
                height: { ideal: 1920 },
              },
              audio: false,
            });
            streamRef.current = stream;
            // The <video> only mounts on the re-render that `capturing` triggers,
            // so hand off to an effect rather than touching the ref here, where it
            // is still null.
            setStreamTick((n) => n + 1);
          } catch (err) {
            // No camera, or permission refused — the upload path still works.
            setCamError(
              err && err.name === "NotAllowedError"
                ? "Camera permission was declined. You can upload a photograph instead."
                : "No camera available on this device. Upload a photograph instead."
            );
          }
        };

        const grabFrame = (id) => {
          const v = videoRef.current;
          if (!v || !v.videoWidth) {
            setCountdown(0);
            setCamError("Could not read a frame from the camera. Upload a photograph instead.");
            return;
          }
          const c = document.createElement("canvas");
          c.width = v.videoWidth;
          c.height = v.videoHeight;
          const ctx = c.getContext("2d");
          // Mirror the front camera back, so the saved frame reads the way a
          // photograph would rather than the way a mirror does.
          ctx.translate(c.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(v, 0, 0, c.width, c.height);
          setShots((s) => ({ ...s, [id]: c.toDataURL("image/jpeg", 0.85) }));
          stopCamera();
          setCapturing(null);
          setCountdown(0);
        };

        // and holding the phone.
        const startTimer = (id) => {
          if (timerRef.current) clearInterval(timerRef.current);
          let n = 5;
          setCountdown(n);
          timerRef.current = setInterval(() => {
            n -= 1;
            setCountdown(n);
            if (n <= 0) {
              clearInterval(timerRef.current);
              timerRef.current = null;
              grabFrame(id);
            }
          }, 1000);

          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => setShots((s) => ({ ...s, [id]: reader.result }));
          reader.readAsDataURL(file);
          e.target.value = "";

                  aria-label="Close AI scan"
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >

                    height="17"

                    <h2 id="scan-title" className="font-display text-[22px] text-ink leading-tight">

                  </div>

                  <div className="relative flex-1 min-h-0 mx-5 rounded-2xl overflow-hidden bg-ink">
                    <video

                      playsInline

                      style={{ transform: "scaleX(-1)" }}

                /* ---------- Setup and review ---------- */
                <div className="flex-1 overflow-y-auto px-5 pb-5">
                  <h2 id="scan-title" className="font-display text-[24px] text-ink leading-tight">
                    AI scan
                  </h2>
                  <div className="mt-5 rounded-2xl border border-hairline bg-inset/50 p-4">
                    <h3 className="font-mono text-[10.5px] uppercase tracking-wider text-muted mb-2">
                      How to stand
                    </h3>
                    <ul className="space-y-1.5">
                      {STANDING_GUIDE.map((g, i) => (
                        <li key={i} className="flex gap-2 text-[12px] text-ink leading-snug">
                          <span className="font-mono text-[10.5px] text-goldtext shrink-0 mt-0.5">
                            {String(i + 1).padStart(2, "0")}
                          </span>
                          <span>{g}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Three shots, three cards, side by side — the stance cue moves
                into the picker, where it is read at the moment it matters. */}
                  <div className="mt-4 grid grid-cols-3 gap-2.5">
                    {SHOTS.map((s) => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setPicking(s)}
                        aria-haspopup="dialog"
                        aria-label={
                          shots[s.id]
                            ? `${s.label} — captured, choose how to retake it`
                            : `${s.label} — choose how to take it`
                        }
                        className={`p-2 rounded-2xl border bg-card text-left transition-all active:scale-[0.98] ${
                          shots[s.id]
                            ? "border-primary/50"
                            : "border-hairline hover:border-primary/45"
                        }`}
                      >
                        <span className="block w-full aspect-[3/4] rounded-xl overflow-hidden bg-inset border border-hairline flex items-center justify-center">
                          {shots[s.id] ? (
                            <img
                              src={shots[s.id]}
                              alt={`${s.label} photograph`}
                              className="w-full h-full object-cover"
                            />
                          ) : (
                            <svg
                              viewBox="0 0 120 300"
                              className="w-full h-full p-2 opacity-35"
                              aria-hidden="true"
                            >
                              <g
                                stroke="currentColor"
                                strokeWidth="9"
                                strokeLinecap="round"
                                fill="none"
                                className="text-muted"
                              >
                                <circle cx="60" cy="34" r="20" />
                                <line x1="60" y1="54" x2="60" y2="170" />
                                <line x1="30" y1="76" x2="90" y2="76" />
                                <line x1="60" y1="170" x2="38" y2="270" />
                                <line x1="60" y1="170" x2="82" y2="270" />
                              </g>
                            </svg>
                          )}
                        </span>

                        <span className="block text-[12.5px] font-medium text-ink mt-1.5 truncate">
                          {s.label}
                        </span>
                        <span
                          className={`block font-mono text-[10px] mt-0.5 ${
                            shots[s.id] ? "text-primary" : "text-muted"
                          }`}
                        >
                          {shots[s.id] ? "Captured" : "Not yet"}
                        </span>
                      </button>
                    ))}
                  </div>

                  {picking && (
                    <div
                      className="absolute inset-0 z-50 flex items-center justify-center px-6 aura-fade-in"
                      style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
                      onMouseDown={(e) => {
                        if (e.target === e.currentTarget) setPicking(null);
                      }}
                    >
                      <div
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="shot-choice-title"
                        className="w-full max-w-[300px] bg-card rounded-3xl border border-hairline shadow-2xl p-5"
                      >
                        <h3
                          id="shot-choice-title"
                          className="font-display text-[20px] text-ink leading-tight"
                        >
                          {picking.label}
                        </h3>
                        <p className="text-[12px] text-muted leading-relaxed mt-1.5 mb-4">
                          {picking.cue}
                        </p>

                        <button
                          type="button"
                          onClick={() => {
                            const id = picking.id;
                            setPicking(null);
                            openCamera(id);
                          }}
                          className="w-full min-h-[48px] rounded-full bg-primary text-onprimary text-[13.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                        >
                          Use camera
                        </button>

                        <label className="mt-2.5 w-full min-h-[48px] rounded-full bg-card border border-ctrl text-ink text-[13.5px] font-medium flex items-center justify-center cursor-pointer hover:bg-inset active:scale-95 transition-all">
                          Upload a photograph
                          <input
                            type="file"
                            accept="image/*"
                            className="sr-only"
                            onChange={(e) => {
                              const handler = onUpload(picking.id);
                              setPicking(null);
                              handler(e);
                            }}
                          />
                        </label>

                        <button
                          type="button"
                          onClick={() => setPicking(null)}
                          className="w-full min-h-[44px] mt-1.5 text-[12.5px] font-medium text-muted hover:text-ink transition-colors"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}

                  <button
                    type="button"
                    disabled={taken < SHOTS.length}
                    onClick={() => onDone(taken)}
                    className="w-full mt-5 min-h-[48px] rounded-full bg-primary text-onprimary text-[14px] font-medium hover:bg-primary/90 active:scale-95 transition-all disabled:opacity-40"
                  >
                    {taken < SHOTS.length
                      ? `Extract measurements — ${taken} of ${SHOTS.length}`
                      : "Extract measurements"}
                  </button>

                  <p className="text-[11px] text-muted leading-relaxed mt-3">
                    Photographs stay on this device in this prototype — nothing is uploaded.
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ===================================================================
             SOMEONE ELSE'S MEASUREMENTS
             The same fourteen points the Profile screen asks for, so a family
             member's record reads identically to your own. Kept per person and
             stored, because these are figures somebody has taken by hand and
             losing them on reload would be worse than not offering the form.
             =================================================================== */
      const MEASURE_FIELDS = [
        { k: "bust", label: "Bust" },
        { k: "waist", label: "Waist" },
        { k: "hip", label: "Hip" },
        { k: "shoulder", label: "Shoulder" },
        { k: "sleeve", label: "Sleeve length" },
        { k: "length", label: "Garment length" },
      ];

      function MeasureField({ id, label, value, onChange, inputMode }) {
        return (
          <div>
            <label
              htmlFor={id}
              className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
            >
              {label}
            </label>
            <input
              id={id}
              type="text"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              inputMode={inputMode}
              style={{ fontSize: 16 }}
              className="w-full min-h-[48px] px-3.5 rounded-xl border border-hairline bg-card text-ink focus:outline-none focus:border-primary transition-colors"
            />
          </div>
        );
      }

      function todayStamp() {
        const d = new Date();
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return "Updated " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
      }

      /* Four ways to arrive at the same fourteen points. The chips pick
               the route; everything below them belongs to that route. */
      const MEASURE_MODES = [
        { id: "tape", label: "Manual" },
        { id: "scan", label: "AI scan" },
        { id: "garment", label: "Garment" },
        { id: "session", label: "Session" },
      ];

      /* A native select draws its own arrow in a font that is not ours, so the
         control is flattened and the chevron drawn back on. */
      const CHEVRON_BG =
        "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235A5468' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>\")";

      /* Garments the wardrobe does not know about. */
      const OTHER_GARMENTS = [
        "Blouse",
        "Kurta",
        "Lehenga skirt",
        "Saree blouse",
        "Anarkali",
        "Shirt",
        "Dress",
        "Trousers",
      ];

      const SESSION_SLOTS = ["Tomorrow morning", "Tomorrow evening", "This weekend", "Next week"];

      function PersonMeasureSheet({ person, onClose, onSave, onToast }) {
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const blank = {
          unit: "in",
          bust: "",
          waist: "",
          hip: "",
          shoulder: "",
          sleeve: "",
          length: "",
          height: "",
          fitNote: "",
        };
        const [form, setForm] = useState(() => Object.assign({}, blank, person.m || {}));
        const [scanOpen, setScanOpen] = useState(false);
        const [mode, setMode] = useState("tape");
        const [slot, setSlot] = useState("");
        /* Photographs of the tape on the cloth. They stay in memory for
                 this session — a data URL per shot is far too heavy for the
                 same store the figures go into. */
        const [shots, setShots] = useState([]);

        /* A flat garment reads about half the body measure, plus the ease the
           piece was cut with. Worked from the figures already on file rather
           than from the photograph itself — a draper is the one who checks it
           against the cloth. */
        const [applied, setApplied] = useState(false);

        const halfOf = (v, ease) => {
          const n = parseFloat(v);
          return isFinite(n) ? (n / 2 + ease).toFixed(1) : "";
        };

        const suggestion = {
          flatChest: halfOf(form.bust, 1),
          flatWaist: halfOf(form.waist, 1),
          flatLength: isFinite(parseFloat(form.length))
            ? String(parseFloat(form.length))
            : "",
        };

        const hasSuggestion = Boolean(
          suggestion.flatChest || suggestion.flatWaist || suggestion.flatLength
        );

        const useSuggestion = (focusAfter) => {
          setForm((f) => Object.assign({}, f, suggestion));
          setApplied(true);
          if (focusAfter) {
            window.setTimeout(() => {
              const el = document.getElementById("pm-flat-chest");
              if (el) {
                el.focus();
                el.select();
              }
            }, 60);
          }
        };

        const addShots = (e) => {
          const files = Array.from(e.target.files || []);
          e.target.value = "";
          files.slice(0, 6).forEach((file) => {
            const reader = new FileReader();
            reader.onload = () =>
              setShots((list) =>
                list.concat({
                  id: "sh" + Date.now() + Math.random(),
                  src: reader.result,
                  name: file.name,
                })
              );
            reader.readAsDataURL(file);
          });
        };
        const set = (k) => (v) => setForm((f) => Object.assign({}, f, { [k]: v }));

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");
          if (panelRef.current) panelRef.current.focus();

          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
            }
          };
          document.addEventListener("keydown", onKey, true);
          return () => {
            document.removeEventListener("keydown", onKey, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        const filled =
          MEASURE_FIELDS.filter((m) => form[m.k].trim()).length + (form.height.trim() ? 1 : 0);

        if (scanOpen) {
          // The scan takes the whole screen, so it replaces the sheet
          // rather than stacking on it; closing returns you here with
          // whatever you had already typed still in the fields.
          return (
            <AiScanModal
              onClose={() => setScanOpen(false)}
              onDone={(n) => {
                setScanOpen(false);
                onToast(
                  n +
                    " photographs of " +
                    (person.self ? "you" : person.name) +
                    " saved \u2014 a draper will confirm " +
                    (person.self ? "your" : "their") +
                    " fourteen points within a day"
                );
              }}
            />
          );
        }

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="measure-sheet-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 h-[92%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              <div className="relative shrink-0 pt-2.5 pb-1">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />
                <button
                  type="button"
                  onClick={onClose}
                  aria-label={
                    person.self
                      ? "Close your measurements"
                      : "Close " + person.name + "'s measurements"
                  }
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto thread-scroll px-5 pt-2 pb-6">
                <h2
                  id="measure-sheet-title"
                  className="font-display text-[22px] leading-tight text-ink mb-4"
                >
                  {person.name}
                  {person.relation && (
                    <span className="text-muted font-normal text-[16px]">
                      {" \u00b7 " + person.relation}
                    </span>
                  )}
                </h2>
                {/* How the measurements get taken. */}
                <div
                  className="flex flex-wrap gap-1.5 mb-4"
                  role="group"
                  aria-label="How to take these measurements"
                >
                  {MEASURE_MODES.map((mm) => {
                    const on = mode === mm.id;
                    return (
                      <button
                        key={mm.id}
                        type="button"
                        aria-pressed={on}
                        onClick={() => setMode(mm.id)}
                        className={
                          "min-h-[38px] px-3 rounded-full border text-[12.5px] font-medium transition-all active:scale-95 " +
                          (on
                            ? "bg-primary text-onprimary border-primary"
                            : "bg-card text-ink border-hairline hover:border-primary/45")
                        }
                      >
                        {mm.label}
                      </button>
                    );
                  })}
                </div>

                {mode === "scan" && (
                  <div className="aura-fade-in">
                    <p className="text-[13px] text-ink leading-relaxed">
                      Photograph {person.self ? "yourself" : person.name} against an on-screen guide
                      — front, back and side.
                    </p>
                    <button
                      type="button"
                      onClick={() => setScanOpen(true)}
                      aria-haspopup="dialog"
                      className="mt-3 w-full min-h-[48px] px-4 rounded-full bg-primary text-onprimary text-[13.5px] font-medium flex items-center justify-center gap-1.5 hover:bg-primary/90 active:scale-95 transition-all"
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="M12 2.5 13.9 8.1 19.5 10 13.9 11.9 12 17.5 10.1 11.9 4.5 10 10.1 8.1z" />
                        <path d="M18.5 15.5 19.4 18.1 22 19 19.4 19.9 18.5 22.5 17.6 19.9 15 19 17.6 18.1z" />
                      </svg>
                      Open the camera guide
                    </button>
                  </div>
                )}

                {mode === "garment" && (
                  <div className="aura-fade-in space-y-3.5">
                    <p className="text-[13px] text-ink leading-relaxed">
                      Lay a garment that already fits flat, and measure across it. A draper doubles
                      the flat figures.
                    </p>

                    <div>
                      <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5">
                        Photographs
                      </span>
                      <p className="text-[11.5px] text-muted leading-relaxed mb-2">
                        Photograph the tape where it lies on the cloth, so a draper can check the
                        reading against the garment.
                      </p>

                      <div className="grid grid-cols-3 gap-2">
                        {shots.map((sh) => (
                          <div key={sh.id} className="relative">
                            <img
                              src={sh.src}
                              alt={"Tape on the garment \u2014 " + sh.name}
                              className="block w-full aspect-[3/4] object-cover rounded-xl border border-hairline bg-inset"
                            />
                            <button
                              type="button"
                              onClick={() => setShots((list) => list.filter((x) => x.id !== sh.id))}
                              aria-label={"Remove " + sh.name}
                              className="absolute top-1 right-1 w-7 h-7 rounded-full bg-card border border-hairline text-ink shadow-sm flex items-center justify-center hover:bg-inset active:scale-90 transition-all"
                            >
                              <svg
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2.4"
                                strokeLinecap="round"
                                aria-hidden="true"
                                focusable="false"
                              >
                                <path d="M18 6 6 18" />
                                <path d="m6 6 12 12" />
                              </svg>
                            </button>
                          </div>
                        ))}

                        <label className="aspect-[3/4] rounded-xl border border-dashed border-ctrl/60 flex flex-col items-center justify-center gap-1 text-primary cursor-pointer hover:bg-inset hover:border-primary/50 active:scale-[0.98] transition-all">
                          <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="1.9"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                          </svg>
                          <span className="text-[11.5px] font-medium">
                            {shots.length ? "Add more" : "Add a photo"}
                          </span>
                          <input
                            type="file"
                            accept="image/*"
                            multiple
                            className="sr-only"
                            onChange={addShots}
                          />
                        </label>
                      </div>

                      {shots.length > 0 && (
                        <p className="font-mono text-[10px] text-muted mt-1.5">
                          {shots.length} {shots.length === 1 ? "photograph" : "photographs"}
                          {" \u00b7 kept on this device"}
                        </p>
                      )}

                      {shots.length > 0 && hasSuggestion && (
                        <div className="mt-3 rounded-2xl border border-hairline bg-inset/50 p-3.5 aura-fade-in">
                          <span className="block font-mono text-[10.5px] uppercase tracking-wider text-muted">
                            Suggested reading
                          </span>
                          <p className="text-[11.5px] text-muted leading-relaxed mt-1 mb-2.5">
                            Worked from the figures already on file. A draper checks
                            them against your photographs before anything is cut.
                          </p>

                          <dl className="bg-card border border-hairline rounded-xl divide-y divide-hairline overflow-hidden">
                            {[
                              { k: "flatChest", label: "Chest, flat" },
                              { k: "flatWaist", label: "Waist, flat" },
                              { k: "flatLength", label: "Length" },
                            ].map((r) => (
                              <div
                                key={r.k}
                                className="flex items-baseline justify-between gap-3 px-3 py-2"
                              >
                                <dt className="font-mono text-[10.5px] uppercase tracking-wider text-muted">
                                  {r.label}
                                </dt>
                                <dd className="font-mono text-[13px] text-ink">
                                  {suggestion[r.k]
                                    ? suggestion[r.k] + " " + form.unit
                                    : "\u2014"}
                                </dd>
                              </div>
                            ))}
                          </dl>

                          {applied ? (
                            <p className="flex items-center gap-1.5 text-[12.5px] mt-2.5 text-primary">
                              <svg
                                width="15"
                                height="15"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2.4"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                aria-hidden="true"
                                focusable="false"
                              >
                                <path d="M20 6 9 17l-5-5" />
                              </svg>
                              Filled in below — edit any of them
                            </p>
                          ) : (
                            <div className="flex items-center gap-2 mt-2.5">
                              <button
                                type="button"
                                onClick={() => useSuggestion(false)}
                                className="flex-1 min-h-[44px] px-3 rounded-full bg-primary text-onprimary text-[13px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                              >
                                Use these
                              </button>
                              <button
                                type="button"
                                onClick={() => useSuggestion(true)}
                                className="flex-1 min-h-[44px] px-3 rounded-full bg-card border border-ctrl text-ink text-[13px] font-medium hover:bg-inset active:scale-95 transition-all"
                              >
                                Adjust manually
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    <div>
                      <label
                        htmlFor="pm-garment"
                        className="block font-mono text-[10.5px] uppercase tracking-wider text-muted mb-1.5"
                      >
                        Which garment
                      </label>
                      <select
                        id="pm-garment"
                        value={form.garment || ""}
                        onChange={(e) => set("garment")(e.target.value)}
                        style={{
                          fontSize: 16,
                          backgroundImage: CHEVRON_BG,
                          backgroundRepeat: "no-repeat",
                          backgroundPosition: "right 14px center",
                          backgroundSize: "16px",
                        }}
                        className="w-full min-h-[48px] pl-3.5 pr-10 rounded-xl border border-hairline bg-card text-ink appearance-none focus:outline-none focus:border-primary transition-colors"
                      >
                        <option value="">Choose a garment</option>
                        <optgroup label="From your wardrobe">
                          {OWNED.map((o) => (
                            <option key={o.id} value={o.name}>
                              {o.name}
                            </option>
                          ))}
                        </optgroup>
                        <optgroup label="Something else">
                          {OTHER_GARMENTS.map((g) => (
                            <option key={g} value={g}>
                              {g}
                            </option>
                          ))}
                        </optgroup>
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <MeasureField
                        id="pm-flat-chest"
                        label={"Chest, flat (" + form.unit + ")"}
                        value={form.flatChest || ""}
                        onChange={set("flatChest")}
                        inputMode="decimal"
                      />
                      <MeasureField
                        id="pm-flat-waist"
                        label={"Waist, flat (" + form.unit + ")"}
                        value={form.flatWaist || ""}
                        onChange={set("flatWaist")}
                        inputMode="decimal"
                      />
                    </div>
                    <MeasureField
                      id="pm-flat-length"
                      label={"Length, shoulder to hem (" + form.unit + ")"}
                      value={form.flatLength || ""}
                      onChange={set("flatLength")}
                      inputMode="decimal"
                    />
                  </div>
                )}

                {mode === "session" && (
                  <div className="aura-fade-in">
                    <p className="text-[13px] text-ink leading-relaxed">
                      A draper takes the points with {person.self ? "you" : person.name} over video.
                      Six minutes, and they write them down for you.

      // "Meera R." -> "MR", "Ravi" -> "R". Matches the existing avatars.
      function initialsFor(name) {
        const parts = name.trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0][0].toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function AddPersonSheet({ onClose, onSave }) {

            document.removeEventListener("keydown", onKey, true);

            const r = restoreRef.current;

      function ProductDetailSheet({ piece, ship, onClose, onRequest, onAsk, saved, onSave }) {
        const trackRef = useRef(null);
        const panelRef = useRef(null);
        const restoreRef = useRef(null);
        const [slide, setSlide] = useState(0);
        const views = getViewsForPiece(piece);

        useEffect(() => {
          restoreRef.current = document.activeElement;
          document.body.classList.add("aura-locked");

          const panel = panelRef.current;
          const focusables = () =>
            Array.from(
              panel.querySelectorAll(
                'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
              )
            ).filter((el) => el.offsetParent !== null);

          const first = focusables()[0];
          if (first) first.focus();
          else panel.focus();

          const onKeyDown = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              onClose();
              return;
            }
            if (e.key !== "Tab") return;
            const items = focusables();
            if (!items.length) return;
            const a = items[0];
            const z = items[items.length - 1];
            if (e.shiftKey && document.activeElement === a) {
              e.preventDefault();
              z.focus();
            } else if (!e.shiftKey && document.activeElement === z) {
              e.preventDefault();
              a.focus();
            }
          };

          document.addEventListener("keydown", onKeyDown, true);
          return () => {
            document.removeEventListener("keydown", onKeyDown, true);
            document.body.classList.remove("aura-locked");
            const r = restoreRef.current;
            if (r && typeof r.focus === "function") r.focus();
          };
        }, [onClose]);

        // Derive the active slide from scroll position so a swipe and the dots
        // always agree about which framing is showing.
        const onScroll = () => {
          const el = trackRef.current;
          if (!el) return;
          const i = Math.round(el.scrollLeft / el.clientWidth);
          if (i !== slide) setSlide(Math.max(0, Math.min(views.length - 1, i)));
        };

        const goTo = (i) => {
          const el = trackRef.current;
          const child = el && el.children[i];
          if (!el || !child) return;
          setSlide(i);
          el.scrollTo({
            left: child.offsetLeft - el.offsetLeft,
            behavior: reducedMotion() ? "auto" : "smooth",
          });
        };

        const rows = [
          { k: "Fabric", v: piece.fabric },
          { k: "Includes", v: piece.includes },
          { k: "Weight", v: piece.weight },
          { k: "Care", v: piece.care },
          { k: "On the loom", v: piece.weeks },
        ];

        /* "DHL Express · 4 days" — the courier sits with the duty line, the
                       transit time drops to its own line under it. */
        const [courierName, courierDays] = ship.courier.split(" · ");

        return (
          <div
            className="absolute inset-0 z-50 aura-fade-in"
            style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.5)" }}
            onMouseDown={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              ref={panelRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby="piece-sheet-title"
              tabIndex={-1}
              className="absolute inset-x-0 bottom-0 h-[90%] bg-card rounded-t-3xl border-t border-hairline shadow-2xl flex flex-col overflow-hidden focus:outline-none aura-sheet-up"
            >
              {/* Grabber + close */}
              <div className="relative shrink-0 pt-2.5 pb-2.5">
                <span
                  className="block w-10 h-1 rounded-full bg-hairline mx-auto"
                  aria-hidden="true"
                />

                <button
                  type="button"
                  onClick={onClose}
                  aria-label={`Close ${piece.name}`}
                  className="absolute top-0.5 right-2.5 w-11 h-11 rounded-full flex items-center justify-center bg-card border border-hairline text-ink shadow-sm hover:bg-inset active:scale-95 transition-all z-10"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto thread-scroll">
                {/* Swipeable carousel */}
                <div
                  ref={trackRef}
                  onScroll={onScroll}
                  className="flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
                  role="group"
                  aria-label={`${piece.name} photographs`}
                  tabIndex={0}
                  onKeyDown={(e) => {
                    if (e.key === "ArrowRight") {
                      e.preventDefault();
                      goTo(Math.min(views.length - 1, slide + 1));
                    } else if (e.key === "ArrowLeft") {
                      e.preventDefault();
                      goTo(Math.max(0, slide - 1));
                    }
                  }}
                >
                  {views.map((v) => (
                    <div key={v.id} className="snap-center shrink-0 w-full px-5">
                      <div className="relative w-full h-[36vh] rounded-2xl overflow-hidden bg-inset border border-hairline">
                        <SheetPhoto piece={piece} view={v} alt={`${piece.name} — ${v.label}`} />
                        <span className="absolute bottom-3 left-3 text-[12px] font-bold text-white bg-black/45 px-3 py-1 rounded-full">
                          {v.label}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Dots */}
                <div className="flex items-center justify-center gap-1.5 mt-3">
                  {views.map((v, i) => (
                    <button
                      key={v.id}
                      type="button"
                      onClick={() => goTo(i)}
                      aria-label={`Show ${v.label}`}
                      aria-current={i === slide}
                      className="w-11 h-8 flex items-center justify-center"
                    >
                      <span
                        className={`block rounded-full transition-all ${
                          i === slide ? "w-4 h-[5px] bg-primary" : "w-[5px] h-[5px] bg-hairline"
                        }`}
                      />
                    </button>
                  ))}
                </div>

                {/* Details */}
                <div className="px-5 pb-5">
                  {/* Save sits with the name it applies to. */}
                  <div className="flex items-start justify-between gap-3 mt-1">
                    <h2
                      id="piece-sheet-title"
                      className="font-display text-[32px] leading-[36px] text-ink"
                    >
                      {piece.name}
                    </h2>
                    {onSave && (
                      <HeartButton
                        saved={saved}
                        onToggle={onSave}
                        name={piece.name}
                        tone="plain"
                        className="mt-1"
                      />
                    )}
                  </div>
                  <p className="font-mono text-[11px] uppercase tracking-wider text-goldtext mt-1.5">
                    {piece.craft}
                  </p>
                  <p className="text-[14px] text-muted leading-[22px] mt-3">{piece.note}</p>

                  <dl className="mt-4 border-t border-hairline">
                    {rows.map((r) => (
                      <div
                        key={r.k}
                        className="flex items-baseline justify-between gap-4 py-3 border-b border-hairline"
                      >
                        <dt className="font-mono text-[11px] uppercase tracking-wider text-muted shrink-0">
                          {r.k}
                        </dt>
                        <dd className="text-[13px] text-ink text-right">{r.v}</dd>
                      </div>
                    ))}
                  </dl>

                  <p className="text-[11px] text-muted leading-[17px] mt-4">
                    Nothing is added at checkout. You approve photographs of the finished garment
                    before it is dispatched, and alterations are covered under the Perfect Fit
                    Guarantee.
                  </p>
                </div>
              </div>

              {/* Price stays put while everything above it scrolls. */}
              <div className="shrink-0 border-t border-hairline bg-card px-5 pt-3.5 pb-5 flex items-center gap-3">
                <div className="min-w-0 flex-1">
                  <span className="block text-[28px] text-ink font-bold leading-none">
                    {ship.symbol}
                    {piece.from}
                  </span>
                  <span className="block text-[11px] text-muted leading-snug mt-1.5">
                    {ship.duty} · {courierName}
                  </span>
                  <span className="block text-[11px] text-muted leading-snug">{courierDays}</span>
                </div>

                <button
                  type="button"
                  onClick={() => onRequest(piece)}
                  className="shrink-0 min-h-[48px] px-7 rounded-full bg-primary text-onprimary text-[14px] font-semibold hover:bg-primary/90 active:scale-95 transition-all"
                >
                  See Fit
                </button>
              </div>
            </div>
          </div>
        );
      }
