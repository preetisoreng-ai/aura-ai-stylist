      :root {

        --card: rgb(var(--card-rgb));

        -webkit-tap-highlight-color: transparent;

      html {
        background-color: var(--canvas);
      }

      body {
        background-color: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.aura-locked {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--primary-rgb));
        outline-offset: 2px;
        border-radius: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;

      .app-viewport {
        width: 100%;
        max-width: 430px;

           the on-screen keyboard; the thread scrolls in the space left. */

        height: var(--app-h, 100dvh);
        margin: 0 auto;
        background: var(--canvas);

        display: flex;

        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {

      }

      .aura-msg-in {

      .aura-toast-in {
        animation: auraToastIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-listening {
        animation: auraListenRing 1.5s ease-out infinite;

        width: 5px;

        border-radius: 9999px;
        background: rgb(var(--primary-rgb));
        animation: auraTypingDot 1.3s ease-in-out infinite;

        animation-delay: 0.16s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes auraSlideFromRight {
        from {
          transform: translateX(100%);
          opacity: 0.6;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .drawer-slide-in {
        animation: auraSlideFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .aura-fade-in {
        animation: auraFadeIn 0.18s ease-out forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }

          transform: none;
        }
        .typing-dot {
          opacity: 0.7;
        }
      }
    </style>

            const { useState, useRef, useEffect, useCallback } = React;

      /* ===================================================================
       WHERE "BACK" GOES
       Every screen is reachable from several others now — the drawer opens
       Discover from home, from a chat, from the wardrobe — so a hard-coded
       destination sends people somewhere they have never been. Read the page
       we actually arrived from and name it, so the control tells the truth.

       Falls back to the old fixed destination when there is no referrer to
       read: a bookmark, a typed URL, or a cross-origin arrival.
       =================================================================== */
      const BACK_LABELS = {
        "index.html": "home",
        "conversation.html": "chat",
        "discover.html": "Discover",
        "collection.html": "the collection",
        "wardrobe.html": "wardrobe",
        "orders.html": "orders",
        "profile.html": "profile",
      };

      /* The browser's own history is the one thing that is always right,
         and it works when the referrer does not — opening these files
         straight off disk (file://) sends no referrer at all. So history
         decides WHERE back goes; the referrer only decides what we CALL it,
         and we say plain "Back" when we cannot name the place. */
      const CAN_GO_BACK = (function () {
        try {
          return window.history.length > 1;
        } catch (e) {
          return false;
        }
      })();

      const BACK_FROM_REFERRER = (function () {
        try {
          const ref = document.referrer;
          if (!ref) return null;
          const u = new URL(ref);
          if (u.origin !== window.location.origin) return null;
          const file = u.pathname.split("/").pop() || "index.html";
          const here = window.location.pathname.split("/").pop() || "index.html";
          // A reload, or a jump within the same screen, is not a way back.
          if (file === here) return null;
          if (!BACK_LABELS[file]) return null;
          return { href: file, label: BACK_LABELS[file] };
        } catch (e) {
          return null;
        }
      })();

      function backTarget(fallbackHref, fallbackLabel) {
        // Name it from the referrer when we have one. With history to fall
        // back on we stay honest and say "Back"; with neither, the old fixed
        // destination is all that is left, so name that.
        const named =
          BACK_FROM_REFERRER ||
          (CAN_GO_BACK ? null : { href: fallbackHref, label: fallbackLabel });

        return {
          href: (named && named.href) || fallbackHref,
          label: named && named.label,
          text: named ? "Back to " + named.label : "Back",
          short: (named && named.label) || "Back",
          useHistory: CAN_GO_BACK,
        };
      }

            /* ===================================================================
                     COMPONENT: OVERLAY — same contract as the home screen's drawer.
                     Escape to close, background scroll lock, focus moved in on open
                     and restored to the trigger on close, focus kept inside while open.
                     =================================================================== */
            function Overlay({ open, onClose, labelledBy, align, children }) {
              const panelRef = useRef(null);
              const restoreRef = useRef(null);

              useEffect(() => {
                if (!open) return;

                restoreRef.current = document.activeElement;
                document.body.classList.add("aura-locked");

                const panel = panelRef.current;
                const focusables = () =>
                  Array.from(
                    panel.querySelectorAll(
                      'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'
                    )
                  ).filter((el) => el.offsetParent !== null);

                const first = focusables()[0];
                if (first) first.focus();
                else panel.focus();

                const onKeyDown = (e) => {
                  if (e.key === "Escape") {
                    e.stopPropagation();
                    onClose();
                    return;
                  }
                  if (e.key !== "Tab") return;
                  const items = focusables();
                  if (items.length === 0) return;
                  const firstEl = items[0];
                  const lastEl = items[items.length - 1];
                  if (e.shiftKey && document.activeElement === firstEl) {
                    e.preventDefault();
                    lastEl.focus();
                  } else if (!e.shiftKey && document.activeElement === lastEl) {
                    e.preventDefault();
                    firstEl.focus();
                  }
                };

                document.addEventListener("keydown", onKeyDown, true);
                return () => {
                  document.removeEventListener("keydown", onKeyDown, true);
                  document.body.classList.remove("aura-locked");
                  const restore = restoreRef.current;
                  if (restore && typeof restore.focus === "function") restore.focus();
                };
              }, [open, onClose]);

              if (!open) return null;

              return (
                <div
                  className={`absolute inset-0 z-50 flex aura-fade-in ${align === "end" ? "justify-end" : "items-end justify-center"}`}
                  style={{ backgroundColor: "rgb(var(--ink-rgb) / 0.45)", backdropFilter: "blur(2px)" }}
                  onMouseDown={(e) => {
                    if (e.target === e.currentTarget) onClose();
                  }}
                >
                  <div
                    ref={panelRef}
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby={labelledBy}
                    tabIndex={-1}
                    className="focus:outline-none contents"
                  >
                    {children}
                  </div>
                </div>
              );
            }

                        Lead time {designer.lead}
                      </span>
                    </span>
                  </span>
                </button>
              );
            }


            function App() {
              const back = backTarget("index.html", "home");
              const [view, setView] = useState("feed"); // feed · profile · verify
              const [openId, setOpenId] = useState(null);
              const [filter, setFilter] = useState("All");
              const [drawerOpen, setDrawerOpen] = useState(false);
              const [activeCountry, setActiveCountry] = useState(SHIP_TO[0]);
              const [toastMsg, setToastMsg] = useState("");
              const toastTimer = useRef(null);
              const scrollRef = useRef(null);

              const showToast = useCallback((msg) => {
                setToastMsg(msg);
                if (toastTimer.current) clearTimeout(toastTimer.current);
                toastTimer.current = setTimeout(() => setToastMsg(""), 3200);
              }, []);
              useEffect(() => () => clearTimeout(toastTimer.current), []);

              const designer = DESIGNERS.find((d) => d.id === openId) || DESIGNERS[0];

              const shown =
                filter === "All"
                  ? DESIGNERS
                  : DESIGNERS.filter(
                      (d) =>
                        d.tags.indexOf(filter) !== -1 ||
                        d.crafts.indexOf(filter) !== -1
                    );

              // Each view starts at the top rather than inheriting the last scroll.
              useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = 0;
              }, [view]);

              const openDesigner = (d) => {
                setOpenId(d.id);
                setView("profile");
              };

              // Back steps through the views before it leaves the screen.
              const goBack = (e) => {
                if (view === "verify") {
                  e.preventDefault();
                  setView("profile");
                  return;
                }
                if (view === "profile") {
                  e.preventDefault();
                  setView("feed");
                  return;
                }
                if (!back.useHistory) return;
                e.preventDefault();
                window.history.back();
              };

              const title =
                view === "feed"
                  ? "Discover designers"
                  : view === "profile"
                    ? designer.name
                    : "Verification";

              const backLabel =
                view === "feed" ? back.text : view === "profile" ? "Back" : "Back";

              return (
                <div className="app-shell">
                  <div className="sr-only" role="status" aria-live="polite">
                    {toastMsg}
                  </div>
                  {toastMsg && (
                    <div
                      aria-hidden="true"
                      className="fixed top-5 left-1/2 z-[60] bg-primary text-onprimary text-[12.5px] font-medium px-4 py-2.5 rounded-full shadow-lg border border-gold/40 flex items-center gap-2 aura-toast-in max-w-[92vw]"
                    >
                      <span className="text-gold" aria-hidden="true">✦</span>
                      <span className="truncate">{toastMsg}</span>
                    </div>
                  )}

                  <div className="app-viewport">
                    {/* ---------- Top bar ---------- */}
                    <header className="shrink-0 flex items-center gap-1 px-2 pt-3 pb-2 border-b border-hairline bg-canvas">
                      {/* Back retraces your steps; home is the way out of them. */}
                      <a
                        href="index.html"
                        aria-label="Go to home"
                        className="shrink-0 w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all"
                      >
                        <svg
                          width="19"
                          height="19"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="1.9"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M3 10.5 12 3.5l9 7" />
                          <path d="M5.5 9.5V20h13V9.5" />
                          <path d="M9.75 20v-6h4.5v6" />
                        </svg>
                      </a>

                      <a
                        href={back.href}
                        aria-label={backLabel}
                        onClick={goBack}
                        className="flex items-center gap-1 min-h-[44px] pl-1.5 pr-3 rounded-full text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
                      >
                        <svg
                          width="18"
                          height="18"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2.1"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="m15 18-6-6 6-6" />
                        </svg>
                        <span className="text-[13.5px] font-medium">{backLabel}</span>
                      </a>

                      <div className="min-w-0 flex-1 text-right pr-1">
                        <h1 className="font-display text-[20px] text-primary leading-tight truncate">
                          {title}
                        </h1>
                      </div>

                      <button
                        type="button"
                        onClick={() => setDrawerOpen(true)}
                        aria-label="Open navigation menu"
                        aria-haspopup="dialog"
                        aria-expanded={drawerOpen}
                        className="w-11 h-11 rounded-full flex items-center justify-center text-ink hover:bg-inset active:scale-95 transition-all shrink-0"
                      >
                        <svg
                          width="20"
                          height="18"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2.1"
                          strokeLinecap="round"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <line x1="3" y1="7" x2="21" y2="7" />
                          <line x1="3" y1="12" x2="21" y2="12" />
                          <line x1="3" y1="17" x2="21" y2="17" />
                        </svg>
                      </button>
                    </header>

                    {/* ---------- 1 · Discovery feed ---------- */}
                    {view === "feed" && (
                      <React.Fragment>
                        <div className="shrink-0 px-4 pt-3 pb-1">
                          <div
                            className="flex flex-wrap gap-2"
                            role="group"
                            aria-label="Filter designers"
                          >
                            {DESIGNER_FILTERS.map((f) => {
                              const on = filter === f;
                              return (
                                <button
                                  key={f}
                                  type="button"
                                  aria-pressed={on}
                                  onClick={() => setFilter(f)}
                                  className={
                                    "min-h-[38px] px-3.5 rounded-full border text-[12.5px] font-medium transition-all active:scale-95 " +
                                    (on
                                      ? "bg-primary text-onprimary border-primary"
                                      : "bg-card text-ink border-hairline hover:border-primary/45")
                                  }
                                >
                                  {f}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div ref={scrollRef} className="thread-scroll px-4 pt-3 pb-24">
                          <p className="font-mono text-[10.5px] text-muted mb-3">
                            {shown.length}{" "}
                            {shown.length === 1 ? "designer" : "designers"} · ranked by
                            fit for you, not by ad spend
                          </p>

                          {shown.length === 0 ? (
                            <p className="text-[13px] text-muted leading-relaxed text-center py-10 rounded-2xl border border-dashed border-ctrl/50">
                              Nobody in the network matches that yet. Try another craft.
                            </p>
                          ) : (
                            <div className="flex flex-col gap-3.5">
                              {shown.map((d) => (
                                <DesignerCard
                                  key={d.id}
                                  designer={d}
                                  onOpen={openDesigner}
                                />
                              ))}
                            </div>
                          )}
                        </div>
                      </React.Fragment>
                    )}

                    {/* ---------- 2 · Designer profile ---------- */}
                    {view === "profile" && (
                      <div ref={scrollRef} className="thread-scroll px-4 pt-3 pb-24">
                        <WorkshopPhoto
                          designer={designer}
                          label
                          className="block w-full h-[210px] rounded-2xl border border-hairline"
                        />

                        <div className="flex items-baseline justify-between gap-3 mt-3.5">
                          <h2 className="text-[15px] font-medium text-ink">
                            Verified boutique
                          </h2>
                          <span className="font-mono text-[13px] text-ink shrink-0">
                            ★ {designer.rating}
                          </span>
                        </div>
                        <div className="flex items-baseline justify-between gap-3 mt-1">
                          <p className="text-[12.5px] text-muted">
                            {designer.city} · Est. {designer.est}
                          </p>
                          <p className="font-mono text-[11px] text-muted shrink-0">
                            {designer.artisans} artisans
                          </p>
                        </div>

                        <div className="flex flex-wrap gap-2 mt-3">
                          {designer.crafts.map((c) => (
                            <span
                              key={c}
                              className="min-h-[34px] px-3.5 rounded-full border border-hairline bg-card text-ink text-[12px] font-medium flex items-center"
                            >
                              {c}
                            </span>
                          ))}
                        </div>

                        {/* A person, not a logo — so the primary actions are ways
                            to reach one. */}
                        <button
                          type="button"
                          onClick={() =>
                            (window.location.href =
                              "conversation.html?prompt=" +
                              encodeURIComponent(
                                "I'd like to talk to " +
                                  designer.first +
                                  " at " +
                                  designer.name +
                                  " about a commission."
                              ) +
                              "&ship=" +
                              encodeURIComponent(activeCountry.code))
                          }
                          className="w-full min-h-[52px] mt-5 rounded-full bg-primary text-onprimary text-[14.5px] font-medium hover:bg-primary/90 active:scale-95 transition-all"
                        >
                          Chat with {designer.first}
                        </button>
                        <button
                          type="button"
                          onClick={() =>
                            showToast(
                              "Video call with " +
                                designer.first +
                                " — pick a time in the next release"
                            )
                          }
                          className="w-full min-h-[50px] mt-2.5 rounded-full bg-card border border-primary text-ink text-[14px] font-medium hover:bg-inset active:scale-95 transition-all"
                        >
                          Book 15-min video call
                        </button>

                        <p className="text-[13px] text-ink leading-relaxed mt-5">
                          {designer.story}
                        </p>

                        <button
                          type="button"
                          onClick={() => setView("verify")}
                          className="w-full flex items-center justify-between gap-3 mt-5 p-3.5 rounded-2xl bg-inset/60 border border-hairline hover:border-primary/45 active:scale-[0.99] transition-all text-left"
                        >
                          <span className="min-w-0">
                            <span className="block text-[13px] font-medium text-ink">
                              How we vet designers
                            </span>
                            <span className="block text-[11.5px] text-muted leading-snug mt-0.5">
                              Five checks, all of them explainable
                            </span>
                          </span>
                          <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            aria-hidden="true"
                            focusable="false"
                            className="shrink-0 text-muted"
                          >
                            <path d="m9 18 6-6-6-6" />
                          </svg>
                        </button>
                      </div>
                    )}

                    {/* ---------- 3 · Trust scaffolding ---------- */}
                    {view === "verify" && (
                      <div ref={scrollRef} className="thread-scroll px-4 pt-4 pb-24">
                        <h2 className="font-display text-[22px] text-ink leading-tight">
                          How we vet designers
                        </h2>
                        <p className="text-[12.5px] text-muted leading-relaxed mt-1.5 mb-4">
                          Verification isn't a badge — it's a checklist you can read.
                          Every designer in the network has cleared all five.
                        </p>

                        <ol className="flex flex-col gap-4">
                          {VETTING.map(([label, detail]) => (
                            <li key={label} className="flex items-start gap-3">
                              <span
                                aria-hidden="true"
                                className="shrink-0 w-2 h-2 rounded-full bg-gold mt-[7px]"
                              />
                              <span className="min-w-0">
                                <span className="block text-[14px] font-medium text-ink leading-snug">
                                  {label}
                                </span>
                                <span className="block text-[12.5px] text-muted leading-snug mt-0.5">
                                  {detail}
                                </span>
                              </span>
                            </li>
                          ))}
                        </ol>

                        <p className="text-[11.5px] text-muted leading-relaxed mt-6 pt-4 border-t border-hairline">
                          A designer who stops clearing these leaves the network.
                          Ratings, returns and disputes are reviewed every quarter.
                        </p>
                      </div>
                    )}


              {/* ---------- Navigation drawer ---------- */}
              <Overlay
                open={drawerOpen}
                onClose={() => setDrawerOpen(false)}
                labelledBy="drawer-title"
                align="end"
              >
                <div className="bg-card w-4/5 max-w-xs h-full p-5 flex flex-col justify-between border-l border-hairline shadow-2xl drawer-slide-in overflow-y-auto">
                  <div className="space-y-6">
                    {/* Profile */}
                    <div className="pb-3.5 border-b border-hairline">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span
                            aria-hidden="true"
                            className="relative w-12 h-12 rounded-full bg-gold text-ink font-display text-[19px] flex items-center justify-center shadow-sm"
                          >
                            PS
                          </span>
                          <span className="flex flex-col">
                            <span className="flex items-center gap-1">
                              <span
                                id="drawer-title"
                                className="font-semibold text-[16px] text-ink leading-tight tracking-tight"
                              >
                                Priya Sharma
                              </span>
                              <button
                                type="button"
                                onClick={() => (window.location.href = "profile.html")}
                                aria-label="Edit your profile"
                                className="w-11 h-11 -my-3 -ml-1 -mr-2.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset active:scale-95 transition-colors shrink-0"
                              >
                                <svg
                                  width="14"
                                  height="14"
                                  viewBox="0 0 24 24"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="2"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                  aria-hidden="true"
                                  focusable="false"
                                >
                                  <path d="M12 20h9" />
                                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                                </svg>
                              </button>
                              <span
                                className="w-2 h-2 rounded-full bg-[#3F7A4B] shrink-0"
                                role="img"
                                aria-label="Your stylist is online"
                              />
                            </span>
                            <span className="font-mono text-[11px] text-muted mt-0.5">
                              Toronto, ON
                            </span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={() => setDrawerOpen(false)}
                          aria-label="Close navigation menu"
                          className="w-11 h-11 -mr-2 -mt-1.5 rounded-full flex items-center justify-center text-muted hover:text-ink hover:bg-inset transition-colors shrink-0"
                        >
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2"
                            strokeLinecap="round"
                            aria-hidden="true"
                            focusable="false"
                          >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {/* 5 primary tabs */}
                    <nav aria-label="Primary">
                      <ul className="space-y-1">
                        {[
                          {
                            id: "home",
                            label: "01 · Home",
                            link: "index.html",
                            desc: "Occasion-first landing",
                          },
                          {
                            id: "discover",
                            label: "02 · Discover",
                            link: "discover.html",
                            desc: "Craft & regional provenance",
                          },
                          {
                            id: "design",
                            active: true,
                            label: "03 · Design",
                            desc: "The makers behind the cloth",
                          },
                          {
                            id: "wardrobe",
                            label: "04 · Wardrobe",
                            link: "wardrobe.html",
                            desc: "Memory & measurements",
                          },
                          {
                            id: "orders",
                            label: "05 · Orders",
                            link: "orders.html",
                            desc: "Live artisan production tracker",
                          },
                        ].map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              aria-current={item.active ? "page" : undefined}
                              onClick={() => {
                                if (item.link) {
                                  window.location.href = item.link;
                                  return;
                                }
                                setDrawerOpen(false);
                                showToast(`${item.label.split("· ")[1]} opens in the next release`);
                              }}
                              className={`w-full text-left p-2.5 min-h-[52px] rounded-r-xl transition-colors border-l-[3px] ${
                                item.active
                                  ? "bg-inset text-primary font-semibold border-primary"
                                  : "hover:bg-selfill text-ink border-transparent"
                              }`}
                            >
                              <span className="block text-[14px]">{item.label}</span>
                              <span className="block text-[11px] text-muted font-normal mt-0.5">
                                {item.desc}
                              </span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    </nav>

                    {/* Dual-geography */}
                    <div className="pt-4 border-t border-hairline space-y-2">
                      <span
                        id="ship-to-label"
                        className="font-mono text-[10.5px] uppercase tracking-wider text-muted font-medium block"
                      >
                        Ship to
                      </span>
                      <div
                        className="flex items-center gap-1.5"
                        role="group"
                        aria-labelledby="ship-to-label"
                      >
                        {SHIP_TO.map((c) => (
                          <button
                            key={c.code}
                            type="button"
                            aria-pressed={activeCountry.code === c.code}
                            onClick={() => {
                              setActiveCountry(c);
                              showToast(`Ship-to ${c.code} — duties and lead times recalculated`);
                            }}
                            className={`flex-1 min-h-[44px] px-1 rounded-lg border text-[11.5px] font-mono transition-colors ${
                              activeCountry.code === c.code
                                ? "border-primary bg-primary text-onprimary"
                                : "border-hairline bg-inset text-ink hover:border-ctrl"
                            }`}
                          >
                            <span aria-hidden="true">{c.flag}</span> {c.code}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Landed-cost disclosure sits at the foot of the drawer
                      (Figma 31:1282) and restates the selected market. */}
                  <div className="pt-6">
                    <p className="text-[11px] text-muted leading-snug">
                      Prices are landed to {activeCountry.code} — {activeCountry.duty},{" "}
                      {activeCountry.courier}. Nothing is added at checkout.
                    </p>
                    <div className="flex items-center justify-between gap-3 pt-3 mt-3 border-t border-hairline text-muted text-[11px] font-mono">
                      <span>Aura v1.0</span>
                      <span className="text-ink">Perfect Fit Guarantee</span>
                    </div>
                  </div>
                </div>
              </Overlay>

                    <div className="home-pill-line" aria-hidden="true" />
                  </div>
                </div>
              );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
